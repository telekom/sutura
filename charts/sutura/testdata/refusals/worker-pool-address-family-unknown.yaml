# `workerPool.addressFamily` is `auto`, `ipv4`, `ipv6` or empty: another spelling fails the render
# rather than the serving pod's start.
environment: production
security:
  accessToken:
    secretName: sutura-access-token
  metricsToken:
    secretName: sutura-metrics-token
workerPool:
  enabled: true
  addressFamily: ipv5
  issuer:
    name: sutura-nodes
  max: 3
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
config:
  base:
    security:
      identity: single-user
      single_user_because: "a test deployment one operator runs with their own credentials"
