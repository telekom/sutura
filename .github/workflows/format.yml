name: format
run-name: Elastic acceptance preparation ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit
        type: string
        required: true
      source_tree:
        description: Exact reviewed source tree
        type: string
        required: true
      request_id:
        description: Unique preparation request
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: elastic-acceptance-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: rust-mcp-16core
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci
      - name: Generate pinned renders and measure the native worker-pool venue
        working-directory: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND
          export NO_COLOR=1 CARGO_TERM_COLOR=never
          mkdir -p ../evidence
          out=$(realpath ../evidence)
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$SOURCE_SHA" "$SOURCE_TREE" "$GITHUB_SHA" "$REQUEST_ID" > "$out/binding.txt"
          git ls-files -s > "$out/source-index.txt"
          sha256sum Cargo.lock flake.lock fuzz/Cargo.lock pixi.lock > "$out/locks-before.sha256"
          finish() {
            status=$?
            trap - EXIT
            set +e
            git diff --binary --full-index -- charts/sutura/testdata/golden > "$out/goldens.patch"
            git diff --name-only > "$out/changed-paths.txt"
            git diff --exit-code -- . ':!charts/sutura/testdata/golden/**' > "$out/unexpected-source.diff"
            unexpected=$?
            restore=0
            if test -s "$out/goldens.patch"; then
              git apply --reverse "$out/goldens.patch" 2> "$out/restoration.log"
              restore=$?
            fi
            git status --porcelain > "$out/source-final-status.txt"
            git ls-files -s > "$out/source-final-index.txt"
            sha256sum Cargo.lock flake.lock fuzz/Cargo.lock pixi.lock > "$out/locks-after.sha256"
            cmp "$out/locks-before.sha256" "$out/locks-after.sha256"; locks=$?
            cmp "$out/source-index.txt" "$out/source-final-index.txt"; index=$?
            printf 'operation=%s unexpected=%s restore=%s locks=%s index=%s\n' "$status" "$unexpected" "$restore" "$locks" "$index" > "$out/final-status.txt"
            test "$unexpected" = 0 && test "$restore" = 0 && test "$locks" = 0 && test "$index" = 0 && test ! -s "$out/source-final-status.txt" || exit 1
            exit "$status"
          }
          trap finish EXIT
          helm=$(nix eval --raw .#apps.x86_64-linux.helm.program)
          nix-store -r "${helm%/bin/helm}"
          "$helm" version --short > "$out/helm-version.txt"
          for values in charts/sutura/testdata/values/*.yaml charts/sutura/testdata/values/pool/*.yaml; do
            name=${values#charts/sutura/testdata/values/}
            "$helm" template test-release charts/sutura -f "$values" > "charts/sutura/testdata/golden/$name"
          done
          cp -r charts/sutura "$RUNNER_TEMP/elastic-unguarded-chart"
          sed -i '/include "sutura.requireOffHostPosture"/d' "$RUNNER_TEMP/elastic-unguarded-chart/templates/deployment.yaml" "$RUNNER_TEMP/elastic-unguarded-chart/templates/configmap.yaml"
          for golden in charts/sutura/testdata/golden/unguarded/*.yaml; do
            name=${golden##*/}
            "$helm" template test-release "$RUNNER_TEMP/elastic-unguarded-chart" -f "charts/sutura/testdata/refusals/$name" > "$golden"
          done
          git diff --binary --full-index -- charts/sutura/testdata/golden > "$out/goldens.patch"
          GIT_INDEX_FILE="$out/generated.index" git read-tree HEAD
          GIT_INDEX_FILE="$out/generated.index" git add charts/sutura/testdata/golden
          GIT_INDEX_FILE="$out/generated.index" git write-tree > "$out/measured-tree.txt"
          nix build --no-link --print-out-paths .#checks.x86_64-linux.helm-chart 2>&1 | tee "$out/chart.log"
          nix build --out-link "$out/worker-pool-result" --print-out-paths -L .#checks.x86_64-linux.k3s-worker-pool 2>&1 | tee "$out/worker-pool.log"
          cp -rL "$out/worker-pool-result" "$out/worker-pool-output"
          rm "$out/worker-pool-result"
      - name: Retain generated bytes, failures and native measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elastic-preparation-${{ inputs.request_id }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
