# Source: sutura/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release
  labels:
    app.kubernetes.io/name: sutura
    helm.sh/chart: sutura-0.1.0
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sutura
      app.kubernetes.io/instance: test-release
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sutura
        app.kubernetes.io/instance: test-release
    spec:
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: test-release
      containers:
        - name: sutura
          image: "ghcr.io/telekom/sutura:latest-musl"
          imagePullPolicy: IfNotPresent
          # `sutura serve` - the HTTP surface folded into the one published binary
          # (`github.com/telekom/sutura#685` step 2). `nix/oci.nix`'s own `Entrypoint` stays
          # `/bin/sutura`; only the argument changes.
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SUTURA_ENVIRONMENT
              value: "production"
            - name: SUTURA_CONFIG_DIR
              value: /etc/sutura/config
            # Always off-host from this process's own point of view: the Service targets
            # the pod, never the loopback-only embedded default.
            - name: SUTURA__SERVER__HOST
              value: "0.0.0.0"
            - name: SUTURA__SERVER__PORT
              value: "8080"
            - name: SUTURA__RATE_LIMIT__ENABLED
              value: "true"
            - name: SUTURA__SECURITY__ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sutura-access-token
                  key: token
            - name: SUTURA__SECURITY__METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sutura-metrics-token
                  key: token
            - name: SUTURA__SECURITY__TLS_TERMINATION
              value: "in-process"
            - name: SUTURA__SERVER__TLS_CERTIFICATE
              value: /etc/sutura/node/tls.crt
            - name: SUTURA__SERVER__TLS_KEY
              value: /etc/sutura/node/tls.key
            - name: SUTURA__SERVER__TLS_NODE_AUTHORITY
              value: /etc/sutura/node/ca.crt
            # The Service names every serving pod alike; the pod's own address after `#` is where a worker
            # answers this one.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SUTURA__SERVER__NODES__OWN
              value: "https://test-release.default.svc:8080#$(POD_IP)"
          volumeMounts:
            - name: config
              mountPath: /etc/sutura/config
              readOnly: true
            - name: node
              mountPath: /etc/sutura/node
              readOnly: true
          # `/health` is the liveness path (`crates/sutura-http/src/constants.rs`) and there is
          # deliberately no readiness route - docs/serving.md. The startup probe carries the
          # generous failure budget: boot re-verifies every anchor before the listener opens,
          # a round trip per anchor against a networked source.
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
      volumes:
        - name: config
          configMap:
            name: test-release-config
        - name: node
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: sutura-nodes
              csi.cert-manager.io/issuer-kind: Issuer
              csi.cert-manager.io/dns-names: test-release.default.svc
              csi.cert-manager.io/key-usages: digital signature,key encipherment,server auth,client auth
              csi.cert-manager.io/duration: 720h
              csi.cert-manager.io/fs-group: "65532"

