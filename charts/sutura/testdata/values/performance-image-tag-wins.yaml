# `minimal.yaml` with the performance image on and an explicit tag: the tag is used as is, with no suffix.
environment: production
security:
  accessToken:
    secretName: sutura-access-token
  metricsToken:
    secretName: sutura-metrics-token
  tlsTermination: ingress
image:
  performance: true
  tag: "pinned-tag"
config:
  base:
    security:
      identity: single-user
      single_user_because: "a test deployment one operator runs with their own credentials"
