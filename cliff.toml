# git-cliff: CHANGELOG.md from conventional commits.
#
# This only works because the commit subject is already a gate (`cargo xtask commit-msg`), so
# every commit on main parses. A changelog generator over unconstrained subjects produces a
# list nobody reads.
#
# Two callers, one config. `version-bump.yml` renders CHANGELOG.md on every push to main, and
# `release.yml` renders the tag's own section into the GitHub Release body. Both read this
# file, so a grouping corrected here is corrected in both places - which is the point of not
# letting GitHub's `--generate-notes` write the release body instead.
#
# `just changelog` is the same render, locally.

[changelog]
# The phrase "Do not edit" MUST stay inside the FIRST FIVE LINES of the rendered file, and
# that is a mechanism rather than a style point: `cargo xtask text-hygiene` treats a file
# whose first five lines say "do not edit" as generated, and that exemption is the only
# reason the em-dash rule tolerates the one commit subject in this history that contains an
# em dash (`6a8e9b5`). Reflow this header past line five and the release commit fails the
# hygiene gate - in CI, on main, on the commit that was about to be tagged.
header = """
# Changelog

Generated by git-cliff from the commit subjects. Do not edit by hand: every push to main
rewrites this file. Fix a wrong entry by fixing the commit message convention, not the file.

"""
# `striptags` is what removes the sort key from each heading - see the note on
# `commit_parsers` below. Without it every heading would render its own `<!-- nn -->`.
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# A non-conventional subject is dropped rather than guessed at. The commit-msg gate means the
# only ones that exist predate it.
filter_unconventional = true
protect_breaking_commits = true
split_commits = false
topo_order = false
sort_commits = "newest"

# `filter_commits` is deliberately left off. A conventional type that matches no parser below
# keeps its own type as the group name, so it renders in a section named after itself instead
# of disappearing - verified against `28f3415`, whose `review:` type predates the gate and
# renders under "Review". A type the commit-msg gate starts allowing therefore degrades
# visibly here rather than silently, and the sort keys put it last.
#
# Two kinds of order, and only one of them is this list's.
#
# MATCHING order is this list: the first pattern that matches wins, so `feat!` is breaking
# before it is a feature.
#
# DISPLAY order is NOT. The template groups with Tera's `group_by`, which sorts its keys as
# strings - so the parser order below bought nothing and the rendered file came out
# alphabetical, with Build and CI above Features and Fixes. Hence the `<!-- nn -->` prefix on
# every group name: it is a sort key, `striptags` removes it from the heading, and `<` sorts
# below every letter so an unmatched type lands at the bottom.
#
# Every type the commit-msg gate accepts appears here (`TYPES` in `xtask/src/commit_msg.rs`):
# feat, fix, refactor, chore, test, docs, perf, ci, build, style, revert.
commit_parsers = [
  { message = "^.*!:", group = "<!-- 00 -->Breaking changes" },
  { body = ".*BREAKING CHANGE", group = "<!-- 00 -->Breaking changes" },
  { message = "^feat", group = "<!-- 01 -->Features" },
  { message = "^fix", group = "<!-- 02 -->Fixes" },
  # A hand-written `revert: ...` is a conventional commit and was reaching none of these, so
  # it rendered in a section named after its own type. git's own `Revert "..."` subject is
  # not conventional and is dropped by `filter_unconventional` above, which is right: the
  # commit it reverts is already in the same list.
  { message = "^revert", group = "<!-- 03 -->Reverts" },
  { message = "^perf", group = "<!-- 04 -->Performance" },
  { message = "^refactor", group = "<!-- 05 -->Refactoring" },
  { message = "^docs", group = "<!-- 06 -->Documentation" },
  { message = "^test", group = "<!-- 07 -->Tests" },
  { message = "^build", group = "<!-- 08 -->Build" },
  { message = "^ci", group = "<!-- 09 -->CI" },
  # Housekeeping is real work and still noise in a changelog. Dropped, not hidden in a
  # collapsed section nobody expands. `chore(release)` and `chore(changelog)` are the commits
  # version-bump.yml writes, so this is also what stops the changelog describing itself.
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
]

[bump]
# What a commit does to the version. `feat` is a minor bump, `fix` and everything else is a
# patch, and `!` or a BREAKING CHANGE footer is a major bump - which for 0.x means minor,
# per SemVer's pre-1.0 rule.
features_always_bump_minor = true
breaking_always_bump_major = false
