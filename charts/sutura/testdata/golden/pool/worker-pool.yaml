# Source: sutura/templates/worker-pool.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-release-operator
  labels:
    app.kubernetes.io/name: sutura
    helm.sh/chart: sutura-0.1.0
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["sutura.telekom.github.io"]
    resources: ["suturaworkerpools"]
    verbs: ["list"]
  - apiGroups: ["sutura.telekom.github.io"]
    resources: ["suturaworkerpools/status"]
    verbs: ["patch"]
  # `get` reads both Deployments' replica counts and selectors; `patch` only ever resizes the
  # workers, named here rather than left open to whatever a `SuturaWorkerPool` names
  # (the operator refuses a foreign name itself, before either call: `InvalidPool::Foreign*`).
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get"]
    resourceNames: ["test-release", "test-release-workers"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch"]
    resourceNames: ["test-release-workers"]
  # `list`/`patch` on pods cannot be named by `resourceNames` or narrowed to a label selector: this
  # grant lets the operator's token patch any field a pod patch can reach on any pod in the
  # namespace - including each container's `image`, which restarts it under that pod's own service
  # account and mounts - not only set `pod-deletion-cost` on an idle worker, which is all this
  # operator itself ever writes (docs/adr/20261030193029-operator-sizes-the-worker-pool.md, Limits).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "patch"]

