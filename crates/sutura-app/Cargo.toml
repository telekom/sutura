[package]
name = "sutura-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "The service: generic over the ports, holding no framework types."

[dependencies]
sutura-domain = { workspace = true }
sutura-semantic = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# `Asked`'s `compile_fail` doctest needs a crate to try deserializing from - the same house pattern
# `sutura-domain::identity` and `sutura-http::inbound` pin their own no-`Deserialize` types with.
# Dev-only: nothing in `src/` names it, so a build that never runs this doctest links no JSON crate.
# Already resolved workspace-wide, so this is a new edge for this crate and not a new package.
serde_json = { workspace = true }
# Already a normal dependency above; this entry is here for one FEATURE, the way `sutura-http` asks
# `sutura-runtime` for `test-capture`. `warehouse::agreement` is the typed comparison
# `tests/differential.rs` makes, shared with the BigQuery acceptance leg so the two cannot diverge
# again - they did, and both erased the cell type.
sutura-domain = { workspace = true, features = ["agreement"] }
# The golden suite lives here because this is the lowest crate that can see both ports at once, so
# it is the one place a corpus can be run against a real adapter and a fake without either of them
# depending on the other.
sutura-catalog-local = { workspace = true }
# A second CATALOG, and the first one that supplies part of a model: it is a DECLARING source and this
# suite expands the three universal catalog cells over it, measured against its own declaration
# rather than the oracle. `docs/adr/0016`.
sutura-catalog-datahub = { workspace = true }
# A second DECLARING catalog, and the narrowest metadata source: a dictionary read from an RDBMS.
# It provides structure, prose and the join columns a foreign key records, and declares no measure,
# no grain, no definitional filter, no value allowlist and no anchor - `docs/adr/0011` specifies it
# and `github.com/telekom/sutura#151` is the issue. Measured against its own declaration like
# `sutura-catalog-datahub`. `docs/adr/0016`.
sutura-catalog-rdbms = { workspace = true }
# A DATA SOURCE, not an engine, and a development dependency rather than a shipped one: it is here
# to prove the SQL we render actually runs somewhere, which is the whole job of a data-source
# adapter today. The binary links the engine and nothing else.
sutura-exec-duckdb = { workspace = true }
# A second DATA SOURCE, over the wire, and a development dependency for the same reason: it proves
# the Postgres statement we render is accepted by a real Postgres. Its corpus cells run against this
# worktree's provisioned tier and skip where none is up.
# `fixtures` for `PostgresWarehouse::local_config`, which the adapters harness below opens the tier
# with. A DEV-dependency's feature reaches no consumer, which is the point of the gate on it.
sutura-exec-postgres = { workspace = true, features = ["fixtures"] }
# A third DATA SOURCE, and the one with no local venue at all - `crates/sutura-app/tests/adapters/
# adapters.rs`'s own `NoLocalTier` reports it unavailable unconditionally, so this suite links the
# type and dials nothing. Default features only: no `wire`, no outbound stack, because nothing here
# ever opens one.
sutura-exec-bigquery = { workspace = true }
# THE engine, and what the golden suite executes with. Also the far side of the differential test:
# one plan computed locally here and pushed down as SQL to the data source above, rows compared. A
# statement that is valid SQL with different semantics is the bug class that catches.
sutura-exec-datafusion = { workspace = true, features = ["measurement"] }
# The bounded measurement is specifically of the configured default, not a duplicated literal.
# Test-only keeps the settings adapter out of `sutura-app`'s inward production dependency graph.
sutura-config = { workspace = true }
# How a network adapter's tests reach the docker tier: the discovery file a harness reads, and the
# skip-or-fail decision that keeps the corpus green in CI where there is no socket.
sutura-dev = { workspace = true }
insta = { workspace = true }
# Rendering, and a DEV dependency here rather than a shipped one, which is the whole point of the
# split. This crate compiles a question into a plan and hands the plan to a port; the SQL goldens
# are a test asking for a rendering. Nothing in `src/` names it, so a build that only ever executes
# plans on the engine does not link a SQL generator.
sutura-sql = { workspace = true }
serde_norway = { workspace = true }
# Parse-only, and test-only: it proves the generated statement is valid in each target dialect
# without needing one of each data system in CI. It never re-emits, so it cannot introduce the
# parser-differential problem that makes translation unusable on the query path.
polyglot-sql = { workspace = true }

# Forwards `sutura-exec-bigquery`'s own default-off `fixtures`, and exists for exactly one reason:
# `#[cfg(feature = ..)]` reads the CURRENT crate's features, so `NoLocalTier`'s `impl JobTransport`
# in `tests/adapters/adapters.rs` has no direct way to ask whether that trait's `apply` method - itself
# `#[cfg(feature = "fixtures")]` in the crate that defines it - exists in this build. Declaring the
# same name here and forwarding it is what lets one `#[cfg(feature = "fixtures")]` gate both sides
# without the two ever being asked to agree by hand. Every gate here passes `--all-features`, which
# turns both on together; nothing shipped reads a feature this crate declares only for its own tests.
[features]
fixtures = ["sutura-exec-bigquery/fixtures"]

[lints]
workspace = true
