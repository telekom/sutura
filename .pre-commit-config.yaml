# Hooks, run by `prek` (a single Rust binary — no Python runtime needed to lint Rust).
# The config format is pre-commit's, so it stays reversible: `pre-commit` runs it too.
#
# Tiered by cost on purpose. A hook that takes 40 s on every commit gets disabled by the
# team inside a week, so fast checks run on commit and slow ones on push.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push, commit-msg]
minimum_pre_commit_version: "3.0.0"

repos:
  - repo: local
    hooks:
      # --- on commit: fast, and scoped to the touched area -------------------
      - id: rust-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        args: ["--check"]
        language: system
        files: \.rs$
        pass_filenames: false

      # `--all-features` is not optional here: the adapters are feature-gated and
      # default-off, so without it clippy inspects almost nothing and reports success.
      - id: rust-clippy
        name: cargo clippy (-D warnings, all features)
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

      # CRLF has broken this repo more than once: Nix keeps a carriage return inside an
      # `''...''` string, so it becomes part of a shell argument and the error names a
      # lint or a flag that looks byte-identical to the correct one. Cheap, so it runs on
      # every commit and over the whole repo.
      - id: line-endings
        name: LF line endings only
        entry: cargo run -q -p xtask -- line-endings
        language: system
        pass_filenames: false
        always_run: true

      # Narrowed by the changed files pre-commit passes us: editing one crate should not
      # pay for a workspace check. Clippy below still sees the whole workspace, so this is
      # fast feedback, never the only thing that inspects the code. A path that belongs to
      # no package widens to `--workspace` rather than checking less than was asked.
      - id: rust-check-changed
        name: cargo check (changed packages only)
        entry: cargo run -q -p xtask -- check-changed
        language: system
        files: \.rs$
        pass_filenames: true

      - id: boundaries
        name: domain crate has no framework dependency
        entry: cargo run -q -p xtask -- check-boundaries
        language: system
        files: (Cargo\.(toml|lock)|\.rs)$
        pass_filenames: false

      # Whole-repo scan on purpose, and cheap enough to afford: it costs milliseconds and
      # it also catches a file that grew in a commit that does not touch it.
      - id: max-lines
        name: no file over 1000 lines
        entry: cargo run -q -p xtask -- max-lines
        language: system
        pass_filenames: false
        always_run: true

      - id: unused-deps
        name: every declared dependency is used
        entry: cargo run -q -p xtask -- unused-deps
        language: system
        files: (Cargo\.(toml|lock)|\.rs)$
        pass_filenames: false

      # --- on push: the expensive gates -------------------------------------
      - id: rust-tests
        name: cargo nextest (all features)
        entry: cargo nextest run --workspace --all-features
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-deny
        name: advisories, licences, bans, sources
        entry: cargo deny check
        language: system
        pass_filenames: false
        stages: [pre-push]

      # --- on commit-msg ------------------------------------------------------
      # `default_install_hook_types` above declares `commit-msg`, and AGENTS.md states the
      # convention. Until this hook existed, neither of those checked anything.
      - id: commit-msg
        name: conventional commit subject
        entry: cargo run -q -p xtask -- commit-msg
        language: system
        stages: [commit-msg]

      # Was `github.com/pre-commit/pre-commit-hooks`. That host is not reachable from every
      # network this repo is developed on, and an unfetchable hook is a hook that does not
      # run — so conflict markers, trailing whitespace, final newlines and file size are
      # checked by our own binary. `fmt` fixes the mechanical ones, including CRLF.
      #
      # check-yaml / check-toml are not reimplemented: every YAML and TOML file here is
      # already parsed by a tool in these gates (cargo, cargo-deny, clippy, zizmor, prek),
      # so a syntax error already fails something.
      # Tree-shaped skill discovery only saves tokens if the router is trustworthy: an
      # entry pointing at a deleted skill routes an agent nowhere, and a SKILL.md in no
      # route is a rule nobody reads while believing it is in force.
      - id: check-skills
        name: skill router and skill tree agree
        entry: cargo run -q -p xtask -- check-skills
        language: system
        files: ^\.agents/skills/
        pass_filenames: false

      - id: text-hygiene
        name: conflict markers, whitespace, final newline, file size
        entry: cargo run -q -p xtask -- text-hygiene
        language: system
        pass_filenames: false
        always_run: true

      # Workflow static analysis: template injection into `run:`, over-permissive tokens,
      # untrusted checkout. From pixi, so it needs no Rust build.
      - id: zizmor
        name: GitHub Actions static analysis
        entry: pixi run --frozen zizmor
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
