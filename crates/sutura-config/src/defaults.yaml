# The built-in defaults, compiled into the binary.
#
# EMBEDDED rather than shipped as a file, and that is the first decision in this file. A default
# that lives on disk is a default that can be missing, and a service whose configuration file was
# not mounted should not fall back to something nobody wrote down. So this is always the bottom
# layer, every key has a value here, and a deployment's own file overrides what it wants to change
# rather than restating the whole tree.
#
# The values are the SAFE posture, not the convenient one:
#
#   * `server.host` is loopback. This service has no per-caller identity, so its bind address is
#     its whole perimeter, and reaching it from another host is an explicit decision made in two
#     places (`security.tls_termination` and an access token) rather than a default.
#   * `security.access_token` is absent, which is only permitted on loopback and outside
#     production. Anything else refuses to start.
#   * `security.tls_termination` is `none`, which says nothing encrypts the path. A bind other
#     hosts can reach requires the operator to name the terminator instead - `sidecar`, `ingress`
#     or `in-process` - so the cleartext hop the bearer token crosses is a stated fact rather than
#     an assumption. A non-loopback bind is NOT refused: an ingress or a sidecar terminating in
#     front of a plaintext pod-local listener is the normal arrangement.
#   * `rate_limit.enabled` is NOT here, because it follows the environment: off in development and
#     test, on in production - the same shape `telemetry.format` and `api.docs` have. A limiter that
#     fires while somebody is iterating is a bug report about sutura that is really a bug report
#     about the tier; production is the deployment an unbounded caller costs something. The
#     convenience runs in one direction only: `rate_limit.enabled: false` in production is a refusal
#     to start, not a default, and an explicit value in either direction is recorded as explicit so
#     the startup log can say somebody chose it.
#   * `rate_limit.client_address` is `peer` and `rate_limit.trusted_proxies` is empty. The peer
#     address cannot be forged; a forwarded header can, so believing one requires naming the hop
#     it may come from. Behind an ingress, `peer` is one bucket for every caller - see
#     `docs/serving.md`.
#
# Overriding: a file layered on top of this (`<dir>/base.yaml`, then `<dir>/<environment>.yaml`),
# then an environment variable per key - `SUTURA__SERVER__PORT`, `SUTURA__SECURITY__ACCESS_TOKEN`.
# The environment is chosen by `SUTURA_ENVIRONMENT` alone and is deliberately not a key here.

server:
  # Loopback. See above: this is a security default, not a convenience one.
  host: "127.0.0.1"
  port: 8080
  request_timeout_seconds: 30
  # A modelled question is a few hundred bytes. 64 KiB is generous by three orders of magnitude and
  # still refuses a body that exists to be large.
  max_body_bytes: 65536

security:
  # One of: none, sidecar, ingress, in-process. See the note above - this is a declaration of where
  # TLS is terminated, not a control that terminates it.
  tls_termination: "none"
  # `identity` and `single_user_because` are DELIBERATELY ABSENT, and this is the only pair in this
  # file whose absence is a refusal rather than a value.
  #
  # `identity` is one of: single-user, multi-user. It says who a query runs AS.
  #
  #   * `single-user` means credentials are static configuration: one user, one host, not
  #     multi-tenant. A source served under one identity is correct for EVERYTHING there, because the
  #     configured credential is that one user's own. It requires `single_user_because` - the
  #     operator's own sentence for why - which is also the acknowledgement every shared source in
  #     that deployment borrows.
  #   * `multi-user` means the caller's identity arrives per request. Shared sources are still
  #     permitted, and that is the whole difficulty: each one has to be acknowledged on its own
  #     `sources.<alias>.acknowledged_because`, because inheriting an acknowledgement is how a
  #     source nobody thought about gets served to everybody as somebody else's identity.
  #
  # There is no default and no derivation. "Every source shared means single-user" is the derivation
  # that gets proposed, and it is unsound in exactly the configuration that most needs the check: a
  # genuinely multi-tenant deployment whose sources are all shared would derive to single-user and be
  # exempted from the acknowledgement. A deployment that configures a source and declares no mode
  # does not start.
  #
  # Neither key makes a caller identity ARRIVE. `inbound`, below, is what does, and the two are
  # independent on purpose: a deployment can verify exactly who is asking and still read every row
  # as one identity, because leg 2 - a credential per execution leg - is not built. So what this
  # declaration decides today is where a shared source's acknowledgement has to be written, which is
  # what a deployment needs in place before a subject reaches a source rather than after.
  #
  # `inbound` is deliberately ABSENT, and it is the one group in this file with no default at any
  # depth. It is how the identity of a CALLER reaches this deployment - leg 1, `docs/adr/0014` - and
  # the two absences it has are different facts:
  #
  #   * no `inbound` block at all, which is this file, means there is no per-caller identity. The
  #     access token authenticates the DEPLOYMENT, every question runs with whatever access the
  #     process has, and nothing about leg 1 becomes required. That is a single-player deployment and
  #     `docs/adr/0008` part 5a calls it a first-class shape rather than a degraded one.
  #   * an `inbound` block with no `mode` is a deployment that meant to establish identity and did not
  #     say how. It REFUSES TO START, because both defaults are wrong in opposite directions: `direct`
  #     makes a deployment behind a gateway reject every caller, and `behind-gateway` makes a directly
  #     exposed one accept a proof anybody can forge.
  #
  # A deployment that wants it writes one of these two shapes, in its own file:
  #
  #   security:
  #     inbound:
  #       mode: "direct"                # this deployment IS the resource server
  #       resource: "https://sutura.example.com"          # what `aud` must equal, byte for byte
  #       authorization_server: "https://issuer.example.com"  # the `iss` VALUE, exactly
  #       key_set_file: "/etc/sutura/keys/jwks.json"       # a JWK set. There is no URL source yet
  #       algorithms: ["RS256"]         # pinned. `none` and every `HS*` are refused at startup
  #       # token_type is OPTIONAL and defaults to RFC 9068's `at+jwt`. Leaving it out is the safe
  #       # reading: without a class check, ANY JWT this issuer signed for this audience verifies -
  #       # an OIDC ID token included, whenever the resource identifier is also a client id, which
  #       # is the ordinary arrangement. Write `any` to switch the check off; the startup log then
  #       # says so at WARN on every boot.
  #       # token_type: "at+jwt"
  #
  #   security:
  #     inbound:
  #       mode: "behind-gateway"        # a fronting component authenticated the caller
  #       transit_header: "x-transit-proof"   # where its SIGNED ASSERTION arrives - never a name
  #       transit_issuer: "https://gateway.example.com"
  #       transit_audience: "https://sutura.example.com"
  #       key_set_file: "/etc/sutura/keys/gateway-jwks.json"
  #       algorithms: ["ES256"]
  #       # REQUIRED in this mode, because a component's `typ` is a fact only the deployment knows -
  #       # there is nothing this crate could guess that does not either reject every request or
  #       # check nothing. Write `any` if the component sets none.
  #       transit_token_type: "at+jwt"
  #       # Optional; 120 seconds by default, one hour at most. An assertion declaring a longer
  #       # `exp - iat` than this is refused, and one with no `iat` at all is refused - so what
  #       # "short-lived" means is a number this deployment chose rather than one the component
  #       # handed it. Inside that window an intercepted assertion REPLAYS: nothing binds one to a
  #       # request, so the hop between the component and this process is a trusted boundary.
  #       transit_max_lifetime_seconds: 120
  #
  # `direct` and `access_token` together are a refusal to start: both are read from
  # `authorization: Bearer`, and a request cannot carry two credentials in one header. `behind-gateway`
  # reads a header of its own, so there both survive.
  #
  # NEITHER makes a data source execute as the asking subject. That is leg 2, it needs a credential per
  # leg and a source that declares it can impersonate, and none of it is built - the startup log says
  # so on every boot.

rate_limit:
  # `enabled` is deliberately absent - see the note above. It follows the environment, and writing
  # `true` here would make a value nobody chose look exactly like one somebody did.
  #
  # The unauthenticated surface: liveness, and the generated interface description. Nothing there
  # is worth polling, so the tier is tight.
  probe_per_second: 2
  probe_burst: 5
  # The versioned API, where one caller legitimately asks several questions in a row.
  api_per_second: 10
  api_burst: 20
  # `peer` or `forwarded`. `forwarded` refuses to start with an empty `trusted_proxies`, because a
  # header nobody vouched for is a bucket the caller chooses.
  client_address: "peer"
  trusted_proxies: []

telemetry:
  service_name: "sutura"
  # Overridden by `RUST_LOG` when that is set, which is the convention every Rust operator already
  # knows. This is the fallback, not the ceiling.
  filter: "info"

# The data systems this deployment declares, keyed by the alias a model's `source:` names.
#
# DELIBERATELY ABSENT, and an empty registry is not refused here: `Settings::load` on these defaults
# has to keep producing a `Settings`, because that is what the `prompt` command and every settings
# test read. What refuses a deployment that declared nothing is the composition root, which finds the
# catalog naming a source it has no entry for and stops before a listener is bound.
#
# One entry per data system:
#
#   sources:
#     local:
#       # Which kind of data system this is: `files` is the only one this build has an adapter for.
#       # Required, with no default. An unknown word is a parse refusal listing what is available.
#       kind: "files"
#       # Absolute. A relative path resolves against whatever working directory the supervisor chose,
#       # which is a different directory on every host. Refused at parse.
#       data_dir: "/srv/sutura/data"
#       # shared-service-user, or impersonation-at-source. REQUIRED, with no default: there is no
#       # bind address that makes "one identity for every caller" safe to assume.
#       posture: "shared-service-user"
#       # Required for a shared source in multi-user mode, and per source - no acknowledgement is
#       # global and none is inherited from a neighbour. In single-user mode the mode's own
#       # `security.single_user_because` is the acknowledgement.
#       acknowledged_because: "a directory of CSVs this deployment owns; one process, one identity"
#     warehouse:
#       kind: "files"
#       data_dir: "/srv/sutura/warehouse"
#       posture: "impersonation-at-source"
#       # The identity that re-runs this source's anchors at boot. Only on an impersonating source:
#       # on a shared one the verification identity IS the shared identity, so a name here would be
#       # read by nothing and is refused. A bundle with an anchor on an impersonating source that
#       # declares none does not boot - a deployment that wants that gets it by authoring no anchors
#       # on that source's metrics, which is a catalog fact a reviewer can see.
#       verification_identity: "sutura_anchor_reader"
#
# `working_set_max_bytes` is not a key here and never will be: there is one working set, so a
# per-source ceiling would be a number with nothing to bound. Writing it under a source is an
# unknown-key error rather than a setting that quietly does nothing.

catalog:
  dir: "catalog"
  data_dir: "data"
  # A placeholder, and it is meant to be replaced by a commit id or a build number: what identifies
  # a snapshot of a directory is not something the directory knows.
  version: "unversioned"

runtime:
  # The resource that runs out is a blocking-pool thread holding a data system, not a socket, so
  # this is deliberately a small number and not a connection-limit-shaped one.
  max_concurrent_queries: 8
  # Shorter than `server.request_timeout_seconds` on purpose: a caller who has waited this long for
  # a slot is better served by a `503` they can retry than by a `408` much later saying the same
  # thing less clearly.
  admission_timeout_seconds: 5
  # How many bytes the engine's operators may reserve at once - a hash-join build side, aggregate
  # state, a sort. One gibibyte, and PROVISIONAL: nobody has measured it, so it is a starting point
  # recorded as one rather than a finding. `WorkingSetCeiling::DEFAULT_BYTES` is the same number and a
  # test asserts the two agree, so this line cannot drift on its own.
  #
  # It is what makes an oversized join a refusal instead of process death. Without it the engine
  # installs an unbounded pool, and shipped profiles compile `panic = "abort"` - so an allocation
  # failure ends the process for every caller in flight rather than refusing the one who asked.
  #
  # It is checked at boot against the memory the process can actually reach - a cgroup limit, or the
  # machine - and refuses to start above it, because a ceiling over that is the unbounded case with a
  # number written next to it. On a platform that will not say, notably macOS, no check is made and
  # the startup log says so.
  #
  # QUERY-WIDE, with no per-source override, and a source declaration carrying one is an unknown-key
  # error rather than a setting that quietly does nothing. There is one working set, so a per-source
  # ceiling would be a number with nothing to bound. Nothing here sizes a spill directory either:
  # exhaustion refuses, and never writes the asking subject's rows to local disk.
  working_set_max_bytes: 1073741824
  # `engine_worker_threads` is deliberately absent, which means "as many threads as this machine can
  # run", resolved to a number at load time so the startup log prints what is in effect. A container
  # with a CPU quota should set it: `available_parallelism` reports what the kernel exposes, which on
  # most runtimes is the host's core count rather than the cgroup's share.
  # Chosen against the orchestrator's kill timer rather than as a round number: the usual window is
  # thirty seconds, and this leaves room for the exit itself.
  shutdown_grace_seconds: 15

prompt:
  # How a catalog author's own prose reaches an agent: `quoted` or `omitted`.
  #
  # `quoted` puts `> ` at the start of every line of it and names the trust boundary in the text
  # above the block. That is a mitigation and not a claim of safety: a description is content
  # somebody wrote into a catalog document, this repository's threat model treats catalog content as
  # untrusted, and a per-line prefix stops prose from reaching column zero without doing anything
  # about prose that persuades. `omitted` leaves it out for a deployment whose catalog authors are
  # not the people who decide what its agents are told - and the prompt then SAYS the descriptions
  # exist and were left out, because silence is what makes an agent infer a definition from a name.
  #
  # NOT environment-derived, unlike `telemetry.format` and `api.docs`. Whether a catalog's authors
  # are trusted is a fact about who writes the catalog, not about whether this is a laptop.
  catalog_prose: "quoted"
  # `instructions_file` is deliberately absent, and absent means there is no operator section at all.
  # A path here is layered ON TOP of the derived text as its last section; there is no key that
  # replaces the derived part, because the derived part carries the refusal guidance and a key whose
  # worst setting deletes that would be a key whose failure mode is invisible.
  #
  # An EMPTY string is an error rather than an absence: an empty path resolves to the working
  # directory. Remove the key to mean "no operator text".
