# Manual diagnostic of one existing test; no source publication or merge evidence.
name: Native duplicate-output diagnostic
run-name: Native duplicate-output diagnostic ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      consumer:
        description: Reviewed diagnostic
        type: choice
        required: true
        options: [native-duplicate-diagnostic]
      request_id:
        description: Exact fresh reviewed request
        type: string
        required: true
      expected_helper_sha:
        description: Exact reviewed workflow commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: native-duplicate-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-bundle:
    runs-on: rust-mcp-16core
    timeout-minutes: 360
    env:
      CONSUMER: ${{ inputs.consumer }}
      REQUEST_ID: ${{ inputs.request_id }}
      EXPECTED_HELPER_SHA: ${{ inputs.expected_helper_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      SOURCE_COMMIT: 969afca89a6e8edb7ed09f42db033577e5558e56
      EXPECTED_TREE: 15514b7c16507c81e20acadaab99901d4dc9aedd
      INSTRUMENTED_TREE: f9376c6ad4643e1396d738a811b2c62368e6d3ba
      PATCH_SHA: df735d9a7f9328a57c835d25a3f3aa8d95eacadb4ddfe4b21ac2dea3a0fcb3a1
      FILTER: package(=sutura-exec-datafusion) & test(=combine::statement::tests::oracle::native_numeric_duplicate_outputs_restore_names_and_distinct_positions)
      GIT_OPTIONAL_LOCKS: "0"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the reviewed helper
        shell: bash
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_UNSTABLE_CODEGEN_BACKEND CARGO_PROFILE_DEV_CODEGEN_BACKEND
          test "$GITHUB_REPOSITORY" = telekom/sutura
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/ci/source-projections-native-duplicate-diagnostic-r2
          [[ "$EXPECTED_HELPER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HELPER_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_HELPER_SHA"
          test "$(git --no-optional-locks rev-parse HEAD)" = "$EXPECTED_HELPER_SHA"
          test -z "$(git --no-optional-locks status --porcelain=v1 --untracked-files=all)"
          test -z "${SKIP:-}${PREK_SKIP:-}${PRE_COMMIT_ALLOW_NO_CONFIG:-}"
          test -z "${GIT_CONFIG_COUNT:-}${GIT_CONFIG_PARAMETERS:-}"
          test "$CONSUMER" = native-duplicate-diagnostic
          test "$REQUEST_ID" = f78f6e3d-d5e3-40b6-9268-071caae1d6c4

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 969afca89a6e8edb7ed09f42db033577e5558e56
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the exact published source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/native-duplicate-diagnostic"
          mkdir "$EVIDENCE"
          test "$(git --no-optional-locks rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git --no-optional-locks write-tree)" = "$EXPECTED_TREE"
          test -z "$(git --no-optional-locks status --porcelain=v1 --untracked-files=all)"
          git --no-optional-locks cat-file commit HEAD > "$EVIDENCE/source-commit.raw"
          sha256sum flake.lock devenv.lock pixi.lock .pre-commit-config.yaml > "$EVIDENCE/source-inputs.sha256"
          base64 --decode <<'PATCH' > "$EVIDENCE/diagnostic.patch"
          
          PATCH
          test "$(sha256sum "$EVIDENCE/diagnostic.patch" | cut -d ' ' -f 1)" = "$PATCH_SHA"

      - uses: $/.github/actions/reclaim-disk

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: $/.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Run the existing test with scoped DEBUG logging and restore source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_UNSTABLE_CODEGEN_BACKEND CARGO_PROFILE_DEV_CODEGEN_BACKEND
          export EVIDENCE="$RUNNER_TEMP/native-duplicate-diagnostic"
          patch="$EVIDENCE/diagnostic.patch"
          snapshot() {
              local out="$EVIDENCE/$1"
              mkdir "$out"
              cp "$(git --no-optional-locks rev-parse --git-path index)" "$out/index.raw"
              git --no-optional-locks ls-files --stage -z > "$out/index.entries.z"
              git --no-optional-locks ls-files -z > "$out/tracked.paths.z"
              git --no-optional-locks ls-tree -rz --full-tree "$EXPECTED_TREE" > "$out/tree.manifest.z"
              git --no-optional-locks write-tree > "$out/index.tree"
              git --no-optional-locks rev-parse HEAD > "$out/HEAD"
              git --no-optional-locks status --porcelain=v1 --untracked-files=all > "$out/status.txt"
              git --no-optional-locks diff --binary --full-index > "$out/unstaged.diff"
              git --no-optional-locks diff --cached --binary --full-index > "$out/staged.diff"
              tar --create --gzip --file "$out/tracked.tar.gz" --null --no-recursion --files-from "$out/tracked.paths.z"
          }
          test -z "${SKIP:-}${PREK_SKIP:-}${PRE_COMMIT_ALLOW_NO_CONFIG:-}"
          test -z "${GIT_CONFIG_COUNT:-}${GIT_CONFIG_PARAMETERS:-}"
          test "$(git --no-optional-locks rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git --no-optional-locks write-tree)" = "$EXPECTED_TREE"
          test -z "$(git --no-optional-locks status --porcelain=v1 --untracked-files=all)"
          test "$(sha256sum "$patch" | cut -d ' ' -f 1)" = "$PATCH_SHA"
          snapshot before
          PATCH_APPLIED=0
          finish() {
              local run_status=$?
              trap - EXIT
              set +e
              printf '%s\n' "$run_status" > "$EVIDENCE/diagnostic.status"
              (
                  set -e
                  snapshot after-test
                  if [ "$PATCH_APPLIED" = 1 ]; then
                      git --no-optional-locks apply --reverse --index --check "$patch"
                      git --no-optional-locks apply --reverse --index "$patch"
                  fi
                  test "$(git --no-optional-locks rev-parse HEAD)" = "$SOURCE_COMMIT"
                  test "$(git --no-optional-locks write-tree)" = "$EXPECTED_TREE"
                  git --no-optional-locks diff --exit-code
                  test -z "$(git --no-optional-locks status --porcelain=v1 --untracked-files=all)"
                  tar --extract --gzip --file "$EVIDENCE/before/tracked.tar.gz" -- crates/sutura-exec-datafusion/src/combine/statement/tests/oracle.rs
                  tar --compare --gzip --file "$EVIDENCE/before/tracked.tar.gz" > "$EVIDENCE/tracked-compare.log" 2>&1
                  cp "$EVIDENCE/before/index.raw" "$(git --no-optional-locks rev-parse --git-path index)"
                  snapshot restored
                  cmp "$EVIDENCE/before/index.raw" "$EVIDENCE/restored/index.raw"
                  cmp "$EVIDENCE/before/index.entries.z" "$EVIDENCE/restored/index.entries.z"
                  cmp "$EVIDENCE/before/tracked.paths.z" "$EVIDENCE/restored/tracked.paths.z"
                  cmp "$EVIDENCE/before/HEAD" "$EVIDENCE/restored/HEAD"
                  cmp "$EVIDENCE/before/index.tree" "$EVIDENCE/restored/index.tree"
                  cmp "$EVIDENCE/before/status.txt" "$EVIDENCE/restored/status.txt"
              )
              local restoration_status=$?
              printf '%s\n' "$restoration_status" > "$EVIDENCE/restoration.status"
              printf '{"helper":"%s","source":"%s","source_tree":"%s","instrumented_tree":"%s","patch_sha256":"%s","filter":"%s","request_id":"%s","run_id":"%s","attempt":"%s","diagnostic_status":%s,"restoration_status":%s}\n' \
                  "$EXPECTED_HELPER_SHA" "$SOURCE_COMMIT" "$EXPECTED_TREE" "$INSTRUMENTED_TREE" "$PATCH_SHA" \
                  "$FILTER" "$REQUEST_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$run_status" "$restoration_status" > "$EVIDENCE/receipt.json"
              (cd "$EVIDENCE" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > "$EVIDENCE/SHA256SUMS"
              local manifest_status=$?
              if [ "$restoration_status" -ne 0 ] || [ "$manifest_status" -ne 0 ]; then
                  exit 1
              fi
              exit "$run_status"
          }
          trap finish EXIT
          git --no-optional-locks apply --index --check "$patch"
          git --no-optional-locks apply --index "$patch"
          PATCH_APPLIED=1
          test "$(git --no-optional-locks write-tree)" = "$INSTRUMENTED_TREE"
          git --no-optional-locks diff --exit-code
          snapshot instrumented
          printf '%s\n' 'nix run .#just -- test-only "$FILTER" ci' > "$EVIDENCE/task.txt"
          set +e
          nix run .#just -- test-only "$FILTER" ci 2>&1 | tee "$EVIDENCE/test-debug.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$EVIDENCE/task.status"
          printf '%s\n' "${statuses[1]}" > "$EVIDENCE/tee.status"
          test "${statuses[1]}" -eq 0
          exit "${statuses[0]}"

      - name: Retain DEBUG output, patch, indexes and restoration
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-duplicate-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/native-duplicate-diagnostic
          if-no-files-found: error
          retention-days: 14
