# The optimised build, on request only.
#
# `release-performance` is `release` plus fat LTO and a single codegen unit. That is minutes
# of extra compile time for a binary worth shipping only once throughput has actually been
# measured - so it is a separate, manually dispatched workflow rather than an input on the
# normal release. Nothing schedules it and no tag triggers it.
#
# WHAT IT DOES NOT DO: `target-cpu=native`. That is the obvious next optimisation and it is
# deliberately absent, because these artifacts are *published* - a binary tuned for the
# runner's CPU would fault with SIGILL on an older one, and a Nix derivation hash does not
# represent the CPU it was built on, so the mismatch would not even be visible. A build
# pinned to a known deployment host can make that trade; a downloadable release cannot.
#
# Names never collide with the normal release: assets are `-performance` and the image tag is
# `<version>-performance`. `latest` is never moved, so nothing starts running an optimised
# build by accident.
#
# THE COMMAND-LINE TOOL ONLY, and that is stated rather than left to be noticed. A release publishes
# two binaries since `github.com/telekom/sutura#111`, and `nix/shipped.nix` gives `sutura-serve` a
# `-performance` sibling for free - `packages.sutura-serve-performance`, `packages.oci-serve-performance`
# - which nothing here builds. The reason is this file's own premise: fat LTO is minutes of compile
# time for throughput SOMEBODY HAS MEASURED, and nobody has measured the server's. Building it here
# would be paying that price on the strength of symmetry. When there is a measurement, this file gains
# the second binary and the packages are already there.
#
# ACTIONS: the same three release.yml uses - checkout, the nix installer and the nix cache -
# each pinned by commit, and nothing more. Publishing is `gh` and `docker` rather than a
# release action, for the same reason as release.yml.
name: release-performance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "build" to confirm the optimised build'
        required: true
        type: string
      publish:
        description: "Attach to the release and push the image (requires a tag ref)"
        required: false
        default: false
        type: boolean

# Nothing broad at the workflow level. `validate` reads a text input and needs no write
# at all; only `build` publishes, and only when asked to.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # A 20-minute build should not start because someone clicked the wrong button.
  validate:
    # `ubuntu-latest`: two string comparisons. `build` below keeps the Rust runner, which is
    # where the 20-minute build this confirmation guards actually happens.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          if [ "$CONFIRM" != "build" ]; then
            echo '::error::Type "build" to confirm the optimised build.'
            exit 1
          fi
          # Publishing writes to a release and to GHCR, so it needs a tag to write *to*.
          if [ "$PUBLISH" = "true" ] && ! printf '%s' "$REF" | grep -q '^refs/tags/'; then
            echo "::error::publish=true requires a tag ref; got $REF"
            exit 1
          fi
          echo "confirmed - ref $REF, publish=$PUBLISH"

  build:
    needs: [validate]
    runs-on: rust-mcp-32core
    timeout-minutes: 120
    permissions:
      contents: write # attach assets to an existing release
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before nix installs: /nix/store is what fills. See
      # `.github/actions/reclaim-disk` for why this is local and why it cannot
      # affect the Nix cache.
      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent: with it, a pull request could add a substituter and a trusted key and have
          # CI fetch attacker-built store paths whose signature verifies. Anything CI needs
          # goes here, where the workflow diff shows it.
          # AND THE STORES THIS REPOSITORY PUBLISHES, which is why the pair below is here rather
          # than only in `ci.yml`: a store this repository fills and never reads is spend with no
          # return, and a tag-started run used to read none of them. Both halves are COMMITTED, so
          # a reviewer sees them in the diff and `cargo xtask check-workflows` compares them - it
          # now also refuses an installer step that names NEITHER. Nix verifies every path against
          # the keys below; what bounds the poison risk is narrower and differs per store - see
          # `ALLOWED` in `xtask/src/workflows/cache_scope/retired/stores.rs`.
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      # Carries /nix/store between runs: the same action at the same commit as ci.yml and
      # release.yml. The argument for why a path that PUBLISHES may share a cache is written out
      # in full in release.yml - the Actions cache is scoped by ref, a run restores only from its
      # own ref and from the default branch, and a cache a pull request wrote lives in
      # `refs/pull/.../merge`, where only that pull request's own re-runs can read it. This
      # workflow is dispatched by hand and, when it publishes, from a tag: the same two scopes
      # release.yml reads, and no pull request can write to either.
      #
      # The win is bigger here than anywhere else in the repo. Fat LTO with a single codegen unit
      # is the slowest build there is, this job runs the full gate set before it starts, and a
      # person clicked the button and is waiting.
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # Same rule as the normal release: nothing shippable is built before the gates pass.
      # These reuse the `release`-profile artifacts, which is why they are cheap here.
      - name: Lints and tests before building anything shippable
        run: |
          set -eu
          nix build .#checks.x86_64-linux.hygiene -L
          nix build .#checks.x86_64-linux.fmt -L
          nix build .#checks.x86_64-linux.clippy -L
          nix run .#deny
          nix build .#checks.x86_64-linux.nextest -L
          nix build .#checks.x86_64-linux.doctest -L
          nix build .#checks.x86_64-linux.one-binary -L
          # And which FEATURES the artefacts this release publishes carry, read out of their own
          # embedded dependency list. `nix/shipped.nix` decides it; this is what asserts it.
          nix build .#checks.x86_64-linux.shipped-features -L

      - name: Build both targets (release-performance)
        run: |
          set -eu
          nix build .#sutura-x86_64-unknown-linux-gnu-performance  -L -o result-x86_64
          nix build .#sutura-aarch64-unknown-linux-gnu-performance -L -o result-aarch64

      # The point of the profile is a different binary. Print the sizes so the run is
      # evidence of that rather than an assertion about it.
      - name: Report what was produced
        run: |
          set -eu
          for f in result-x86_64/bin/sutura result-aarch64/bin/sutura; do
            printf '%-32s %s bytes\n' "$f" "$(wc -c < "$f")"
          done
          result-x86_64/bin/sutura --version

      - name: Package with checksums
        run: |
          set -eu
          mkdir -p dist stage
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            case "$target" in
              x86_64-*)  src=result-x86_64 ;;
              aarch64-*) src=result-aarch64 ;;
            esac
            install -m755 "$src/bin/sutura" stage/sutura
            name="sutura-${target}-performance"
            tar -C stage -czf "dist/${name}.tar.gz" sutura
            ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          done
          ls -l dist

      - name: Build the optimised image
        run: nix build .#oci-performance -L -o result-oci

      - name: Load it and prove the binary runs
        run: |
          set -eu
          ./result-oci | docker load
          docker run --rm sutura:latest --version
          docker image inspect sutura:latest --format 'digest: {{.Id}}'

      # Tagged `<version>-performance` and never `latest`: an optimised image must be opted
      # into by name, not inherited by anything already pulling `latest`.
      - name: Push as <version>-performance
        if: ${{ inputs.publish }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tag="${GITHUB_REF_NAME#v}"
          docker tag sutura:latest "${IMAGE}:${tag}-performance"
          docker push "${IMAGE}:${tag}-performance"
          docker logout ghcr.io

      # The binaries are NOT attached to the release, and cannot be.
      #
      # This step used to run `gh release upload "$GITHUB_REF_NAME" dist/* --clobber`, which can
      # never succeed here: this repository has GitHub's immutable releases enabled, so a
      # release's assets are frozen the moment it is published. It returns
      # `HTTP 422: Cannot upload assets to an immutable release` - observed for real on the
      # v0.1.0 run - and no flag changes that. A workflow that runs manually, after the release
      # exists, has no way in.
      #
      # So the optimised build's deliverable is the IMAGE, pushed above as
      # `<image>:<tag>-performance`. That is digest-addressed, layer-shared and reachable by
      # anyone who can reach the registry, which the release asset never was.
      #
      # The tarballs stay in `dist/` and are listed in the step summary below, so a maintainer
      # running this by hand can still see and download them from the run. If they are ever
      # needed as durable artifacts, the answer is a separate release for the optimised build,
      # created WITH its assets in one call - not an upload onto an existing one.
      - name: Say where the binaries went
        if: ${{ inputs.publish }}
        run: |
          set -eu
          {
            echo "## Binaries"
            echo
            echo "Not attached to the release: immutable releases freeze assets at publish."
            echo "The optimised build ships as the image tagged below."
            echo
            echo '```'
            ls -l dist/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
