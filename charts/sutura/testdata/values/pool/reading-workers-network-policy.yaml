# NetworkPolicy on with two reading worker groups: the serving, worker, worker egress, one policy per
# group and operator policies all render. Each group's policy admits all of the release's nodes - the
# serving pods, the combining workers and both reading groups - and connects only to DNS and the
# addresses the group declares - `orders` its own source, `finance` its own, never the other's.
environment: production
security:
  metricsToken:
    secretName: sutura-metrics-token
  inbound:
    keySetSecretName: sutura-inbound-keys
workerPool:
  enabled: true
  issuer:
    name: sutura-nodes
networkPolicy:
  enabled: true
readingWorkers:
  groups:
    orders:
      sources: [orders]
      egress:
        - cidr: 192.0.2.10/32
          port: 5432
      catalogs:
        - name: model
          kind: markdown
          dir: /srv/sutura/catalog
          data_dir: /srv/sutura/data
          version: "1"
    finance:
      sources: [finance]
      egress:
        - cidr: 192.0.2.20/32
          port: 5433
        - cidr: 2001:db8::20/128
          port: 5433
      catalogs:
        - name: model
          kind: markdown
          dir: /srv/sutura/catalog
          data_dir: /srv/sutura/data
          version: "1"
config:
  base:
    security:
      identity: multi-user
      inbound:
        mode: direct
        resource: https://sutura.example.com
        authorization_server: https://issuer.example.com
        algorithms: [RS256]
    sources:
      orders:
        kind: files
        data_dir: /srv/sutura/orders
        posture: shared-service-user
        acknowledged_because: "a directory this deployment owns"
      finance:
        kind: files
        data_dir: /srv/sutura/finance
        posture: shared-service-user
        acknowledged_because: "a directory this deployment owns"
