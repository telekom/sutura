# OpenSSF Scorecard, weekly and on a push to `main`, PUBLISHING its results.
#
# **THIS WORKFLOW SENDS DATA TO A THIRD PARTY, DELIBERATELY.** `publish_results: true` makes the
# action mint an OIDC token whose subject names this repository and POST the run to
# `https://api.scorecard.dev` - the aggregate score, every check's score and reason, the repository
# name and the commit. That endpoint is public, and from it the score reaches the OpenSSF dataset
# and the badge in `README.md`.
#
# It is on because the badge was asked for and **the badge does not render without it** - the
# action's own documentation states `publish_results: true` and `id-token: write` as the two
# prerequisites. It is not a default, and it is one line to revert: setting it `false` stops the
# publication, and `cargo xtask check-workflows` then FAILS until the badge is removed from
# `README.md`, so the two cannot drift apart. `docs/adr/0024` is the decision.
#
# WHAT ELSE A RUN REACHES, because "publishes a score" is not the whole disclosure. The action runs
# every check it has, and three of them answer their question by asking somebody other than GitHub:
# `Vulnerabilities` queries OSV at `osv.dev` and sends the dependency set; `CII-Best-Practices`
# queries the badge API at `bestpractices.dev`; `Fuzzing` reads the OSS-Fuzz project list. The
# action takes no check-set argument, so this is not selectable - it is part of what running it
# costs, and `devco/scorecard-publication` records it beside the decision.
#
# THE ACTION RATHER THAN THE NIX-PINNED CLI, and this is a cost rather than a preference. This
# repository's rule is that nix is the only pin for a tool whose version decides what it reports,
# and `pkgs.scorecard` exists. But the CLI cannot publish - publication is the action's own step -
# so the badge selects the action, and with it two things worth naming:
#
#   * the action is `using: docker` over `image: docker://ghcr.io/ossf/scorecard-action:v2.4.4`
#     (read at commit `2d1146689b8cda280b9bc96326124645441f03bc` on 2026-09-07), so the SHA below
#     pins the manifest and NOT the code that runs. There is no way to write the digest from the
#     calling side;
#   * that image comes from `ghcr.io`, which a network behind a registry mirror has no route to.
#     Every image this repository reaches itself goes through `SUTURA_IMAGE_REGISTRY`; one named
#     inside a third-party action cannot.
#
# THE PUBLICATION HAS A WITNESS NOW, because it did not have one and needed it: this workflow
# reported `completed success` three times while `api.scorecard.dev` held no record of this project.
# The action attempts the publish, the API refuses it, and `signing.ProcessSignature` turns that
# refusal into a `::warning::` and returns nil - so a green run said nothing about whether anything
# landed. Two mechanisms now cover the two halves. `cargo xtask check-workflows` reads this file
# against every rule the API applies to a producing workflow, offline and inside the required `ci`
# job - the reason `score` runs on `ubuntu-latest` and the reason the witness is its own job. The
# `published` job asks the API whether it actually holds a score. Neither can substitute for the
# other: the first is a precondition read from a file, the second is the outcome.
#
# NOT REQUIRED, and the limit belongs next to the claim: the only status context the `main` ruleset
# requires is `ci` - see `devco/required-contexts` for the dated read. This workflow reports no
# context on a pull request, because it deliberately does not run on one: the checks read what is
# on the default branch, so scoring a pull-request head would score a tree that is not the project.
# **A falling score blocks nothing.**
#
# THIRD-PARTY ACTIONS: one, and it is the point of the file. `actions/*` is GitHub's own.
name: scorecard

on:
  # Post-merge on the default branch. `paths` is deliberately absent: most of what Scorecard scores
  # - the workflow permissions, the pinning, the branch rules, the release signatures - changes
  # without any one file predicting it.
  push:
    branches: [main]
  # A ruleset change moves the Branch-Protection score without touching the tree, and this is the
  # only event that reports it.
  branch_protection_rule:
  schedule:
    # Tuesday 06:43 UTC. Off the hour, and a different day from `security-audit.yml`, so the two
    # weekly jobs do not queue behind each other.
    - cron: "43 6 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  score:
    # `ubuntu-latest` AND NOT `rust-mcp`, and it is the only job here that is not self-hosted.
    # This is the fix for a publication that reported success three times and landed nothing.
    # `api.scorecard.dev` verifies the PRODUCING WORKFLOW before it accepts a score, and one of
    # its rules is an allowlist of runner labels. Measured from run 34174327175 on 2026-09-08:
    #
    #   http response 400 ... "workflow verification failed: scorecard job has invalid runner
    #   label: 'rust-mcp', see .../scorecard-action#workflow-restrictions for details."
    #
    # The action retries, then logs `::warning::` and returns nil - so the step exits 0 and the
    # badge never resolves. `cargo xtask check-workflows` now holds every one of those rules
    # against this file; `xtask/src/workflows/publication.rs` is the reading and the allowlist.
    # Nothing of ours runs in this job - no nix, no cargo, just a third-party container - so the
    # self-hosted label bought nothing here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # EVERY PERMISSION, NAMED, because a permission block is a security surface in itself. A
    # job-level block REPLACES the workflow-level one rather than adding to it.
    #
    # `id-token: write` is the only WRITE here and it is the publication's authentication: it mints
    # a short-lived OIDC token whose subject names this repository and ref, which `api.scorecard.dev`
    # verifies before accepting a score. It grants nothing else and no secret is exposed by it.
    #
    # The four reads below `contents` are the ones the action's own documentation asks for on a
    # PRIVATE repository, each with the check it serves. Without them those checks answer about the
    # token rather than about the repository.
    #
    # WHAT IS DELIBERATELY ABSENT: `security-events: write`, which would let the run upload SARIF to
    # code scanning. Code scanning on a private repository needs GitHub Advanced Security, and it is
    # DISABLED here as read on 2026-09-07 - so that upload would fail rather than be ignored, and
    # the permission would be granted for nothing.
    permissions:
      id-token: write      # publication only: the OIDC token api.scorecard.dev verifies
      contents: read       # the checkout, and every file-reading check
      actions: read        # workflow runs, for CI-Tests and Dangerous-Workflow
      checks: read         # check runs on a commit, for CI-Tests
      issues: read         # issue activity, for Maintained
      pull-requests: read  # review history, for Code-Review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.json
          # `json` rather than `sarif`: SARIF exists to be uploaded to code scanning, and that
          # upload cannot work here (see the permission block above). A format nobody consumes
          # would be a step that looks like a control.
          results_format: json
          # THE DISCLOSURE. See the header for exactly what this sends and where, and
          # `docs/adr/0024` for why it is on. `cargo xtask check-workflows` holds it against the
          # badge in README.md, in both directions.
          publish_results: true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-${{ github.sha }}
          path: scorecard.json
          if-no-files-found: warn
          retention-days: 90

  # THE PUBLICATION'S WITNESS, and the property is *the publication was not refused*, never *the
  # publisher ran*. That difference was a live defect rather than a hypothesis. Three runs of this
  # workflow reported `completed success` while api.scorecard.dev held no record of the project -
  # and the reason was in the scoring step's OWN OUTPUT the whole time, thrown away:
  #
  #   error sending scorecard results to webapp: http response 400, status: 400 Bad Request,
  #   error: {"code":400,"message":"workflow verification failed: ... scorecard job has invalid
  #   runner label: 'rust-mcp' ..."}
  #   ::warning::Unable to POST scorecard results to webapp: ...
  #
  # `signing.ProcessSignature` retries, logs that `::warning::` and returns nil, so the step exits
  # 0. **The evidence was never missing; nothing read it.** So this job reads it: it fetches the
  # `score` job's log for THIS run and fails if the publication was refused.
  #
  # WHY THAT SIGNAL RATHER THAN POLLING THE API, which was the first shape of this check. The API
  # indexes with a lag of its own, so *no record yet* cannot be told from *refused* - it would
  # redden on freshness. The refusal is exact, it is in this run, and it names its own reason.
  #
  # WHY A SEPARATE JOB, and it is not a style choice: api.scorecard.dev refuses the results of a
  # scoring job containing ANY step that is not a call to one of five approved actions, so a `run:`
  # step added to `score` would have broken the very publication it was meant to witness. That rule
  # is held offline by `cargo xtask check-workflows`, with this job as its own test case.
  #
  # WHAT IT DOES NOT HOLD, and both are real. It trusts the action to LOG its own refusal - a
  # future image that fails silently would pass this. And where the log carries no refusal and the
  # repository is not public, it reports UNVERIFIED rather than success: the publication may not
  # have been attempted at all, and an overstated control is itself the defect here. The API answer
  # is reported for information and is only a verdict in one direction - a score present while the
  # README still shows the stand-in, which is the badge's restore trigger.
  published:
    # `ubuntu-latest` for `score`'s reason, one step weaker: this job builds nothing either, and
    # the witness should not depend on capacity the scan itself no longer needs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `needs: score` because the subject is THIS run's log, and `always()` so a scoring job that
    # failed or was cancelled is still reported rather than silently unwitnessed.
    needs: score
    if: always()
    # NO `id-token: write`, and that is a hard requirement rather than least privilege for its own
    # sake: api.scorecard.dev refuses the whole workflow if any job other than the scoring one can
    # mint that token. `check-workflows` holds it. `actions: read` is what reads the job log.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The publication was not refused
        env:
          SLUG: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          job=$(gh api "repos/${SLUG}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name == "score") | .id' | head -1)
          if [ -z "${job}" ]; then
            echo "::error ::This run has no scoring job, so nothing was published and nothing" \
              "here can witness it."
            exit 1
          fi
          gh api "repos/${SLUG}/actions/jobs/${job}/logs" > score.log || {
            echo "::error ::The scoring job log could not be read, so whether the publication" \
              "was refused is UNREAD. That is a broken witness, not a pass."
            exit 1
          }

          if grep -qF 'Unable to POST scorecard results to webapp' score.log; then
            echo "The API's answer, from the scoring step's own log:"
            grep -oE 'http response [0-9]+, status: [^,]*, error: .*' score.log | tail -1 || true
            echo "::error ::REFUSED. api.scorecard.dev rejected this run's score and the action" \
              "downgraded that to a warning, so the scoring step exited 0 and published nothing." \
              "See xtask/src/workflows/publication.rs for every workflow-shape rule the API" \
              "applies before it accepts a score - the reason quoted above names which one."
            exit 1
          fi

          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
            "https://api.scorecard.dev/projects/github.com/${SLUG}" || echo 000)
          pending=$(grep -c 'openssf%20scorecard-publication%20pending' README.md || true)
          echo "no refusal in the scoring log; api.scorecard.dev -> HTTP ${code} (a fresh" \
            "publication is not indexed instantly); README stand-ins=${pending}"

          if [ "${code}" = "200" ] && [ "${pending}" != "0" ]; then
            echo "::error ::The publication landed and README.md still shows the" \
              "publication-pending stand-in. Restore the live badge - this job is the mechanism" \
              "that remembers, so the stand-in cannot quietly become permanent."
            exit 1
          fi

          if grep -qF 'Private repository: true' score.log; then
            echo "::warning ::No refusal in the log, and the scoring job saw a PRIVATE" \
              "repository. api.scorecard.dev serves a public dataset, so the publication is" \
              "UNVERIFIED here rather than confirmed."
            exit 0
          fi
          echo "The publication was not refused."
