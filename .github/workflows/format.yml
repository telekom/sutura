name: peer-window-proof

on:
  push:
    branches: [ci/peer-window-proof]

permissions:
  contents: read

jobs:
  validate:
    runs-on: rust-mcp-32core
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1dd20648f417ab7e4a1e9090b891d817793b6acc
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"
      - name: Open KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: |
            fallback = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci
      - name: Validate exact final source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/peer-window-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/peer-window-proof/source-sha"
          nix shell --inputs-from . nixpkgs#just nixpkgs#pixi nixpkgs#betterleaks --command just validate 2>&1 | tee "$RUNNER_TEMP/peer-window-proof/validate.log"
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: peer-window-validate-1dd20648f
          path: ${{ runner.temp }}/peer-window-proof/
          if-no-files-found: error
