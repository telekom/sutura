# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:
    inputs:
      consumer:
        description: Reviewed source to commit and export
        type: choice
        required: true
        options: [sql-planned-native]
      expected_helper_sha:
        description: Exact reviewed workflow commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.consumer || 'format' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  format:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent, for the reason security-audit.yml gives: with it, a pull request could add
          # a substituter and a trusted key and have CI fetch attacker-built store paths whose
          # signature verifies.
          extra_nix_config: |
            fallback = true

      # The candidate set is `git ls-files`, so the checkout above IS the input. `fetch-depth` is
      # left at its default: the script reads the working tree, not a diff against a base.
      - name: markdown, yaml, toml and python
        run: bash nix/format-text.sh check

  source-bundle:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch'
    runs-on: rust-mcp-16core
    timeout-minutes: 360
    env:
      CONSUMER: ${{ inputs.consumer }}
      EXPECTED_HELPER_SHA: ${{ inputs.expected_helper_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      NO_COLOR: "1"
      SUTURA_DOCKER_PROBE_TIMEOUT_SECS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the reviewed helper before creating the source checkout
        id: binding
        run: python3 .github/sql-planned.py guard
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.binding.outputs.base }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - uses: $/.github/actions/nix-store-cache
        with:
          scope: ci
      - name: Fetch the five immutable original lane artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/sql-planned.py fetch-original "$RUNNER_TEMP/sql-planned-incoming" "$RUNNER_TEMP/sql-planned-artifacts.json"
      - name: Collect generated files and commit two review units through normal hooks
        env:
          SOURCE_BASE: ${{ steps.binding.outputs.base }}
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_UNSTABLE_CODEGEN_BACKEND CARGO_PROFILE_DEV_CODEGEN_BACKEND
          export helper="$GITHUB_WORKSPACE/.github/sql-planned.py"
          export evidence="$RUNNER_TEMP/sql-planned-bundle"
          # Collector creates evidence only after all five artifacts have been checked.
          nix shell --inputs-from . nixpkgs#just nixpkgs#pixi nixpkgs#devenv nixpkgs#betterleaks --command bash -euo pipefail <<'BUILD'
          just lint-ci
          python3 "$helper" self-check
          cd source
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          base="$SOURCE_BASE"
          main="$(python3 -c 'import json;print(json.load(open("../.github/payloads/sql-planned.json"))["main"])')"
          test "$(git rev-parse HEAD)" = "$base"
          test "$(git ls-remote --refs origin refs/heads/main)" = "$main"$'\trefs/heads/main'
          api_branch="$(python3 -c 'import json;print(json.load(open("../.github/payloads/sql-planned.json"))["api_branch"])')"
          behavior_branch="$(python3 -c 'import json;print(json.load(open("../.github/payloads/sql-planned.json"))["behavior_branch"])')"
          test -z "$(git ls-remote --refs origin "refs/heads/$api_branch" "refs/heads/$behavior_branch")"
          test -z "$(git config --get core.hooksPath || true)"
          git config --local user.name ci
          git config --local user.email user@example.com
          python3 "$helper" prepare api
          git switch -c "$api_branch"
          # Evidence is created by the collector below; keep parent hook output beside it meanwhile.
          export parent_log="$RUNNER_TEMP/sql-planned-api-commit.log"
          devenv --profile hooks shell bash -euo pipefail <<'PARENT'
          test -z "${SKIP:-}${PREK_SKIP:-}${PRE_COMMIT_ALLOW_NO_CONFIG:-}${PREK_ALLOW_NO_CONFIG:-}"
          test -z "${GIT_CONFIG_COUNT:-}${GIT_CONFIG_PARAMETERS:-}"
          pixi run --frozen hooks-install
          hook_dir="$(git rev-parse --git-path hooks)"
          for stage in pre-commit commit-msg pre-push; do test -x "$hook_dir/$stage"; done
          test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
          git -c color.ui=false commit -m 'refactor(sql): declare planned execution ports and dialects' 2>&1 | tee "$parent_log"
          PARENT
          python3 "$helper" prepare behavior
          python3 "$helper" collect "$RUNNER_TEMP/sql-planned-incoming" "$evidence"
          cp "$parent_log" "$evidence/api-commit.log"
          cp "$RUNNER_TEMP/sql-planned-artifacts.json" "$evidence/original-artifacts.json"
          git switch -c "$behavior_branch"
          devenv --profile hooks shell bash -euo pipefail <<'CHILD'
          test -z "${SKIP:-}${PREK_SKIP:-}${PRE_COMMIT_ALLOW_NO_CONFIG:-}${PREK_ALLOW_NO_CONFIG:-}"
          test -z "${GIT_CONFIG_COUNT:-}${GIT_CONFIG_PARAMETERS:-}"
          pixi run --frozen hooks-install
          hook_dir="$(git rev-parse --git-path hooks)"
          for stage in pre-commit commit-msg pre-push; do test -x "$hook_dir/$stage"; done
          test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
          { rustc --version; cargo --version; cargo deny --version; pixi --version; devenv --version; } > "$evidence/versions.log" 2>&1
          git -c color.ui=false commit -F "$GITHUB_WORKSPACE/.github/payloads/sql-planned-behavior-message.txt" 2>&1 | tee "$evidence/behavior-commit.log"
          CHILD
          test "$(git log -1 --format=%B)" = "$(cat "$GITHUB_WORKSPACE/.github/payloads/sql-planned-behavior-message.txt")"
          for log in "$evidence/api-commit.log" "$evidence/behavior-commit.log"; do
            for hook in 'cargo fmt' 'cargo clippy (-D warnings, all features)' 'structural gates' 'cargo check (changed packages only)' 'copy/paste detection (jscpd)' 'detect hardcoded secrets (CI is authoritative)' 'conventional commit subject'; do
              grep -F "$hook" "$log" | grep -Eq '\.+Passed$'
            done
            if grep -Eq '^run-gate: SKIPPED|^format-text: SKIPPED|not on PATH - skipped|skipped - no nix' "$log"; then exit 1; fi
          done
          git bundle create "$evidence/source.bundle" "refs/heads/$api_branch" "refs/heads/$behavior_branch" "^$base"
          git bundle verify "$evidence/source.bundle"
          python3 "$helper" receipt "$evidence"
          BUILD
      - name: Keep draft source bundle and collection receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sql-planned-source-bundle
          path: ${{ runner.temp }}/sql-planned-bundle
          if-no-files-found: error
          retention-days: 7
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sql-planned-bundle-failure
          path: |
            ${{ runner.temp }}/sql-planned-api-commit.log
            ${{ runner.temp }}/sql-planned-bundle/*.log
          if-no-files-found: ignore
          retention-days: 7
