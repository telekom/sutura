# `minimal.yaml` with `environment: Production`: the chart refuses an environment name the binary
# does not know by that exact spelling.
environment: Production
security:
  accessToken:
    secretName: sutura-access-token
  metricsToken:
    secretName: sutura-metrics-token
  tlsTermination: ingress
config:
  base:
    security:
      identity: single-user
      single_user_because: "a test deployment one operator runs with their own credentials"
