# `security.inbound.mode: direct` and no access token: the caller's own token authenticates the
# request, so the binary needs no `security.access_token` and refuses one (`direct-with-access-token`
# in `testdata/refusals/`). Exercises the inbound-keys volume/mount and
# `SUTURA__SECURITY__INBOUND__KEY_SET_FILE`. `tlsTermination: sidecar` rather than `minimal.yaml`'s
# `ingress`, so this golden also shows the OTHER declared value that satisfies the same refusal.
environment: production
security:
  metricsToken:
    secretName: sutura-metrics-token
  tlsTermination: sidecar
  inbound:
    keySetSecretName: sutura-inbound-keys
config:
  base:
    security:
      inbound:
        mode: direct
        resource: https://sutura.example.com
        authorization_server: https://issuer.example.com
        algorithms: [RS256]
