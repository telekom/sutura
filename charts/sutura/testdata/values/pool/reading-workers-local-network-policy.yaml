# NetworkPolicy on with a local-only reading worker group: its policy renders without source egress.
environment: production
security:
  metricsToken:
    secretName: sutura-metrics-token
  inbound:
    keySetSecretName: sutura-inbound-keys
workerPool:
  enabled: true
  issuer:
    name: sutura-nodes
networkPolicy:
  enabled: true
readingWorkers:
  groups:
    local:
      sources: [local]
      catalogs:
        - name: model
          kind: markdown
          dir: /srv/sutura/catalog
          data_dir: /srv/sutura/data
          version: "1"
config:
  base:
    security:
      identity: multi-user
      inbound:
        mode: direct
        resource: https://sutura.example.com
        authorization_server: https://issuer.example.com
        algorithms: [RS256]
    sources:
      local:
        kind: files
        data_dir: /srv/sutura/local
        posture: shared-service-user
        acknowledged_because: "a directory this deployment owns"
