name: release-feature-diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ci/release-feature-diagnostic]

permissions:
  contents: read

jobs:
  feature-tree:
    runs-on: rust-mcp-16core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - name: Resolve the shipped feature graph
        run: |
          set -euo pipefail
          features='bigquery,postgres,duckdb,clickhouse,tls,datahub,openmetadata,cube,rdbms,oracle,agent,distributed'
          nix run .#cargo -- tree --locked --package sutura-cli --features "$features" --edges normal,build > release-build-tree.txt
          test -s release-build-tree.txt
          nix run .#cargo -- metadata --locked --manifest-path crates/sutura-cli/Cargo.toml --features "$features" --filter-platform x86_64-unknown-linux-gnu > metadata.json
          python3 - <<'PY' | tee release-parser-paths.txt
          import collections
          import json
          from pathlib import Path

          metadata = json.loads(Path('metadata.json').read_text())
          packages = {p['id']: p for p in metadata['packages']}
          nodes = {n['id']: n for n in metadata['resolve']['nodes']}
          root = next(p['id'] for p in packages.values() if p['name'] == 'sutura-cli')
          for wanted in ('sqlparser', 'datafusion-sql'):
              queue = collections.deque([[root]])
              seen = {root}
              found = False
              while queue:
                  path = queue.popleft()
                  current = path[-1]
                  if packages[current]['name'] == wanted:
                      found = True
                      print(wanted, 'metadata path:')
                      for key in path:
                          print(' ', packages[key]['name'], packages[key]['version'], nodes[key]['features'])
                      break
                  for dep in nodes[current]['deps']:
                      if dep['pkg'] not in seen and any(k['kind'] in (None, 'build') for k in dep['dep_kinds']):
                          seen.add(dep['pkg'])
                          queue.append(path + [dep['pkg']])
              if not found:
                  print(wanted, 'has no normal/build path from sutura-cli in metadata')
          Path('release-resolve.json').write_text(json.dumps({
              'resolve': metadata['resolve'],
              'packages': [{k: p[k] for k in ('id', 'name', 'version')} for p in packages.values()],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-feature-diagnostic
          path: |
            release-build-tree.txt
            release-parser-paths.txt
            release-resolve.json
          if-no-files-found: error
