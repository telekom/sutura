[package]
name = "sutura-exec-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "A Warehouse adapter over PostgreSQL, rendered through the compiled Postgres dialect."

[dependencies]
sutura-domain = { workspace = true }
# Rendering, shared with every other SQL adapter: this adapter asks `sutura-sql` to render the plan
# for `Dialect::Postgres` rather than growing a second set of quoting and placeholder decisions.
# NOT `sutura-semantic`: compiling stops at a plan, the port carries the plan, and this adapter
# never compiles anything.
sutura-sql = { workspace = true }
# The declared bundle and client-identity read, shared with `sutura-exec-bigquery` and the HTTP
# adapters, so a `Conninfo` refuses an unreadable or malformed file with the same refusal they do -
# before a driver loads rather than at libpq's first connect.
sutura-tls = { workspace = true }
thiserror = { workspace = true }
# The one transport (`src/adbc.rs`, `telekom/sutura#913`). `sutura-adbc` is the shared crate that
# owns the workspace's one `unsafe` ADBC site, so this adapter adds none; the driver manager loads
# the self-built `libadbc_driver_postgresql` (`nix/postgres-adbc.nix`) - linked into a musl release,
# mounted elsewhere - and the two Arrow crates name what it hands back.
adbc_core = { version = "0.24" }
adbc_driver_manager = { version = "0.24" }
arrow-array = { version = "59" }
arrow-schema = { version = "59" }
sutura-adbc = { workspace = true }
# The conformance packs, which `tests/conformance.rs` binds this adapter to, and the developer
# workflow crate that answers where this worktree's Postgres is listening.
#
# **Both DEV-dependencies, and the second one is the whole reason this binding is possible.** The
# packs may not depend on the crate that performs discovery - `xtask/src/boundaries/harness.rs`
# holds `sutura-conformance` to `sutura-domain` alone, and its own remedy assigns *reaching a
# provisioned tier* to the adapter's fixture - so the fixture asks `sutura_dev::provisioned`, which
# also owns the skip-or-fail direction for every harness here. Nothing shipped can reach either:
# `sutura-cli` takes this crate as a normal dependency and a dev-dependency
# propagates to no consumer.
[dev-dependencies]
sutura-conformance = { workspace = true }
sutura-dev = { workspace = true }
# The benchmark harness for `benches/row_materialisation.rs` - `github.com/telekom/sutura#915`.
# Dev-only and reaches no consumer, for the same reason every other entry in this table does not.
divan = { workspace = true }
# A generated self-signed pair, for the in-crate tests that exercise the TLS construction refusals
# against real anchor/identity material. The same crate `sutura-http` rests its own TLS tests on, so
# no new crate enters the dev graph.
rcgen = { workspace = true }
# THE FIXTURE-TIER CREDENTIAL, ITS LOADER AND ITS ADMIN CONNECTION. Default-off, and the reason is
# the ARTEFACT rather than build time: `nix/shipped.nix` builds cargo's DEFAULT feature set, so
# nothing a release publishes contains `src/fixture.rs`, `AdbcPostgres::load_csv` or
# `adbc::FixtureAdmin`. Every caller is a test - the tier-backed targets here,
# `crates/sutura-app/tests/adapters/adapters.rs` and `crates/sutura-cli/tests` - so nothing shipped
# loses anything, and `github.com/telekom/sutura#455` is a `pub fn` whose only guard against a
# consumer reaching it was its name.
#
# **Not `pub(crate)`, and not because that would be weaker.** It would be stronger, and it does not
# compile: the callers are INTEGRATION tests, which are separate crates. A test-only module has the
# same problem. So a feature is the narrowest visibility this pair of call sites admits.
#
# Every compiling gate here passes `--all-features`, and `deny.toml` sets `all-features = true`, so
# this is still compiled, linted and tested on every run.
[features]
fixtures = ["sutura-domain/fixtures"]

[[test]]
name = "conformance"
required-features = ["fixtures"]

[[test]]
name = "deadline"
required-features = ["fixtures"]

[[test]]
name = "raw"
required-features = ["fixtures"]

[[test]]
name = "refusals"
required-features = ["fixtures"]

[[test]]
name = "tls"
required-features = ["fixtures"]

[[test]]
name = "types"
required-features = ["fixtures"]

# `harness = false`: divan runs its own `main`, not libtest's `#[bench]` runner. Not a gate -
# `github.com/telekom/sutura#915` - so it is reached by `just bench`, never by `just validate`,
# `just test` or `ci`.
[[bench]]
name = "row_materialisation"
harness = false

[lints]
workspace = true
