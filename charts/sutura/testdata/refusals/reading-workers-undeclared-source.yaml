# A reading worker group naming `ledger`, which `sources` does not declare: `sutura serve` refuses to
# start a node that names a reading worker for a source it does not declare
# (`NotFitToServe::DeclaredNodeReadsUndeclaredSource`).
environment: production
security:
  metricsToken:
    secretName: sutura-metrics-token
  inbound:
    keySetSecretName: sutura-inbound-keys
workerPool:
  enabled: true
  issuer:
    name: sutura-nodes
readingWorkers:
  groups:
    finance:
      sources: [ledger]
      catalogs:
        - name: model
          kind: markdown
          dir: /srv/sutura/catalog
          data_dir: /srv/sutura/data
          version: "1"
config:
  base:
    security:
      identity: multi-user
      inbound:
        mode: direct
        resource: https://sutura.example.com
        authorization_server: https://issuer.example.com
        algorithms: [RS256]
    sources:
      orders:
        kind: files
        data_dir: /srv/sutura/orders
        posture: shared-service-user
        acknowledged_because: "a directory this deployment owns"
