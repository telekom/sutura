# The documentation site: mkdocs-material, versioned by mike.
#
# The versioning is the reason for this stack rather than mdBook. mike publishes each version
# into its own directory on `gh-pages`, maintains `versions.json`, renders the root redirect and
# feeds the version selector Material already ships - all of which had to be hand-written under
# mdBook. `docs/publishing.md` describes the resulting layout.
#
# Every tool named here comes from pixi's isolated `docs` environment - `pixi run --frozen -e
# docs docs` locally, `nix run .#pixi -- run --frozen -e docs docs` in CI, where a bare tool
# name exits 127. There is deliberately no mkdocs and no mike flake app: mike shells out to
# mkdocs, and composing the two through nix produced an mkdocs that could not import
# `pymdownx`. One resolver owns the interpreter and everything in it, and nothing here comes
# from pip or npm.

site_name: sutura
site_description: Answers questions about data as the person or agent asking, using metric definitions somebody certified.
site_url: https://telekom.github.io/sutura/
repo_url: https://github.com/telekom/sutura
repo_name: telekom/sutura
# `docs/` is the source directory, the mkdocs default, and there is no extra level under it:
# a page's path is its URL, which is the layout every mkdocs reader expects. `docs/.tools/`
# holds the API page generator; mkdocs skips a dot-prefixed path, so it is never published.
edit_uri: edit/main/docs/

theme:
  name: material
  # Material otherwise emits a stylesheet link to fonts.googleapis.com and a preconnect to
  # fonts.gstatic.com on every page. `false` drops both and falls back to the system font stack,
  # which is what keeps the site self-contained - it has to render behind a proxy with no direct
  # egress, and a page that phones a CDN also puts every reader in that CDN's logs. Checked by
  # `cargo xtask check-docs`, because the default is the insecure one and nothing else would say.
  font: false
  # Paths relative to the docs directory. `cargo xtask check-docs` fails if either stops
  # resolving: mkdocs renders a broken image for a missing logo rather than failing the build.
  logo: assets/sutura.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.tooltips
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Auto, following the reader's system preference, and first so it is the default.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # `custom` for both, because Telekom magenta is not one of Material's named palette
    # colours. The values live in docs/css/telekom.css, per scheme, with the measured contrast
    # ratio beside each - see the comment at the top of that file for why they differ.
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # `CONTRIBUTING.md` and `CHANGELOG.md` live at the repository root, because that is where
  # GitHub looks for them, and are rendered into a page by an INCLUDE rather than a copy -
  # `docs/contributing.md` and `docs/changelog.md` are the include and nothing else, so the
  # prose has one home and cannot drift.
  #
  # `base_path` is the repository root: snippets resolve against the process working
  # directory, which is where mkdocs is invoked from, and `.` is already the default - it is
  # written out because the include reaches OUTSIDE the docs directory and that is the part a
  # reader will not assume. `check_paths` is the one that matters: it defaults to false, and
  # a snippet that stops resolving is then published as the literal `--8<--` line on a green
  # build.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  # Mermaid, through Material's own SuperFences integration rather than the mermaid2 plugin,
  # because that integration is what hands mermaid the active colour scheme - a bare CDN import
  # leaves every diagram stuck in light mode.
  #
  # KNOWN GAP, and this comment used to state the opposite: Material does NOT bundle the mermaid
  # library. Its own bundle loads `https://unpkg.com/mermaid@11/dist/mermaid.min.js` at runtime,
  # confirmed by watching the request. So a diagram does not render for a reader with no direct
  # egress - the reader `theme.font: false` exists to protect - and degrades to a code block.
  # Fixing it means vendoring mermaid under docs/assets and pointing Material at it. Until then
  # a mermaid fence is a nice-to-have, and no page may depend on one to be understood.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Pages that are written for whoever is BUILDING sutura, and are not part of the site.
#
# `exclude_docs` removes a page from the build entirely - not rendered, not searchable, not a
# link target - which is the difference between it and `not_in_nav`, where the page is still
# published and merely unlisted. The implementation plans are the case it exists for: they argue
# why the steps went in the order they did, which is worth keeping and is not what a reader of
# this site came for. Two and a half thousand lines of it beside three hundred lines of getting
# started is why a first-time reader could not tell which page was addressed to them.
#
# They stay under `docs/` rather than moving out of it so that every path citation in the
# repository - ADRs, doc comments, `xtask`'s own gates, the `docs/**` globs `check-guidance`
# counts and pins against - keeps naming the file it names today. `cargo xtask check-docs` reads
# this list and holds five things: every pattern here reaches exactly one page that exists, no
# excluded page is also in `nav`, no published page LINKS to one, every published page was
# actually read in order to say so, and a page in neither state is the orphan it always was. Each
# line must name a page literally - a glob or a negation is refused, because a pattern that gate
# cannot resolve is an exclusion nothing checks.
#
# A LINE WITH NO `/` IN IT MATCHES A BASENAME AT EVERY DEPTH, because `exclude_docs` is gitignore
# syntax and mkdocs matches it with `pathspec`. The gate matches it the same way now and says so
# when one line reaches two pages, which was a real difference rather than a nicety: while it
# compared these lines against docs-relative paths, a page one level down was dropped by mkdocs
# and published by the gate's model of it, so a nav entry to nothing and a dead link on a
# published page were both green.
#
# THE LINK RULE IS OURS BECAUSE `--strict` DOES NOT HAVE IT, and this comment said the opposite
# first. Measured: with an ADR linking one of these pages, `mkdocs build --strict` printed
# *"contains a link to 'implementation-plan.md' which is excluded from the built site"* at INFO
# and exited 0 - `--strict` escalates warnings, not info, so the dead link would have published
# behind a green docs job. Cite one of these pages as a backticked path, which is what the seven
# ADRs that used to link them now do.
#
# The ADRs joined this list 2026-09-19 (owner-decided on #325): they argue why a decision went the
# way it did, for whoever is changing that decision, and that is not what a first-time reader of
# this site came for either. They stay under `docs/adr/` rather than moving, for the same reason
# the implementation plans do - every citation in the repository keeps naming the file it names
# today. Cite one as a backticked path; every published page that linked into `docs/adr/` now
# does.
exclude_docs: |
  implementation-plan.md
  implementation-plan-bigquery.md
  implementation-plan-identity-and-services.md
  adr/0001-first-party-semantic-models.md
  adr/0002-a-closed-vocabulary-for-measures.md
  adr/0003-datafusion-for-local-execution.md
  adr/0004-a-named-escape-hatch-for-authored-sql.md
  adr/0005-a-refusal-carries-a-status.md
  adr/0006-several-databases-behind-one-data-system.md
  adr/0007-federating-across-different-data-systems.md
  adr/0008-a-credential-per-leg-for-the-calling-subject.md
  adr/0009-the-plan-from-one-source-to-many.md
  adr/0010-transport-security-for-a-source.md
  adr/0011-pluggable-by-declaration.md
  adr/0012-conformance-packs-for-inputs-and-adapters.md
  adr/0013-a-raw-sql-tool-off-by-default.md
  adr/0014-how-a-caller-proves-who-it-is.md
  adr/0015-an-authenticated-metrics-endpoint.md
  adr/0016-what-datahub-can-carry.md
  adr/0017-what-a-bigquery-test-runs-against.md
  adr/0018-what-the-bigquery-wire-is-built-from.md
  adr/0019-a-table-outside-the-connections-dataset.md
  adr/0020-a-credential-the-compiler-refuses-to-print.md
  adr/0021-how-a-published-artefact-proves-where-it-came-from.md
  adr/0022-untrusted-content-marking.md
  adr/0023-how-the-agent-surface-learns-who-is-asking.md
  adr/0024-three-oss-readiness-scans-and-what-each-discloses.md
  adr/0025-what-a-scorecard-zero-says-about-this-repository.md
  adr/0026-no-third-party-binary-cache.md
  adr/0027-an-oss-binary-cache-for-this-repositorys-own-paths.md
  adr/0028-who-may-see-a-metric.md
  adr/0029-where-a-deadline-lives.md
  adr/0030-where-a-budget-lives.md
  adr/0031-caching-an-exchanged-credential.md
  adr/0032-the-iamcredentials-impersonation-hop.md
  adr/0033-a-closed-enum-over-the-shipped-warehouse-kinds.md
  adr/0034-the-twin-root-link-between-leg-1-and-the-pool.md
  adr/0035-bigquery-accepts-agent-identity-as-iam-principal.md
  adr/0036-a-knowledge-only-source-speaks-through-a-metric.md
  adr/0037-an-rdf-source-declines-rather-than-maps-a-part.md
  crap.md
  what-a-bpmn-file-actually-carries.md
  what-an-rdf-graph-can-carry.md

# Explicit, not derived from filenames. A nav that falls out of directory order silently
# reorders itself when a page is added, and `cargo xtask check-docs` checks this list against
# the files on disk in both directions.
#
# THREE SECTIONS, BY AUDIENCE, AND THE ORDER IS THE POINT: ask sutura a question, then run a
# deployment of it, then work on sutura itself. `Reference` dissolved (owner-decided on #325) -
# it mixed all three audiences under one label, which is why a first-time reader could not tell
# which half of it was addressed to them. Architecture and the API move into *Building it*
# because both describe the internals a contributor reads, not a question a caller asks or a
# setting an operator sets; the ADRs leave the built site entirely, per `exclude_docs` above.
#
# No section index pages. Material would render one for each section heading, and `index.md`
# already routes to every page here; three more landing pages would restate that table three
# times. `navigation.indexes` stays on because a section index is worth having as soon as a
# section has enough pages to need one.
nav:
  - Using it:
      - Introduction: index.md
      - Concepts: concepts.md
      - Getting started: getting-started.md
      - Questions and answers: qa.md
      - The agent prompt: agent-prompt.md
  - Operating it:
      - Serving over HTTP: serving.md
      - Verifying a release: verifying-a-release.md
      - The local chat demo: demo.md
      - Integrations: integrations.md
      - Where each identity claim is proven: where-identity-is-proven.md
      - The wave-one E2E showcase: showcase-datahub-bigquery.md
      - An RDBMS dictionary as a metadata source: rdbms-catalog-guidance.md
      - What an agent identity can carry: what-agent-identity-can-carry.md
      - What an OKF-style catalog can carry: what-okf-can-carry.md
      - What an OpenMetadata catalog can carry: what-openmetadata-can-carry.md
      - Changelog: changelog.md
  - Building it:
      - Architecture: architecture.md
      - Contributing: contributing.md
      - Building without direct egress: enterprise-mirrors.md
      - Publishing the docs: publishing.md
      - API:
          - api/index.md
          - sutura-domain: api/sutura-domain.md
          - sutura-catalog-local: api/sutura-catalog-local.md
          - sutura-catalog-datahub: api/sutura-catalog-datahub.md
          - sutura-catalog-okf: api/sutura-catalog-okf.md
          - sutura-catalog-openmetadata: api/sutura-catalog-openmetadata.md
          - sutura-catalog-rdbms: api/sutura-catalog-rdbms.md
          - sutura-semantic: api/sutura-semantic.md
          - sutura-sql: api/sutura-sql.md
          - sutura-exec-datafusion: api/sutura-exec-datafusion.md
          - sutura-exec-duckdb: api/sutura-exec-duckdb.md
          - sutura-exec-bigquery: api/sutura-exec-bigquery.md
          - sutura-exec-postgres: api/sutura-exec-postgres.md
          - sutura-tls: api/sutura-tls.md
          - sutura-app: api/sutura-app.md
          - sutura-config: api/sutura-config.md
          - sutura-runtime: api/sutura-runtime.md
          - sutura-http: api/sutura-http.md
          - sutura-mcp: api/sutura-mcp.md
          # Dev tooling rather than shipped surface, and last for that reason. Both are here because
          # they ARE libraries - `xtask`'s compose tier depends on `sutura-dev`'s `Scope` and two
          # adapters' test targets depend on `sutura-conformance`'s pack signatures, so both are real
          # contracts and a change to either belongs in a reviewable diff. Narrowing the gate instead
          # was considered and rejected: every first-party crate is `publish = false`, so a `publish`
          # predicate would exempt all of them and check nothing.
          - sutura-conformance: api/sutura-conformance.md
          - sutura-dev: api/sutura-dev.md

extra:
  version:
    provider: mike
    # Which version the "you are reading an old version" banner points at. `latest` is the
    # alias mike moves onto each release.
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/telekom/sutura

extra_css:
  - css/telekom.css

# With `mkdocs build --strict` every one of these becomes an error. `omitted_files` is what
# makes a page that is in no nav entry fail the build, which is the same rule check-docs
# enforces without needing a Python environment.
validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

watch:
  - mkdocs.yml
