[package]
name = "sutura-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Process-lifecycle concerns for a sutura service: the log, the panic hook and the shutdown signal."

[features]
# Exposes the log-capture writer in `src/testing.rs` to ANOTHER crate's tests.
#
# It exists because everything a transport crate does to the log is observable only as bytes, and
# `Capture` is what reads them back. The alternative was a second copy of the writer in
# `sutura-http`, and a second copy is the failure this repo already argues against for
# `identifier_newtype!`: one implementation cannot drift from itself.
#
# **Only the writer, and that is not tidiness.** The helpers that build a subscriber around it stay
# `cfg(test)` because they use `expect`, which is DENIED outside test code - so exposing them
# through a feature would make `--all-features` fail to lint. A caller gets the writer and builds
# its own subscriber through `telemetry::subscriber`, which is public already.
test-capture = []

[dependencies]
sutura-config = { workspace = true }
# For the audit sink, and for nothing else: the port and the record are domain types, and the writer
# behind them is a use of the subscriber this crate installs. Inward-pointing - the domain gains no
# dependency from this, which is what `cargo xtask check-boundaries` reads.
sutura-domain = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-bunyan-formatter = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }

[dev-dependencies]
# Reading the provenance RECORD rather than its text: `announce_provenance`'s doc claims the line
# carries paths only, and holding that means asking which FIELDS it emitted, not searching the
# rendered bytes for a value somebody thought to look for. Already vendored, so this adds no
# `[[package]]` to `Cargo.lock` - only an edge under `sutura-runtime`, which is the one line the lock
# gains. Test-only: nothing shipped parses its own log.
serde_json = { workspace = true }
# `test-util` and nothing else, for `#[tokio::test(start_paused = true)]`. The admission window and
# the shutdown grace period are measured in seconds, and a test that waits them out in real time
# adds those seconds to every run of the suite while proving less: a paused clock advances only when
# nothing is ready, so the assertion is about the WINDOW rather than about a sleep being long
# enough. Test-only on purpose - it is what makes `tokio`'s timer controllable, which is not
# something a shipped binary should be able to do.
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "test-util", "time"] }

# `Capture` reaches an integration test only through the feature, so the target declares it rather
# than failing to compile without it. `--all-features` - what CI lints and tests with - builds it.
[[test]]
name = "blocking_span"
required-features = ["test-capture"]

[[test]]
name = "principal_privacy"
required-features = ["test-capture"]

[lints]
workspace = true
