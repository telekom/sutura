[package]
name = "sutura-exec-bigquery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "A Warehouse adapter over BigQuery: renders the plan into GoogleSQL and pushes it down."

[features]
# The ADBC TRANSPORT (telekom/sutura#913): loads the self-built
# `libadbc_driver_bigquery.so` (`nix/bigquery-adbc.nix`, one per release triple)
# through `adbc_driver_manager` and decodes its Arrow result sets. It is the ONLY
# transport this crate offers - the previous HTTP `wire` transport was removed in
# the same change that adopted ADBC as the normal BigQuery mode.
#
# **Default-off, and the reason is the same as any out-of-process transport: the
# driver's native `.so` and its Arrow graph are a per-triple addition a lean
# build should not link.** Off is not hidden - every gate here passes
# `--all-features`, so the module is compiled, linted and unit-tested even when a
# served artifact does not request it.
adbc = ["dep:adbc_core", "dep:adbc_driver_manager", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-cast"]

# The FIXTURE LOADER: `src/importer.rs`, `BigQueryWarehouse::load_fixture`, and the third
# `transport::JobTransport` method it needs. It is what turns the committed example CSVs into four
# tables so a corpus can be run against a real dataset, which is `docs/adr/0017`'s first acceptance
# bullet and #78's importer shape pointed at this adapter.
#
# **Default-off, and not because of a dependency - it adds none.** It is that this
# feature is the only thing in the crate that can issue `CREATE OR REPLACE TABLE`, and a method that
# replaces a table has no business in a build that serves questions. With the feature off,
# `JobTransport` has the methods it always had and nothing in the crate can write.
#
# **Why a feature and not a `#[cfg(test)]` helper**, which would be the cheaper-looking answer: the
# acceptance legs are INTEGRATION targets, which cargo compiles as separate crates, so they cannot
# reach a `#[cfg(test)]` item in this one. The choice is therefore between a feature and a `pub`
# method on the shipped surface - which is what #78's `PostgresWarehouse::load_csv` is, and this is
# the stricter of the two.
#
# Off is not hidden, for the reason the `adbc` entry gives: every gate here passes `--all-features`,
# so the loader is compiled, linted and unit-tested on every run.
fixtures = []

[dependencies]
sutura-domain = { workspace = true }
# Rendering, shared with every other SQL adapter, for the reason `sutura-exec-duckdb` states: this
# adapter speaks SQL, so it asks `sutura-sql` to render the plan for its dialect rather than growing a
# second set of quoting and placeholder decisions. NOT `sutura-semantic`: the port carries a plan and
# this adapter compiles nothing.
sutura-sql = { workspace = true }
thiserror = { workspace = true }
# The exchanged-credential cache's own lock (`src/sts/cache.rs`, `docs/adr/0031`) - not
# feature-gated: the cache holds no network client and no TLS stack, it is a
parking_lot = { workspace = true }

# Always-on, not feature-gated, because the identity-exchange broker (core `sts.rs`, telekom/sutura#817)
# decodes the `iss`/`aud` claims of the subject token it hands to the metadata service - a broker-level
# check that must run whether or not this build links a transport, and one the broker's fake
# `StsExchange` tests exercise. A JSON value and a base64url decode are already in every served binary
# through `sutura-config`/`sutura-http`, so promoting them here adds no new package to `Cargo.lock`
# and no network stack to any build.
serde_json = { workspace = true }
base64 = { workspace = true }

adbc_core = { version = "0.24", optional = true }
adbc_driver_manager = { version = "0.24", optional = true }
# The ADBC driver manager (telekom/sutura#913): loads the self-built
# `libadbc_driver_bigquery.so` by path (`ManagedDriver::load_dynamic_from_filename`)
# and runs a statement, returning Arrow record batches. The driver owns its own
# transport to BigQuery, so this transport brings no TLS stack of this crate's own.

arrow-array = { version = "59", optional = true }
arrow-schema = { version = "59", optional = true }
arrow-cast = { version = "59", optional = true }

[dev-dependencies]
# Already a normal dependency; this entry asks for one FEATURE. `warehouse::agreement` is the typed
# row comparison the conformance binding's row check makes, and it is SHARED with
# `crates/sutura-app/tests/differential.rs` rather than copied - the copy is what lets both compare
# cells through a display form and call a null equal to the word `null`.
sutura-domain = { workspace = true, features = ["agreement"] }
# The conformance packs, which `tests/conformance.rs` binds this adapter to over a canned transport
# - see that file for why no tier and no transport feature is needed to make the binding honest. A
# DEV-dependency and never more: the harness holds this adapter to the port's contract, and nothing
# shipped should be able to reach it.
sutura-conformance = { workspace = true }

[lints]
workspace = true
