[package]
name = "sutura-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "The HTTP surface. Transport only: it goes through the ports and decides nothing a question depends on."

[features]
# Does this build contain a TLS listener?
#
# DEFAULT-OFF, and that is the deployment model rather than caution. TLS is normally terminated by
# an ingress controller or a sidecar, so plaintext on the pod network is the intended arrangement
# and the shipped artifacts do not carry a TLS stack they would not use. In-process termination is
# for the deployment where nothing terminates in front.
#
# It turns on `sutura-config`'s feature of the same name, which carries no dependency and exists
# only so `Settings::refusals` can tell "the operator asked this process to terminate TLS" from
# "this process can". Wiring it here is what makes the two impossible to disagree: a binary with
# this feature has the listener AND reports that it has it.
tls = ["dep:tokio-rustls", "sutura-config/tls"]

[dependencies]
# The service, behind the ports. This crate calls `answer` and `verify_and_validate` and nothing
# else; every rule about what may be answered lives on the other side of that call.
sutura-app = { workspace = true }
sutura-config = { workspace = true }
sutura-domain = { workspace = true }
# For one value type - `Shutdown` - and not for anything this crate installs. `sutura-runtime` owns
# the process-global setup and is called by the composition root; nothing here touches a subscriber,
# a panic hook or a signal handler. The dependency exists so `serve` can arm its drain deadline
# after shutdown is asked for, which needs to observe the signal twice.
sutura-runtime = { workspace = true }
axum = { workspace = true }
# Directly, for `middleware::StateInformationMiddleware` in the limiter's type. It is part of the
# signature because emitting the remaining-quota headers is a construction-time choice.
governor = { workspace = true }
# Leg 1: signature verification, `exp`/`nbf`, issuer and audience, and JWK decoding. See the note on
# the workspace entry for why the version is what it is and what it adds to the lock. `sutura-config`
# owns the DECLARATION - which algorithms, which issuer, which audience - and names none of this: the
# mapping from `sutura_config::SigningAlgorithm` onto this library's own enum lives in
# `crate::inbound::token` and is the only place the two vocabularies meet.
jsonwebtoken = { workspace = true }
serde = { workspace = true }
# The interface description is serialized once at startup and served from a clone, and the wire
# shapes are asserted on as JSON in the tests, because the JSON is the contract.
serde_json = { workspace = true }
thiserror = { workspace = true }
# `net` for the listener, `time` for the drain deadline, `rt`/`macros` for the handlers, and
# `sync` for what `Shutdown` is built on. See the amendment on the workspace entry: this ADDS to
# the base set the engine asks for, and does not change what the CLI links.
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
# The TLS listener, and ONLY under the `tls` feature - `optional` is what makes the dependency
# absent from the build rather than merely unused. See `src/tls.rs` for why the acceptor is driven
# from a task instead of from `accept`, and the workspace manifest for the feature choices.
tokio-rustls = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[dev-dependencies]
# base64url, for writing a JWK in the leg 1 tests. See the workspace entry: test-only, and nothing in
# a shipped path here encodes base64 first-party.
base64 = { workspace = true }
# TWO uses now, and they are the same argument. The TLS tests generate their certificates rather than
# carrying one - see the workspace entry: a committed pair cannot express "this key does not match this
# certificate", which is the case the reload path has to refuse. The leg 1 tests generate a signing key
# for the same reason plus one more: a committed private key in a public repository is a committed
# private key, whatever a comment beside it says, and `KeyPair::generate` costs a millisecond.
rcgen = { workspace = true }
# The mock authorization server: a generated key pair, a JWK set it PUBLISHES to a path, and a token
# minter every claim of which is a parameter.
#
# In `sutura-dev` and not in this crate's own fixtures, which is the point of it: leg 1 is verified
# here, minted-for in a broker and composed in a root, and a fixture inside any one of those three
# cannot be driven from the other two. The feature is named because it is default-off in that crate -
# `xtask` links the same library to learn a compose project name and should not compile a crypto
# backend for it.
sutura-dev = { workspace = true, features = ["mock-issuer"] }
# The one broker in this workspace that EXCHANGES rather than minting from configuration, for the
# transport half of `github.com/telekom/sutura#147`: `crate::identity_e2e` drives
# `WorkloadIdentityBroker` over a fake `StsExchange` through the real router, so what is asserted is
# that the compact JWT leg 1 verified is byte-for-byte the `subject_token` the shipped broker sends.
# A fixture broker of this crate's own cannot say that - it would be asserting on itself.
#
# **A DEV-dependency, and the distinction is the whole reason this edge is allowed.** Dev edges do not
# propagate, so no shipped artifact gains this crate; `cargo xtask check-boundaries` walks normal
# edges for the adapter-class half for exactly this reason - a dev edge between two adapters is how a
# test reaches a real implementor instead of a copy of one. Default features, so the `wire` feature's
# `ureq`/rustls closure stays out: the port and the broker are not behind it.
sutura-exec-bigquery = { workspace = true }
# The SAME dependency as above, with the log-capture writer turned on. The router's span is
# observable only as bytes, so the harness builds a subscriber over a buffer and asserts on them -
# and the writer comes from `sutura-runtime` rather than being copied here, because a second copy is
# a second thing to keep in step. The feature carries no dependency and is off in every shipped
# build; see the comment on it in that crate's manifest.
sutura-runtime = { workspace = true, features = ["test-capture"] }
# The router tests drive the real router with `oneshot`, which needs a multi-threaded runtime
# because a query handler moves its work onto the blocking pool.
#
# `io-util` is here and NOT in the dependency table above, which is the point of it being here: the
# TLS test speaks HTTP over a real handshake by writing the bytes itself, and `write_all` and
# `read_to_end` are extension traits from that feature. The server side needs none of it, so the
# shipped graph does not get it.
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
