# Hooks, run by `prek` (a single Rust binary - no Python runtime needed to lint Rust).
# The config format is pre-commit's, so it stays reversible: `pre-commit` runs it too.
#
# Tiered by cost on purpose. A hook that takes 40 s on every commit gets disabled by the
# team inside a week, so fast checks run on commit and slow ones on push.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push, commit-msg]
minimum_pre_commit_version: "3.0.0"

repos:
  - repo: local
    hooks:
      # --- on commit: fast, and scoped to the touched area -------------------
      - id: rust-fmt
        name: cargo fmt
        # Through xtask, not `cargo fmt --all`: `--all` formats every package cargo
        # metadata reports, INCLUDING path dependencies that `[workspace] exclude` keeps out
        # of the member list. It wanted to rewrite the vendored mimalloc source, which is the
        # one thing vendoring must not do. xtask derives the package list instead.
        #
        # THROUGH THE DEVENV ENVIRONMENT, so the pinned NIGHTLY rustfmt is what runs however
        # git invoked the hook. macOS does not pass the interactive shell's exports to a hook
        # subprocess the way Linux does, so a bare `cargo` here could resolve to a non-nightly
        # toolchain whose rustfmt reformats a tree the nightly considers clean (and vice versa) -
        # the finding is then a property of the hook's environment, not of the change.
        entry: devenv shell cargo run -q -p xtask -- fmt --check
        language: system
        files: \.rs$
        pass_filenames: false

      # `--all-features` is not optional here: the adapters are feature-gated and
      # default-off, so without it clippy inspects almost nothing and reports success.
      #
      # Runs on the shell's nightly toolchain, which is what CI gates on - the stable/nightly
      # split is gone, so a clippy finding a commit sees is one CI reproduces.
      #
      # THROUGH THE DEVENV ENVIRONMENT for the same reason the `rust-fmt` hook now runs there:
      # macOS does not pass the interactive shell's exports to a hook, so a bare `cargo` could
      # resolve to a non-nightly clippy that reports findings the nightly does not. `devenv shell`
      # pins it to the nightly regardless of how git invoked the hook.
      #
      # The push stage used to alias this exact scalar (a `rust-clippy-push` hook on `pre-push`,
      # so a rebase's commits were still compiled before reaching the remote). Cargo keys its
      # fingerprints on the invocation, so that alias was the only form of "the same command" that
      # could not drift. The push tier now runs security checks only, so clippy runs once here on
      # commit and an uncompiled rebase is caught by CI rather than locally - `check-hook-tiers`
      # holds the new shape.
      - id: rust-clippy
        name: cargo clippy (-D warnings, all features)
        entry: devenv shell cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

      # Every cheap structural gate, in one hook. It was eight, and all eight walk the
      # whole repo regardless of `files:` scoping - so eight hooks meant eight redundant
      # tree walks. xtask owns which gates these are (`Kind::Hygiene`).
      - id: hygiene
        name: structural gates
        entry: bash -c 'exec cargo run -q -p xtask -- hygiene'
        language: system
        pass_filenames: false
        always_run: true

      # Narrowed by the changed files pre-commit passes us: editing one crate should not
      # pay for a workspace check. Clippy below still sees the whole workspace, so this is
      # fast feedback, never the only thing that inspects the code. A path that belongs to
      # no package widens to `--workspace` rather than checking less than was asked.
      - id: rust-check-changed
        name: cargo check (changed packages only)
        entry: bash -c 'exec cargo run -q -p xtask -- check-changed "$@"' --
        language: system
        files: \.rs$
        pass_filenames: true
        # `pass_filenames: true` lets prek PARTITION the paths and run this hook once per
        # partition, concurrently. Two simultaneous invocations on one target directory means two
        # `cargo metadata` calls, two xtask builds, and one of them blocked on the build-directory
        # lock for the duration - all of it to check the same workspace. Serial is strictly
        # cheaper here, and one line.
        require_serial: true

      # NO TEST SUITE, NO DOCTESTS, NO CRAP SCORE AND NO FUZZ REPLAY ON COMMIT, by owner decision:
      # a commit may hold a failing test until `just validate` or CI runs it. The suite and the
      # doctests run in `just validate` and CI; CRAP runs in `just validate`, in CI and, scoped to
      # a diff that reaches it, in `just ship-check`; the fuzz replay runs in
      # `.github/workflows/fuzz.yml` only. `cargo xtask check-hook-tiers` refuses any of them back
      # on the commit stage, and `check-fuzz` still holds the harness itself on every pull request.

      # The jscpd copy/paste gate (issue #474). Scoped by `files:` to every tracked `.rs` plus
      # the things that decide the verdict - the allowlist, the gate, and the nix provisioning.
      # It scans the WHOLE first-party Rust tree, not just the diff: a clone is a fact about two
      # files that rarely sit in one edit.
      #
      # THE PATTERN IS THE EXTENSION RATHER THAN A DIRECTORY LIST, and that is a fix rather than a
      # style. It named `crates/` and `xtask/`, but `dev/` and `fuzz/` carry first-party Rust that
      # `check-jscpd` scans, and `hook_coverage`'s `Rust source` surface is deliberately `*.rs` for
      # the reason its own comment gives - a directory list here is a list to forget the day a
      # fourth root appears. Measured: a diff touching only `dev/src/scope.rs` ran `jscpd` as
      # `(no files to check)`, and `hook-coverage` then failed `ship-check` with a coverage gap
      # over Rust it had correctly classified.
      #
      # Through nix/run-gate.sh, the same tiering the other nix-backed hooks use - and jscpd is
      # the only pin for the version, so `cargo xtask check-pins` fails if it reappears in
      # pixi.toml. The fail-closed verdict with the allowlist is `checks.hygiene`; where this
      # host cannot run the gate, it delays the finding to CI rather than blocking the commit.
      - id: jscpd
        name: copy/paste detection (jscpd)
        entry: bash nix/run-gate.sh jscpd
        language: system
        files: ^(.*\.rs|devco/dup-ignore|nix/(jscpd\.nix|run-gate\.sh)|flake\.nix)$
        pass_filenames: false

      # Every shell script we ship, and the glob IS the list.
      #
      # It was two hand-written lists - two files named in the justfile, one in ci.yml - under a
      # comment claiming to be exhaustive, which it was of neither. `nix/run-gate.sh` was in
      # neither, and that file decides whether the secret sweep, the supply-chain gate, the
      # copy/paste gate and the chart gate run AT ALL: a `set -eu` slip there turns them into
      # silent no-ops at once. A `files:` glob cannot drift the way a transcribed list does.
      #
      # Through nix, the only pin for shellcheck - its version decides what it reports, so
      # `cargo xtask check-pins` fails if it reappears in pixi.toml. Skipped with a notice where
      # nix is absent, like the other nix-backed hooks here.
      #
      # IT IS A COMMIT HOOK, and it sat under the push banner below for its whole life while
      # CONTRIBUTING.md listed it as a push gate. It declares no `stages:`, so it inherits
      # `default_stages: [pre-commit]` - the banner was the only thing saying otherwise. Moved
      # rather than restaged: the tier it has always RUN at is the right one, since a `.sh` edit is
      # cheap to check and the finding is most useful before the commit claiming the script works.
      - id: shellcheck
        name: shell scripts
        entry: >-
          bash -c 'command -v nix >/dev/null 2>&1
          && exec nix run .#shellcheck -- -x "$@"
          || echo "shellcheck skipped - no nix on this host, CI enforces it"' --
        language: system
        files: \.sh$
        pass_filenames: true

      # Markdown, YAML and TOML through dprint; Python through ruff, formatter and linter both.
      #
      # ONE SCRIPT, which `just lint-text`, `just fmt`, `just validate` and
      # `.github/workflows/format.yml` also call - so a finding a developer sees is one CI sees.
      # That is the property `nix/lint-workflows.sh` exists for, and the reason the invocation is
      # not written twice.
      #
      # COMMIT STAGE. `cargo xtask check-hook-tiers` reserves `pre-push` for the two whole-tree
      # security scans and nothing else, and a check too slow for a commit belongs in no local
      # hook at all - this is neither: it compiles nothing and reads the tracked text files.
      #
      # Through nix, the ONLY pin for both tools - the version decides what a formatter reports,
      # so a second pin would be a second verdict and `cargo xtask check-pins` fails if either
      # name reappears in pixi.toml. Skipped with a notice where nix is absent, like `shellcheck`
      # and `zizmor`; the script itself owns that tiering, not this entry.
      #
      # `files:` covers the four extensions plus the three files that decide the verdict without
      # being one of them - the config, the script, and the plugin pin.
      - id: format-text
        name: markdown/yaml/toml (dprint), python (ruff)
        entry: bash nix/format-text.sh check
        language: system
        files: (\.(md|ya?ml|toml|py)|^(dprint\.json|nix/format-text\.sh|nix/dprint\.nix))$
        pass_filenames: false

      # The Helm chart's own gate (#149): `helm lint`, the no-values refusal and its wording,
      # every values file rendered against its committed golden, and `kubeconform` against the
      # vendored Kubernetes schemas. Nothing else here reaches the chart - `format-text` runs over
      # `charts/**/*.yaml` and dprint EXCLUDES `charts/*/templates/**` and
      # `charts/*/testdata/golden/**` (`dprint.json`, pinned by `xtask/tests/dprint_config.rs`), so
      # on the half of that tree that decides what renders it inspected nothing, and
      # `templates/_helpers.tpl` is not YAML at all.
      #
      # Through `nix/run-gate.sh`, which builds the SAME `checks.helm-chart` derivation
      # `.github/workflows/ci.yml`'s `Chart` step does - one invocation, so the local verdict and
      # CI's cannot differ - and skips with a notice where nix is absent, like `shellcheck` and
      # `zizmor`. `xtask/tests/chart_gate.rs` holds that agreement.
      #
      # COMMIT STAGE. `cargo xtask check-hook-tiers` reserves `pre-push` for the two whole-tree
      # security scans, and a check too slow for a commit belongs in no local hook at all - this is
      # neither: it compiles no Rust, waits on no dependency closure, and renders one chart.
      #
      # `files:` is the chart tree plus the two files that decide the verdict without being in it:
      # the derivation, and `flake.nix`, which is where this check's `src` is chosen (`wholeTree`,
      # not the filtered source) and where the source filter's `charts` arm lives.
      - id: chart
        name: Helm chart (lint, render, goldens, kubeconform)
        entry: bash nix/run-gate.sh chart
        language: system
        files: ^(charts/.*|nix/(helm-chart\.nix|run-gate\.sh)|flake\.nix)$
        pass_filenames: false

      # --- on push: SECURITY ONLY -------------------------------------------
      # The whole tree, not just the diff. The commit-stage scan above is staged-only, so a
      # finding in a file committed long ago reaches CI unseen - which is exactly what happened.
      #
      # This stage deliberately runs ONLY these two security checks and nothing that compiles
      # first-party code. A rebase runs no commit hook, and the push stage no longer compiles
      # either, so an uncompiled rebase now reaches CI rather than being caught locally - a
      # deliberate weakening of the old rebase-safety tier, held by `cargo xtask check-hook-tiers`.
      - id: secret-sweep
        name: secrets, whole tree (as CI scans it)
        entry: bash nix/run-gate.sh secrets
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-deny
        name: advisories, licences, bans, sources
        entry: bash nix/run-gate.sh supply-chain
        language: system
        pass_filenames: false
        stages: [pre-push]

      # --- on commit-msg ------------------------------------------------------
      # `default_install_hook_types` above declares `commit-msg`, and AGENTS.md states the
      # convention. Until this hook existed, neither of those checked anything.
      - id: commit-msg
        name: conventional commit subject
        entry: cargo run -q -p xtask -- commit-msg
        language: system
        stages: [commit-msg]

      # Secret detection on the staged diff, when the tool is available. `--redact` keeps a
      # finding out of terminal scrollback and out of any log.
      #
      # It says so and continues when betterleaks is absent, which is deliberate and is not a
      # gate failing open: a hook is bypassable with `--no-verify`, so it was never the
      # enforcement point. CI runs the scan over the whole tree ungated, and that is what
      # decides. Blocking every commit on a host where the tool cannot be installed would only
      # teach people to pass `--no-verify` habitually, which costs more than it saves.
      - id: betterleaks
        name: detect hardcoded secrets (CI is authoritative)
        entry: >-
          sh -c 'command -v betterleaks >/dev/null 2>&1 ||
          { echo "betterleaks not on PATH - skipped here; CI enforces the scan"; exit 0; };
          betterleaks git --pre-commit --config devco/gitleaks.toml --redact --staged --verbose'
        language: system
        pass_filenames: false

      # Workflow static analysis: template injection into `run:`, over-permissive tokens,
      # untrusted checkout.
      #
      # Through nix, which is the ONLY pin for it - the version decides what it reports, so a
      # second pin in pixi would be a second verdict. Skipped with a notice where nix is
      # absent, the same way the secret scan behaves: CI runs it unconditionally, so a skip
      # here delays the finding to the PR rather than losing it.
      - id: zizmor
        name: GitHub Actions static analysis
        # A block scalar, not a plain one: the command contains `: `, which YAML reads as a
        # mapping inside a plain scalar and rejects outright.
        entry: >-
          bash -c 'command -v nix >/dev/null 2>&1
          && exec nix run .#zizmor -- .github/workflows
          || echo "zizmor skipped - no nix on this host, CI enforces it"'
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
