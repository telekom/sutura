# Advisories with no fixed release. Each entry expires so the scan fails again and the ignore is
# reviewed. At build time the only input is this directory's own files.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-31
reason = "picomatch ReDoS via repeated extglobs; every release <= 4.0.7 is affected and none is patched. 4.0.7 (vite, @slidev/cli, unplugin, tinyglobby, vue-router's build plugin) and 2.3.2 (micromatch, anymatch, readdirp) are build tooling matching the deck's own globs; the deck's runtime imports neither. Remove when picomatch ships a fix."
