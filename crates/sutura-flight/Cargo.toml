[package]
name = "sutura-flight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Arrow Flight framing for typed sutura remote legs."

[features]
# Node B's `DoExchange` server (`RemoteLegService`), its `grpc-timeout` parse and its parameter
# decode. Default-off so the framing a caller of a remote leg reuses links `sutura-domain` and
# Arrow only: the application layer, the runtime and the gRPC server arrive with this feature and
# with nothing else.
service = ["dep:arrow-schema", "dep:sutura-app", "dep:sutura-runtime", "dep:tonic", "dep:tracing"]

[dependencies]
arrow-array = { workspace = true }
arrow-flight = { workspace = true }
arrow-schema = { workspace = true, optional = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
sutura-app = { workspace = true, optional = true }
sutura-domain = { workspace = true }
sutura-runtime = { workspace = true, optional = true }
thiserror = { workspace = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
