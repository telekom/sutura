name: format
run-name: Distributed diagnostic bootstrap ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      helper_tree:
        description: Exact reviewed helper tree
        type: string
        required: true
      request_id:
        description: Frozen bootstrap request UUID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: distributed-diagnostic-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: rust-mcp-16core
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: helper
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1a30b5783bbc0e987927fdbbed9503cf51477f13
          path: base
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1a30b5783bbc0e987927fdbbed9503cf51477f13
          path: source
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true

      - name: Generate both bound locks and check disposable source
        working-directory: source
        env:
          HELPER_TREE: ${{ inputs.helper_tree }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND
          nix shell --no-write-lock-file --inputs-from ../base nixpkgs#python3 --command python3 -I ../helper/devco/distributed_diagnostic_bootstrap.py

      - name: Retain generated source and raw failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributed-diagnostic-bootstrap-${{ inputs.request_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/distributed-diagnostic-bootstrap/
          if-no-files-found: error
          retention-days: 14
