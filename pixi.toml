# pixi owns tooling that ships as a conda or Python package, and nothing else. The Rust
# toolchain and the build come from Nix — two owners for one version is one too many.
#
# Channels here are public, because this repo is public. An internal mirror is configured in
# pixi's GLOBAL config (~/.pixi/config.toml), so no internal URL is ever committed. See
# documentation/enterprise-mirrors.md.

[project]
name = "sutura-tooling"
version = "0.1.0"
description = "Workflow static analysis for sutura."
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[dependencies]
# Static analysis for GitHub Actions: finds what a YAML schema check cannot — template
# injection through `${{ }}` into `run:`, an over-permissive token, an unpinned action,
# checkout of untrusted code under `pull_request_target`.
# conda-forge rather than the PyPI wheel: one resolver, one lock.
zizmor = ">=1.9"

[tasks]
# `regular` is the default persona. `pedantic` adds stylistic findings and is not the gate,
# so the gate does not depend on opinions that change between releases.
zizmor = "zizmor .github/workflows"
zizmor-pedantic = "zizmor --persona pedantic .github/workflows"
