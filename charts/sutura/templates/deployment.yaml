{{- include "sutura.requireOffHostPosture" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sutura.fullname" . }}
  labels:
    {{- include "sutura.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sutura.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sutura.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: sutura
          image: "{{ .Values.image.repository }}:{{ include "sutura.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # `sutura serve` - the HTTP surface folded into the one published binary
          # (`github.com/telekom/sutura#685` step 2). `nix/oci.nix`'s own `Entrypoint` stays
          # `/bin/sutura`; only the argument changes.
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- include "sutura.env" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/sutura/config
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/sutura/tls
              readOnly: true
            {{- end }}
            {{- if .Values.security.inbound.keySetSecretName }}
            - name: inbound-keys
              mountPath: /etc/sutura/inbound-keys
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # `/health` is the liveness path (`crates/sutura-http/src/constants.rs`) and there is
          # deliberately no readiness route - docs/serving.md. The startup probe carries the
          # generous failure budget: boot re-verifies every anchor before the listener opens,
          # a round trip per anchor against a networked source.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "sutura.fullname" . }}-config
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        {{- if .Values.security.inbound.keySetSecretName }}
        - name: inbound-keys
          secret:
            secretName: {{ .Values.security.inbound.keySetSecretName }}
            # Only the key set entry: any other entry of the Secret, such as a private key, stays out
            # of the pod. A projection and not a `subPath`, so a rotated Secret still reaches it.
            items:
              - key: {{ .Values.security.inbound.keySetSecretKey }}
                path: {{ .Values.security.inbound.keySetSecretKey }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
