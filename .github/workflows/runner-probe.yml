# Frozen lock hash comparison; maintenance writes require a genuine bot event.
name: Native npm dependency hash equivalence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-native-hash-equivalence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_OPTIONAL_LOCKS: "0"
      SOURCE_SHA: a0d0c086745141328c69ec0f251bc4b9be0e8949
      SOURCE_TREE: 9d20d057273ec2552e65938ed6d1c96f32d5f5fa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a0d0c086745141328c69ec0f251bc4b9be0e8949
          persist-credentials: false

      - name: Bind the accepted source before acquiring tools
        run: |
          set -euo pipefail
          [[ "$(git --no-optional-locks rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(git --no-optional-locks rev-parse 'HEAD^{tree}')" == "$SOURCE_TREE" ]]
          [[ -z "$(git --no-optional-locks status --porcelain)" ]]

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - name: Acquire the pinned accepted-source tools
        run: |
          set -euo pipefail
          for tool in prefetch-npm-deps cacert python3; do
            nix build --inputs-from . "nixpkgs#$tool" --out-link "$RUNNER_TEMP/trusted-$tool"
          done

      - name: Compare the native stdout with the accepted npm dependency hash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/npm-native-hash-proof"
          python="$RUNNER_TEMP/trusted-python3/bin/python3"
          "$python" -I - <<'PYTHON'
          import hashlib
          import json
          import os
          import runpy
          from pathlib import Path

          trusted = runpy.run_path("devco/dependabot_npm.py")
          deck = Path("slides/2026-introducing-sutura")
          manifest = (deck / "package.json").read_bytes()
          lock = trusted["validate_graph"](manifest, (deck / "package-lock.json").read_bytes())
          template = Path("nix/slides.nix").read_bytes()
          expected = trusted["template_slot"](template, template).group(1).decode("ascii")
          temporary = Path(os.environ["RUNNER_TEMP"])
          out = temporary / "npm-native-hash-proof"
          out.mkdir()
          (out / "package-lock.json").write_bytes(lock)
          proof = {
              "status": "prepared",
              "source": os.environ["SOURCE_SHA"],
              "source_tree": os.environ["SOURCE_TREE"],
              "flake_lock_sha256": hashlib.sha256(Path("flake.lock").read_bytes()).hexdigest(),
              "helper_sha256": hashlib.sha256(Path("devco/dependabot_npm.py").read_bytes()).hexdigest(),
              "manifest_sha256": hashlib.sha256(manifest).hexdigest(),
              "lock_sha256": hashlib.sha256(lock).hexdigest(),
              "nix_sha256": hashlib.sha256(template).hexdigest(),
              "expected": expected,
              "native_format": 1,
              "tools": {
                  name: str((temporary / ("trusted-" + name)).resolve())
                  for name in ("prefetch-npm-deps", "cacert", "python3")
              },
              "scope": "Frozen lock native hash only; no dependency build, advisory or maintenance-write verdict.",
          }
          (out / "proof.json").write_text(json.dumps(proof, indent=2) + "\n")
          PYTHON
          mkdir "$out/home" "$out/tmp"
          test -f "$RUNNER_TEMP/trusted-cacert/etc/ssl/certs/ca-bundle.crt"
          # Registry redirects remain trusted; the native reader has no per-response size bound.
          (
            cd "$out"
            timeout 1200 env -i \
              PATH="$RUNNER_TEMP/trusted-prefetch-npm-deps/bin" \
              HOME="$out/home" TMPDIR="$out/tmp" \
              SSL_CERT_FILE="$RUNNER_TEMP/trusted-cacert/etc/ssl/certs/ca-bundle.crt" \
              NPM_FETCHER_VERSION=1 RAYON_NUM_THREADS=2 \
              "$RUNNER_TEMP/trusted-prefetch-npm-deps/bin/prefetch-npm-deps" \
              "$out/package-lock.json" > "$out/hash"
          )
          "$python" -I - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "npm-native-hash-proof"
          proof = json.loads((out / "proof.json").read_bytes())
          raw = (out / "hash").read_bytes()
          assert len(raw) <= 128, "unexpected native hash output"
          proof["actual"] = raw.removesuffix(b"\n").decode("ascii")
          proof["hash_stdout_sha256"] = hashlib.sha256(raw).hexdigest()
          proof["status"] = "equal" if proof["actual"] == proof["expected"] else "different"
          (out / "proof.json").write_text(json.dumps(proof, indent=2) + "\n")
          assert proof["status"] == "equal", "native stdout differs from accepted npmDepsHash"
          print("native hash equals accepted npmDepsHash")
          PYTHON
          [[ -z "$(git --no-optional-locks status --porcelain)" ]]

      - name: Retain the source and hash comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-native-hash-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/npm-native-hash-proof/proof.json
            ${{ runner.temp }}/npm-native-hash-proof/hash
          if-no-files-found: error
          retention-days: 14
