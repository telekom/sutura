name: e2e-gcp

# Provision and exercise the Google test infrastructure (issue 81(a) / issue 87) entirely from
# environment values and secrets - no project, pool, principal or dataset is committed.
#
# The `e2e-gcp` GitHub ENVIRONMENT is the mechanism: its variables hold the resource names
# (project, dataset, pool, provider, issuer/audiences via the SUTURA_GOOGLE_* keys the
# config-from-env.sh shim reads) and its secrets hold the provider's own credential. A fork's
# pull request cannot see an environment's secrets, so this job skips there and runs everywhere
# in-repo - the same `docs/adr/0017` reasoning as `bigquery-acceptance`.
#
# NOT a gate: `just validate` neither reaches it nor depends on it. It provisions a real project
# and can spend money, so it is an explicit, environment-secret-gated action rather than a check.

on:
  workflow_dispatch:
  push:
    paths:
      - "test-infra/**"
      - ".github/workflows/e2e-gcp.yml"

jobs:
  provision:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: e2e-gcp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            fallback = true
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # The `pulumi` CLI is a system binary - the pixi `infra` env only pins the Python SDK. A
      # clean runner has no CLI, so install it explicitly; the python SDK then interprets __main__.py.
      - uses: pulumi/actions@9519177da243fd32cab6d36e4af4b3a67103a21c # v6.0.1
        with:
          pulumi-version: "^3.0"

      # The Pulumi provider authenticates with the deployment's own service-account key, from a
      # secret, written OUTSIDE the checkout - the same discipline the bq-test job uses.
      - name: Place the provider credential outside the checkout
        env:
          E2E_GCP_ADMIN_KEY: ${{ secrets.E2E_GCP_ADMIN_KEY }}
        run: |
          set -eu
          if [ -z "${E2E_GCP_ADMIN_KEY:-}" ]; then
            echo "the e2e-gcp environment holds no E2E_GCP_ADMIN_KEY secret" >&2
            exit 1
          fi
          umask 077
          printenv E2E_GCP_ADMIN_KEY > "$RUNNER_TEMP/e2e-gcp-admin.json"
          echo "provider credential placed, $(wc -c < "$RUNNER_TEMP/e2e-gcp-admin.json") bytes, outside the checkout"

      - name: Mask the resource names
        env:
          E2E_GCP_PROJECT: ${{ vars.E2E_GCP_PROJECT }}
          E2E_GCP_DATASET: ${{ vars.E2E_GCP_DATASET }}
          E2E_GCP_TABLE: ${{ vars.E2E_GCP_TABLE }}
          E2E_GCP_WORKLOAD_POOL_ID: ${{ vars.E2E_GCP_WORKLOAD_POOL_ID }}
        run: |
          set -eu
          for name in E2E_GCP_PROJECT E2E_GCP_DATASET E2E_GCP_TABLE E2E_GCP_WORKLOAD_POOL_ID; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "the e2e-gcp environment defines no $name - it names a resource this stack has to be pointed at" >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "$(printenv "$name")"
          done
          echo "resource names masked for the rest of this job"

      # Everything the stack requires comes from the e2e-gcp environment; config-from-env.sh
      # maps SUTURA_GOOGLE_* into stack config, refuses to run on anything missing, and uses the
      # LOCAL file backend so no pulumi cloud account or shared bucket is involved.
      #
      # The stack name carries a per-run postfix: with the local backend the state is keyed by
      # stack name, so two parallel CI runs each init their own `.pulumi/<stack>.json` and cannot
      # collide. The postfix never lands in a committed file.
      - name: Configure the stack from the environment
        working-directory: test-infra/pulumi/google
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/e2e-gcp-admin.json
          PULUMI_BACKEND_URL: file://${{ github.workspace }}/test-infra/pulumi/google
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.E2E_GCP_PULUMI_PASSPHRASE }}
          SUTURA_GOOGLE_PROJECT: ${{ vars.E2E_GCP_PROJECT }}
          SUTURA_GOOGLE_REGION: ${{ vars.E2E_GCP_REGION }}
          SUTURA_GOOGLE_DATASET: ${{ vars.E2E_GCP_DATASET }}
          SUTURA_GOOGLE_TABLE: ${{ vars.E2E_GCP_TABLE }}
          SUTURA_GOOGLE_GROUP_COLUMN: ${{ vars.E2E_GCP_GROUP_COLUMN }}
          SUTURA_GOOGLE_WORKLOAD_POOL_ID: ${{ vars.E2E_GCP_WORKLOAD_POOL_ID }}
          SUTURA_GOOGLE_WORKLOAD_PROVIDER_ID: ${{ vars.E2E_GCP_WORKLOAD_PROVIDER_ID }}
          SUTURA_GOOGLE_WORKLOAD_ISSUER_URI: ${{ vars.E2E_GCP_WORKLOAD_ISSUER_URI }}
          SUTURA_GOOGLE_WORKLOAD_ALLOWED_AUDIENCES: ${{ vars.E2E_GCP_WORKLOAD_ALLOWED_AUDIENCES }}
        run: |
          set -eu
          STACK="e2e-gcp-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "STACK=$STACK" >> "$GITHUB_ENV"
          nix run .#pixi -- run -e infra bash ./config-from-env.sh --stack "$STACK"

      - name: Apply the stack
        working-directory: test-infra/pulumi/google
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/e2e-gcp-admin.json
          PULUMI_BACKEND_URL: file://${{ github.workspace }}/test-infra/pulumi/google
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.E2E_GCP_PULUMI_PASSPHRASE }}
        run: |
          set -eu
          nix run .#pixi -- run --frozen -e infra up --stack "$STACK" --yes

      # The values a downstream run consumes: the two principal keys (secrets) and the WIF
      # audience. Materialised OUTSIDE the checkout; never echoed.
      - name: Materialise the stack outputs
        working-directory: test-infra/pulumi/google
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/e2e-gcp-admin.json
          PULUMI_BACKEND_URL: file://${{ github.workspace }}/test-infra/pulumi/google
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.E2E_GCP_PULUMI_PASSPHRASE }}
        run: |
          set -eu
          nix run .#pixi -- run --frozen -e infra -- pulumi stack output --stack "$STACK" --show-secrets -j \
            > "$RUNNER_TEMP/e2e-gcp-outputs.json"
          echo "outputs materialised outside the checkout"
