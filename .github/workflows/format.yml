name: format

on:
  workflow_dispatch:
    inputs:
      proof:
        type: choice
        default: validation
        options: [validation, artifacts]

permissions:
  contents: read

jobs:
  release-artifacts:
    if: inputs.proof == 'artifacts'
    runs-on: rust-mcp-32core
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7187cc9c2976f26ff73091ac908788ab8f758280
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Check the native release artifacts
        run: nix run .#just -- shipped

      - name: Export the embedded inventories
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/source-sha
          for binary in sutura sutura-operator; do
            artifact="$(nix build ".#$binary" --no-link --print-out-paths)"
            nix run .#rust-audit-info -- "$artifact/bin/$binary" > "proof/$binary.json"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-inventories-7187cc9c2
          path: proof/
          if-no-files-found: error

      - uses: ./.github/actions/nix-store-cache-report
        if: always()

  validate-and-ship:
    if: inputs.proof == 'validation'
    runs-on: rust-mcp-32core
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 154bc0fa5b4a2198977fda9fc4b0ffc9216336d0
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - name: Open KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Run the exact-source validation gate
        run: nix shell --inputs-from . nixpkgs#just nixpkgs#pixi nixpkgs#betterleaks --command just validate

      - name: Run the committed-diff ship check
        run: nix shell --inputs-from . nixpkgs#just nixpkgs#pixi nixpkgs#devenv --command just ship-check

      - uses: ./.github/actions/nix-store-cache-report
        if: always()
