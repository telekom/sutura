[package]
name = "sutura-exec-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "A Warehouse adapter over PostgreSQL, rendered through the compiled Postgres dialect."

[dependencies]
sutura-domain = { workspace = true }
# Rendering, shared with every other SQL adapter: this adapter asks `sutura-sql` to render the plan
# for `Dialect::Postgres` rather than growing a second set of quoting and placeholder decisions.
# NOT `sutura-semantic`: compiling stops at a plan, the port carries the plan, and this adapter
# never compiles anything.
sutura-sql = { workspace = true }
# Pure Rust and links nothing, which is the point this adapter exists to prove: Postgres is the
# first source whose driver does not pull a native library, so the cross-build matrix survives it.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "io-util", "sync", "macros"] }
tokio-postgres = { workspace = true }
# TLS for a Postgres SOURCE connection. Behind no feature, because when this crate is linked at all
# (by a served deployment) the channel either verifies or refuses - and the pure-Rust driver keeps
# these out of the musl cross builds the same way `tokio-postgres` itself does. See
# `sutura_config::sources::transport`, which owns the three-state declaration this code turns into a
# `rustls::ClientConfig` per connection.
tokio-postgres-rustls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
# (This crate's `tls` module reads the anchor bundle and client identity off disk with rustls's own
#  `PemObject` reader and builds the `ClientConfig` for [`connect_secured`] to connect with.)
# The wire buffer a `ToSql` impl hands bytes to, and the `Sink` item a text `COPY` drives.
bytes = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
# The conformance packs, which `tests/conformance.rs` binds this adapter to, and the developer
# workflow crate that answers where this worktree's Postgres is listening.
#
# **Both DEV-dependencies, and the second one is the whole reason this binding is possible.** The
# packs may not depend on the crate that performs discovery - `xtask/src/boundaries/harness.rs`
# holds `sutura-conformance` to `sutura-domain` alone, and its own remedy assigns *reaching a
# provisioned tier* to the adapter's fixture - so the fixture asks `sutura_dev::provisioned`, which
# also owns the skip-or-fail direction for every harness here. Nothing shipped can reach either:
# `sutura-cli` and `sutura-serve` take this crate as a normal dependency and a dev-dependency
# propagates to no consumer.
[dev-dependencies]
sutura-conformance = { workspace = true }
sutura-dev = { workspace = true }
# A generated self-signed pair, for the in-crate tests that exercise the TLS construction refusals
# against real anchor/identity material. The same crate `sutura-http` rests its own TLS tests on, so
# no new crate enters the dev graph.
rcgen = { workspace = true }
# THE FIXTURE-TIER CREDENTIAL, AND THE CONNECTION CONFIG OVER IT. Default-off, and the reason is the
# ARTEFACT rather than build time: `nix/shipped.nix` builds cargo's DEFAULT feature set, so nothing a
# release publishes contains `src/fixture.rs` or `PostgresWarehouse::local_config`. Both callers are
# tests - `tests/conformance.rs` here and `crates/sutura-app/tests/adapters/mod.rs` - so nothing
# shipped loses anything, and `github.com/telekom/sutura#455` is a `pub fn` whose only guard against
# a consumer reaching it was its name.
#
# **Not `pub(crate)`, and not because that would be weaker.** It would be stronger, and it does not
# compile: both callers are INTEGRATION tests, which are separate crates. A test-only module has the
# same problem. So a feature is the narrowest visibility this pair of call sites admits.
#
# Every compiling gate here passes `--all-features`, and `deny.toml` sets `all-features = true`, so
# this is still compiled, linted and tested on every run. `check-default-features` and
# `check-default-feature-tests` scope themselves to the shipped set, which this crate is not in.
[features]
fixtures = ["sutura-domain/fixtures"]

[[test]]
name = "conformance"
required-features = ["fixtures"]

[lints]
workspace = true
