# devenv inputs. `languages.rust.version` needs rust-overlay declared explicitly -
# devenv fails the shell evaluation with the exact `devenv inputs add` command otherwise.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  # The repository itself, as an input, so the dev shell can reference the flake's OWN `packages`
  # (the single source of truth) rather than re-resolve a tool. Used for `jscpd` and `nextest`:
  # the shell gets the same derivations the flake's checks use.
  repo:
    url: path:.
