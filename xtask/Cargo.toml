[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Repo automation: the dependency-boundary, file-length and unused-dependency gates."

[dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }

# The per-worktree naming and the endpoint discovery file. `xtask` provisions and `sutura-dev`
# names, and the edge points this way so there is ONE function supplying the compose project - the
# same one a test harness and `sutura-dev` read. Two copies of that derivation is how start and stop
# come to disagree about which network to remove.
sutura-dev = { workspace = true }

