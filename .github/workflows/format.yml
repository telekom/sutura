name: oracle-image-hash

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit containing the image pin
        required: true
        type: string
      source_tree:
        description: Exact source tree
        required: true
        type: string
      request_id:
        description: Unique acquisition intent
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-image-hash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: rust-mcp-16core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - name: Acquire the pinned Linux image archive hash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f-]{36}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          mkdir evidence
          git rev-parse HEAD > evidence/helper-sha.txt
          git rev-parse HEAD^{tree} > evidence/helper-tree.txt
          printf '%s\n' "$SOURCE_SHA" "$SOURCE_TREE" "$REQUEST_ID" > evidence/request.txt
          python3 - <<'CHECK'
          import pathlib
          import re
          source = pathlib.Path('source/compose.services.yaml').read_text()
          matches = re.findall(r'gvenzl/oracle-free:([^@\s]+)@sha256:([0-9a-f]{64})', source)
          assert len(matches) == 1, matches
          tag, digest = matches[0]
          pathlib.Path('evidence/image-tag.txt').write_text(tag)
          pathlib.Path('evidence/image-digest.txt').write_text('sha256:' + digest)
          CHECK
          cd source
          nix shell --inputs-from . nixpkgs#nix-prefetch-docker --command nix-prefetch-docker \
            --image-name gvenzl/oracle-free \
            --image-digest "$(cat ../evidence/image-digest.txt)" \
            --final-image-tag "$(cat ../evidence/image-tag.txt)" \
            --os linux --arch amd64 > ../evidence/image.json
          test -s ../evidence/image.json
      - name: Retain acquisition evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-image-hash-${{ inputs.request_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
