# Order: classify -> closure-free gates -> xtask and lint -> tests -> the metrics ABOUT the tests.
# Three staged `nix build` graphs realise it in that sequence, which is what makes the order of the
# steps the order of the work; the stage-1 header in the `ci` job carries why the stages are cut
# where they are, what the split gives up, and the measurement that found the sequence was a
# fiction. Explicit steps rather than one `nix flake check`, because flake checks run in arbitrary
# order and the classifications below deliberately skip work a diff cannot affect. Release-profile
# builds and images belong to the tag-triggered release workflow.
#
# Steps AND the graph roots that realise them are gated on the classification, which fails open.
# Licensing, the structural gates and the secret scan never are: they judge docs too.
#
# Every action is pinned by commit. A tag is mutable and these run with the job's token.
name: ci

# Prose-only pushes do not start a second run after merge. Pull requests always start this workflow
# because `ci` is required on the sole trunk; `classify` keeps their expensive steps off.
#
# What still runs for those paths: docs.yml, which builds the book and runs the text and
# documentation gates. Nothing about a PROSE edit goes unchecked - it is checked by the
# cheaper workflow.
#
# `.json` and `.toml` are NOT ignored, so a change to skill-router.json or a manifest brings
# the full chain back.
#
# NOT EVERY MARKDOWN FILE IS PROSE, and that is why this is `paths` and no longer
# `paths-ignore: ["**/*.md", ...]`. A SEMANTIC CATALOG IS A DIRECTORY OF MARKDOWN DOCUMENTS -
# `examples/single-player/catalog/**` is one, and it is now the only one - and a
# metric's `measure:` decides what SQL we generate. Under the old filter, editing one changed
# the generator's output, started nothing but docs.yml, which runs no tests, and reported green.
# Both golden suites read that directory, so the tests that would have caught it were
# already written and simply never ran.
#
# `paths` with `!` rather than `paths-ignore` plus exceptions, because the two cannot be
# combined: "You cannot use both the `paths` and `paths-ignore` filters for the same event in a
# workflow." The `!` form needs something to subtract from - "If you define a path with the `!`
# character, you must also define at least one path without the `!` character" - and the leading
# `**` is that something: it "matches all files and directories in the repository and is the
# default when no paths filter is used", so the list starts from exactly what no filter at all
# would have matched - the dot directories `.github/` and `.cargo/` included.
#
# THE LIST IS ORDERED, NOT GROUPED, AND THE ORDER IS THE MECHANISM. GitHub walks the patterns
# top to bottom and the LAST match decides: "A matching negative pattern (prefixed with `!`)
# after a positive match will exclude the path. A matching positive pattern after a negative
# match will include the path again." So it reads as one sentence - everything, minus prose,
# plus the catalogs back, minus everything under docs/ - and re-sorting it changes what runs.
#
# The catalogs come back by WHAT THEY ARE, a `catalog/` or `fixtures/` directory, rather than by
# which crate or example holds them, so moving one between `crates/` and `examples/` cannot
# quietly drop it out of CI. A markdown fixture introduced somewhere else would need a line
# here; `xtask/src/changes.rs` carries the same note on the classifier side, which is the second
# gate a catalog edit has to get past.
#
# `!docs/**` is LAST deliberately, and it is the one push exclusion that must win outright: a page
# under docs/ has its own workflow and must not start this whole `ci` chain after merge, even if
# somebody writes `docs/.../catalog/x.md`.
#
# `!mkdocs.yml` sits beside it so the two push filters remain complements. They were
# not: `mkdocs.yml` is in docs.yml's filter AND matched the leading `**` here, so an ADR-only pull
# request that added a nav entry started BOTH, paying the full `ci` chain and the docs job's own
# gates for a prose change. It cannot affect what cargo produces: `mkdocs.yml` is read by mkdocs
# and by `check-docs`, which docs.yml runs. Measured on the pull request that found this,
# `docs/adr/**` plus `mkdocs.yml` was the whole diff bar one line.
#
# **WORKFLOW CODE IS THE EXCEPTION TO the push complement, and it is deliberate.** An earlier
# version of this filter also excluded `.github/workflows/docs.yml`, by the same argument - a
# workflow file is read by nothing but Actions. That argument is wrong, and review caught it: the
# only static analysis any workflow gets is `zizmor`, `actionlint` and `shellcheck`, and all three
# are STEPS IN THIS FILE rather than part of `hygiene`. `cargo xtask check-workflows` does not
# validate YAML either - it cross-checks referenced nix outputs and keeps release outputs out of
# this workflow. So excluding docs.yml meant a change to it could merge with no workflow analysis,
# and invalid YAML in a workflow can stop that workflow from running its own checks. A docs.yml-only
# pull request now
# pays for this chain, which is the honest price of linting the thing that decides what gets
# linted. Any `.github/**` path is in the same class: do not add an exclusion for one.
#
# NOT excluded, and deliberately: `devco/**`. `devco/max-lines-ignore` decides what `max-lines`
# exempts, so a change to it changes what a gate accepts and the gate has to run. It is a
# configuration file for our own tooling, not prose, and the fact that one edit to it happened to
# exempt a docs directory does not make it docs.
#
# A path filter matches the event's CHANGED FILES and the workflow runs if at least one of them
# survives the list, so a commit touching a README and a metric runs - the metric is the reason
# CI exists.
#
# `ci` IS a required check now - it is the one context in the `main` ruleset's
# `required_status_checks` - so the sentence this paragraph used to state as a hypothetical is
# live: a required check that never RUNS blocks the merge rather than failing it. GitHub's own
# words, checked 2026-08-31: "If a workflow is skipped due to path filtering, branch filtering or
# a commit message ... then checks associated with that workflow will remain in a 'Pending'
# state." The `merge_group` trigger below is that failure fixed for one event; the path filters
# push filter above is safe because required checks gate pull requests, not pushes after merge.
# THERE IS EXACTLY ONE `merge_group:` KEY IN THIS FILE and it is the documented one below, after
# the `pull_request` block. A bare second copy sat here and made the whole file invalid - "key
# `merge_group` is duplicated in `on` section" - so GitHub started NO run at all: runs
# 33500695027 and 33500684237 on the `pr-177` queue ref are startup failures with zero jobs. That
# is the worst shape available, because `ci` is the one required context: a workflow that cannot
# start cannot report, a required check that never reports leaves the merge PENDING rather than
# red, and the queue then wedges on a file nobody can see is broken from the pull request page.
#
# IT SURVIVED EVERY GATE, and the reason is worth keeping: `actionlint` catches this instantly -
# it is what found it - but `actionlint`, `zizmor` and `shellcheck` are STEPS IN THIS FILE, so an
# invalid `ci.yml` disables the only three things that would have named it. `just lint-ci` is the
# same three from a shell and is what to run when this file changes; nothing mechanical here can
# close that loop, which is why this paragraph is a warning rather than a check.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!LICENSE"
      - "!NOTICE"
      - "**/catalog/**/*.md"
      - "**/fixtures/**/*.md"
      - "!docs/**"
      - "!mkdocs.yml"
  # Unfiltered because `ci` is required on main. A skipped workflow would leave the pull request's
  # required context pending forever; classification inside the job skips irrelevant work.
  pull_request:
  # THE MERGE QUEUE. A queued pull request gets a ref under
  # `gh-readonly-queue/<base>/pr-<N>-<sha>` and a `merge_group` event, and `ci` is the one context
  # the `main` ruleset requires - so with nothing listening the required check never reports, and
  # the queue's own `check_response_timeout_minutes` elapses, at which point GitHub assumes a check
  # that never concluded FAILED and drops the entry. MEASURED rather than reasoned, 2026-08-31:
  # `refs/heads/gh-readonly-queue/main/pr-107-<sha>` was on the remote while
  # `actions/runs?event=merge_group` listed ZERO runs, so the event had fired and nothing in this
  # repository had ever answered one.
  #
  # **BARE, AND THE OMISSION IS THE ONLY FORM THIS TRIGGER HAS.** There is no `paths:` key here
  # because `merge_group` does not take one - it supports the single activity type
  # `checks_requested` and no `paths`, `paths-ignore`, `branches` or `branches-ignore` filter
  # (GitHub's events reference, checked 2026-08-31) - so a filter copied down from the two
  # triggers above is an invalid workflow rather than a narrower one. Not asserted: `paths: ["**"]`
  # was written here and `actionlint` - the step in this very file - refused it, `"paths" filter is
  # not available for merge_group event. it is only for push, pull_request, pull_request_target
  # events`. Next to two heavily filtered triggers the absence reads as an oversight, which is why
  # it is written down.
  #
  # WHAT THAT COSTS, said plainly: a docs-only entry in the queue now starts this workflow where
  # the filters above would have skipped it. `classify` inside the `ci` job still gates every
  # expensive step, so the bill is the runner, the Nix install and the cache restore - not the
  # lints, the tests, the coverage run or the build.
  #
  # EVERY OTHER REF TEST IN THIS FILE WAS CHECKED AGAINST THIS EVENT, because a `merge_group`
  # run's `github.ref` is `refs/heads/gh-readonly-queue/...` and is not the trunk. `Publish the
  # CRAP baseline` tests `== 'refs/heads/main'`, so a queue entry SKIPS it, which is right and is
  # left alone: a queue entry is not a promotion and must not publish a baseline. The `cross`
  # job's test was the one that came out wrong under the same reading and it MOVED to the event -
  # see its own comment. `concurrency` is right as it stands: `cancel-in-progress` is
  # `github.event_name == 'pull_request'`, so a merge-queue run is never cancelled, and the queue
  # ref is unique per entry so it shares no group with the pull request's own run.
  #
  # THE TWO EVENT TESTS ARE RIGHT AS THEY STAND AND ARE LEFT ALONE. `crap-comment` gates on
  # `pull_request`, so a queue entry posts nothing - there is no pull request to comment on.
  # `bigquery-acceptance` gates on a push or a same-repository pull request, so a queue entry skips
  # it: it is not a required context, nothing has it in `needs`, and the pull request it came from
  # already ran it. Making a queue entry call a cloud provider would be a decision about cost and
  # about a secret, not a fix, so it is named here rather than taken.
  #
  # SCOPE: this file only, and deliberately. `ci` is the only required context, so adding
  # `merge_group` to `docs.yml` or `security-audit.yml` would buy a duplicate run and nothing
  # else. If `verify` or `audit` is ever made required, its workflow needs this trigger too or
  # the queue stalls exactly the way this change fixes.
  merge_group:

permissions:
  contents: read

# #561: the concurrency group MOVED from the workflow level to the `ci` JOB (below), so a run's
# validation is not held up by an unrelated predecessor's downstream tail. The correctness of the
# default-branch base no longer depends on `cancel-in-progress: false` either - the base is read
# from a durable marker, so an evicted run's commits stay covered regardless of cancellation.
jobs:
  ci:
    # THE VALIDATION CONCURRENCY GROUP (#561), at the `ci` JOB level rather than the workflow
    # level. A workflow-level `concurrency:` makes every job of run N+1 - pr-cache,
    # bigquery-acceptance, ci-aggregate included - wait for every job of run N, so the next run's
    # ci sits behind an unrelated predecessor's cross tail (median 79 s, max 1040 s of queue lag
    # measured in #561). Scoping the group to the job that VALIDATES stops that: a later run's ci
    # waits only for the prior run's ci, not its tail; the downstream legs are each own-serialized
    # (bigquery-acceptance has its own group) or idempotent.
    #
    # Never cancel a run on the default branch, and the correctness that used to rest on that
    # comment is now on the durable marker (#561): the default-branch base is the last fully
    # validated commit, so even an EVICTED pending run's commits are covered by the next run.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ci
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # SKIPPED ON THE RELEASE COMMIT, and the three jobs below `needs: [ci]` so they skip with it.
    # version-bump.yml pushes `chore(release): vX.Y.Z` to `main` under a GitHub App installation
    # token, because the `main` ruleset requires a pull request and GITHUB_TOKEN cannot be given
    # a bypass without bypassing every workflow here. An App token's push DOES start workflow
    # runs, so that commit would otherwise re-run this whole workflow - and it is the most
    # expensive commit in the repository to re-run, because it moves the workspace version and
    # therefore crane's dependency derivation, so nothing in the build cache is reusable.
    #
    # WHAT IS GIVEN UP: `main` gets no `ci` run for that commit. Its tree is the reviewed trunk
    # plus a version number, and release.yml reruns the full gates from the tag - so what is
    # skipped is an immediately duplicated cold build of the same release commit.
    #
    # `head_commit` exists on `push` and on nothing else. A `pull_request` event reads the empty
    # string and runs, which is what stops this from silently withholding a REQUIRED check: a
    # promotion PR whose tip happens to be a release commit is still gated.
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore(release):') }}
    runs-on: rust-mcp-16core
    # 75, AND THE CEILING IS THE MERGE QUEUE RATHER THAN THE SLOWEST RUN. `ci` is the only
    # REQUIRED check, so the queue's check-response timeout - 90 minutes - is the point past which
    # a verdict cannot be consumed by anything. The 120 this replaces sat 30 minutes beyond it: a
    # runaway was ejected from the queue at 90 and then went on burning a paid runner for half
    # an hour producing an answer nothing could read.
    #
    # WHY NOT 120. It was set when the cold cost was an ESTIMATE. The engine brought DataFusion and
    # Arrow in, a cap of 60 had killed one cold run mid-`Tests`, and "most of an hour compiling"
    # was the guess that replaced it. The number now exists, taken over the last 300 runs of this
    # workflow (2026-09-09 to 2026-09-11; 170 `pull_request`, 70 `merge_group`, 60 `push`), of
    # which 266 `ci` jobs actually executed:
    #
    #   whole window   n=266   median  708 s   p90 959 s   p99 1107 s   max 1296 s (21.6 min)
    #   since #586     n= 55   median  586 s   p90 882 s   p99 1057 s   max 1065 s (17.8 min)
    #
    # Exactly one job in the window exceeded 1200 s. Both COLD classes are inside that spread: a
    # full Actions-cache MISS with warm cachix stores ran 1041 s, and a pull request that ADDS a
    # crate, so the deps derivation is rebuilt from source, ran 992 s. Neither came near an hour.
    #
    # WHY NOT 60. That is the value that killed the cold run, and the estimate it lost to is the
    # only record of what that run needed - so it is the one number the evidence cannot clear. 75
    # is 3.5x the worst job ever seen in the window, 4.2x the worst since #586, and at least 4.3x
    # either cold class; and, the property that actually matters, it is below 90.
    #
    # **THE LIMIT, STATED NEXT TO THE CLAIM - TWO THINGS THIS NUMBER DOES NOT DO.**
    #
    # It is NOT HELD BY A GATE. Nothing in this repository reads this key, and nothing can read the
    # 90 either: that is a repository ruleset setting and `check-workflows` runs inside a derivation
    # with no network. The pairing is text, so drift back above 90 would be green - the same shape
    # of limit the store-cache action records about a credential's scope.
    #
    # AND IT DOES NOT BOUND A JOB THAT NEVER STARTED. The two longest `ci` walls in that window
    # were 7794 s and 3653 s, and both are `cancelled` with ZERO steps, no runner name and no
    # runner group - queued against an environment policy that never released them, which is an
    # open gap and not compute. `timeout-minutes` begins when a runner picks the job up, so it
    # would not have fired on either one. This cap is not protection against that.
    timeout-minutes: 75
    # SCOPED TO THIS JOB, and it restates `contents: read` because a job-level block REPLACES the
    # workflow-level one rather than adding to it - omitting the line would take away the read
    # this job's checkout needs.
    #
    # `actions: read` is the new grant and it is here rather than at the workflow level because
    # exactly one thing needs it: the CRAP delta below reads the `crap-baseline` artifact that a
    # PREVIOUS run on `main` produced. Listing another run's artifacts and downloading from it
    # are both `actions` scope; `contents: read` cannot reach either. It is a READ scope, it can
    # see nothing a person browsing the Actions tab of this public repository cannot, and it is
    # granted to the job that already reads the whole tree.
    permissions:
      contents: read
      actions: read
    # Published so the `cross` matrix below can gate on the same classification rather than
    # recomputing it. Recomputing would need the full history in five jobs and could disagree
    # with itself; one classification, one verdict.
    outputs:
      build: ${{ steps.classify.outputs.build }}
      # Whether a rendered CRAP delta comment exists for the `crap-comment` job below.
      # A job output rather than a second lookup there: that job holds a write scope and
      # must stay as small as possible, so it is told what to do rather than deciding.
      crap_delta: ${{ steps.crap_delta.outputs.available }}
      # The category axis, published once so the category-gated legs and `ci-aggregate` read the
      # same classification rather than recomputing it. Each value is `core || selected` from the
      # `classify` step, so a `core` diff (a shared or unmapped path) flips every one true.
      core: ${{ steps.classify.outputs.core }}
      identity: ${{ steps.classify.outputs.identity }}
      data_source_datafusion: ${{ steps.classify.outputs.data_source_datafusion }}
      data_source_duckdb: ${{ steps.classify.outputs.data_source_duckdb }}
      data_source_postgres: ${{ steps.classify.outputs.data_source_postgres }}
      data_source_bigquery: ${{ steps.classify.outputs.data_source_bigquery }}
      catalog_local: ${{ steps.classify.outputs.catalog_local }}
      catalog_datahub: ${{ steps.classify.outputs.catalog_datahub }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # classify and the causality gate diff against the base commit.
          fetch-depth: 0
          persist-credentials: false

      # BEFORE nix installs, because /nix/store is what fills. `ubuntu-latest` ships ~20 GB of
      # SDKs this repository does not use against a 14 GB budget, and both `Doctests` and
      # `Test causality` have died on `No space left on device` compiling a dependency closure
      # that is legitimately one of the largest in the ecosystem.
      #
      # A local composite action so `docs`, `release` and the cross matrix can call the same
      # thing. See `.github/actions/reclaim-disk` for why it is local and why it cannot affect
      # the Nix cache.
      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent: with it, a pull request could add a substituter and a trusted key and have
          # CI fetch attacker-built store paths whose signature verifies. Anything CI needs
          # goes HERE, where the workflow diff shows it - never read from flake.nix.
          #
          # THE STORES THIS REPOSITORY PUBLISHES ARE THE ONES IT READS - every bucket
          # `cachix-push.yml` writes is named here, since one it fills and never reads is spend with
          # no return. Both halves are COMMITTED rather than held in a secret or a variable: a
          # committed value is one a reviewer sees and one `cargo xtask check-workflows` compares
          # against, while a variable swaps with no diff. The gate permits exactly this list in
          # exactly this spelling - a store added or dropped, a different key, a key on another host,
          # or any of them passed as `--extra-substituters` are all still refused. Nix's signature
          # check bounds the trust. What bounds the POISON risk for the main-store path is narrower:
          # its WRITE credential is an *environment* secret reachable only from a push to the default
          # branch. PR and mixed credentials must be treated as able to write any trusted store until
          # their scope is independently verified, so this repository cannot claim that every store
          # contains only its own CI output. Residual limit: a value assembled from pieces, or one arriving via
          # another action's input, passes unseen.
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      # HALF (a): the pull-request path also trusts the PR's OWN additive cache, on top of the
      # published set above. That list is SELF-CONTAINED on purpose: a second install must not depend
      # on the first config surviving, so whichever nix.conf wins, a PR run ends trusting all of
      # them. It is gated to exactly `pull_request`, so a merged main run and a merge-queue entry
      # read only the published set. Removing or fuzzing this `if:` reopens main = the gate reddens.
      # A PR still restores the published closures AND reads its own branch cache: nix verifies a
      # signature against the intersection of signer and trusted keys, so every key must be named.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: github.event_name == 'pull_request'
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org https://sutura-prs.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens= sutura-prs.cachix.org-1:UTZrp8XfnC5a3XIvdtADv3/s+vQ686Ac7doOEu2Gizw=

      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Toolchain in use
        run: |
          set -eu
          nix --version
          cat rust-toolchain.toml

      # What to compare against. This gets its own step because getting it wrong is subtle
      # and was wrong: `github.event.before` is the PREVIOUS PUSH on the branch, so a push
      # whose last commit only touched docs classified as docs-only and skipped the Rust
      # chain - reporting green while the branch itself was red. The whole branch is the unit
      # of review, so the whole branch is the unit of comparison.
      - name: Resolve the base to compare against
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            # The merge base, not the base tip: it is the whole PR even if the target moved.
            base="$(git merge-base "$PR_BASE" HEAD || true)"
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            # THE DEFAULT-BRANCH BASE IS A DURABLE MARKER, NOT `github.event.before` (#561).
            # The per-ref concurrency group keeps only ONE pending run, so a third push EVICTS the
            # second before it starts a job; an evicted run validates nothing, and if the next run
            # classified from `before` (= the evicted run's head) the evicted run's commits would
            # fall out of every completed run's range - nine `main` commits went unvalidated that
            # way. So the base here is the durable marker of the last commit a GREEN ci job fully
            # validated, published as artifact `last-validated` at the end of this job. A run that
            # never starts never advances it, so the evicted run's commits sit between the marker
            # and HEAD and ARE covered by this run - which is exactly the property #561 demands,
            # proven as a unit test in xtask `validated_base`. Read it over the Actions API (the
            # CRAP-baseline read's pattern) and prefer it when it is an ancestor of HEAD; `before`
            # stays the fallback for the first push or when no marker is readable.
            base="$BEFORE"
            marker="$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=last-validated&per_page=100" 2>/dev/null |
                jq -r --arg branch "$DEFAULT_BRANCH" '
                  .artifacts[]
                  | select(.expired == false)
                  | select(.workflow_run.head_branch == $branch)
                  | .workflow_run.head_sha
                ' | head -n 1
            )" || marker=""
            if [ -n "$marker" ] && git merge-base --is-ancestor "$marker" HEAD 2>/dev/null; then
              base="$marker"
              echo "classifying against the last fully-validated commit $marker (evicted-run commits stay covered)"
            fi
          else
            # A push to a topic branch: judge the branch, not the push.
            base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)"
          fi
          # An all-zero SHA (new branch) or an empty value means fail open, not skip.
          case "$base" in 0000000000000000000000000000000000000000|"") base="" ;; esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then
            echo "comparing against $base ($(git rev-list --count "$base..HEAD" 2>/dev/null || echo '?') commit(s))"
          else
            echo "no usable base: everything will run"
          fi

      # A docs-only edit needs the structural gates and nothing else; a flake edit needs the
      # whole chain. An unmapped path, a bad base ref or an empty diff all run everything.
      - name: Classify the change
        id: classify
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -eu
          if [ -n "$BASE" ]; then
            nix run .#xtask -- classify --since "$BASE"
          else
            nix run .#xtask -- classify
          fi

      # >>> THREE STAGES, AND THEY ARE THE EXECUTION ORDER (#639 slice I). <<<
      #
      # WHAT WAS HERE, AND WHY IT WAS A LIE OF SEQUENCE. One `nix build` took every check root at
      # once - hygiene, licensing, formatting, lint, tests, both service tiers and doctests,
      # unconditionally - so the "lint, then tests" order of the steps below was not the order
      # anything executed in. Every one of those steps then merely READ an already-realised result,
      # and the timings say so: over the 324 successful `ci` jobs of 2026-09-09..2026-09-12,
      # `Structural gates`, `Licensing`, `Format`, `Clippy`, `Tests`, both tiers, `Doctests` and
      # `API reference pages` each have a median of 0 s and a MAXIMUM of 1 s, while the merged step
      # itself ran a median of 273 s (p90 353 s). Two consequences, paid on every run:
      #
      #   * A CHEAP GATE COULD NOT REPORT UNTIL THE TEST CLOSURE HAD BEEN BUILT. Of the 43 `ci`
      #     jobs that failed in that window, 15 first failed at `Format`, `Clippy` or `Structural
      #     gates` - median 492 s into the job, of which 478 s was burnt before the failing step
      #     even started.
      #   * AND A LATER CLASSIFICATION AVOIDED NOTHING. The roots were unconditional bar
      #     `api-docs`, so 45 of those 324 jobs realised BOTH service tiers and then skipped both
      #     tier steps, and 5 realised the Rust closure and skipped every Rust verdict.
      #
      # THE CUT IS WHERE THE DEPENDENCY CLOSURE FALLS, not where a reader would group the checks,
      # because that is the only line a stage can actually gate on:
      #
      #   1. `fmt` and `reuse` need no `cargoArtifacts` at all - `craneLib.cargoFmt` reads the
      #      filtered source and `nix/reuse.nix` runs a tool over the tree - so they can report
      #      BEFORE `sutura-deps` is substituted or built. That is what makes this stage a gate
      #      rather than a relabelling.
      #   2. `hygiene` and `clippy` both take `inheritedArtifacts ciArtifacts` (`flake.nix`) -
      #      hygiene compiles the xtask binary, clippy the workspace - so neither can precede the
      #      closure, and this is the stage that pays for it.
      #   3. the test roots: the expensive half that a red in stage 1 or 2 no longer launches.
      #
      # WITHIN a stage the roots still reach nix in ONE invocation, which keeps #562's measurement
      # rather than trading it away: nix starts only as many builds as it has runnable derivations,
      # so a single root over a crane closure is one heavy cargo derivation behind a wide fan of
      # fetches, and the host sat **77% idle on average** that way (`runner-probe.yml`, 32-core).
      # `max-jobs` was never the constraint - the number of roots was.
      #
      # WHAT THIS GIVES UP, SAID PLAINLY: overlap ACROSS stages. `clippy` no longer compiles while
      # `nextest` does. That is the price of the ask and not an oversight - and these three steps
      # are also the instrument that finally prices it, because one merged step could report only a
      # single total, which is why no figure above attributes time to any individual check.
      #
      # WHAT IT DOES NOT FIX. `API reference pages` was the first red in 17 of those 43 failures -
      # the largest single cause - at a median of 758 s. `api-docs` needs the same closure and is
      # itself the long root, so it stays in stage 3 overlapping the tests and its latency is
      # unchanged. Staging cannot make a gate report sooner when that gate IS the long pole.
      #
      # EVERY ROOT NOW CARRIES ITS OWN STEP'S CONDITION. `classify` fails open - `run_all` subsumes
      # every area, `xtask/src/changes.rs` - so a root gated on the same expression its step
      # carries cannot narrow coverage below what that step already had. `reuse` and `hygiene` stay
      # unconditional because their own steps are: they judge every file in the tree.
      #
      # NO GATE PAIRS A ROOT WITH ITS STEP, and the reason that is tolerable is the blast radius,
      # stated rather than assumed. If someone narrows a step's `if:` and forgets its root, or the
      # reverse, nothing here reddens - but nothing goes UNCHECKED either, because each step below
      # still runs its own `nix build` and is still the authoritative verdict. A drift costs
      # prefetch, never coverage, and it is visible in the one place that already measures it: a
      # verdict step whose median is 0 s stops being 0 s the moment its root is not realised above.
      #
      # EACH STAGE IS A PREFETCH, NOT A VERDICT, and that is what keeps per-step attribution. Every
      # check below still runs its own `nix build`, still owns its own log and still fails its own
      # step by name - it just finds its result already in the local store. So `continue-on-error`
      # is not a way to hide a red: if a derivation fails here, the step that owns it fails
      # immediately afterwards with its own attributed output. `--keep-going` is what makes that
      # true, by stopping one failing root from abandoning its siblings.
      #
      # The classification reaches these bodies through step-level `env:` and never as `${{ }}`
      # inside the shell, which is `zizmor`'s template-injection finding and would redden
      # `Workflow static analysis` below.
      - name: Realise the closure-free gates in one graph
        continue-on-error: true
        # The ONLY runner-utilisation telemetry CI has: this samples /proc/stat once a second
        # across the stage and reports cpus/memory/model + the nix max-jobs/cores pair in force +
        # mean/peak CPU-busy, so a later analysis can see whether the host was saturated or idle
        # while the checks ran. `busy` is TRUE busy since #564 (idle+iowait as not-busy), sampled
        # by the shared nix/cpu-busy.sh. ~0 cost side effect. It lands in the job summary AND as a
        # `measure-host(<label>):` line in this job's log - grep that prefix, since the summary is
        # served to a browser and to nothing a script can read. One label per stage, which is what
        # makes the three separable in that log.
        uses: ./.github/actions/measure-host
        env:
          RUST: ${{ steps.classify.outputs.rust }}
        with:
          label: closure-free gate graph
          run: |-
            set -eu
            checks=(.#checks.x86_64-linux.reuse)
            if [ "$RUST" = "true" ]; then checks+=(.#checks.x86_64-linux.fmt); fi
            nix build -L --keep-going "${checks[@]}"

      # UNCONDITIONAL, like `Structural gates` two stages down and for the same reason: it judges
      # every file, so gating it on the `rust` classification would let a docs or workflow file
      # arrive attributed to nobody. It needs no cargo and no dependency closure, which is also why
      # its root is in stage 1 and hygiene's is not - there is nothing to save by skipping it and
      # nothing to wait for before running it.
      - name: Licensing
        run: nix build .#checks.x86_64-linux.reuse -L

      - name: Format
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.fmt -L

      # The authoritative secret scan. The pre-commit hook is best-effort - it can be
      # bypassed, and it cannot run on a host without the tool - so the enforcement point has
      # to be here. Never gated on classification: a credential can be committed in any file.
      - name: Secrets
        run: nix run .#betterleaks -- dir . --config devco/gitleaks.toml --redact --verbose

      # An app, not a check: it fetches the advisory database and a build sandbox has no
      # network. The app also supplies the pinned cargo.
      - name: Supply chain
        if: steps.classify.outputs.deps == 'true'
        run: nix run .#deny

      # `nix/lint-workflows.sh` rather than inline, because the composite-action pass below it had
      # TWO callers and was written twice - here and in the justfile - and two copies of a gate are
      # how the two come to check different things. That script's header carries what each tool
      # covers, including the one gap none of them reached: the shell inside a composite action,
      # which `actionlint` cannot read at all. It also records the line-cap measurement that
      # decided WHEN to split, which is a fact about the trunk and not about this file here.
      - name: Workflow static analysis
        if: steps.classify.outputs.run_all == 'true'
        run: bash nix/lint-workflows.sh

      # >>> STAGE 2: THE GATES THAT NEED THE DEPENDENCY CLOSURE BUT NOT THE TESTS. <<<
      #
      # `hygiene` compiles the xtask binary and `clippy` the workspace, both on top of
      # `ciArtifacts`, so this is the stage that pays for `sutura-deps` and stage 3 reuses it from
      # the local store - which is how the shared dependency artifact survives the split. The
      # stage-1 header above carries why the cut is here and what the lost cross-stage overlap
      # costs.
      - name: Realise the xtask and lint gates in one graph
        continue-on-error: true
        uses: ./.github/actions/measure-host
        env:
          RUST: ${{ steps.classify.outputs.rust }}
        with:
          label: xtask and lint gate graph
          run: |-
            set -eu
            checks=(.#checks.x86_64-linux.hygiene)
            if [ "$RUST" = "true" ]; then checks+=(.#checks.x86_64-linux.clippy); fi
            nix build -L --keep-going "${checks[@]}"

      - name: Structural gates
        run: nix build .#checks.x86_64-linux.hygiene -L

      - name: Clippy
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.clippy -L

      # NOT gated on classification: a licence value can move without `Cargo.lock` moving. The
      # document is generated and not committed, so there is nothing to byte-compare - this
      # generates one and refuses an incomplete result, which needs a resolvable registry. The
      # hygiene half holds the ABSENCE of a committed copy and needs nothing.
      - name: The attribution document generates completely
        run: nix run .#xtask -- check-attribution

      # >>> STAGE 3: THE TEST ROOTS, WHICH A RED IN STAGE 1 OR 2 NO LONGER LAUNCHES. <<<
      #
      # Every root carries the condition of the step that reads it, which is the half that was
      # unconditional before: 45 of 324 successful jobs realised both service tiers - a Keycloak
      # JVM and a Postgres server - and then skipped both tier steps. `doctest` inherits
      # `checks.nextest`'s artifacts (`flake.nix`), so it was never parallel with nextest and this
      # stage does not make it serial. `api-docs` sits here rather than in stage 2 although it
      # needs only `ciArtifacts`: it is the long root, so hoisting it would put every test behind
      # it and buy nothing - see the stage-1 header on the failure it is most often the cause of.
      #
      # AN EMPTY SELECTION IS A LEGITIMATE DOCS-ONLY RUN and not a misconfiguration, so it is
      # answered before the array is expanded - `set -u` refuses an empty `"${checks[@]}"` on bash
      # older than 4.4, and the runner's bash is not the only shell this has to survive.
      - name: Realise the test graph in one invocation
        continue-on-error: true
        uses: ./.github/actions/measure-host
        env:
          RUST: ${{ steps.classify.outputs.rust }}
          API: ${{ steps.classify.outputs.api }}
          TIERS: ${{ steps.classify.outputs.run_all == 'true' || steps.classify.outputs.nix == 'true' }}
          IDENTITY: ${{ steps.classify.outputs.identity }}
          POSTGRES: ${{ steps.classify.outputs.data_source_postgres }}
        with:
          label: test graph
          run: |-
            set -eu
            checks=()
            if [ "$RUST" = "true" ]; then
              checks+=(.#checks.x86_64-linux.nextest .#checks.x86_64-linux.doctest)
            fi
            if [ "$TIERS" = "true" ] || [ "$IDENTITY" = "true" ]; then
              checks+=(.#checks.x86_64-linux.keycloak-tier)
            fi
            if [ "$TIERS" = "true" ] || [ "$POSTGRES" = "true" ]; then
              checks+=(.#checks.x86_64-linux.postgres-tier)
            fi
            if [ "$API" = "true" ]; then checks+=(.#checks.x86_64-linux.api-docs); fi
            if [ "${#checks[@]}" -eq 0 ]; then
              echo "no test root is selected by this classification"
              exit 0
            fi
            nix build -L --keep-going "${checks[@]}"

      - name: Tests
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.nextest -L

      # The identity tier, brought up and provisioned inside the sandbox: a realm, a client and two
      # subjects through `kcadm.sh`, and a token fetched AS each subject before the check passes. It
      # is the mechanical form of "no human is needed in CI" - the claim `nix/keycloak-tier.nix` is
      # built on - and it needs no docker socket and nothing off loopback.
      #
      # Gated on the venue's own inputs rather than on `rust`: nothing compiled here can change what
      # the tier does, and a JVM on every Rust pull request is the cost `compose.services.yaml`
      # declines for the same server. `nix/**` fails open to `run_all`, and `flake.nix`/`flake.lock`
      # are the `nix` area, so between them the two conditions cover every file the tier reads.
      - name: Identity tier
        if: steps.classify.outputs.run_all == 'true' || steps.classify.outputs.nix == 'true' || steps.classify.outputs.identity == 'true'
        run: nix build .#checks.x86_64-linux.keycloak-tier -L

      # The Postgres tier's state machine, which the `Tests` step above cannot report on: it starts
      # this tier and stops it, so a green run there means a server came up. Whether `status` and
      # `.sutura-dev/endpoints.json` agree, what a stop that FAILS does to the claim, and which of
      # the two records `nix/with-tier.sh` acts on are all invisible to it - and all three were one
      # discarded suite run.
      #
      # Gated like the identity tier and for its reason: nothing compiled here changes what the
      # tier script does, and the two conditions between them cover every file it reads.
      - name: Postgres tier
        if: steps.classify.outputs.run_all == 'true' || steps.classify.outputs.nix == 'true' || steps.classify.outputs.data_source_postgres == 'true'
        run: nix build .#checks.x86_64-linux.postgres-tier -L

      # nextest deliberately does not run doctests, so a `///` example that stops compiling
      # would pass unnoticed. A separate check, so the gap is visible rather than assumed.
      - name: Doctests
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.doctest -L

      # The pages under docs/api/ are GENERATED from the library crates' doc comments and
      # COMMITTED. rustdoc JSON (`--output-format json`) is nightly-only, so this is its own
      # flake output rather than a fold into an ordinary check: the output packages its own
      # rustdoc JSON generator and its own interpreter, run with `--all-features`. A committed
      # generated file rots silently, so this regenerates them and byte-compares: a doc
      # comment that changed without a regeneration fails here instead of publishing a stale
      # page as current. Locally the same gate is `cargo xtask check-api-docs`, and the fix
      # it asks for is `just api`.
      #
      # rustdoc JSON is unstable nightly-only, which is the whole reason this step is a flake
      # output of its own rather than one of the checks above: the generator needs a nightly
      # that can accept `--output-format json`. That is no longer "the only nightly step" in
      # the way an older comment claimed - the stable/nightly split is gone, and every build,
      # every gate and every shipped artifact here runs the SAME single pinned nightly from
      # devco/rust-toolchain-nightly.toml. The step stays separate for the packaging of the
      # generator and interpreter, not because the rest of the tree is stable.
      #
      # `api` is set by classify for a library crate's sources, for the generator, for the
      # committed pages, and for the manifests - the pages are generated with `--all-features`,
      # so a feature or a dependency can add a public re-export with no doc comment touched. The
      # gate is self-scoping on top of that: a change touching only private code regenerates to
      # identical output and passes, so nothing here has to guess which Rust changes reach the
      # public surface.
      - name: API reference pages
        if: steps.classify.outputs.api == 'true'
        run: nix build .#checks.x86_64-linux.api-docs -L

      # The writable `target/causality-target` the three tail apps recompile into, carried on the
      # SAME digest the store cache uses so a lockfile/manifest change invalidates it and restores
      # the previous generation's recompile otherwise. Saved from main; `save:` inside the action
      # owns the write, so this caller carries no `if:`.
      #
      # RESTORED HERE - immediately before its first reader - RATHER THAN BESIDE THE STORE CACHE
      # AT THE TOP OF THE JOB (#639 slice I). It restores nothing any check above needs: only
      # `apps.causality`, `apps.default-features` and `apps.default-feature-tests` read that
      # directory. Two things that buys, and one that it does not:
      #
      #   * A RUN THAT REDDENS ABOVE NEVER PAYS FOR IT. Measured over the 213 jobs that had this
      #     step: median 28 s, p90 43 s, max 213 s - spent before the first gate had reported.
      #   * THE GRAPH STAGES GET THE DISK BACK. A hit unpacks up to 13.7 GB into the workspace
      #     (the witness's own reading), against a budget `./.github/actions/reclaim-disk` has to
      #     clear 25 GB for, and both `Doctests` and `Test causality` have died here on
      #     `No space left on device`. Restoring after the test graph means that 13.7 GB is not
      #     occupied while the closure is being built.
      #   * IT DOES NOT SHORTEN A GREEN RUN. The same bytes are still restored, just later; what
      #     moves is which failures pay for them. Any claim beyond that needs a measurement.
      #
      # NARROWING it was considered and refused: the entry already holds exactly one directory
      # (`paths: target/causality-target`, `nix: false`), and the three apps SHARE that directory
      # by design, so there is no per-app subset to restore. The lever here is when, not how much.
      - uses: ./.github/actions/causality-target-cache
        with:
          scope: ci

      # THE ONLY TWO STEPS HERE THAT TOUCH CARGO'S DEFAULT FEATURES - the set `nix/shipped.nix`
      # publishes and no other venue in this job uses. Every compiling gate above passes
      # `--all-features`, `Clippy` and `Tests` included, so a `#[cfg(feature = ..)]` arm only ever
      # compiled with the feature ON was a hard error in the exact configuration a release builds
      # while every step here was green. That shipped once, and its `cfg(not(..))` TEST was compiled
      # by the gate below and executed by nothing at all.
      #
      # Apps rather than checks for `Supply chain`'s reason: both shell out to cargo, which needs a
      # registry and a writable target directory the sandbox has not got.
      #
      # ADJACENT, AND THAT IS THE ONE THING THE ORDER DECIDES. The two ask cargo the SAME narrow
      # question - one shipped package, no feature flags - which the v2 resolver gives a narrower
      # feature set than the workspace-wide union `craneLib.buildDepsOnly` warmed, so about a third
      # of each dependency graph is compiled again. Whichever runs first pays that; the second
      # reuses it. `xtask/src/default_features.rs` carries the measurement and says why the
      # recompile is the price of the question rather than a defect. Neither position makes the warm
      # start possible: the stage-2 graph puts the closure in the store before either of these
      # steps, whichever way round they sit.
      #
      # BEFORE `Test causality` AND BEFORE `CRAP score` NOW (#639 slice I), where they used to
      # follow both. The old order was argued as a correctness one - `Test causality` regenerates
      # build script output whose baked `OUT_DIR` did not survive the unpack - and that argument
      # does not hold, because the purge is not the causality step's to do: all three tail apps
      # reach the writable dir through `cargoWarmStart` in `nix/cargo-env.nix`, which embeds
      # `nix/purge-baked-out-dirs.sh` itself. So the sweep happens in whichever of the three runs
      # first, and the order decides only which step pays for it - exactly as the sentence this
      # replaces already conceded. What the new order buys is the ask: the shipped feature set is
      # test BEHAVIOUR, and it now reports before the two steps that measure a property OF the
      # tests rather than the tests themselves.
      #
      # `rust` and not a narrower classification, for both: the package list is derived from
      # `nix/shipped.nix`, which matches no area and so fails open to `run_all` anyway.
      #
      # WHAT NEITHER COVERS: the first stops at metadata and the second links the HOST triple only,
      # so the `cross` legs stay the authority on a musl LINK - and nothing here reaches a
      # feature no shipped binary enables, which is what the `--all-features` gates are for.
      #
      # BOTH WRAPPED IN `measure-host` (#562): the post-graph cargo tail (~300-450 s) had NO
      # utilisation telemetry at all - `measure-host` covered only the then-merged graph step - so
      # nobody could say whether it was CPU-bound or waiting. Sampling it (true busy since #564) is cheap and
      # answers that next question. The `run:` is the same command, `nix run .#default-features`;
      # only the wrapper is added.
      - name: The shipped feature set compiles and lints
        if: steps.classify.outputs.rust == 'true'
        uses: ./.github/actions/measure-host
        with:
          label: shipped feature set compiles and lints
          run: |-
            set -eu
            nix run .#default-features

      # The other half. `xtask/src/default_feature_tests.rs` carries its own argument, its own
      # measurement - 2m18s reusing the warmed closure at the `ci` profile - and its own limits.
      - name: The shipped feature set runs its tests
        if: steps.classify.outputs.rust == 'true'
        uses: ./.github/actions/measure-host
        with:
          label: shipped feature set runs its tests
          run: |-
            set -eu
            nix run .#default-feature-tests

      # CRAP: cyclomatic complexity weighted by the tests that cover it. Neither a complexity
      # limit nor a coverage percentage catches the combination on its own, which is what makes it
      # worth a step of its own.
      #
      # IN THIS JOB, blocking, and that is a cost decision with numbers behind it. Coverage is a
      # SEPARATE PROFILE: `-C instrument-coverage` shares nothing with the artifacts the `Tests`
      # step above just cached. Measured in the dev container on 16 cores, `--workspace` coverage
      # spent over 80 CPU-minutes and 6m18 wall recompiling DataFusion, Arrow and DuckDB and never
      # reached a single test. **The extrapolation that used to follow is void and is not replaced
      # with a guess:** it read "on this runner's four vCPUs that is twenty minutes and up", and
      # this job runs on `rust-mcp-16core` - the same core count the measurement was taken at. So
      # the 6m18 wall applies as measured rather than multiplied, and 6m18 of recompiling that
      # reaches no test belongs nowhere in CI, let alone in the one required job.
      #
      # What runs instead is scoped to `sutura-domain`, whose dependency set is serde and
      # thiserror. MEASURED in the sandbox: 10.2 s of instrumented compile, on top of the
      # dependency derivation the stage-2 and stage-3 graphs above already build - the check shares
      # `cargoArtifacts` with them, so no second one is created. At that price a blocking step in
      # the job that already gates the branch is the right home; a scheduled or non-blocking job
      # would let a regression merge and be noticed later, which for a metric about untested
      # complexity is most of the value gone.
      #
      # The scope is one line in xtask/src/crap.rs, and docs/crap.md carries the measured cost of
      # every wider option plus what this one does not see. `rust` rather than a narrower
      # classification: the policy file, the pin and the manifests all change the verdict, and the
      # commit hook is the thing that scopes by path.
      #
      # `-o result-crap` AND THE COPY exist so the delta steps below cost NO SECOND COVERAGE RUN.
      # The check writes a path-portable copy of its score report into `$out`, which is the only
      # channel out of a Nix build sandbox; this lifts it into the workspace under a plain name.
      # Every consumer below reads that one file. Nothing is measured twice.
      - name: CRAP score
        if: steps.classify.outputs.rust == 'true'
        run: |
          set -eu
          nix build .#checks.x86_64-linux.crap -L -o result-crap
          install -m644 result-crap/crap-baseline.json crap-baseline.json

      # THE DELTA GATE, in four steps: resolve the base's baseline, download it, compare, publish.
      #
      # WHY A DELTA AT ALL, when the step above already enforces CRAP 30 absolutely. An absolute
      # threshold cannot say "worse than the base". A function that slides from CRAP 12 to CRAP 29
      # passes it, every time, and nothing anywhere reports that it moved. The delta answers the
      # other question, and the two are kept independent on purpose: the threshold is the rule
      # that still holds when there is no baseline, and the delta is the rule that still holds
      # over code whose inherited debt is already above the line.
      #
      # THE BASE MUST BE THE MERGE BASE AND NOTHING ELSE. `steps.base` above already resolves it -
      # `git merge-base`, not the base branch tip - and this reuses that value rather than
      # computing a second one. The difference is not cosmetic. Against "the latest baseline on
      # main" the comparison lies in both directions: work that landed on main after the branch
      # point reads as this branch's regression, and improvements that landed there read as this
      # branch's improvements. A gate that reports regressions somebody else caused is a gate
      # that gets switched off.
      #
      # SO THE MATCH IS EXACT, AND A MISS IS A WARNING RATHER THAN A FAILURE. The merge base is
      # not guaranteed to have a baseline: a push to `main` carrying several commits gets one CI
      # run, so the middle commits never produced an artifact, and artifacts expire. Failing there
      # would fail pull requests for the shape of somebody else's push - which is not a finding
      # about this branch, and would train everybody to re-run the job until it went away. It
      # SKIPS instead, loudly, and the absolute threshold above has already run either way. That
      # is a deliberate trade: the delta is a ratchet on top of a gate, not the gate.
      - name: Find the CRAP baseline for the merge base
        id: crap_baseline
        if: github.event_name == 'pull_request' && steps.classify.outputs.rust == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ -z "$BASE" ]; then
            echo "::warning title=CRAP delta::No merge base was resolved, so there is nothing to compare against; the absolute CRAP threshold above still ran."
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Captured rather than piped straight into a filter: a token or permission problem must
          # not read as "no baseline exists". The two outcomes are one warning apart and the
          # difference matters when somebody asks why the delta never runs.
          if ! artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=crap-baseline&per_page=100" 2>&1)"; then
            echo "::warning title=CRAP delta::Listing the crap-baseline artifacts failed, so the delta is skipped. The absolute CRAP threshold above still ran."
            printf '%s\n' "$artifacts"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The default branch AND the exact base SHA. Branch alone would match a baseline from a
          # release branch; SHA alone would match one built on a fork of the same commit.
          run_id="$(
            printf '%s' "$artifacts" |
              jq -r --arg base "$BASE" --arg branch "$DEFAULT_BRANCH" '
                .artifacts[]
                | select(.expired == false)
                | select(.workflow_run.head_branch == $branch)
                | select(.workflow_run.head_sha == $base)
                | .workflow_run.id
              ' | head -n 1
          )"
          if [ -z "$run_id" ]; then
            echo "::warning title=CRAP delta::No crap-baseline artifact exists for the exact merge base $BASE, so the delta is skipped rather than compared against a stale or newer baseline. The absolute CRAP threshold above still ran."
          else
            echo "baseline from workflow run $run_id, built at the merge base $BASE"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the CRAP baseline
        if: steps.crap_baseline.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crap-baseline
          path: crap-base
          # Another run's artifact, which is what `actions: read` on this job is for.
          github-token: ${{ github.token }}
          run-id: ${{ steps.crap_baseline.outputs.run_id }}

      # No compiler, no coverage, no cargo-crap: two JSON files in, a verdict out. `nix run
      # .#xtask` is the binary this workflow already builds for `classify`, so this step adds a
      # few seconds of file reading and nothing else.
      #
      # The rendered markdown goes to the step summary HERE, where it needs no token at all, and
      # is uploaded for the `crap-comment` job below, which holds the only write scope on any job
      # a pull request can reach. Other workflows do hold write scopes - the site, a release, the
      # optimised release build, a version bump, the cache prune - and none of those scopes is on a
      # job a pull request can start: four of the five do not run on a pull request at all, and
      # docs.yml, which does, gates its publishing job off that event.
      #
      # The verdict is re-raised at the end rather than short-circuiting, so the summary and the
      # artifact exist even when the ratchet failed - which is exactly when a reader wants them.
      - name: CRAP delta
        id: crap_delta
        if: steps.crap_baseline.outputs.run_id != ''
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -u
          status=0
          nix run .#xtask -- crap-delta \
            --baseline crap-base/crap-baseline.json \
            --head crap-baseline.json \
            --comment crap-delta.md \
            --base "$BASE" || status=$?
          if [ -s crap-delta.md ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            { echo; cat crap-delta.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload the CRAP delta comment
        if: ${{ !cancelled() && steps.crap_delta.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crap-delta-comment
          path: crap-delta.md
          if-no-files-found: error
          retention-days: 7

      # MAIN ONLY: this commit's report becomes the baseline every pull request branched from it
      # compares against. Uploaded from the same file the step above already produced, so `main`
      # pays nothing for it beyond the upload.
      #
      # 30 days, which is the one real limit on this mechanism: a pull request whose merge base is
      # older than that gets the warning and the skip above. That is the right failure - a branch
      # a month behind `main` has a comparison problem the CRAP gate cannot fix.
      - name: Publish the CRAP baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.classify.outputs.rust == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crap-baseline
          path: crap-baseline.json
          if-no-files-found: error
          retention-days: 30

      # A changed test must fail against base behaviour and pass with the change. Compiles
      # twice in a worktree, so it needs git history and a writable tree.
      #
      # EXIT 3 IS "I MEASURED NOTHING", and this step is the one place that decides what this
      # venue does with it. Both of the gate's inconclusive answers used to be exit 0, so a
      # required check went green over no evidence and no reader of the check could tell - see
      # `github.com/telekom/sutura#307` and `xtask/src/main.rs`'s `Verdict::Inconclusive`. They
      # exit 3 now, which fails any consumer that does not know the code; this one KNOWS it and
      # continues, because the changes that land there are legitimate (a harness move, a changed
      # public signature that a held-at-HEAD test file calls) and a gate that reddens correct
      # work gets disabled.
      #
      # WHAT CONTINUING COSTS, stated because a green step is exactly what #307 is about: the
      # job is still green on an inconclusive run, and the two surfaces below do NOT reach the
      # pull-request conversation. `$GITHUB_STEP_SUMMARY` renders on the workflow RUN SUMMARY
      # page - that is what the variable is for - and a `::warning` with no `file=`/`line=` is a
      # PATH-LESS annotation: the job log, the run's annotations list and the check run, anchored
      # wherever GitHub chooses rather than where this file chose. So a reviewer who reads only
      # the conversation sees one green check and nothing else, which is #307's failure mode with
      # one click removed rather than closed. An earlier version of this comment claimed the
      # conversation, and an overstated control is itself the defect.
      #
      # THE CONVERSATION MECHANISM IS IN THIS FILE, in the `crap-comment` job below: a
      # marker-keyed sticky comment posted from a separate job holding `pull-requests: write`,
      # shaped so a delivery failure cannot recolour the gate. Routing this verdict through it is
      # the open improvement, and it was not taken yet because the branch below HAS EXECUTED IN NO
      # VENUE - no run of this repository has reached exit 3 here - so a delivery path built on top
      # of it would be assumed rather than proven. What IS proven about this branch: exit 3 is a
      # unit test on `Verdict::exit_code`, `nix run` propagates 3 unchanged, and
      # `cargo xtask check-inconclusive` refuses a venue that suppresses it or declares a branch
      # it does not have.
      #
      # The substitute evidence (a mutation run, or the gate scoped per commit) is the author's,
      # and nothing here can check that they gave it. Cite the VERDICT LINE, never this step's
      # colour.
      - name: Test causality
        if: steps.classify.outputs.rust == 'true'
        env:
          BASE: ${{ steps.base.outputs.base }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            # Ordinary CI keeps its merge checkout; causality measures only the topic's diff.
            merge_head=$(git rev-parse HEAD)
            read -r base_tip merged_pr extra <<< "$(git show -s --format=%P HEAD)"
            if [ -z "$PR_HEAD" ] || [ "$merged_pr" != "$PR_HEAD" ] || [ -n "$extra" ]; then
              echo "causality requires the checked-out merge's second parent to be the event's PR head" >&2
              exit 1
            fi
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "causality refuses to switch a checkout with tracked changes" >&2
              exit 1
            fi
            BASE=$(git merge-base "$base_tip" "$PR_HEAD")
            trap 'git checkout --detach "$merge_head" || exit 1' EXIT
            git checkout --detach "$PR_HEAD"
          fi
          if [ -z "$BASE" ]; then
            echo "no usable base ref; causality not checked"
            exit 0
          fi
          status=0
          nix run .#causality -- --since "$BASE" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning title=Test causality was INCONCLUSIVE::The gate reached no verdict about this change - this step is green over NO red-before-green evidence. Read the verdict line in the log and require a mutation run, or the gate scoped per commit."
            {
              echo "### Test causality: INCONCLUSIVE"
              echo
              echo "The gate ran and measured nothing (exit 3), so this green step is not coverage."
              echo "Usual causes: a harness move, or a changed public signature a test file kept at"
              echo "HEAD calls. Ask for the substitute evidence - a mutation run, or \`just causality\`"
              echo "scoped per commit - and read the verdict line rather than this step's colour."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      - uses: ./.github/actions/nix-store-cache-report
        if: always()

      # DURABLE VALIDATED-COMMIT MARKER (#561). Advance "the last commit a completed run fully
      # validated" to THIS run's head, ONLY on a green push to the default branch. The base step
      # reads it; this is the write half. An EVICTED run never reaches here (it never starts a
      # job), so the marker only moves on runs that actually ran to a green conclusion - which is
      # exactly what keeps an evicted run's commits inside the NEXT run's classification range.
      # `success()` keeps a RED run from advancing it, so a commit that failed is re-classified by
      # the next run rather than silently marked done. The value a later run reads is the
      # artifact's OWN `workflow_run.head_sha` (= this push's head), so the file below is for a
      # human reading the artifact, not for the reader above.
      - name: Publish the last-validated-commit marker
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          printf '%s' "$SHA" > last-validated

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: last-validated
          path: last-validated
          if-no-files-found: error
          retention-days: 30

  # HALF (a): publish this pull request's OWN store paths to `sutura-prs`, the PR's additive cache.
  # Runs ONLY on a pull request and only after `ci` has warmed the closure (`needs`), mirroring
  # `cachix-push.yml`'s own push job.
  #
  # **WHAT SELECTS THE PULL-REQUEST CREDENTIAL IS THE `environment:` DECLARATION, and that is the
  # whole of the mechanism.** This job declares `environment: cachix-push-pr`, which is how it reads
  # that environment's secret rather than the main one, and `cache_scope`'s PR-writer pairing PINS
  # that declaration - deleting it turns the gate red, verified by mutation rather than assumed.
  #
  # **AND THIS COMMENT USED TO OVERSTATE IT.** It said the credential carries "Write on sutura-prs,
  # no Write on `sutura`". It does not. The credential for the main store is the narrow one - one
  # store, default branch only - while the pull-request and mixed credentials must be treated as able
  # to write either store until their scope is independently verified. So the separation between the
  # two write paths is convention and configuration, NOT a verified capability. That posture is an
  # accepted decision and is recorded here rather than implied, because an overstated control is
  # itself the defect: a reader who saw "no Write on `sutura`" stopped looking for the thing that would
  # have made it true.
  #
  # **THE LIMIT, STATED NEXT TO THE CLAIM: a gate cannot read a credential's scope and cannot read a
  # branch policy.** Nothing in this repository can verify any of the paragraph above -
  # `check-workflows` runs inside a derivation with no network. What it CAN do is what it does: pin
  # the environment name and the pull_request gating, and pair them.
  #
  # **THE READ SIDE IS HELD IN TEXT, AND WHAT IT CONTAINS IS NARROWER THAN THIS COMMENT CLAIMED
  # (#639 slice I).** What is true and unchanged: the default branch never lists the pull-request
  # store's public key, so no merged-main resolve substitutes from `sutura-prs` - which is the
  # containment for POISONED CONTENT IN THAT STORE, and `docs/adr/0027` records it.
  #
  # What it does NOT do is what the sentence here used to say, that it "stops an in-repository
  # pull-request author reaching main". Read-key separation cannot contain a writer authorised for
  # the main store, and the pull-request and mixed credentials must be treated as able to write
  # `sutura` directly until their scope is independently verified. `sutura` is a store the default
  # branch DOES name and DOES trust by key. The read-key boundary closes one route to main; it does
  # not close the route that an unverified credential scope may leave open.
  #
  # So the actual bound on that route is **who can reach the `cachix-push-pr` environment's
  # secret**, which is forge configuration this repository cannot read - the same owner-held control
  # `docs/adr/0027` files under "What is NOT held by a mechanism". Retaining or changing that
  # credential posture is an owner decision and is not taken here; correcting the guarantee is.
  #
  # **NEITHER HALF WAS INDEPENDENTLY VERIFIED FOR THIS CORRECTION.** The credential's scope was not
  # inspected and no poisoning was attempted; what is corrected is an argument that did not follow
  # from the facts already written beside it, which is the cheapest kind of defect to leave standing
  # and the most expensive kind to rely on.
  pr-cache:
    needs: [ci]
    # `!cancelled()` RATHER THAN NOTHING, AND IT IS THE WHOLE REASON THIS CACHE READ AS UNUSED.
    # With a bare `needs: [ci]` GitHub skips this job whenever `ci` FAILS, so the store filled only
    # after a green run - precisely when nobody needs it - and every red push, which is when you
    # iterate and when the expensive closure gets rebuilt, contributed nothing. Measured on #597
    # push 3, a branch that ADDS a crate so main's stores cannot hold its closure: `ci` substituted
    # 129 paths, every one from `cache.nixos.org` and ZERO from `sutura-prs`, while this job on the
    # two earlier pushes was SKIPPED because `ci` failed on both. It then published 7 paths
    # (`sutura-deps-0.1.0` among them) that no fourth push existed to read.
    #
    # PUBLISHING AFTER A FAILURE IS SAFE, and the argument is nix's: a derivation that failed has no
    # store path to push. A red `ci` means some check's derivation failed; its successful
    # sub-derivations - `sutura-deps` above all - are valid store paths either way. So this pushes
    # exactly what genuinely built.
    #
    # `!cancelled()` and not `always()`, because this job takes a paid runner: `always()` would
    # start it after somebody pressed cancel and publish whatever partial store the runner held.
    # `ci` being SKIPPED is not a live case - that skip is for `chore(release):` commits, which are
    # not `pull_request` events.
    #
    # THE TOKEN ORDER IS LOAD-BEARING: `cache_scope`'s PR-writer pairing reads this job's `if:`
    # with `github.event_name == 'pull_request'` as a pinned PREFIX and refuses the reversed
    # spelling and a `${{ }}` wrapping alike.
    if: github.event_name == 'pull_request' && !cancelled()
    runs-on: rust-mcp-16core
    environment: cachix-push-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: github.event_name == 'pull_request'
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org https://sutura-prs.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens= sutura-prs.cachix.org-1:UTZrp8XfnC5a3XIvdtADv3/s+vQ686Ac7doOEu2Gizw=

      # RESTORE-ONLY, AND THIS JOB CANNOT EVER SAVE THIS SCOPE. The action's `save:` is gated on a
      # push to `main` and this job runs on `pull_request` alone, so it reads the scope `ci` entry
      # that a `main` push wrote and writes nothing back - the step summary it prints says
      # "restore-only, nothing written" on every run here. That is the DESIGNED shape and not an
      # oversight: `cache_scope` refuses an `if:` on this step and on any caller of it, precisely so
      # a pull request's restore survives while the write stays gated to `main`.
      #
      # KEPT ON EVIDENCE, because #604 deleted this exact shape twice as pure cost and it is NOT
      # pure cost here. Measured on job `103311822910`: the restore took 42 s of a 157 s job, hit an
      # older generation, pulled 3.65 GB, and left nix with 4 derivations to build and 4 paths -
      # 2.7 MiB - to fetch. It supplied essentially the whole build-time closure.
      #
      # Deleting it moves those bytes to the cachix substituters, which is the trade #604 made for
      # scope `bq` - and that one came out at NO MEASURABLE CHANGE: `bigquery-acceptance` ran a
      # median of 179 s over the 143 executed jobs before that merge and 178 s over the 8 after it.
      # (#604 claimed no after-number itself; this is that number.) So the expected saving here is
      # nothing, and there is no census gain either, because the entry is shared rather than this
      # job's own.
      #
      # IT DOES NOT DEFEAT THE PUBLISH BELOW, which was the one way it could have been load-bearing
      # in reverse. cachix's post-build hook publishes only what nix BUILDS, and a restore carries
      # dependencies rather than this pull request's own check outputs - the same run built and
      # pushed 4 paths while skipping 1541.
      #
      # THE LIMIT: n=8 after that merge is a direction and not a distribution, and no A/B of THIS
      # step exists - deleting it would need its own before-and-after on this job, not the `bq` one.
      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: sutura-prs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Same self-restraint the main publish uses: push what THIS run realised, not the whole store.
          pushFilter: "(-source$|nixpkgs)"

      # Realise and publish the PR's own realised paths. cachix-action's post-build hook publishes
      # ONLY paths nix BUILDS while its daemon is alive - a job that merely restored scope `ci` and
      # re-derived it would fire the hook nothing. Scope `ci` is keyed on the lockfiles, which are
      # unchanged across a PR's commits, but the checks' own outputs are derived from the PR's
      # source, so this realise RE-COMPILES the workspace crates into fresh store paths for this PR,
      # the hook fires, and they land in `sutura-prs` for the next commit on this branch to
      # substitute - the same three-check closure the shared `push` job publishes to `sutura`.
      - name: Realise and publish this PR's shared closure
        run: |
          set -eu
          nix build --print-build-logs \
            .#checks.x86_64-linux.nextest \
            .#checks.x86_64-linux.clippy \
            .#checks.x86_64-linux.hygiene

  # THE ONLY JOB IN THIS REPOSITORY THAT HOLDS A WRITE SCOPE, and it exists as a separate job for
  # exactly that reason.
  #
  # WHAT NEEDS IT: posting the CRAP delta table as a pull-request comment. A comment on a pull
  # request is an ISSUE comment to the API, and creating or editing one needs
  # `pull-requests: write`. There is no read-only route to it, and the alternative - leaving the
  # table in the step summary, where it needs no token - was judged not enough: a reviewer reads
  # the conversation, not the run page.
  #
  # WHY IT IS NOT ON THE `ci` JOB. A job-level `permissions:` block is the narrowest grant GitHub
  # offers, and this job is the narrowest job that can be built: it checks nothing out, compiles
  # nothing, runs no code from the pull request, and touches exactly one artifact and one API
  # endpoint. The `ci` job builds and tests the branch's own code; a write token there would be
  # reachable by anything that code can influence. Here there is nothing to influence.
  #
  # DELIBERATE, NOT INHERITED. This repository is public and its workflow-level grant is
  # `contents: read`; that line was not widened, and this block does not change it for any other
  # job. The grant was reviewed and approved as a security decision, and the four properties
  # below are what the decision rests on. Removing any one of them changes the decision:
  #
  #   1. `pull_request`, NEVER `pull_request_target`. On a `pull_request` event the token is
  #      scoped to the head repository, so a fork PR gets a read-only token whatever this block
  #      says - and the `if` below skips forks rather than failing on them.
  #   2. NO CHECKOUT. This job never materialises the pull request's tree, so no `run:` here can
  #      execute anything the pull request author wrote.
  #   3. NO UNTRUSTED TEXT IN A SHELL BODY. Every `${{ }}` below reaches the script through `env:`
  #      and is read as a shell variable. The PR title, branch name and body are never
  #      interpolated - they are not used at all.
  #   4. THE COMMENT BODY IS OURS. It is rendered by `cargo xtask crap-delta` from two JSON
  #      reports this pipeline produced, and it is posted through `--input` with a jq-built JSON
  #      payload rather than assembled by string concatenation.
  #
  # What an attacker could do if those properties were lost: with a write scope and any way to run
  # their own code in this job, they could edit or delete comments on any pull request in the
  # repository, and use the same token to post approvals-looking comments. They could not push to
  # a branch or read a secret - `contents` and `secrets` are not granted here. That is the blast
  # radius the four properties above hold to nothing, and it is what the `zizmor` gate reads this
  # block for.
  crap-comment:
    needs: [ci]
    # `!cancelled()` and not `success()`: the comment is MOST useful when the delta failed.
    # The fork guard is property 1 above - a fork's token is read-only, so posting would fail
    # rather than being denied, and a red job for a comment nobody could have posted teaches
    # nothing.
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.ci.outputs.crap_delta == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # `ubuntu-latest`, AND IT COMPILES NOTHING - `gh` and `jq` are its whole toolchain and both
    # ship on the hosted runner, which the step below already says. Measured at 9-10 s per run,
    # so what the Rust runner bought here was a large machine holding a comment.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Posting or editing the one comment. Nothing else is granted: `contents` is absent because
      # this job checks nothing out, and a job-level block sets every unlisted scope to `none`.
      pull-requests: write
      # Reading the artifact the `ci` job uploaded. `actions/download-artifact` resolves it
      # through the Actions API, which `pull-requests` does not cover.
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crap-delta-comment
          path: crap-delta

      # DELIVERY, NOT VERDICT, and `continue-on-error` is what says so. The gate already ran in
      # the `ci` job and its result is that job's exit code. If the API call fails here - a rate
      # limit, a transient 502 - the run must not turn red for a comment, and it must not turn
      # green either: it stays exactly as `ci` left it.
      #
      # `gh` and `jq` rather than a JavaScript action: both ship on the runner, and this repository
      # pins every action by digest, so not adding a fourth one to keep pinned is worth two more
      # lines of shell.
      - name: Post or update the CRAP delta comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          body=crap-delta/crap-delta.md
          # The marker is hardcoded HERE and asserted against the file, rather than read out of
          # it. That way a rename in `xtask/src/crap/delta.rs` fails loudly instead of quietly
          # posting a second comment on every push forever.
          marker='<!-- sutura-crap-delta -->'
          if ! head -n 1 "$body" | grep -qxF "$marker"; then
            echo "the rendered comment does not begin with $marker" >&2
            echo "refusing to post a comment the next run cannot find and replace" >&2
            exit 1
          fi
          # jq builds the JSON, so a backtick or a quote in the table cannot break the payload.
          jq -Rs '{body: .}' "$body" > payload.json
          existing="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" |
              jq -r --arg marker "$marker" '
                .[] | select(.body != null and (.body | startswith($marker))) | .id
              ' | head -n 1
          )"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input payload.json > /dev/null
            echo "updated comment $existing"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input payload.json > /dev/null
            echo "posted a new comment on pull request $PR_NUMBER"
          fi

  # The one job in this file that talks to a real cloud service, and therefore the one that can
  # claim ACCEPTANCE rather than rendering. `docs/adr/0017` decided this belonged outside CI and its
  # amendment records what changed: an ENVIRONMENT secret is not exposed to a `pull_request` run from
  # a fork, which was that decision's whole stated reason.
  #
  # **Its own job, deliberately.** A failure here is attributable to the endpoint rather than mixed
  # into the lint-and-test job, and the rest of CI does not wait on a network call to a cloud
  # provider.
  #
  # **A fork's pull request SKIPS and everything in-repo RUNS**, which is this repository's own rule:
  # skip where the runner had no choice, fail where somebody typed the command. The condition is on
  # the head repository rather than on `github.event_name`, because a pull request from a BRANCH of
  # this repository can see the secret and should be held to it.
  #
  # It waits for `ci`, so the dependency closure that job fills is available before this one asks the
  # cache for it and a red local gate spends no cloud request. Nothing needs this job, so an endpoint
  # failure still does not hold the cross matrix; whether it becomes required is a branch-protection
  # decision rather than one this file makes.
  #
  # **A concurrency group shared across REFS - the CI belt to the per-run-table braces.** The
  # dataset (`docs/adr/0017`'s seventh amendment) is one resource and every in-repo run shares it;
  # the group is keyed on the DATASET not the ref so refs queue rather than interleave. `queue: max`
  # retains up to 100 pending jobs; any beyond that are cancelled. `cancel-in-progress: false`
  # preserves the job already using the dataset. A developer's own local run is the one concurrent
  # writer this cannot serialise; per-run table names keep it safe anyway.
  bigquery-acceptance:
    needs: [ci]
    # Runs only when the diff selected the BigQuery category (or fell open to `core`), AND the
    # event can reach the `bq-test` environment secret (an in-repo pull request, or a push). A
    # branch that touches no BigQuery adapter or dialect - or a fork, or the merge queue - pays
    # nothing for the dataset-serialising acceptance leg. `ci-aggregate` holds that this job may be
    # skipped ONLY when its category is not selected, or the event cannot run it, never silently.
    if: github.event_name == 'push' && needs.ci.outputs.data_source_bigquery == 'true' || github.event.pull_request.head.repo.full_name == github.repository && needs.ci.outputs.data_source_bigquery == 'true'
    runs-on: rust-mcp-16core
    # The endpoint answers in seconds; what takes the time is compiling the crate under the pinned
    # toolchain on a cold cache.
    timeout-minutes: 60
    permissions:
      contents: read
    # **The environment is the mechanism, not decoration.** GitHub does not expose an environment's
    # secrets to a `pull_request` run from a fork, which is exactly the exposure `docs/adr/0017`
    # refused CI over - so naming it here is what makes the amendment true rather than asserted.
    environment: bq-test
    # **The belt to the per-run-table braces:** two CI runs sharing one dataset queue rather than
    # interleave. Keyed on the dataset (a `vars` value) and shared across refs - see the comment
    # above the job.
    concurrency:
      group: bigquery-acceptance-${{ vars.SUTURA_BQ_DATASET }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      # NO STORE CACHE HERE, AND THE REASON IS ARITHMETIC. One complete generation of this
      # repository's Actions-cache entries is ~13 GB against a 10 GB effective ceiling, so something
      # is always being evicted - measured 2026-09-11 at 10,309,515,473 B over 217 entries, of which
      # the main-ref scopes are `bq` 4082 MB, `ci` 3483 MB and the musl triple 2118 MB, with
      # `aarch64` and the causality-target entry already gone. `bq` was the largest single claim on
      # that ceiling and it carried a closure `cachix-push.yml` already publishes, so every reader
      # here can substitute it from the stores the installer above names. Restoring it cost 25-47 s;
      # what the substitution costs instead is unmeasured, and this job's own run is the measurement.
      # `cachix-push.yml`'s `connectors` job lost its `scope: bq` restore in the same change: this
      # job was the only writer, and a restore of a scope nobody writes is the defect `fuzz` was.

      # **The credential reaches the runner and never the repository, a log, or a command line.**
      #
      # Written through `env` into a file under `$RUNNER_TEMP`, which is OUTSIDE the checkout. Three
      # separate reasons, and the second is the one that cost a real failure:
      #
      #   1. a key inside the tree is one `git add .` from a public leak;
      #   2. the secret sweep scans the WORKING TREE and does not honour `.gitignore`, so a key in the
      #      checkout fails `just secrets` and blocks the push stage for everyone - measured, three
      #      leaks, on a developer machine;
      #   3. `$RUNNER_TEMP` is discarded with the runner.
      #
      # `printenv` rather than `echo "$VAR"` and never `${{ }}` in a shell body: a multi-line JSON key
      # is exactly the shape that defeats naive log masking, so nothing here interpolates it, echoes it
      # or passes it as an argument. `umask 077` before the write, so it is never briefly readable.
      - name: Place the credential outside the checkout
        env:
          SUTURA_BQ_KEY: ${{ secrets.svc_suturua_bq_ci }}
        run: |
          set -eu
          if [ -z "${SUTURA_BQ_KEY:-}" ]; then
            echo "the bq-test environment holds no svc_suturua_bq_ci secret" >&2
            exit 1
          fi
          umask 077
          printenv SUTURA_BQ_KEY > "$RUNNER_TEMP/bq-key.json"
          # The shape, never the content: enough to know a key arrived and nothing that reveals it.
          echo "credential placed, $(wc -c < "$RUNNER_TEMP/bq-key.json") bytes, outside the checkout"

      # **Mask the three resource names, and this step exists because of a channel the rest of the job
      # would otherwise open.**
      #
      # Workflow logs on a PUBLIC repository are public. The wire carries the endpoint's own `message`
      # on a refusal - bounded, deliberately, because a `400 invalidQuery` with only a reason code is
      # undiagnosable - and that message quotes the resource it refused, as `project:dataset.table`. So
      # a FAILING acceptance run would print a project id, a dataset and a table name into a log
      # anybody can read, which is exactly the class `AGENTS.md` says not to disclose.
      #
      # `::add-mask::` is the mechanism that fits, because it does not care WHERE the value appears: it
      # redacts it from every subsequent log line in the job, including a panic message from a test.
      # Masking the diagnostic away is the right trade in this direction - a maintainer who needs the
      # unredacted message runs the leg locally, where the log is theirs.
      #
      # **THE LIMIT, AND THIS COMMENT USED TO OVERSTATE IT (#527).** It said the names were masked
      # "before anything can print them". For two of the three they are not. The runner prints a
      # step's resolved `env:` block into that step's own `Run` group BEFORE it executes the body -
      # `PrintActionDetails` in `actions/runner`'s `src/Runner.Worker/Handlers/Handler.cs` emits
      # `env:` and every entry of the handler's environment, and `ActionRunner` calls it ahead of
      # `RunAsync` - so `SUTURA_BQ_DATASET` and `SUTURA_BQ_TABLE` appear in cleartext ONCE, here, and
      # are redacted from every occurrence after that. An overstated control is worse than an absent
      # one, because a reader who believes the old sentence stops looking.
      #
      # **AND IT CANNOT BE FIXED BY MOVING THE MASK EARLIER**, which is why the shape below is the
      # best available one rather than a defect left in place. That printed dictionary is built from
      # the `env` CONTEXT, which the same runner source notes "contains job level env and action's env
      # block" - so hoisting these to a job-level or workflow-level `env:` prints them in EVERY step's
      # group, which is strictly worse - and a `${{ }}` read inside a `run:` body is printed too,
      # because the script is echoed with its expressions already resolved. There is no position in a
      # workflow from which a `vars` value can be masked ahead of its own first occurrence. The one
      # thing that closes it is making these two environment SECRETS rather than variables: the runner
      # adds every secret to the masker before the first step runs, so the dump would read `***`. That
      # is a forge change no file here can make and NO GATE HERE CAN SEE.
      #
      # The project id, by contrast, IS masked before its first occurrence, and the difference is the
      # lesson: it never becomes an expression at all. Only the key's PATH goes through `env:` and
      # `python3` reads the value out of the file. It is read from the key rather than configured for
      # the reason the fixture reads it from the key - a service-account key names its own project, and
      # a second declaration is a second answer to *who pays*. `python3 -c` rather than a shell read,
      # so the value never becomes a shell word that could be logged by `set -x`.
      - name: Mask the resource names
        env:
          K: ${{ runner.temp }}/bq-key.json
          SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
          SUTURA_BQ_TABLE: ${{ vars.SUTURA_BQ_TABLE }}
        run: |
          set -eu
          python3 -c 'import json,os;print("::add-mask::" + json.load(open(os.environ["K"]))["project_id"])' \
            2>/dev/null || { echo "the key names no project_id" >&2; exit 1; }
          for name in SUTURA_BQ_DATASET SUTURA_BQ_TABLE; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "the bq-test environment defines no $name - it names a resource this leg has to be pointed at" >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "$(printenv "$name")"
          done
          echo "three resource names masked for the rest of this job"
        # `K` separately, so the credential path is an environment value rather than an interpolation.
        # Same rule the rest of this file follows: no `${{ }}` reaches a shell body.

      # `nix run .#bigquery-acceptance` and not a check: `checks.*` run in the nix sandbox, which has
      # no network. `check-workflows` verifies that this output exists.
      #
      # The dataset and the table come from `vars`, which are not secrets and are also not written into
      # this repository - the values name a project's resources and belong in the environment. The
      # BILLING PROJECT comes from the key's own `project_id`, so there is no third variable to get
      # wrong. All three fail loudly when unset rather than skipping, because reaching this step is
      # already a statement of intent.
      - name: Acceptance leg
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bq-key.json
          SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
          SUTURA_BQ_TABLE: ${{ vars.SUTURA_BQ_TABLE }}
        run: |
          set -eu
          nix run .#bigquery-acceptance -- --no-capture

      # Always, so a cancelled or failed run does not leave a key on a runner that some other job on
      # the same machine could read.
      - name: Remove the credential
        if: always()
        run: |
          set -eu
          rm -f "$RUNNER_TEMP/bq-key.json"

  # THE CATEGORY AGGREGATOR, and the second required context beside `ci` (owner-held ruleset edit).
  # It performs no build and no test; it reads every category-gated leg's result and fails when a
  # leg that should have run was skipped. A required check that never RUNS stays Pending forever
  # and wedges the merge queue - the same failure `ci`'s own event handling documents - so a leg
  # may be green BY SKIP only when the diff did not select its category. A buggy filter that
  # silently skips an affected adapter leaves the category selected while its leg reports skipped,
  # and this job is what turns that green shape red.
  #
  # Legs and their categories: `ci` is always required; `bigquery-acceptance` is
  # `data_source_bigquery`. `core` (a shared or unmapped path) subsumes every category because the
  # category outputs are emitted as `core || selected`, so a `core` diff requires every leg to run
  # and forbids every allowed skip.
  #
  # Two event exceptions are deliberate and match the jobs' own `if:`. A fork pull request cannot
  # reach the `bq-test` environment secret, and the merge queue never runs `bigquery-acceptance`
  # (its trigger excludes `merge_group`); in both the leg is skipped not by a filter bug but by the
  # event, so the aggregator does not require it there. On every in-repo pull request and push it
  # is held to the run-or-fail rule above.
  #
  # `ubuntu-latest`, WHICH IS WHAT `.github/actionlint.yaml` ALREADY DECLARES FOR A JOB LIKE THIS:
  # a larger runner where Rust is compiled, `ubuntu-latest` where nothing is. This job checks out
  # nothing, installs nothing, builds nothing and runs one bash step over its two `needs` results -
  # measured at 2-5 s over the last 14 `main` runs that reached it - so a larger host was paying
  # for a string comparison. What it can and cannot say about the LABEL: an org runner group has to
  # serve this repository for `rust-mcp-32core` to resolve at all, which is a permission on the
  # GitHub side that no gate here can read (`.github/actionlint.yaml` says so of its own list), and
  # the workflows that still name it prove it is served today - so this is a cost move, not a
  # reachability fix. The
  # reported CONTEXT does not move: `devco/required-contexts` names it, and a context is a job's
  # `name:` where it has one and otherwise its id, neither of which `runs-on` touches.
  ci-aggregate:
    runs-on: ubuntu-latest
    needs: [ci, bigquery-acceptance]
    # Never category-skipped and never suppressed by an upstream failure: it reads the results.
    if: ${{ !cancelled() }}
    steps:
      - name: Aggregate the category-gated legs
        env:
          CI_RESULT: ${{ needs.ci.result }}
          BQ_RESULT: ${{ needs.bigquery-acceptance.result }}
          BQ_SELECTED: ${{ needs.ci.outputs.data_source_bigquery }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          fail() { echo "ci-aggregate: RED - $*"; exit 1; }
          # `ci` is normally the always-required base context. It is skipped in EXACTLY one
          # situation: the release commit, whose `chore(release):` message skips the whole belt
          # below `ci` (see `ci`'s own `if`, top of the file). That skip propagates to every leg
          # that `needs: [ci]` here - bigquery-acceptance included - so a skipped `ci` means the
          # release belt intentionally skipped together, and the aggregate is validly green.
          # Every other non-`success` `ci` is a real failure, and the bigquery check below is
          # untouched: a selected-but-skipped leg still fails, whatever `ci` reported.
          if [ "$CI_RESULT" != "success" ] && [ "$CI_RESULT" != "skipped" ]; then
            fail "ci reported '$CI_RESULT'"
          fi
          # Whether this event can physically run bigquery-acceptance: an in-repo PR or a push
          # (which carries the secret); a fork PR and the merge queue cannot, so a skip there is
          # the event, not a filter bug.
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "pull_request" ] && [ "$PR_HEAD" = "$REPO" ]; }; then
            can_run_bq=true
          else
            can_run_bq=false
          fi
          if [ "$BQ_SELECTED" = "true" ] && [ "$can_run_bq" = "true" ]; then
            if [ "$BQ_RESULT" != "success" ]; then
              fail "bigquery-acceptance must run (BigQuery category selected) but reported '$BQ_RESULT'"
            fi
          else
            case "$BQ_RESULT" in
              skipped|success) ;;
              *) fail "bigquery-acceptance reported '$BQ_RESULT' and was neither required to run nor allowed to skip" ;;
            esac
          fi
          echo "ci-aggregate: ok - every category-gated leg green"

  # `needs: [ci]` keeps the file's stated order - classify, gates, tests, then build - so a
  # tree that fails clippy does not spend four runners proving it also links.
  #
  # THE BODY IS `.github/workflows/cross-link.yml`, and only the gating is here. That file's header
  # carries what the job proves, why it is a matrix, and why this job was the one lifted out when
  # this file reached the 1000-line cap.
  cross:
    needs: [ci]
    # Same `== 'true'` test the main-only steps use, against the classification `ci` published.
    #
    # THE EVENT, NOT THE REF. A merge-queue entry arrives on
    # `refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>` and would build the full set a SECOND
    # time, over the pull request's own commits rebased onto the base - a tree the merge itself
    # will produce, not one a link check gates. So the condition names the events this job serves
    # instead of the refs it does not: a ref shape nobody has seen cannot make it wrong.
    #
    # THE TWO EVENTS, AND THE MATRIX DIFFERS BY THEM. `pull_request` runs the aarch64 pair (the
    # cross surface the native job never compiles); a push runs ALL FOUR targets - the all-4 link
    # gate AND the binary-cache-priming run every PR restores from. The `push` branch is safe:
    # `ci.yml`'s `on.push` is `branches: [main]`. `cross-link.yml` reads the caller's
    # `github.event_name` (a called workflow's `github` context reflects the CALLER's event, not
    # `workflow_call`) to select the same two-vs-four split.
    if: needs.ci.outputs.build == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
    # No `permissions:` block: a caller cannot grant a called workflow more than it holds, so
    # omitting it leaves this workflow's own `contents: read`, which is what the job declared.
    uses: ./.github/workflows/cross-link.yml
