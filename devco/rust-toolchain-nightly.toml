# The NIGHTLY pin. The local inner loop, plus ONE narrow use in CI. Never a shipped artifact.
#
# Why a second toolchain at all: cranelift is a rustc codegen backend that cuts debug codegen
# time substantially, and it is nightly-only. The instructions in Cargo.toml told a developer
# to switch `profile.dev.codegen-backend` to cranelift, which could not work - the pinned
# toolchain is stable 1.98.0, where `-Zcodegen-backend` does not exist.
#
# Why a FILE rather than a version string in a .nix: this is resolved exactly like
# rust-toolchain.toml, by `rust-bin.fromRustupToolchainFile` in nix/toolchains.nix. Same
# mechanism, one code path, and `rustup` honours it directly - so a developer without nix can
# `rustup toolchain install` from it instead of reading a nix expression.
#
# A DATE, not `nightly`: an unpinned channel means two developers get different compilers and
# a cranelift regression is unattributable. Bump it deliberately, in its own commit.
#
# CI DOES read this file, in exactly one place, and it is worth being precise because this header
# used to deny it. `checks.api-docs` runs `cargo rustdoc --output-format json`, which is unstable
# and has no stable equivalent - stable's `rustdoc --help` offers `[html]` and nothing else. So the
# pages are generated by nightly and COMMITTED, which is what lets the docs site build on stable.
#
# What that use is NOT: nightly builds no artifact any gate reads. The `xtask` binary driving the
# check is compiled by rust-toolchain.toml on the same `ci` closure the other six checks reuse, and
# nightly is a command prefix around the `cargo rustdoc` child alone, with its own
# CARGO_TARGET_DIR so the two channels never share artifacts. It does compile that child's inputs -
# third-party crates, and a few first-party libs as path dependencies of the ones being documented -
# mostly as rmeta. None of it is linted, tested, linked or shipped.
#
# Stable is the authority for everything else: rust-toolchain.toml. See the canonical-sources table
# in AGENTS.md, which states the same split.
[toolchain]
channel = "nightly-2026-09-08"
# rustc-codegen-cranelift-preview is the whole reason this file exists. The rest match
# rust-toolchain.toml so the inner loop has the same tools, plus the two that wire the
# LANGUAGE SERVER to this same pin: rust-analyzer (the binary, first on PATH in the dev
# shell) and rust-src (the standard library, so go-to-definition reaches std). Neither is
# in rust-toolchain.toml, which is why this file is the place for them.
# `llvm-tools-preview` is here for cargo-llvm-cov, which the CRAP gate (`cargo xtask crap`)
# needs to take a coverage measurement: it was present in the old stable toolchain this pin
# replaced and was dropped in the nightly unification, which broke `cargo xtask crap` with
# "failed to find llvm-tools-preview".
components = ["rustfmt", "clippy", "rust-std", "llvm-tools-preview", "rustc-codegen-cranelift-preview", "rust-analyzer", "rust-src"]
profile = "minimal"
