[package]
name = "sutura-catalog-rdbms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "A SemanticCatalog adapter over an RDBMS dictionary: the narrowest declaration."

[dependencies]
sutura-domain = { workspace = true }
thiserror = { workspace = true }
# The LIVE Postgres dictionary reader (`src/postgres_reader.rs`), behind the default-off `live`
# feature for the ARTEFACT reason `sutura/crate-map` states: a networked adapter's outbound TLS
# stack must not reach a build that did not ask for it. The library closure stays domain + thiserror;
# everything here arrives with that feature and with nothing else. The reader dials through the
# shared connector `sutura-adbc-postgres` (`telekom/sutura#913` stage 3), binds through
# `sutura-adbc`'s parameter batch, and decodes the Arrow batches the driver returns.
sutura-adbc-postgres = { workspace = true, optional = true }
sutura-adbc = { workspace = true, optional = true }
adbc_core = { version = "0.24", optional = true }
arrow-array = { workspace = true, optional = true }
# The LIVE Oracle dictionary reader (`src/oracle_reader.rs`), behind its own `live-oracle` feature.
# Oracle's own pure-Rust driver; it takes `rustls` with its default features, `aws-lc-rs` among
# them - the hazard `clippy.toml`'s rustls rows ban the auto-detecting builders for.
oracledb = { workspace = true, optional = true }

[features]
# The live Postgres dictionary reader. Default-off: a build that does not ask for it links no
# ADBC/`rustls` stack. `sutura-cli`'s `rdbms` feature turns this on and composes the reader, and
# `nix/shipped.nix` ships that feature.
live = [
  "dep:sutura-adbc-postgres",
  "dep:sutura-adbc",
  "dep:adbc_core",
  "dep:arrow-array",
]
# The live Oracle dictionary reader, on top of `live`. `sutura-cli`'s `oracle` feature turns this
# on, which is the only way `oracledb` enters a build that links this crate.
live-oracle = ["live", "dep:oracledb"]

[dev-dependencies]
# The compiler: the acceptance suite proves a dictionary bundle answers no certified question
# because no metric is defined, which requires `sutura-semantic::compile` to reach `MetricUnknown`.
# Dev-only, so the library closure stays domain + thiserror.
sutura-semantic = { workspace = true }
# The provisioned-tier reach and skip-or-fail direction for `tests/provisioned.rs` - the same
# crate every tier-backed fixture in this workspace uses (`sutura/dev`), scoped to `sutura-domain`.
sutura-dev = { workspace = true }
# `tests/provisioned.rs` exercises the live reader against a real Postgres tier, so it only builds
# (and only the `--all-features` gates reach it) with the `live` feature that links the reader.
[[test]]
name = "provisioned"
required-features = ["live"]

[[test]]
name = "oracle_provisioned"
required-features = ["live-oracle"]

[lints]
workspace = true
