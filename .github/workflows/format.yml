name: format
run-name: Oracle metadata describe ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact frozen source commit
        type: string
        required: true
      source_tree:
        description: Exact frozen source tree
        type: string
        required: true
      comparison_sha:
        description: Exact comparison commit
        type: string
        required: true
      request_id:
        description: Unique proof request UUID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: oracle-describe-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: rust-mcp-16core
    timeout-minutes: 120
    env:
      SUTURA_DOCKER_PROBE_TIMEOUT_SECS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci
      - name: Prove exact-source Oracle metadata describe
        working-directory: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          COMPARISON_SHA: ${{ inputs.comparison_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND
          export CARGO_TERM_COLOR=never NO_COLOR=1
          nix shell --inputs-from . nixpkgs#python3 --command python3 -I ../devco/oracle_describe_proof.py
      - name: Keep failed and restored evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-describe-proof-${{ inputs.request_id }}-${{ github.run_id }}
          path: source/target/oracle-describe-proof/
          if-no-files-found: error
          retention-days: 14
