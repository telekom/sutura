---
# Source: sutura/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-release-config
  labels:
    app.kubernetes.io/name: sutura
    helm.sh/chart: sutura-0.1.0
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
data:
  base.yaml: |
    sources:
      warehouse:
        acknowledged_because: a single analytics project this deployment owns
        billing_project: sutura-analytics
        credential_file: /etc/sutura/sources/warehouse/credential.json
        dataset: metrics
        kind: bigquery
        posture: shared-service-user
  production.yaml: |
    {}

---
# Source: sutura/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: test-release
  labels:
    app.kubernetes.io/name: sutura
