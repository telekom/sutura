# The only release entry point. An approved dispatch on main derives the next version, writes the
# changelog into that version's commit, and pushes the commit and its tag through the narrow release
# App. The tag starts release.yml and docs.yml against that exact commit.
name: version-bump

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: rust-mcp-32core
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - name: Refuse to run outside main
        env:
          REF: ${{ github.ref }}
        run: |
          set -eu
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::version-bump only runs on main; got $REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            fallback = true

      - name: Refuse a stale dispatch
        # Checkout persists no credential. This command-scoped helper answers Git's one HTTPS
        # challenge without putting the token in the URL or the repository configuration.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          credential_helper="!f() { printf '%s\n' 'username=x-access-token' \"password=\$GITHUB_TOKEN\"; }; f"
          git -c credential.helper="$credential_helper" fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main moved after this dispatch started; dispatch the workflow again"
            exit 1
          fi

      - name: Compute the next version
        id: next
        run: |
          set -eu
          next_raw="$(nix run .#git-cliff -- --bumped-version 2>/dev/null || true)"
          prev_raw="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          next="v${next_raw#v}"
          prev="v${prev_raw#v}"
          echo "previous: ${prev_raw:-none}"
          echo "next:     ${next_raw:-none}"
          if [ -z "$next_raw" ] || [ "$next" = "$prev" ]; then
            echo "no version change: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the release changelog
        if: steps.next.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: nix run .#git-cliff -- --tag "$VERSION" -o CHANGELOG.md

      - name: Mint the release App's token
        id: app-token
        if: steps.next.outputs.release == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Set the workspace version
        if: steps.next.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -eu
          plain="${VERSION#v}"
          count="$(grep -c '^version = ' Cargo.toml)"
          if [ "$count" != "1" ]; then
            echo "::error::expected one workspace version line in Cargo.toml, found $count"
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"${plain}\"/" Cargo.toml
          nix run .#cargo -- update --workspace

      - name: Commit and tag
        if: steps.next.outputs.release == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -eu
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "::error::the release App minted no token; nothing was pushed"
            exit 1
          fi
          if ! curl -sfS \
                 -H "Authorization: Bearer ${APP_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 https://api.github.com/installation/repositories \
               | grep -q "\"full_name\"[[:space:]]*:[[:space:]]*\"${GITHUB_REPOSITORY}\""; then
            echo "::error::the minted token is not an installation token for ${GITHUB_REPOSITORY}"
            exit 1
          fi
          release_remote="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "chore(release): ${VERSION}"
          git tag -a "$VERSION" -m "$VERSION"
          # One transaction: a ruleset refusal or a concurrent main update leaves neither a
          # release commit without its tag nor a tag whose commit main does not contain.
          git push --atomic "$release_remote" HEAD:main "$VERSION"
