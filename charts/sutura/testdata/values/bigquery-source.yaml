# A non-trivial `config.base` - a declared `bigquery` source (`SourceKind::BigQuery`) -
# rendered verbatim into the ConfigMap this chart mounts (`toYaml .Values.config.base`, parsed
# by nothing here). `sources.<alias>.password_file` has no dedicated chart value on purpose
# (see the chart README); `extraVolumeMounts` is where a source's Secret would land in a real
# deployment, omitted here to keep this golden about the source declaration.
#
# `crates/sutura-config/tests/chart_renders.rs` loads this render as settings, so the source
# declares every key `kind: bigquery` requires.
environment: production
security:
  accessToken:
    secretName: sutura-access-token
  metricsToken:
    secretName: sutura-metrics-token
  tlsTermination: ingress
config:
  base:
    security:
      identity: single-user
      single_user_because: "a test deployment one operator runs with their own credentials"
    sources:
      warehouse:
        kind: bigquery
        billing:
          service_account_project: sutura-analytics
        max_bytes_billed: 1073741824
        posture: shared-service-user
        acknowledged_because: "a single analytics project this deployment owns"
