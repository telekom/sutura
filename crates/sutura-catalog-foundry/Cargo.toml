[package]
name = "sutura-catalog-foundry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "EXPERIMENTAL: a SemanticCatalog adapter over a Palantir Foundry ontology's v2 metadata API - a declaring source, tested against synthetic public-reference fixtures only."

[features]
# Off by default for `sutura-catalog-cube`'s reason: what arrives with it is an outbound TLS stack,
# and no published binary links one it did not ask for.
http = ["dep:ureq", "dep:sutura-tls", "dep:sutura-http-client"]

[dependencies]
sutura-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true, optional = true }
sutura-tls = { workspace = true, optional = true }
sutura-http-client = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
# The loopback fake server `tests/http_reader.rs` answers the reader with.
sutura-http-client = { workspace = true, features = ["test"] }
