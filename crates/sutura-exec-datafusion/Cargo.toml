[package]
name = "sutura-exec-datafusion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "A Warehouse adapter that executes a plan in process with DataFusion, generating no SQL."

[dependencies]
sutura-domain = { workspace = true }
# NOT `sutura-semantic`, and that absence is the whole crate. The sibling DuckDB adapter depends on
# the compiler for its last stage because it speaks SQL; this one executes the plan directly, so
# there is no dialect to render for, no identifier to quote and no placeholder to position.
datafusion = { workspace = true }
# The optimizer rule that cuts a `run_sql` statement into one part per source, and the provider each
# source gives it. Without its `sql`, whose executor would run a part itself: a part here runs through
# the application's raw port instead.
datafusion-federation = { workspace = true }
# The engine `distributed` plans a combine's stages across nodes with, and the type it names a node by.
# Without its default `sql`, which would turn on `datafusion/sql`, kept out by the workspace's entry.
# `parquet` because `datafusion` has it: the engine's error codec matches every `DataFusionError`
# variant, and without its own `parquet` it misses the one that feature adds and does not compile. It
# turns on `datafusion/unicode_expressions` wherever it is compiled. VENDORED: the published 4.0.0 plus
# the call authorization hook the task grant is asked through; `VENDOR.md` says when it goes back.
datafusion-distributed = { path = "../../vendor/datafusion-distributed", version = "4.0.0", default-features = false, features = [
  "grpc",
  "parquet",
], optional = true }
url = { workspace = true, optional = true }
# The links between nodes, each dialled over mutual TLS on the workspace's own rustls over ring, the
# way `sutura-exec-node` dials, so the gRPC client turns on no TLS feature. Every one is already in the
# graph through `datafusion-distributed` or the Flight transports; `async-trait` because the engine's
# channel trait is declared with it, and so is the federation planner trait `sql` implements.
async-trait = { version = "0.1", optional = true }
hyper-util = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tower = { workspace = true, optional = true, features = ["util"] }
# The connection error a link's status keeps as its cause when a node goes away under a call, which
# is how a lost node is told from a failed one. Already in the graph through `tonic`.
h2 = { version = "0.4", optional = true }
# The task grant every call to a worker carries: a key drawn for each question and an HMAC under it
# on the ring rustls already runs on. Both are already in the lock.
getrandom = { version = "0.4", optional = true }
ring = { version = "0.17", optional = true }
# Where a `run_sql` statement's planner text goes instead of the caller's answer, which it would leak
# column names into.
tracing = { workspace = true, optional = true }
# One runtime, built once and kept beside the session context. See the struct.
#
# `rt-multi-thread` ADDS to the base `rt` the workspace entry asks for, and it is the whole of what
# lets `with_worker_threads` exist: `Builder::new_multi_thread` is not in the build without it.
# `time` is the other addition: `tokio::time::timeout` around `execute`'s `rows` future needs the
# feature compiled in as well as `enable_time()` on the runtime at construction, which is what
# stops a question at its deadline (`telekom/sutura#160`, `docs/adr/0029`). Still no `enable_all`,
# so still no I/O driver, which a plan over a local file does not need.
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
# `StreamExt::next` over `DataFrame::execute_stream`, so a result is charged against its byte budget
# one batch at a time instead of being collected first. Already in the graph through `datafusion`,
# and it was already a DEV-dependency here for the deadline test's hand-rolled `PartitionStream`.
futures-util = { workspace = true }
thiserror = { workspace = true }

# The conformance packs, which `tests/conformance.rs` binds this engine to. A DEV-dependency, for
# the reason the sibling adapter's manifest gives.
[dev-dependencies]
sutura-conformance = { workspace = true }
# `sutura_dev::tolerance`: the deadline tests' wall-clock margin widens on a shared dev machine and
# stays CI's own strict number everywhere else. Already in the graph via `sutura-exec-postgres`'s
# own dev-dependencies, so this is a new edge, not a new crate.
sutura-dev = { workspace = true }
# Writing the compressed CSVs `src/attach/tests.rs` reads back through the `compression` feature. A
# test WRITES compressed bytes and this crate never does, which is why these are dev-only; the
# workspace declaration records that both were already in `Cargo.lock`.
flate2 = { workspace = true }
bzip2 = { workspace = true }
# The localhost nodes `combine::tests::across` serves a worker on, and the layer that counts what
# each one is sent. `tonic` is already a dependency of the workspace's Flight transports.
tonic = { workspace = true }
tokio = { workspace = true, features = ["net"] }
# The node authorities those nodes' certificates are signed by.
rcgen = { workspace = true }

[features]
fixtures = ["sutura-domain/fixtures"]
# Test-harness construction that observes the engine's operator-reservation pool. It is default-off
# because no shipped binary reads a live reservation; `sutura-app` enables it only as a dev-dependency.
measurement = []
# A combine whose stages above a repartition run on several nodes, `combine::across`. Default-off: no
# binary plans a combine across nodes yet. `tokio/net` for the runtime's I/O driver, which the links
# to the other nodes need, and `tokio/sync` for the lock their channels are kept under.
distributed = [
  "dep:datafusion-distributed",
  "dep:url",
  "dep:async-trait",
  "dep:hyper-util",
  "dep:tokio-rustls",
  "dep:tonic",
  "dep:tower",
  "dep:h2",
  "dep:getrandom",
  "dep:ring",
  "tokio/net",
  "tokio/sync",
]
# DataFusion's SQL frontend and unparser, for `tools.run_sql` over its listed sources.
# Default-off, and `just check-default-features` refuses `sqlparser` or `datafusion-sql` in a
# shipped default build's resolved tree. `datafusion-distributed?/sql` for `parquet`'s reason above:
# its error codec matches every `DataFusionError` variant, and `datafusion/sql` adds one.
sql = ["datafusion/sql", "datafusion-distributed?/sql", "dep:async-trait", "dep:tracing"]

[[test]]
name = "conformance"
required-features = ["fixtures"]

[lints]
workspace = true
