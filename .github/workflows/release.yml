# Publish on a tag: four cross-built binaries and four container images. Both kinds, because a
# binary is what you drop on a host and an image is what a platform schedules.
#
# Four of each: glibc and musl on x86_64 and aarch64. The musl pair is statically linked, which
# is what makes it runnable on a host older than the builder and inside an image holding no libc
# at all - and the reason the allocator is replaced, since musl's own serialises every thread on
# one lock (see `crates/sutura-cli/src/main.rs`).
#
# One job, so nothing has to be handed between jobs. Actions pinned by commit.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing broad at the workflow level: a default grant applies to every job the file gains.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # create the release, upload assets
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent: with it, a pull request could add a substituter and a trusted key and have
          # CI fetch attacker-built store paths whose signature verifies. Anything CI needs
          # goes here, where the workflow diff shows it.
          extra_nix_config: |
            fallback = true

      # No shared cache on the release path, deliberately: zizmor flags cache poisoning,
      # and a published binary must not be built from a cache a PR run could have written
      # to. ci.yml keeps the cache, where the win is real and nothing is published.

      # A release must not ship what the gates never saw. These reuse one cargoArtifacts.
      - name: Gates
        run: |
          set -eu
          nix build .#checks.x86_64-linux.hygiene -L
          nix build .#checks.x86_64-linux.fmt -L
          nix build .#checks.x86_64-linux.clippy -L
          nix run .#deny
          nix build .#checks.x86_64-linux.nextest -L
          nix build .#checks.x86_64-linux.doctest -L
          nix build .#checks.x86_64-linux.one-binary -L

      # `release`, not `release-performance`: the default shipped profile is the cheap one.
      # release-performance.yml builds the other, on request.
      #
      # FOUR targets: glibc and musl, on each architecture. The musl pair is what runs on a host
      # whose glibc is older than the builder's, and in an image that carries no libc at all.
      # Its static-linking claim is ASSERTED here rather than described, because a musl target
      # that quietly linked dynamically would still build, still run on this runner, and fail
      # only on the machine the artifact exists for.
      - name: Build and package
        run: |
          set -eu
          mkdir -p dist stage
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            nix build ".#sutura-${target}" -L -o "result-${target}"
            described="$(file -b "result-${target}/bin/sutura")"
            echo "${target}: ${described}"
            case "$target" in
              *-musl)
                # `file` says "statically linked" for a plain static ELF and "static-pie linked"
                # for a static position-independent one. Both are static and neither carries a
                # PT_INTERP; which one you get is a rustc target-spec detail, so accept either
                # and reject anything that names an interpreter.
                case "$described" in
                  *"statically linked"*|*"static-pie linked"*) ;;
                  *) echo "::error::${target} is not statically linked: ${described}"; exit 1 ;;
                esac
                ;;
            esac
            install -m755 "result-${target}/bin/sutura" stage/sutura
            tar -C stage -czf "dist/sutura-${target}.tar.gz" sutura
            ( cd dist && sha256sum "sutura-${target}.tar.gz" > "sutura-${target}.tar.gz.sha256" )
          done
          ls -l dist

      # Only from a tag, and only from a tag that looks like a release. Without this a
      # `workflow_dispatch` on any branch computed a tag from the branch name and moved
      # `:latest`, which is what consumers pull - unreviewed content, published.
      #
      # One image per binary, tagged with the RUST TRIPLE, so an image and a tarball from the
      # same run are traceable to each other. `:<version>` and `:latest` stay the x86_64 glibc
      # image, because that is what an unqualified `docker pull` has always meant here and a
      # release must not quietly change what it means.
      #
      # Not a manifest list, deliberately: `docker manifest create` needs all four pushed first
      # and adds a second failure mode to the step that publishes, while per-triple tags already
      # answer "which artifact am I running". A manifest list is its own change.
      - name: Images
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to publish from ref $GITHUB_REF_NAME"; exit 1 ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          : > dist/image-digests.txt
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            nix build ".#oci-${target}" -L -o "result-oci-${target}"
            # Every stream script loads as `sutura:latest`, so retag before the next iteration
            # takes that name away.
            "./result-oci-${target}" | docker load
            docker tag sutura:latest "${IMAGE}:${tag}-${target}"
            case "$target" in
              x86_64-*)
                # Only the x86_64 images can execute here. Running the arm64 pair would need
                # qemu-user-static registered on the runner, which this job deliberately does
                # not install: the step that publishes should not also gain an emulator.
                docker run --rm "${IMAGE}:${tag}-${target}" --version
                docker run --rm "${IMAGE}:${tag}-${target}" doctor
                # Prove the non-root default actually works rather than assuming it.
                docker run --rm --user 65532:65532 "${IMAGE}:${tag}-${target}" --version
                ;;
            esac
            docker push "${IMAGE}:${tag}-${target}"
            # The digest is the only durable answer to "which build is running". Recorded as a
            # release asset, because a checksum an uploader can also rewrite proves little.
            # Read AFTER the push: RepoDigests is empty until a registry has assigned one.
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${tag}-${target}" 2>/dev/null || true)"
            printf '%s %s\n' "$target" "${digest:-unknown}" >> dist/image-digests.txt
          done
          docker tag "${IMAGE}:${tag}-x86_64-unknown-linux-gnu" "${IMAGE}:${tag}"
          docker tag "${IMAGE}:${tag}-x86_64-unknown-linux-gnu" "${IMAGE}:latest"
          docker push "${IMAGE}:${tag}"
          docker push "${IMAGE}:latest"
          {
            echo "## Images"
            echo
            echo '```'
            cat dist/image-digests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io

      # `gh` is preinstalled. `--clobber` makes a re-run idempotent.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes --title "$tag"
          gh release upload "$tag" dist/* --clobber
