name: Native BigQuery qualifier mutation proof

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact frozen source commit
        type: string
        required: true
      source_tree:
        description: Exact tree of the frozen source commit
        type: string
        required: true
      comparison_sha:
        description: Exact ancestor for the finishing comparison
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: inbound-finishing-gates-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  bigquery-mutations:
    if: github.event_name == 'workflow_dispatch'
    runs-on: rust-mcp-16core
    timeout-minutes: 360
    environment: bq-test
    concurrency:
      group: bigquery-conformance-${{ vars.SUTURA_BQ_DATASET }}
      queue: max
      cancel-in-progress: false
    env:
      GIT_OPTIONAL_LOCKS: "0"
      SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
      SUTURA_BQ_REGION: ${{ vars.SUTURA_BQ_REGION }}
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the exact current source before provisioning
        working-directory: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          COMPARISON_SHA: ${{ inputs.comparison_sha }}
          HELPER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$HELPER_REF" == refs/heads/ci/native-discovery-trace-20261118-r1 ]]
          [[ "$SOURCE_SHA" == fd5d6ea23d014e70b6b542d82f1f472b3ddddd68 ]]
          [[ "$SOURCE_TREE" == 41904bfb5c4dc49bcaff0acfad952b46c30d4e6a ]]
          [[ "$COMPARISON_SHA" == abfd0bc5db39d405bbae2746b6ee1358b260414c ]]
          [[ "$(git --no-optional-locks rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(git --no-optional-locks rev-parse 'HEAD^{tree}')" == "$SOURCE_TREE" ]]
          [[ "$(git --no-optional-locks merge-base "$SOURCE_SHA" "$COMPARISON_SHA")" == "$COMPARISON_SHA" ]]
          [[ -z "$(git --no-optional-locks status --porcelain)" ]]
          printf '{"source_sha":"%s","source_tree":"%s","comparison_sha":"%s"}\n' "$SOURCE_SHA" "$SOURCE_TREE" "$COMPARISON_SHA" > "$RUNNER_TEMP/finishing-plan.json"

      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - uses: $/.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Place credential outside the checkout
        env:
          SUTURA_BQ_KEY: ${{ secrets.svc_suturua_bq_ci }}
        run: |
          set -eu
          if [ -z "${SUTURA_BQ_KEY:-}" ]; then
            echo "bq-test has no CI credential" >&2
            exit 1
          fi
          umask 077
          printenv SUTURA_BQ_KEY > "$RUNNER_TEMP/bq-key.json"
          chmod 600 "$RUNNER_TEMP/bq-key.json"
          printf 'GOOGLE_APPLICATION_CREDENTIALS=%s\n' "$RUNNER_TEMP/bq-key.json" >> "$GITHUB_ENV"
      # The project comes off the key, masked before it is exported, so it reaches the cells
      # without reaching the log.
      - name: Mask resource names and read the project off the key
        env:
          K: ${{ runner.temp }}/bq-key.json
          SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
        run: |
          set -eu
          project="$(python3 -c 'import json,os;print(json.load(open(os.environ["K"]))["project_id"])' 2>/dev/null)" \
            || { echo "the CI credential names no project_id" >&2; exit 1; }
          if [ -z "$project" ]; then
            echo "the CI credential names an empty project_id" >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$project"
          if [ -z "${SUTURA_BQ_DATASET:-}" ]; then
            echo "bq-test has no SUTURA_BQ_DATASET" >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$SUTURA_BQ_DATASET"
          printf 'SUTURA_BQ_PROJECT=%s\n' "$project" >> "$GITHUB_ENV"
      - name: Export the exact current BigQuery driver
        working-directory: source
        run: |
          set -euo pipefail
          driver="$(nix build --no-link --print-out-paths .#packages.x86_64-linux.adbc-driver-bigquery-x86_64-unknown-linux-gnu)"
          driver="$driver/lib/libadbc_driver_bigquery.so"
          [[ "$driver" == /nix/store/* && -f "$driver" ]]
          printf 'SUTURA_BIGQUERY_ADBC_DRIVER=%s\n' "$driver" >> "$GITHUB_ENV"

      - name: Load the exact source corpus once
        working-directory: source
        run: nix run .#bigquery-provision -- --no-capture

      - name: Run the existing whole-binary mutation proof
        working-directory: source
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND SUTURA_ONLY_SYSTEMS
          export CARGO_TERM_COLOR=never NO_COLOR=1
          : "${SUTURA_BQ_PROJECT:?}" "${SUTURA_BQ_DATASET:?}" "${SUTURA_BIGQUERY_ADBC_DRIVER:?}"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$SUTURA_BIGQUERY_ADBC_DRIVER"
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#just nixpkgs#pixi nixpkgs#devenv nixpkgs#betterleaks nixpkgs#strace --command python3 -I ../devco/inbound_verifier_proof.py sql-mutations "$RUNNER_TEMP/finishing-plan.json"

      - name: Remove credential
        if: always()
        run: rm -f "$RUNNER_TEMP/bq-key.json"

      - name: Retain native mutation evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sql-qualifier-bigquery-${{ github.run_id }}
          path: source/target/inbound-verifier-proof/
          if-no-files-found: error
          retention-days: 14
