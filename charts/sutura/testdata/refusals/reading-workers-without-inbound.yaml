# A reading worker group, a source it reads, and no `security.inbound.mode`: a lookup leg a reading
# worker reads is granted for a verified caller, so `sutura serve` refuses to start a node that names
# the group (`NotFitToServe::ReadingNodeWithoutInboundIdentity`).
environment: production
security:
  accessToken:
    secretName: sutura-access-token
  metricsToken:
    secretName: sutura-metrics-token
workerPool:
  enabled: true
  issuer:
    name: sutura-nodes
readingWorkers:
  groups:
    orders:
      sources: [orders]
      catalogs:
        - name: model
          kind: markdown
          dir: /srv/sutura/catalog
          data_dir: /srv/sutura/data
          version: "1"
config:
  base:
    security:
      identity: single-user
      single_user_because: "a test deployment one operator runs with their own credentials"
    sources:
      orders:
        kind: files
        data_dir: /srv/sutura/orders
        posture: shared-service-user
