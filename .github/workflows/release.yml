# Publish on a tag: four cross-built binaries and four container images. Both kinds, because a
# binary is what you drop on a host and an image is what a platform schedules.
#
# Four of each: glibc and musl on x86_64 and aarch64. The musl pair is statically linked, which
# is what makes it runnable on a host older than the builder and inside an image holding no libc
# at all - and the reason the allocator is replaced, since musl's own serialises every thread on
# one lock (see `crates/sutura-cli/src/main.rs`).
#
# THREE JOBS: `gates` once, `build` as a matrix over the four targets, `publish` last. This was
# a single job, on the argument that nothing then has to be handed between jobs. The handover
# is real work - two more actions and four artifacts - and it buys two things.
#
# Wall clock, first, and it is NOT cheaper. Four runners at 4 vCPU each is MORE total compute
# than one runner doing the same four builds in sequence, because on a cold cache every job
# builds its own dependency closure concurrently instead of reusing the previous target's. The
# matrix buys latency and pays for it in CPU. For a release, where the thing waiting is a
# person, that is the right trade - but it is a trade, not a free win.
#
# A token boundary, second, and that one is free. `gates` and `build` hold nothing beyond
# `contents: read`. `publish` is the only job that can write a release or push to GHCR, and it
# compiles nothing: it loads image tarballs, pushes bytes, and renders text. It never executes
# anything the build jobs produced, and it is the one job with no build cache attached.
#
# `publish` NOW HOLDS FOUR WRITE GRANTS rather than two, and that paragraph is worth re-reading
# rather than skimming, because the count changed and the property did not. `id-token: write`
# lets the job mint a short-lived OIDC token that says which workflow, at which ref, in which
# repository is asking - which is what Fulcio signs a certificate against and what makes a
# signature mean "this pipeline produced these bytes" instead of "somebody holding a key did".
# `attestations: write` is what stores the SLSA provenance. Neither can read the repository's
# secrets, neither can push code, and both are useless to an attacker who does not already
# control this workflow file - at which point they would change the source instead, which is the
# same argument the cache paragraph above makes.
#
# What did NOT change is the sentence that matters: this job still never executes anything the
# build jobs produced. `cosign` and the attestation action HASH bytes and sign digests; `docker
# load` and `docker push` move layers without running an entrypoint. The smoke tests stayed in
# `build`, under a token that can read the repository and nothing else.
#
# Actions pinned by commit.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing broad at the workflow level: a default grant applies to every job the file gains.
permissions:
  contents: read

# One release at a time per ref, and this is not hypothetical caution. version-bump.yml asks
# for this workflow BY NAME after it pushes the tag, because a push made with GITHUB_TOKEN
# does not start a workflow run - so the tag alone never triggered this file. If that
# suppression rule ever changes, the tag push and the dispatch would both start a run: two
# jobs cross-building the same four artifacts and racing to move `:latest`.
#
# `cancel-in-progress: false`, because cancelling a run mid-publish is exactly what leaves
# images pushed to ghcr.io with no release object naming them. Queueing is the safe order;
# every step below is idempotent, so the second run converges.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # A release must not ship what the gates never saw, and they run ONCE rather than per target:
  # they judge the source tree, which is the same tree for all four triples. Running them
  # inside the matrix would report the same verdict four times and pay for it four times.
  #
  # These reuse one cargoArtifacts, which is why the whole set is cheaper than it reads.
  #
  # Re-run here on the TAG rather than trusted from main, deliberately. Tag `v0.1.0` points at
  # a commit no branch contains, so CI never validated that tree at all: "main was green"
  # would have shipped something nothing had ever checked.
  gates:
    runs-on: rust-mcp
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before nix installs: /nix/store is what fills. See
      # `.github/actions/reclaim-disk` for why this is local and why it cannot
      # affect the Nix cache.
      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent: with it, a pull request could add a substituter and a trusted key and have
          # CI fetch attacker-built store paths whose signature verifies. Anything CI needs
          # goes here, where the workflow diff shows it.
          extra_nix_config: |
            fallback = true

      # Carries /nix/store between runs. The same action at the same commit as ci.yml, copied
      # rather than written, so the two paths cannot drift into caching differently.
      #
      # This step used to be ABSENT here, deliberately, on the argument that a published binary
      # must not be built from a cache a pull request could have written to. That threat is not
      # reachable, and GitHub's own documentation is what settles it. The Actions cache is
      # scoped by ref - "Access restrictions provide cache isolation and security by creating a
      # logical boundary between different branches or tags" - a run can restore only from its
      # own ref and from the default branch, and a cache written by a pull request "is created
      # for the merge ref (refs/pull/.../merge)" and therefore "can only be restored by re-runs
      # of the pull request". A tag build reads its own tag's scope and main's. Nothing a pull
      # request wrote is in either of them.
      #
      # What remains is an attacker who can push to the default branch, and that attacker
      # changes the source instead: it is the shorter path to the same poisoned artifact, and no
      # cache setting closes it. So refusing the cache bought nothing, and cost every release a
      # cold rebuild of the entire dependency closure.
      #
      # Written out rather than quietly switched on, because the wrong version of this argument
      # is the intuitive one, and somebody will otherwise "re-harden" the release path by
      # deleting this line again.
      #
      # zizmor still reports `cache-poisoning` here, at its own stated confidence of Low, and it
      # is not wrong to: the audit fires on `on.push.tags` plus a cache-aware action, and has no
      # way to reason about ref scoping or about which job holds a write token. So it is
      # suppressed INLINE, per step, carrying the argument above - not turned off in a config
      # file, and not for any other audit. Its own output says `2 ignored`, so the suppression is
      # visible in every run rather than silent. Note the `# v14` pin has to share this one
      # comment with the directive: zizmor only honours an ignore comment that begins with
      # `zizmor:` and sits on the flagged line itself.
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # zizmor: ignore[cache-poisoning] v14 - not reachable, see above

      - name: Gates
        run: |
          set -eu
          nix build .#checks.x86_64-linux.hygiene -L
          nix build .#checks.x86_64-linux.fmt -L
          nix build .#checks.x86_64-linux.clippy -L
          nix run .#deny
          nix build .#checks.x86_64-linux.nextest -L
          nix build .#checks.x86_64-linux.doctest -L
          nix build .#checks.x86_64-linux.one-binary -L

  # `release`, not `release-performance`: the default shipped profile is the cheap one.
  # release-performance.yml builds the other, on request.
  #
  # FOUR targets, one job each: glibc and musl, on each architecture. The musl pair is what
  # runs on a host whose glibc is older than the builder's, and in an image that carries no
  # libc at all.
  #
  # NO write permissions, which is the point of having this job separate at all. Everything
  # that compiles happens here, under a token that can read the repository and nothing else.
  build:
    needs: [gates]
    runs-on: rust-mcp
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      # `fail-fast: false`, though nothing publishes unless all four succeed. Cancelling the
      # other three on the first failure discards work that was nearly done AND denies the
      # cache the store paths those jobs had already built, so the re-run starts colder. Since
      # a re-run has to redo the whole matrix either way, the information is worth more than
      # the saved minutes: one red job tells you which target is broken, four tell you whether
      # it is the target or the tree.
      fail-fast: false
      matrix:
        # Must stay in step with `TARGETS` in `publish`. It is not derived from it, because a
        # matrix takes literals; instead `publish` asserts that exactly these four arrived, so
        # a drift fails loudly rather than publishing three binaries.
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before nix installs: /nix/store is what fills. See
      # `.github/actions/reclaim-disk` for why this is local and why it cannot
      # affect the Nix cache.
      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # As in `gates`: settings that matter are written here, not read out of flake.nix.
          extra_nix_config: |
            fallback = true

      # The same cache as `gates`, for the reason spelled out there. Within one run this also
      # picks up what `gates` just built, since both jobs read and write the same ref's scope.
      # Same inline suppression as there, for the same reason.
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # zizmor: ignore[cache-poisoning] v14 - not reachable, see above

      # The static-linking claim is ASSERTED here rather than described, because a musl target
      # that quietly linked dynamically would still build, still run on this runner, and fail
      # only on the machine the artifact exists for.
      - name: Binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          mkdir -p dist stage facts
          nix build ".#sutura-${TARGET}" -L -o "result-${TARGET}"
          described="$(file -b "result-${TARGET}/bin/sutura")"
          echo "${TARGET}: ${described}"
          case "$TARGET" in
            *-musl)
              # `file` says "statically linked" for a plain static ELF and "static-pie linked"
              # for a static position-independent one. Both are static and neither carries a
              # PT_INTERP; which one you get is a rustc target-spec detail, so accept either
              # and reject anything that names an interpreter.
              case "$described" in
                *"statically linked"*|*"static-pie linked"*) ;;
                *) echo "::error::${TARGET} is not statically linked: ${described}"; exit 1 ;;
              esac
              ;;
          esac
          # The linkage the notes report is the OBSERVED property, read out of the same `file`
          # output the musl assertion above rejects on - not derived from the target name. A
          # target named musl whose bytes were dynamic would already have failed that
          # assertion; taking the label from `file` keeps the notes describing the artifact
          # rather than the intent.
          case "$described" in
            *"statically linked"*|*"static-pie linked"*) linkage="static, no libc" ;;
            *) linkage="dynamic (glibc)" ;;
          esac
          install -m755 "result-${TARGET}/bin/sutura" stage/sutura
          tar -C stage -czf "dist/sutura-${TARGET}.tar.gz" sutura
          ( cd dist && sha256sum "sutura-${TARGET}.tar.gz" > "sutura-${TARGET}.tar.gz.sha256" )
          # Feeds the release notes, and lives OUTSIDE dist/ so it cannot become an asset
          # repeating what the notes already say. Written with `>` and not `>>`: on a re-run in
          # a warm workspace an append would report this target twice.
          printf '%s|%s\n' "$TARGET" "$linkage" > "facts/${TARGET}.txt"
          ls -l dist

      # Built and RUN here, pushed by `publish`. Building the image in the job that holds
      # `packages: write` was the alternative and it is worse in both directions: that job
      # would have to compile, and the smoke tests below would be running image code under the
      # publishing token. This way the token-holding job only ever moves bytes it does not
      # execute.
      #
      # Unconditional, including on a `workflow_dispatch` from a branch where nothing will be
      # published. A dry run that builds and runs all four images is the point of having one.
      - name: Image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          mkdir -p dist images
          nix build ".#oci-${TARGET}" -L -o result-oci
          # Written to a file once and loaded from it, rather than streamed twice: the stream
          # script rebuilds and recompresses every layer each time it runs. The gzip is both
          # what `publish` downloads and what the musl asset below is, so it happens once here
          # rather than once per consumer.
          ./result-oci > oci.tar
          gzip -9 -c oci.tar > "images/sutura-oci-${TARGET}.tar.gz"
          docker load -i oci.tar
          rm -f oci.tar
          case "$TARGET" in
            x86_64-*)
              # Only the x86_64 images can execute here. Running the arm64 pair would need
              # qemu-user-static registered on the runner, which this job deliberately does
              # not install: a build step should not also gain an emulator.
              docker run --rm sutura:latest --version
              docker run --rm sutura:latest doctor
              # Prove the non-root default actually works rather than assuming it.
              docker run --rm --user 65532:65532 sutura:latest --version
              ;;
          esac
          # The musl pair is ALSO attached to the release as a loadable tarball; the glibc pair
          # is not. That asymmetry is deliberate and is stated in the notes so it cannot read
          # as an omission.
          #
          # Measured, not assumed: the musl image is 4.7 MiB of tar and 1.0 MiB gzipped, the
          # glibc one 41 MiB and 13.2 MiB. So the glibc pair would add roughly 26 MiB to every
          # release, most of it a glibc layer identical from one release to the next - and a
          # release asset is not a registry: no shared layers, no digest addressing, no expiry,
          # so it would be re-shipped whole each time. The case for attaching any image at all
          # is the host that cannot reach ghcr.io, and that host is served by the static one
          # that carries no libc, at 1 MiB. For the glibc pair the published digest is the
          # pointer, which is what a registry-reachable consumer wants anyway.
          #
          # A copy rather than a move: `publish` loads every target out of images/, so all four
          # take one code path there, and the checksum describes the exact bytes of the asset.
          case "$TARGET" in
            *-musl)
              cp "images/sutura-oci-${TARGET}.tar.gz" "dist/sutura-oci-${TARGET}.tar.gz"
              ( cd dist && sha256sum "sutura-oci-${TARGET}.tar.gz" > "sutura-oci-${TARGET}.tar.gz.sha256" )
              ;;
          esac
          ls -l dist images

      # An SBOM of the IMAGE, per target, and what it does and does not describe is the whole
      # point of this comment.
      #
      # It reads the image TARBALL rather than the daemon or the registry, so what it inventories
      # is exactly the bytes `publish` pushes - not an image resolved by a tag that could have
      # moved between two steps. Decompressed to a scratch file rather than piped, because
      # `docker-archive:` seeks within the archive; the copy is transient and is deleted in the
      # same step, so peak disk is what the `Image` step above already reached.
      #
      # In `build` and not in `publish`, for the reason the header gives: this is compute, and the
      # job holding the write tokens compiles and inspects nothing.
      #
      # **WHAT IT COVERS.** The image's files - which is the binary, `cacert` and `tzdata`, since
      # there is no shell and no package manager in there - AND the crate graph the binary was
      # compiled from, because `nix/auditable.nix` builds it with `cargo auditable` and `syft`
      # reads that ELF section back out with its `cargo-auditable-binary-cataloger`.
      #
      # **THE SECOND HALF IS NOT READ OUT OF A LOCK FILE, AND THAT IS THE POINT.** A document
      # generated from `Cargo.lock` beside the binary is a CHECKED claim about it - the two can
      # drift and neither says so - and it would also be the WRONG graph: `sutura-cli` links the
      # engine only, while `libduckdb-sys` and the BigQuery wire put `ureq`, rustls and `ring` in
      # the resolve for a binary that links none of them. What is inventoried here is what the
      # compiler actually put in, from inside the bytes being scanned. `nix/auditable.nix` carries
      # the argument; `docs/adr/0021`'s amendment is the decision.
      #
      # Two formats, because they have different consumers rather than because more is better.
      # CycloneDX is what `cosign attest --type cyclonedx` carries into the registry and what the
      # licence-review toolchain reads; SPDX is what most ingestion pipelines take. Both are
      # generated from one scan, so they cannot disagree.
      #
      # ASSERTED rather than described, like the static-linking and manifest-list claims either
      # side of it, and the assertion is now about CONTENT rather than about the file existing.
      # The failure this catches is specific and silent: if the embedded section stops being
      # produced - a crane bump that drops `cargoBuildCommand`, a `cargo-auditable` that changes
      # its wrapper - the scan still succeeds, still writes valid CycloneDX, and inventories three
      # files. Nothing downstream can tell that apart from a correct run, so the count and one
      # named crate are checked here.
      - name: SBOM
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          mkdir -p dist
          gzip -dc "images/sutura-oci-${TARGET}.tar.gz" > sbom-input.tar
          nix run .#syft -- scan "docker-archive:sbom-input.tar" \
            --source-name "sutura-${TARGET}" \
            --source-version "${GITHUB_REF_NAME}" \
            -o "cyclonedx-json=dist/sutura-oci-${TARGET}.cdx.json" \
            -o "spdx-json=dist/sutura-oci-${TARGET}.spdx.json"
          rm -f sbom-input.tar
          for sbom in "dist/sutura-oci-${TARGET}.cdx.json" "dist/sutura-oci-${TARGET}.spdx.json"; do
            if [ ! -s "$sbom" ]; then
              echo "::error::${sbom} was not written"
              exit 1
            fi
            # No jq: it is not a pinned tool here, and neither question needs a JSON parser.
            #
            # **`grep -o ... | wc -l`, NEVER `grep -c`.** `grep -c` counts matching LINES, and
            # syft writes JSON on ONE line - so it returns 1 for a document naming 241 packages
            # and 1 for a document naming none. This step shipped with `grep -c` and would have
            # failed every release; `ci.yml`'s cross job is what caught it, on the pull request,
            # which is the argument for that check existing at all.
            #
            # COUNTED PER FORMAT rather than through a shared key. `"name":` also appears in tool
            # blocks, properties and metadata, so it is a proxy rather than a count; CycloneDX
            # gives every component a `"bom-ref"` and SPDX gives every package an `"SPDXID"`, and
            # a two-line case buys an exact number.
            case "$sbom" in
              *.cdx.json) key='"bom-ref"' ;;
              *) key='"SPDXID"' ;;
            esac
            named="$(grep -o "$key" "$sbom" | wc -l)"
            # A FLOOR, not a fixed number. The exact count moves with every dependency bump, so
            # pinning it would make `just update` fail on a correct tree - and this check is not
            # about the count being right, it is about the embedded section being THERE. Without
            # it the answer is three files; with it, the engine alone brings DataFusion, Arrow and
            # tokio. MEASURED on 2026-08-31: 241 CycloneDX components and 242 SPDX ids, against
            # three files without the section - so 100 sits between the two by an order of
            # magnitude and a dropped adapter cannot trip it.
            if [ "${named:-0}" -lt 100 ]; then
              echo "::error::${sbom} names ${named} thing(s), expected at least 100 - the cargo auditable section is missing, so this inventories the image's files and not the crates the binary was built from"
              exit 1
            fi
            # AND the engine by name. The floor above would still pass on a document listing a
            # hundred of the wrong things; DataFusion is the one crate `sutura-cli` cannot ship
            # without, so its absence means the section describes something other than this binary.
            if ! grep -q '"datafusion"' "$sbom"; then
              echo "::error::${sbom} does not name datafusion, which the shipped binary links: this is not an inventory of the crates it was built from"
              exit 1
            fi
            printf '%s: %s named entries\n' "$sbom" "$named"
          done
          # NO `.sha256` sidecar, unlike the tarballs. The tarballs have one because they predate
          # anything better and a consumer's script may read it; an SBOM ships from the first
          # release that has signatures, and its Sigstore bundle already commits to its digest and
          # says who produced it. Adding a bare hash beside a signature is a weaker mechanism next
          # to a stronger one, and the failure mode is a reader checking the weak one.
          ls -l dist

      # The handover. `dist/` is release assets, `images/` is what `publish` pushes and never
      # ships, `facts/` is one line of prose for the notes.
      #
      # `compression-level: 0` because every file here is already gzipped, and zip would spend
      # CPU re-compressing compressed bytes for no gain. `if-no-files-found: error` because an
      # empty artifact would surface as a failure in `publish`, far from its cause.
      #
      # `retention-days: 7`: long enough that re-running only a failed `publish` days later
      # still finds its inputs, short enough that four images per release do not accumulate.
      - name: Hand the artifacts to publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/
            images/
            facts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The only job that can write anything, and the only one that builds nothing.
  #
  # Gated at the JOB level rather than per step, so on a branch dispatch the job holding the
  # write tokens never starts. The runtime check inside `Push the images` is still there and is
  # not redundant: `startsWith(github.ref, 'refs/tags/v')` accepts `v-nonsense`, and only a
  # `vN.N.N` tag may move `:latest`, which is what consumers pull.
  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: rust-mcp
    timeout-minutes: 60
    permissions:
      contents: write      # create the release, upload assets
      packages: write      # push to GHCR, and the signatures and attestations that sit beside it
      id-token: write      # mint the OIDC token Fulcio signs a certificate against
      attestations: write  # store the SLSA provenance against this repository
    env:
      # The four targets, in the order the release notes list them: the glibc pair first,
      # because an unqualified `docker pull` and an unqualified download both mean glibc here.
      # Read by more than one step, so it is job-level rather than repeated. Must stay in step
      # with `strategy.matrix.target` in `build`; `Check that all four builds arrived` is what
      # makes that a gate instead of a hope.
      TARGETS: >-
        x86_64-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        x86_64-unknown-linux-musl
        aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because git-cliff renders the change list out of it below.
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # As in `gates`: settings that matter are written here, not read out of flake.nix.
          extra_nix_config: |
            fallback = true

      # NO cache step here, and this time the absence really is deliberate. This job compiles
      # nothing: its only nix invocation is `nix run .#git-cliff`, which is substituted from
      # cache.nixos.org rather than built. So the job holding `contents: write` and
      # `packages: write` is also the one job that never touches the shared build cache - a
      # property that falls out of the split rather than one that had to be arranged.

      # Into the workspace root, so `dist/`, `images/` and `facts/` land exactly where the
      # steps below expect them: the same layout a single job would have produced. None of
      # those three names exists in the checkout, so nothing is overwritten, and nix ignores
      # untracked files, so the flake source is unaffected.
      - name: Collect what the matrix built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true

      # The failure mode the split introduces, gated before anything is published. A single job
      # could not lose a target; four jobs and an artifact round-trip can, and a release that
      # quietly shipped three binaries and a table one row short is exactly the kind of thing
      # nobody notices until a user does.
      - name: Check that all four builds arrived
        run: |
          set -eu
          missing=0
          want=0
          for target in $TARGETS; do
            want=$((want + 1))
            files="facts/${target}.txt images/sutura-oci-${target}.tar.gz"
            files="${files} dist/sutura-${target}.tar.gz dist/sutura-${target}.tar.gz.sha256"
            # Both SBOMs for EVERY target, not only the musl pair whose image tarball ships. The
            # asymmetry below is about a 26 MiB attachment nobody needs; an SBOM is kilobytes, and
            # the glibc pair is what an unqualified `docker pull` resolves - so it is the pair most
            # likely to be the one somebody has to inventory.
            files="${files} dist/sutura-oci-${target}.cdx.json dist/sutura-oci-${target}.spdx.json"
            case "$target" in
              *-musl)
                files="${files} dist/sutura-oci-${target}.tar.gz"
                files="${files} dist/sutura-oci-${target}.tar.gz.sha256"
                ;;
            esac
            for f in $files; do
              if [ ! -s "$f" ]; then
                echo "::error::${target}: ${f} is missing or empty"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          # And nothing EXTRA, which catches the drift in the other direction: a target added
          # to strategy.matrix.target and not to TARGETS would otherwise be built, paid for,
          # and silently dropped.
          have="$(find facts -type f -name '*.txt' | wc -l)"
          if [ "$have" -ne "$want" ]; then
            echo "::error::${have} target(s) arrived but this job expects ${want}: TARGETS here and strategy.matrix.target in 'build' have drifted apart"
            exit 1
          fi
          ls -l dist images facts

      # Only from a tag that looks like a release. Without this a `workflow_dispatch` on any
      # branch computed a tag from the branch name and moved `:latest`, which is what consumers
      # pull - unreviewed content, published.
      #
      # One image per binary, tagged with the RUST TRIPLE, so an image and a tarball from the
      # same run are traceable to each other. Those four leaf tags are what a deliberate pin
      # names, and they are what the two manifest lists below reference.
      #
      # TWO MANIFEST LISTS on top of them, each spanning linux/amd64 and linux/arm64:
      # `:<version>` / `:latest` for glibc, `:<version>-musl` / `:latest-musl` for the static
      # pair. This file used to say a manifest list was "its own change" and point `:<version>`
      # and `:latest` at the x86_64 glibc image with a plain `docker tag`. It was its own
      # change, and the first real release published the bug: an arm64 host running
      # `docker pull ghcr.io/telekom/sutura:latest` received an amd64 image, which either
      # refuses to start or is silently emulated. A single-architecture `:latest` is worse than
      # no `:latest`, because nothing in the name tells you which architecture you got.
      #
      # ORDERING IS LOAD-BEARING: `imagetools create` reads its inputs from the REGISTRY, so
      # every leaf has to be pushed before either list can be assembled. That is why the loop
      # completes before the two `create` calls, rather than a list being built per pair.
      #
      # glibc keeps the UNSUFFIXED tags, and size is not the reason. An unqualified
      # `docker pull` has always meant glibc here, and this change is already changing what
      # `:latest` resolves to architecturally - moving the libc under the same name in the same
      # release would be two silent changes wearing one tag. musl also resolves DNS differently
      # enough from glibc that it should be the thing somebody asks for by name rather than the
      # thing they get by typing nothing. The 1 MiB-against-13 MiB argument is real and it
      # belongs to whoever types `-musl`.
      - name: Push the images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to publish from ref $GITHUB_REF_NAME"; exit 1 ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # kind, name, pinnable reference. Two kinds because they answer different questions:
          # a `list` is what a plain `docker pull` resolves and what a consumer should pin; a
          # `leaf` is one architecture, for pinning to one deliberately. A reader who pins a
          # leaf digest thinking it is the image has pinned half of it.
          {
            echo "# kind name reference@digest"
            echo "# list = multi-arch manifest list; pin this unless you want one architecture"
            echo "# leaf = single-arch image, named by its rust target triple"
          } > dist/image-digests.txt
          for target in $TARGETS; do
            # Every stream script loaded as `sutura:latest` in the build job, so each tarball
            # arrives under that name; retag before the next iteration takes it away. Loading
            # and pushing never EXECUTES the image - the smoke tests ran in `build`, under a
            # token that cannot write to a registry.
            docker load -i "images/sutura-oci-${target}.tar.gz"
            docker tag sutura:latest "${IMAGE}:${tag}-${target}"
            # The digest is the only durable answer to "which build is running", so it comes
            # from what the registry SAID rather than from local bookkeeping.
            #
            # This was `docker inspect --format '{{index .RepoDigests 0}}'`, and it recorded
            # `unknown` for one of the four targets in the v0.1.0 release while the push
            # itself had succeeded and printed a digest. `RepoDigests` is per-image-ID, and
            # every tarball here loads under the same `sutura:latest` name, so the tag-to-ID
            # mapping is rewritten on each iteration - the field is unreliable exactly when
            # several images share one repository. `docker push` prints the digest it
            # registered, which needs no bookkeeping to survive.
            push_log="$(mktemp)"
            docker push "${IMAGE}:${tag}-${target}" | tee "$push_log"
            digest="$(grep -oE 'sha256:[0-9a-f]{64}' "$push_log" | tail -1)"
            rm -f "$push_log"
            # FAIL rather than record `unknown`. A release whose digests are missing cannot
            # be pinned, and a placeholder makes an absence look like data.
            if [ -z "$digest" ]; then
              echo "::error::no digest in the push output for ${target}" >&2
              exit 1
            fi
            printf 'leaf %s %s@%s\n' "$target" "$IMAGE" "$digest" >> dist/image-digests.txt
          done
          # Two manifest lists, assembled from the leaves just pushed. The four leaf tags are
          # written out rather than accumulated in the loop above, so which architecture belongs
          # to which libc is readable here instead of inferred from control flow.
          #
          # `docker buildx imagetools create`, not `docker manifest create`: buildx ships with
          # ubuntu-latest, while `docker manifest` still needs the experimental flag set, which
          # is one more thing that has to be true about a runner. Both tags go on one call, so a
          # list and its `latest` alias are the same push and cannot drift apart.
          docker buildx imagetools create -t "${IMAGE}:${tag}" -t "${IMAGE}:latest" "${IMAGE}:${tag}-x86_64-unknown-linux-gnu" "${IMAGE}:${tag}-aarch64-unknown-linux-gnu"
          docker buildx imagetools create -t "${IMAGE}:${tag}-musl" -t "${IMAGE}:latest-musl" "${IMAGE}:${tag}-x86_64-unknown-linux-musl" "${IMAGE}:${tag}-aarch64-unknown-linux-musl"

          # ASSERTED, like the static-linking claim in `build`, and for the same reason. A list
          # assembled from leaves that all declare amd64 still pushes, still resolves, and still
          # hands an amd64 image to an arm64 host - the exact bug this step exists to fix,
          # wearing a manifest list as a disguise. So each list has to report both platforms
          # before anything downstream records it as good.
          for list in "${IMAGE}:${tag}" "${IMAGE}:${tag}-musl"; do
            platforms="$(docker buildx imagetools inspect "$list" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            echo "${list}: ${platforms}"
            for want in linux/amd64 linux/arm64; do
              case " $platforms " in
                *" $want "*) ;;
                *) echo "::error::${list} has no ${want} entry: ${platforms}"; exit 1 ;;
              esac
            done
          done

          # The LIST digest is what a consumer should pin, because a leaf digest pins one
          # architecture. `--raw` prints the index bytes and a manifest digest IS the sha256 of
          # exactly those bytes, so this computes the digest by definition rather than by
          # scraping an output format that can change. Cross-checked against the `Digest:` line
          # `imagetools inspect` prints for a human, and against `{{json .Manifest}}`.
          record_list() {
            digest="$(docker buildx imagetools inspect --raw "$2" | sha256sum | cut -d' ' -f1)"
            printf 'list %s %s@sha256:%s\n' "$1" "$IMAGE" "$digest" >> dist/image-digests.txt
          }
          record_list glibc "${IMAGE}:${tag}"
          record_list musl "${IMAGE}:${tag}-musl"
          {
            echo "## Images"
            echo
            echo '```'
            cat dist/image-digests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io

      # Everything published so far becomes verifiable here: a Sigstore signature per release
      # asset and per image reference, each leaf image's CycloneDX SBOM attached as a cosign
      # attestation, and SLSA provenance for the assets and for the two manifest lists.
      #
      # A LOCAL composite action rather than steps in this file, and the reason is in the action's
      # own header at length. Short version: this file is hand-written configuration under the
      # 1000-line cap `cargo xtask max-lines` enforces, and the signing sequence is the part of
      # the release path that grows with every new artefact kind - so it is the part that had to
      # move before the next addition forced the split under pressure.
      #
      # BEFORE the release exists, deliberately. A Sigstore signature and a provenance attestation
      # are bound to the bytes' digest and not to a release object, so nothing here needs the
      # release - and doing it now means a failure lands while nothing is half-created, which is
      # the same reason the notes below are assembled before the draft. The bundles it writes into
      # `dist/` are picked up by the upload, so they are release assets like anything else there.
      #
      # It cannot know what SHOULD have been published - it signs what it is handed - so the step
      # that keeps a missing artefact from becoming a quietly unsigned one is `Check that all four
      # builds arrived` above, and that is the step to extend when a new asset shape is added.
      - name: Attest and sign
        uses: ./.github/actions/attest-and-sign
        with:
          image: ${{ env.IMAGE }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      # The body, assembled before anything is published so a failure here lands while
      # nothing is half-created.
      #
      # Two parts. The change list comes from cliff.toml, not from `--generate-notes`:
      # GitHub's version lists merged pull requests, which records who typed something rather
      # than what changed, and this repo gates the commit subject (`cargo xtask commit-msg`)
      # precisely so the history can be rendered instead. CHANGELOG.md comes off the same
      # config, so the file and the release body cannot disagree.
      #
      # The second part is the artifacts. They were always attached and never mentioned, so a
      # reader got a list of pull requests and no way to tell which of eight tarballs to take
      # or what to pull. Everything in it is read back off the files themselves - sizes from
      # the assets, linkage from `file`, digests from image-digests.txt - so the notes cannot
      # describe a build that did not happen.
      #
      # TABLES ONLY, and this is a standing instruction rather than a passing preference: the
      # body is the change list plus tables of what shipped. It had grown recommendations
      # ("take a musl one"), rationale for what is absent, a section on what a checksum does
      # not prove, and `curl`/`docker pull` snippets that restated the table beside them. A
      # release page is a manifest, not a tutorial. Columns carry the facts a reader chooses
      # on - size, linkage, platforms, digest - so if something here needs a sentence to
      # explain it, it belongs in the docs instead.
      - name: Assemble the release notes
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}"

          # One line per target, concatenated in TARGETS order rather than in whatever order
          # four parallel jobs happened to finish in. The table below is the reader's first
          # impression of the release; it should not be a race result.
          : > binary-facts.txt
          for target in $TARGETS; do
            cat "facts/${target}.txt" >> binary-facts.txt
          done

          # `--current` is the section for the tag CONTAINING HEAD. That is the tag being
          # released, because the job checked out this ref and the guard on this job requires
          # it to be a `v` tag. `--latest` would be the newest tag in the REPO, so re-running
          # an older tag would publish the newer tag's notes underneath it. Note that
          # `--current` reads the tag at HEAD rather than $tag: those are the same thing only
          # because of the checkout, which is why the guard above is not decoration.
          #
          # `--strip header` drops the "# Changelog / do not edit" preamble, which belongs to
          # the file and means nothing in one release's body.
          #
          # A render failure must not fail the release. Four images are on ghcr.io by the time
          # this runs; aborting would leave them published with nothing naming them. So it
          # degrades to a pointer at the history, loudly, and the artifact section below is
          # still written - that is the half a reader operationally needs.
          nix run .#git-cliff -- --current --strip header -o changes.md || true
          : > notes.md
          if [ -s changes.md ]; then
            cat changes.md >> notes.md
          else
            echo "::warning::no change list rendered for ${tag}"
            {
              echo "## Changes"
              echo
              echo "The change list could not be rendered for this tag. The commits are at"
              echo "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${tag}>."
            } >> notes.md
          fi

          {
            echo
            echo "## Artifacts"
            echo
            echo "### Binaries"
            echo
            echo "| Target | Asset | Size | Linking |"
            echo "| --- | --- | --- | --- |"
            while IFS='|' read -r target linkage; do
              asset="sutura-${target}.tar.gz"
              size="$(stat -c %s "dist/${asset}" | numfmt --to=iec-i --suffix=B --format='%.1f')"
              printf "| \`%s\` | [\`%s\`](%s/%s) | %s | %s |\n" "$target" "$asset" "$base" "$asset" "$size" "$linkage"
            done < binary-facts.txt
          } >> notes.md

          if [ -f dist/image-digests.txt ]; then
            {
              echo
              echo "### Images"
              echo
              echo "| Variant | Tag | Platforms |"
              echo "| --- | --- | --- |"
              printf "| glibc (the default) | \`%s:%s\`, \`%s:latest\` | linux/amd64, linux/arm64 |\n" "$IMAGE" "$version" "$IMAGE"
              printf "| static musl | \`%s:%s-musl\`, \`%s:latest-musl\` | linux/amd64, linux/arm64 |\n" "$IMAGE" "$version" "$IMAGE"
              echo
              echo "| Variant | Pull by digest |"
              echo "| --- | --- |"
              grep '^list ' dist/image-digests.txt | while read -r _ name ref; do
                printf "| %s | \`docker pull %s\` |\n" "$name" "$ref"
              done
              echo
              echo "| Target | Tag | Pull by digest |"
              echo "| --- | --- | --- |"
              grep '^leaf ' dist/image-digests.txt | while read -r _ target ref; do
                if [ "$ref" = "unknown" ]; then
                  pull="not recorded; pull the tag"
                else
                  pull="\`docker pull ${ref}\`"
                fi
                printf "| \`%s\` | \`%s:%s-%s\` | %s |\n" "$target" "$IMAGE" "$version" "$target" "$pull"
              done
              # The attached image tarballs, as a table rather than the `docker load` snippet the
              # prose used to carry. Globbed and not listed: which ones are attached is decided
              # by the publish step, and a hardcoded pair here would silently misreport the day
              # that changes.
              echo
              echo "| Loadable image tarball | Size |"
              echo "| --- | --- |"
              for tarball in dist/sutura-oci-*.tar.gz; do
                [ -f "$tarball" ] || continue
                name="$(basename "$tarball")"
                size="$(stat -c %s "$tarball" | numfmt --to=iec-i --suffix=B --format='%.1f')"
                printf "| [\`%s\`](%s/%s) | %s |\n" "$name" "$base" "$name" "$size"
              done
            } >> notes.md
          fi

          # The supply-chain section, and it obeys the TABLES ONLY rule above rather than being an
          # exception to it. Three tables: what the SBOMs are, what each claim is, and the one
          # command that checks it. A verify command is a fact, not a tutorial - what it does NOT
          # get here is the argument for why keyless signing is the right shape, which is
          # `docs/verifying-a-release.md`'s job and is linked as a row rather than summarised.
          #
          # The SBOM table is globbed like the image tarballs above, for the reason stated there:
          # which SBOMs exist is decided by the build, and a hardcoded list here would misreport
          # the day a target is added.
          {
            echo
            echo "### Software bill of materials"
            echo
            echo "| Target | CycloneDX | SPDX |"
            echo "| --- | --- | --- |"
            for target in $TARGETS; do
              cdx="sutura-oci-${target}.cdx.json"
              spdx="sutura-oci-${target}.spdx.json"
              [ -f "dist/${cdx}" ] || continue
              printf "| \`%s\` | [\`%s\`](%s/%s) | [\`%s\`](%s/%s) |\n" \
                "$target" "$cdx" "$base" "$cdx" "$spdx" "$base" "$spdx"
            done
            echo
            echo "| Covers | Read from |"
            echo "| --- | --- |"
            echo "| the files in the image: the binary, CA certificates, tzdata | the image layers |"
            echo "| the crates the binary was compiled from | a \`cargo auditable\` section inside the binary, not from \`Cargo.lock\` |"
          } >> notes.md

          {
            echo
            echo "### Provenance and signatures"
            echo
            echo "| Artefact | Sigstore bundle | SLSA provenance | Registry signature |"
            echo "| --- | --- | --- | --- |"
            echo "| binaries, image tarballs, SBOMs, \`image-digests.txt\` | \`<asset>.sigstore.json\`, attached | yes | n/a |"
            echo "| the \`.sha256\` sidecars | no: the bundle above already commits to the digest | yes | n/a |"
            echo "| images, four leaves and two manifest lists | n/a | the two manifest lists | \`cosign\`, all six references |"
            echo "| each leaf image's CycloneDX SBOM | n/a | n/a | \`cosign attest --type cyclonedx\` |"
            echo
            echo "| Check | Command |"
            echo "| --- | --- |"
            # Double-quoted with escaped backticks, matching the printfs above. A single-quoted
            # format string would be the obvious way to write a literal backtick and shellcheck
            # reports SC2016 on it, reasonably: inside single quotes a backtick is exactly as
            # inert as it looks, and telling the two cases apart is not something a linter can do.
            issuer="https://token.actions.githubusercontent.com"
            identity="'^https://github.com/${GITHUB_REPOSITORY}/'"
            printf "| an asset is the bytes this workflow produced, offline | \`cosign verify-blob --bundle <asset>.sigstore.json --certificate-identity-regexp %s --certificate-oidc-issuer %s <asset>\` |\n" \
              "$identity" "$issuer"
            printf "| the same, against this forge | \`gh attestation verify <asset> --repo %s\` |\n" "$GITHUB_REPOSITORY"
            printf "| an image is the one this workflow pushed | \`cosign verify %s@<digest> --certificate-identity-regexp %s --certificate-oidc-issuer %s\` |\n" \
              "$IMAGE" "$identity" "$issuer"
            printf "| what is inside an image | \`cosign verify-attestation --type cyclonedx %s@<digest> --certificate-identity-regexp %s --certificate-oidc-issuer %s\` |\n" \
              "$IMAGE" "$identity" "$issuer"
            printf "| what any of it means | [Verifying a release](%s/%s/blob/%s/docs/verifying-a-release.md) |\n" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag"
          } >> notes.md

      # Draft first, then the assets, then publish. NOT create-and-publish-then-upload, which
      # is what this file did and what the first real release failed on:
      #
      #   HTTP 422: Cannot upload assets to an immutable release
      #
      # This repository has GitHub's immutable releases enabled. Immutability begins the moment
      # a release is PUBLISHED: after that its assets can never be added to, replaced or
      # deleted. A draft is still mutable, so every asset goes on while it is a draft and
      # publishing is the last thing that happens. `--clobber` is gone with the step it belonged
      # to - there is nothing to clobber, because an asset that exists can never be replaced.
      #
      # TITLE AND NOTES stay editable after publication; only assets are permanent. So a wrong
      # changelog can be repaired later with `gh release edit --notes-file`, while a missing
      # asset cannot be repaired at all. That asymmetry is the whole reason for this ordering.
      #
      # `gh release create` would do this internally if the files were passed to it as
      # positional arguments - its source creates a draft, uploads, publishes, and deletes the
      # draft if an upload fails. But `gh` is the one tool in this file that is NOT pinned; it
      # comes with the runner. So the sequence is written out here and depends only on
      # documented flags rather than on an unpinned tool's internal ordering.
      #
      # WHAT A RE-RUN DOES, which differs either side of the publish:
      #   nothing there yet        -> proceeds normally.
      #   a leftover draft         -> refuses. Adopting it would attach a second copy of every
      #                               asset to a draft whose body came from an older run, and a
      #                               draft is invisible on the releases page, so "it worked"
      #                               would be unfalsifiable. The trap below means this should
      #                               not happen; if it did, something killed the runner.
      #   already published        -> refuses. Nothing can repair it - the assets are frozen.
      #                               Cut the next version.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          cat notes.md

          state="$(gh release view "$tag" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)"
          case "$state" in
            published)
              echo "::error::${tag} is already published, and this repository has immutable releases enabled: its assets can never be added to or replaced, so re-running cannot repair it. Cut the next version."
              exit 1
              ;;
            draft)
              echo "::error::an unpublished DRAFT for ${tag} is left over from an earlier run. It is invisible to users, so adopting it is not safe: delete it with 'gh release delete ${tag} --yes' and re-run."
              exit 1
              ;;
          esac

          # The glob has to have matched something. Unmatched, bash passes `dist/*` through
          # literally and gh would try to open a file by that name - a confusing failure in the
          # one step that gets no second attempt.
          count="$(find dist -type f | wc -l)"
          if [ "$count" -lt 1 ]; then
            echo "::error::dist/ holds no files to attach"
            exit 1
          fi

          # A failure between here and the publish must not leave an invisible draft behind.
          # The tag is deliberately NOT cleaned up: `gh release delete` keeps it by default,
          # and the tag is what a re-run needs.
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::failed before publishing ${tag}; deleting the draft so a re-run starts clean"
              gh release delete "$tag" --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          gh release create "$tag" --draft --title "$tag" --notes-file notes.md
          echo "attaching ${count} asset(s) while ${tag} is still a draft"
          gh release upload "$tag" dist/*
          gh release edit "$tag" --draft=false

          # Assert the publish happened. A draft that silently stayed a draft reads as success
          # in the log and is invisible on the releases page - the failure this whole shape is
          # meant to make impossible, so it gets checked rather than assumed.
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "::error::${tag} is still a draft after 'gh release edit --draft=false'"
            exit 1
          fi
          # Published now, so the trap must not delete it: past this line a failure is reported
          # rather than cleaned up, because the assets are already frozen and removing a
          # published release would destroy them.
          trap - EXIT

          attached="$(gh release view "$tag" --json assets --jq '.assets | length')"
          echo "published ${tag} with ${attached} asset(s)"
          if [ "$attached" -ne "$count" ]; then
            echo "::error::attached ${attached} asset(s) but dist/ holds ${count}. The release is published and its assets are immutable, so this cannot be topped up: the notes can still be edited, the assets cannot."
            exit 1
          fi
