# Manual normal-hook commit and bundle export; publication is a separate operation.
name: Catalog relationship source bundle
run-name: Catalog relationship source bundle ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      consumer:
        description: Reviewed source to commit and export
        type: choice
        required: true
        options: [catalog-relationships]
      request_id:
        description: Exact fresh reviewed request
        type: string
        required: true
      expected_helper_sha:
        description: Exact reviewed workflow commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: catalog-relationships-source-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-bundle:
    runs-on: rust-mcp-16core
    timeout-minutes: 360
    env:
      CONSUMER: ${{ inputs.consumer }}
      REQUEST_ID: ${{ inputs.request_id }}
      EXPECTED_HELPER_SHA: ${{ inputs.expected_helper_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      MAIN_PARENT: 586782feba9529e1d2a36c32c39c060e8675a5e0
      SOURCE_PARENT: 586782feba9529e1d2a36c32c39c060e8675a5e0
      SOURCE_PARENT_BRANCH: main
      EXPECTED_TREE: b07820ad1dee531a9b5c881f5609f56b9be5c0f5
      MESSAGE_SHA: 77f730ef8f99c65e0b3af3c8590f46be6e2b71bf34851825e88c0b791f3e01e0
      PATCH_SHA: 5a79f35113da9c7361a1c1e2eb8519295f06992bd83fb1569521a1c48614a404
      SOURCE_BRANCH: feat/catalog-relationships-1976-causality-8215e950
      GIT_OPTIONAL_LOCKS: "0"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the reviewed helper
        shell: bash
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_UNSTABLE_CODEGEN_BACKEND CARGO_PROFILE_DEV_CODEGEN_BACKEND
          test "$GITHUB_REPOSITORY" = telekom/sutura
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/ci/catalog-relationships-source-bundle-1976-8215e950
          [[ "$EXPECTED_HELPER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HELPER_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_HELPER_SHA"
          test "$(git --no-optional-locks rev-parse HEAD)" = "$EXPECTED_HELPER_SHA"
          test -z "$(git --no-optional-locks status --porcelain=v1 --untracked-files=all)"
          test -z "${SKIP:-}${PREK_SKIP:-}${PRE_COMMIT_ALLOW_NO_CONFIG:-}"
          test -z "${GIT_CONFIG_COUNT:-}${GIT_CONFIG_PARAMETERS:-}"
          test "$CONSUMER" = catalog-relationships
          test "$REQUEST_ID" = 8215e950-82cb-44ab-93cf-e07d9bc7231e

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 586782feba9529e1d2a36c32c39c060e8675a5e0
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct the accepted source before acquiring tools
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/catalog-relationships-source-commit"
          mkdir "$EVIDENCE"
          test "$(git --no-optional-locks rev-parse HEAD)" = "$SOURCE_PARENT"
          test -z "$(git --no-optional-locks status --porcelain=v1 --untracked-files=all)"
          test -z "$(git --no-optional-locks config --get core.hooksPath || true)"
          remote_main="$(git --no-optional-locks ls-remote --refs origin refs/heads/main)"
          remote_topic="$(git --no-optional-locks ls-remote --refs origin "refs/heads/$SOURCE_BRANCH")"
          remote_parent="$(git --no-optional-locks ls-remote --refs origin "refs/heads/$SOURCE_PARENT_BRANCH")"
          printf '%s\n%s\n%s\n' "$remote_main" "$remote_topic" "$remote_parent" > "$EVIDENCE/remote-bindings.before"
          test "$remote_main" = "$MAIN_PARENT"$'\trefs/heads/main'
          test -z "$remote_topic"
          test "$remote_parent" = "$SOURCE_PARENT"$'\trefs/heads/'"$SOURCE_PARENT_BRANCH"
          git --no-optional-locks config --local user.name ci
          git --no-optional-locks config --local user.email user@example.com
          git --no-optional-locks switch -c "$SOURCE_BRANCH"
          patch="$EVIDENCE/source.patch"
