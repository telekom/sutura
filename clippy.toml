# Test code is exempt from the strict lints: forcing `?`-ceremony into an assert makes
# tests worse, and a test is not attack surface.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true

# Stricter than clippy's defaults - flag complexity while it is still cheap to fix.
#
# The threshold values are HIGHER than this repo once declared, and the increase is an
# #94 decision rather than drift. Until #94 there was an `#[expect]` on the threshold lint at
# every site below - a suppression whose correctness was a property of the MERGE, not of the
# code (a threshold lint's cause is a number an unrelated branch can change). #94 removed the
# class: the `#[expect]`s are gone and each value below is the measured worst case for the
# workspace on the day (2026-08-31), plus a little headroom so a one-branch drift does not tip
# it over the next merge. A function past a threshold now has to SPLIT, because `#[expect]` on
# one is banned.
cognitive-complexity-threshold = 50   # max in tree 45, all tracing-macro inflation (announce_*)
too-many-lines-threshold = 165        # max 158 - the federated splitter, kept as one pass
too-many-arguments-threshold = 10     # max 10 - flat constructor signatures (Metric, Plan)
type-complexity-threshold = 100       # default 250
enum-variant-name-threshold = 2       # default 3

# A ban without a reason gets reverted by the next person who trips over it.
#
# VERIFIED TO RESOLVE, which for this file is the whole question. An unresolvable path in
# `disallowed-methods` is silently ignored by the pinned clippy - measured, not assumed - so an
# entry that reads as enforcement and does nothing is worse than no entry. Each of these was
# confirmed by writing the banned call and watching clippy reject it.
#
# **Do not read the silence as permanent.** clippy 0.1.99 warns - "does not refer to a reachable
# function", with an `allow-invalid = true` opt-out - measured on that version against a deliberate
# nonsense path. `rust-toolchain.toml` pins 0.1.98, which does not, so writing the call remains the
# only check that holds today. When the pin moves past that, the warning becomes the mechanism and
# this paragraph is where that gets recorded.
disallowed-methods = [
  # The obvious way to parse a catalog-authored SQL fragment, and it PANICS. `Parser::new` over an
  # empty token list hits an `expect` in the parser, which is what `""`, whitespace-only and
  # comment-only input all tokenize to - in every one of our dialects. `panic = "abort"` makes that
  # a catalog file ending the process. `sutura_sql::expression` parses `SELECT {fragment}` instead,
  # with a guard on each way that can come back as something other than one expression.
  { path = "polyglot_sql::parser::Parser::parse_expressions", reason = "panics on empty input, which is reachable from a catalog file; use sutura_sql::expression::compile" },
  { path = "polyglot_sql::parser::Parser::new", reason = "the only reason to build a parser by hand is the panicking fragment API; use sutura_sql::expression::compile" },
  # A bare spawn drops the request. `tracing`'s current span is a thread-local, so the pool thread
  # has none - every line the closure writes lands outside the span the transport opened, and the
  # defect is invisible: it compiles, it runs, the answer is right, and one request's lines are not
  # findable together. `sutura_runtime::spawn_carrying_span` is the same call with the span carried
  # across, and it holds the single `#[expect]` for this entry.
  { path = "tokio::task::spawn_blocking", reason = "the pool thread has no current span, so the request's context is lost; use sutura_runtime::spawn_carrying_span" },
  # The ONE method on the `Warehouse` port that reaches a data system with no credential. It runs
  # under whatever identity the deployment configured that adapter with, so a second call site is a
  # second thing executing as the deployment - and `AnchorPlan` cannot stop that on its own, because
  # every value its constructor reads is publicly constructible and Rust has no cross-crate friend
  # visibility. What makes the path boot-only is therefore this entry: the single caller is
  # `sutura_app::verify_anchors`, which holds the single `#[expect]`, and any other call is an error
  # under `-D warnings` until somebody writes a second one a reviewer can see. Verified to resolve by
  # writing the call and watching clippy reject it; the limit is that a lint is not a type, so it
  # reaches this workspace and not a crate outside it.
  { path = "sutura_domain::warehouse::Warehouse::verify_anchor", reason = "the only port method that executes with no credential; it belongs to the boot path alone, whose one call site holds the single #[expect]" },
  # The one call that lets credential material out of `Secret`, and until #145 the only thing
  # holding it was its NAME. `docs/adr/0020` made logging a credential a compile error - `Secret`
  # has no `Display`, so a `%` tracing field does not build - and that record's own documentation
  # states the hole it left: nothing stopped a call site writing the exposure into a log, "which is
  # why the method is named to be greppable rather than relied on to be absent". Greppable is not a
  # mechanism.
  #
  # So the ban makes each exposure a place somebody wrote an `#[expect]` a reviewer can see, which
  # is the `verify_anchor` and `spawn_blocking` shape one row up. There is no list of permitted call
  # sites in this file on purpose: a name here would rot silently, where an expectation that stops
  # firing is an error under `-D warnings`.
  #
  # VERIFIED TO RESOLVE the way this file's header requires - not by writing a new call, but by
  # adding the entry and watching clippy reject the existing ones by file and line.
  #
  # Test code is NOT exempt: there is no `allow-disallowed-methods-in-tests`, and the
  # `allow-*-in-tests` switches at the top reach four named lints only. A test's exposure carries
  # an expectation like any other, and the reason it gives says it is a test.
  { path = "sutura_domain::identity::Secret::expose_secret", reason = "the one call that lets credential material out; every exposure carries an #[expect] naming what it is for, so a new one is a visible diff" },
]

disallowed-types = [
  { path = "std::sync::Mutex",  reason = "async code may deadlock the executor; use tokio::sync or parking_lot" },
  { path = "std::sync::RwLock", reason = "async code may deadlock the executor; use tokio::sync or parking_lot" },
]

# Nothing here is published to a registry, so there is no exported API to break. Clippy
# suppresses a whole family of pedantic lints on public items by default to protect
# semver; turning that off is what makes them apply to the surface that actually matters.
avoid-breaking-exported-api = false
