# One job, two behaviours, split by WHICH BRANCH it ran on.
#
#   push to dev          -> write CHANGELOG.md and nothing else.
#   push to main         -> work out the next version, tag it, and ask release.yml AND docs.yml
#                           to run on that tag. Then put the release commit back on dev.
#   workflow_dispatch    -> the same, decided by the ref it was dispatched on.
#
# This file publishes nothing itself.
#
# RELEASING IS AUTOMATIC AGAIN, and the shape is what makes that affordable. `dev` is the trunk
# and `main` is the release ref, so a release happens once per PROMOTION rather than once per
# `feat` merge.
#
# The history matters here, because this reverses `7f30597`. Releasing used to be automatic on
# every push whose commits moved the version, which meant a single `feat` merge cut a release -
# four in one day. The cost is not the tag: the release commit edits the workspace version, the
# version reaches crane's dependency derivation, and every release therefore recompiles and
# re-caches the whole dependency closure for all four targets. The build cache went over its
# quota on that alone, and past the quota GitHub evicts continuously, so every job gets slower.
#
# THAT COST IS UNCHANGED, and was re-measured rather than assumed before reversing anything:
# workspace version `0.2.4` gives `sutura-deps` the derivation `bzcl79gg...`, `0.2.5` gives
# `vdh9v71g...`. A one-line version bump still invalidates the closure.
#
# What changed is the FREQUENCY. That reversal's own note said "releasing when there is
# something to release fixes the cause", and a promotion is exactly that - somebody decided.
# The second fix it named, making the dependency build blind to the version, is still available
# and still independent; it is the thing to do if promotions ever get frequent enough to hurt,
# and it is not needed to make this safe.
#
# It asks, rather than leaving the tag to do it. A push made with GITHUB_TOKEN does not start
# a workflow run - GitHub suppresses that so a workflow cannot trigger itself - so `git push
# origin "$VERSION"` lands the tag and nothing happens. `workflow_dispatch` is the documented
# exception to the same rule, so the release is requested explicitly, on the tag's own ref.
# That suppression is also what stops the changelog refresh below from looping.
#
# CHANGELOG.md is written on EVERY push, not only when the version moves. Written only on a
# release, the file sat on main with an `## Unreleased` heading listing a subset of what main
# already contained - twelve commits behind at the worst point. A heading that calls itself
# unreleased and then omits half the unreleased work is worse than no file at all.
#
# The bump is DERIVED, not chosen: `feat` gives a minor, `fix` and the rest give a patch, and a
# `!` or a BREAKING CHANGE footer gives a major. That works only because the commit subject is
# already a gate (`cargo xtask commit-msg`) - a bump computed from unconstrained subjects would
# be a guess with a version number attached.
#
# Nothing is tagged when no commit since the last tag would change the version, so an
# unnecessary dispatch is a no-op rather than an empty release.
#
# TO CUT A RELEASE: run this workflow from the Actions tab on `main`, or
# `gh workflow run version-bump.yml --ref main`. The version is still DERIVED from the commit
# subjects, so what is manual is the timing and not the number.
name: version-bump

on:
  push:
    # Both, and they do DIFFERENT jobs - see the header. `dev` refreshes the changelog and never
    # tags; `main` is the release ref and a push to it cuts the release.
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two bumps at once: they would race to compute "next" from the same tag.
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: rust-mcp
    timeout-minutes: 60
    permissions:
      contents: write   # commit the changelog, push the tag
      actions: write    # ask release.yml to run; the tag push cannot (see the note above)
    steps:
      # A `workflow_dispatch` on any branch would otherwise reach the pushes below, putting
      # unreviewed commits on a protected branch - which on `main` then tags and publishes. The
      # ref is checked before anything is fetched.
      #
      # TWO refs now, and which one it is decides what happens: `dev` refreshes the changelog,
      # `main` releases. `TRUNK` is exported for the pushes below so no step has to re-derive it,
      # and so a third branch cannot be reached by adding one to the trigger list without also
      # coming through here.
      - name: Refuse to run outside dev or main
        id: ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -eu
          case "$REF" in
            refs/heads/dev)  echo "branch=dev"  >> "$GITHUB_OUTPUT" ;;
            refs/heads/main) echo "branch=main" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::version-bump only runs on dev or main; got $REF"
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff reads history; a shallow clone gives it one commit and a wrong answer.
          fetch-depth: 0
          persist-credentials: true

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent: with it, a pull request could add a substituter and a trusted key and have
          # CI fetch attacker-built store paths whose signature verifies. Anything CI needs
          # goes here, where the workflow diff shows it.
          extra_nix_config: |
            fallback = true

      - name: Compute the next version
        id: next
        env:
          # WHICH BRANCH decides, not which event. A push to `dev` refreshes the changelog and
          # stops; a push to `main` releases. Read from the guard step above rather than from
          # `github.ref` again, so there is one place that maps a ref to a role.
          BRANCH: ${{ steps.ref.outputs.branch }}
        run: |
          set -eu
          # git-cliff prints a bare version (0.2.0). release.yml triggers on `v*`, so the
          # tag MUST carry the prefix - without it the tag lands and nothing publishes.
          # Both sides are normalised before comparing, or `0.1.0` != `v0.1.0` forever and
          # every push re-releases.
          next_raw="$(nix run .#git-cliff -- --bumped-version 2>/dev/null || true)"
          prev_raw="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          next="v${next_raw#v}"
          prev="v${prev_raw#v}"
          echo "previous: ${prev_raw:-none}"
          echo "next:     ${next_raw:-none}"
          if [ -z "$next_raw" ] || [ "$next" = "$prev" ]; then
            echo "no version change: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" != "main" ]; then
            # THE TRUNK NEVER RELEASES. The version would move, and this is `dev`: the changelog
            # is rendered with an `## Unreleased` heading and committed, and nothing is tagged.
            # Accumulating commits under that heading is the point - one promotion to `main`
            # later derives one version from all of them.
            #
            # Gated in this one place rather than on the four steps below, so the no-release path
            # is the same path a chore-only push already took.
            echo "$next is available; the trunk does not release - promote dev to main to cut it"
            echo "::notice::${next} is ready to release. Promote dev to main, or dispatch version-bump on main."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # A PUSH TO `main` IS A RELEASE, and that is the whole of the automation - no
            # dispatch, no second decision. `$EVENT` is deliberately not consulted: a promotion
            # and a manual dispatch on `main` mean the same thing, and treating them differently
            # is how a release ends up depending on which button somebody pressed.
            #
            # THIS REVERSES `7f30597`, which made releasing manual because a `feat` merge cut a
            # release - four in one day - and each one moved the workspace version, which moves
            # crane's dependency derivation and re-caches the whole closure for four targets.
            # MEASURED again before reversing it: version `0.2.4` gives `sutura-deps` the drv
            # `bzcl79gg...` and `0.2.5` gives `vdh9v71g...`, so that cost is real and unchanged.
            #
            # What changed is the FREQUENCY, not the cost. Releases now happen once per
            # promotion rather than once per `feat` merge, which is what that reversal's own
            # note asked for: "releasing when there is something to release fixes the cause".
            # The other fix it names - making the dependency build blind to the version - is
            # still available and still independent, and is worth doing if promotions ever get
            # frequent enough to hurt.
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi

      # Unconditional. `version` is only set when the bump moved, so an empty one is the
      # no-release path: the section stays `## Unreleased` and is committed on its own below.
      # With a tag it becomes that version's section and rides in the release commit instead.
      # Same render either way, and the same one `just changelog` does locally.
      - name: Write the changelog
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -eu
          if [ -n "${VERSION:-}" ]; then
            nix run .#git-cliff -- --tag "$VERSION" -o CHANGELOG.md
          else
            nix run .#git-cliff -- -o CHANGELOG.md
          fi
          git --no-pager diff --stat -- CHANGELOG.md

      # The other branch, and now the usual one: nothing is being tagged - either the commits
      # do not move the version, or they do and this was a push rather than a release dispatch.
      # Either way the changelog is what changed.
      #
      # A lost race is not a failure HERE. `concurrency` above serialises this workflow
      # against itself, but a human push landing between the checkout and this push makes it
      # non-fast-forward, and the next push to main renders the identical file again - so the
      # right response is to say so and move on rather than redden a run nobody can act on.
      # The release path below deliberately does NOT get that leniency: a release that
      # silently did not happen is a real problem.
      - name: Refresh the changelog on the trunk
        if: steps.next.outputs.release != 'true'
        env:
          BRANCH: ${{ steps.ref.outputs.branch }}
        run: |
          set -eu
          if git diff --quiet -- CHANGELOG.md; then
            echo "changelog unchanged: nothing to commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          # `chore` is skipped by cliff.toml, so this commit never shows up as an entry about
          # itself - and a chore moves no version, so it cannot trigger a release either.
          git commit -m 'chore(changelog): refresh the unreleased section'
          # Back to the branch this ran on. It used to be a hardcoded `HEAD:main`, which after the
          # trunk moved would have pushed a `dev` changelog onto the release ref - a commit on
          # `main` that no promotion put there, and on a repository where a push to `main` cuts a
          # release, the worst possible place for a stray commit.
          git push origin "HEAD:${BRANCH}" \
            || echo "::warning::${BRANCH} moved; the next push rewrites it"

      # The manifest version must match the tag, or a built binary reports one version
      # while the release says another.
      - name: Set the workspace version
        if: steps.next.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -eu
          plain="${VERSION#v}"
          # `^version = ` matches exactly one line in Cargo.toml: the workspace's. Crates
          # inherit it with `version.workspace = true` and the profile tables have no version
          # key, so a global substitution is unambiguous. Asserted rather than assumed:
          count="$(grep -c '^version = ' Cargo.toml)"
          if [ "$count" != "1" ]; then
            echo "::error::expected one workspace version line in Cargo.toml, found $count"
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"${plain}\"/" Cargo.toml
          grep -A1 '^\[workspace.package\]' Cargo.toml
          # Cargo.lock records member versions, so it has to move with the manifest or a
          # `--locked` build fails on the very commit just tagged.
          #
          # `update --workspace`, not `metadata --offline`. The intent was to stop a release
          # quietly picking up a dependency update, and `--offline` was the wrong instrument:
          # on a fresh runner the registry cache is empty, so it cannot resolve anything and
          # fails with "no matching package named `serde`". `--workspace` gives the same
          # guarantee properly - it re-locks the workspace members and cannot touch a
          # third-party version - and it may use the network to read the index it needs.
          nix run .#cargo -- update --workspace

      - name: Commit and tag
        if: steps.next.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          # The trunk, so the release commit can be put back on it. A literal rather than the
          # guard's output, because this step only ever runs on `main` and the branch it pushes
          # BACK to is the other one - deriving it from `steps.ref` would name `main` twice.
          TRUNK: dev
        run: |
          set -eu
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md Cargo.toml Cargo.lock
          # `chore(release)` is skipped by cliff.toml, so the release commit never appears in
          # the next changelog as an entry about itself.
          git commit -m "chore(release): ${VERSION}"
          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin HEAD:main
          git push origin "${VERSION}"

          # AND BACK ONTO THE TRUNK, because the release commit is the one thing that lands on
          # `main` without going through `dev`. Left alone, `dev`'s `Cargo.toml` stays a version
          # behind for ever and every later promotion carries a manifest conflict.
          #
          # A fast-forward: `dev` is an ancestor of this commit, since `main` only moves by
          # promotion from it. If `dev` has moved on in the seconds since, the push is refused
          # and the WARNING names the fix rather than failing the release - the tag is already
          # pushed by this point, so aborting here would leave a released version with no
          # changelog on the trunk, which is worse than a manifest one commit behind.
          git push origin "HEAD:${TRUNK}" || {
            echo "::warning::${TRUNK} moved; it is now one release commit behind main."
            echo "::warning::Fix with: git switch ${TRUNK} && git merge --ff-only main && git push"
          }

      # The tag is pushed; nothing has started. See the note at the top of this file: a push
      # made with GITHUB_TOKEN does not start a workflow run, so release.yml has to be asked.
      # Its own `permissions` and its tag-shape guards are unchanged by being dispatched - the
      # ref is the tag, so `github.ref` is `refs/tags/vX.Y.Z` and every guard in it still
      # holds.
      #
      # Retried, because the ref was created seconds ago and the API can 404 on it briefly.
      # BOTH workflows the tag is supposed to start, for the reason in this file's header: a
      # push made with GITHUB_TOKEN starts nothing, so `git push origin "$VERSION"` above lands
      # the tag and no `on: push: tags` trigger anywhere fires.
      #
      # docs.yml was the half that got missed. It declares `tags: ["v*"]` and its publish step
      # is correct - on a tag it deploys `<version>` and moves the `latest` alias - but it had
      # never once run on a tag: five releases existed and `versions.json` on gh-pages held a
      # single entry, `main`, so the version dropdown had nothing to select and `extra.version.
      # default: latest` in mkdocs.yml pointed at an alias that did not exist. The docs looked
      # permanently stuck on the development copy because they were.
      #
      # One loop over both, so a third workflow that needs the tag is one word to add and
      # cannot be half-wired the way this was.
      - name: Start the release and publish its docs
        if: steps.next.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -eu
          failed=""
          for wf in release.yml docs.yml; do
            started=""
            for attempt in 1 2 3; do
              if gh workflow run "$wf" --ref "$VERSION"; then
                echo "${wf} dispatched for ${VERSION}"
                started=yes
                break
              fi
              echo "attempt ${attempt}: ${VERSION} not visible to the API yet for ${wf}; retrying"
              sleep 10
            done
            # Recorded and carried on rather than exiting here: if docs fail to start, the
            # release still has to be reported, and one `::error::` naming both is more use than
            # the first failure hiding the second.
            if [ -z "$started" ]; then failed="${failed} ${wf}"; fi
          done
          if [ -n "$failed" ]; then
            echo "::error::could not start${failed} for ${VERSION}; dispatch by hand"
            exit 1
          fi
