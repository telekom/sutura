name: QA

on:
  workflow_call:
    inputs:
      run-all-checks:
        description: Run every suite without selection or verdict reuse
        type: boolean
        default: false
      fast-checked:
        description: The caller requires the fast checks before calling QA
        type: boolean
        default: false
      tested-commit:
        description: Accepted PR merge checkout for queue verdict reuse
        type: string
      green-jobs:
        description: Exact successful job names from the accepted PR run
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: rust-mcp-16core
    timeout-minutes: 30
    outputs:
      count: ${{ steps.select.outputs.count }}
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - name: Secrets
        if: always() && !inputs.fast-checked
        run: nix run .#betterleaks -- dir . --config devco/gitleaks.toml --redact --verbose

      - name: Format
        if: "!inputs.fast-checked"
        run: nix build .#checks.x86_64-linux.fmt -L

      - name: Text format
        if: "!inputs.fast-checked"
        run: bash nix/format-text.sh check

      - name: Workflow static analysis
        if: "!inputs.fast-checked"
        run: bash nix/lint-workflows.sh

      - name: Select integration suites
        id: select
        env:
          ALL_CHECKS: ${{ inputs.run-all-checks }}
          LIVE_ELIGIBLE: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
          TESTED_COMMIT: ${{ inputs.tested-commit }}
          GREEN_JOBS: ${{ inputs.green-jobs }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$ALL_CHECKS" = "true" ]; then
            if [ "$LIVE_ELIGIBLE" != "true" ]; then
              echo "Full QA requires an event that can run the live suites" >&2
              exit 1
            fi
            nix run .#xtask -- ci-suites --all
          elif [ "$EVENT" = "push" ]; then
            nix run .#xtask -- ci-suites --main
          elif [ "$EVENT" = merge_group ]; then
            if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$BASE" HEAD &&
              [[ "$TESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] &&
              { git cat-file -e "$TESTED_COMMIT^{commit}" || git fetch --no-tags origin "$TESTED_COMMIT"; }; then
              nix run .#xtask -- ci-suites --queue "$BASE" "$TESTED_COMMIT"
            else
              nix run .#xtask -- ci-suites --all
            fi
          elif [ "$EVENT" = "pull_request" ]; then
            if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$BASE" HEAD; then
              nix run .#xtask -- ci-suites --pr "$BASE"
            else
              nix run .#xtask -- ci-suites --pr
            fi
          else
            nix run .#xtask -- ci-suites --all
          fi

      - name: Structural gates
        if: "!inputs.fast-checked"
        run: nix build .#checks.x86_64-linux.hygiene -L

      - name: Clippy
        if: "!inputs.fast-checked"
        run: nix build .#checks.x86_64-linux.clippy -L

  core-graph:
    needs: [plan]
    if: inputs.run-all-checks && !inputs.fast-checked
    runs-on: rust-mcp-32core
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - name: Full core graph
        run: bash nix/ci-core-graph.sh --full

      - name: Default feature check and tests
        run: |
          set -euo pipefail
          nix run .#default-features
          nix run .#default-feature-tests

  integration:
    name: suite (${{ matrix.id }})
    needs: [plan]
    if: needs.plan.outputs.count != '0'
    runs-on: rust-mcp-16core
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SUTURA_DOCKER_PROBE_TIMEOUT_SECS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open KVM
        if: matrix.venue == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - name: Run suite
        env:
          SUITE: ${{ matrix.id }}
        run: bash nix/ci-suite.sh "$SUITE"

      - name: Keep Oracle fixture evidence
        if: always() && (matrix.id == 'oracle-native' || matrix.id == 'oracle-legacy')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.id }}-acceptance
          path: |
            target/oracle-native-probe
            target/oracle-legacy-probe

      - name: Cube tier container logs
        if: failure() && matrix.id == 'ci-cube-tier'
        run: |
          for service in cube cube-text-search cube-metrics cube-keycloak cube-clickhouse; do
            name=$(docker ps -a --format '{{.Names}}' | grep -E -- "-${service}-1\$") || { echo "::warning::no container for ${service}"; continue; }
            echo "::group::docker logs $name"
            docker logs --tail 500 "$name" 2>&1 || true
            echo "::endgroup::"
          done

  demo:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.selected), 'demo-container')
    uses: $/.github/workflows/demo-container.yml

  cross:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.selected), 'cross-link')
    uses: $/.github/workflows/cross-link.yml

  e2e-datahub-adbc:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.selected), 'e2e-datahub-adbc') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: rust-mcp-16core
    timeout-minutes: 75
    permissions:
      contents: read
    environment: bq-test
    # #1013: `docker info` gave no answer inside the 10s default in 3 logged WedgedDaemon failures (cause
    # not established; 60s is unmeasured). Silence past 60s still FAILS - `compose.rs`'s `absent` veto.
    env:
      SUTURA_DOCKER_PROBE_TIMEOUT_SECS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - name: Place credential outside the checkout
        env:
          SUTURA_BQ_KEY: ${{ secrets.svc_suturua_bq_ci }}
        run: |
          set -eu
          if [ -z "${SUTURA_BQ_KEY:-}" ]; then
            echo "bq-test has no CI credential" >&2
            exit 1
          fi
          umask 077
          printenv SUTURA_BQ_KEY > "$RUNNER_TEMP/bq-key.json"
      - name: Mask resource names
        env:
          K: ${{ runner.temp }}/bq-key.json
          SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
        run: |
          set -eu
          python3 -c 'import json,os;print("::add-mask::" + json.load(open(os.environ["K"]))["project_id"])' \
            2>/dev/null || { echo "the CI credential names no project_id" >&2; exit 1; }
          if [ -z "${SUTURA_BQ_DATASET:-}" ]; then
            echo "bq-test has no SUTURA_BQ_DATASET" >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$SUTURA_BQ_DATASET"
      - name: Served DataHub and ADBC answer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bq-key.json
          SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
        run: nix run .#e2e-datahub-adbc -- --no-capture --no-fail-fast
      - name: Remove credential
        if: always()
        run: rm -f "$RUNNER_TEMP/bq-key.json"

  bigquery-conformance:
    needs: [plan]
    if: contains(fromJSON(needs.plan.outputs.selected), 'bigquery-conformance') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: rust-mcp-16core
    timeout-minutes: 60
    permissions:
      contents: read
    environment: bq-test
    # The adapter suffixes every physical table with GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT, so
    # merge-group runs and retries can share the configured dataset without replacing fixtures.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - name: Place credential outside the checkout
        env:
          SUTURA_BQ_KEY: ${{ secrets.svc_suturua_bq_ci }}
        run: |
          set -eu
          if [ -z "${SUTURA_BQ_KEY:-}" ]; then
            echo "bq-test has no CI credential" >&2
            exit 1
          fi
          umask 077
          printenv SUTURA_BQ_KEY > "$RUNNER_TEMP/bq-key.json"
      # The project comes off the key, masked before it is exported, so it reaches the cells
      # without reaching the log.
      - name: Mask resource names and read the project off the key
        env:
          K: ${{ runner.temp }}/bq-key.json
          SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
        run: |
          set -eu
          project="$(python3 -c 'import json,os;print(json.load(open(os.environ["K"]))["project_id"])' 2>/dev/null)" \
            || { echo "the CI credential names no project_id" >&2; exit 1; }
          if [ -z "$project" ]; then
            echo "the CI credential names an empty project_id" >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$project"
          if [ -z "${SUTURA_BQ_DATASET:-}" ]; then
            echo "bq-test has no SUTURA_BQ_DATASET" >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$SUTURA_BQ_DATASET"
          printf 'SUTURA_BQ_PROJECT=%s\n' "$project" >> "$GITHUB_ENV"
      - name: Load the example corpus once
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bq-key.json
          SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
        run: nix run .#bigquery-provision -- --no-capture
      - name: Golden corpus on BigQuery
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bq-key.json
          SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
          SUTURA_BQ_REGION: ${{ vars.SUTURA_BQ_REGION }}
        run: nix run .#bigquery-conformance -- --no-capture
      - name: Remove credential
        if: always()
        run: rm -f "$RUNNER_TEMP/bq-key.json"

  integration-verdict:
    needs: [plan, core-graph, integration, demo, cross, e2e-datahub-adbc, bigquery-conformance]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected suite
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CORE_RESULT: ${{ needs.core-graph.result }}
          CORE_REQUIRED: ${{ inputs.run-all-checks && !inputs.fast-checked }}
          MATRIX_COUNT: ${{ needs.plan.outputs.count }}
          MATRIX_RESULT: ${{ needs.integration.result }}
          DEMO_REQUIRED: ${{ contains(fromJSON(needs.plan.outputs.selected || '[]'), 'demo-container') }}
          CROSS_REQUIRED: ${{ contains(fromJSON(needs.plan.outputs.selected || '[]'), 'cross-link') }}
          DATAHUB_REQUIRED: ${{ contains(fromJSON(needs.plan.outputs.selected || '[]'), 'e2e-datahub-adbc') }}
          BQ_REQUIRED: ${{ contains(fromJSON(needs.plan.outputs.selected || '[]'), 'bigquery-conformance') }}
          DEMO_RESULT: ${{ needs.demo.result }}
          CROSS_RESULT: ${{ needs.cross.result }}
          DATAHUB_RESULT: ${{ needs.e2e-datahub-adbc.result }}
          BQ_RESULT: ${{ needs.bigquery-conformance.result }}
          LIVE_ELIGIBLE: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        run: |
          set -euo pipefail
          require() {
            if [ "$2" = success ]; then return; fi
            if [ "$3" = true ]; then
              printf 'QA: %s must run but reported %s\n' "$1" "$2" >&2
              exit 1
            fi
            if [ "$2" != skipped ]; then
              printf 'QA: %s reported %s\n' "$1" "$2" >&2
              exit 1
            fi
          }
          require "suite plan" "$PLAN_RESULT" true
          require "core graph" "$CORE_RESULT" "$CORE_REQUIRED"
          case "$MATRIX_COUNT" in
            0) require "integration matrix" "$MATRIX_RESULT" false ;;
            ''|*[!0-9]*) echo "QA: missing or invalid matrix count" >&2; exit 1 ;;
            *) require "integration matrix" "$MATRIX_RESULT" true ;;
          esac
          require demo-container "$DEMO_RESULT" "$DEMO_REQUIRED"
          require cross-link "$CROSS_RESULT" "$CROSS_REQUIRED"
          if [ "$LIVE_ELIGIBLE" != true ]; then
            DATAHUB_REQUIRED=false
            BQ_REQUIRED=false
          fi
          require e2e-datahub-adbc "$DATAHUB_RESULT" "$DATAHUB_REQUIRED"
          require bigquery-conformance "$BQ_RESULT" "$BQ_REQUIRED"
