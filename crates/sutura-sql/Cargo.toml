[package]
name = "sutura-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "Rendering: a QueryPlan becomes one statement in one dialect. What SQL-speaking adapters share."

[dependencies]
sutura-domain = { workspace = true }
# The dialect layer. Renders a statement AST into one target dialect: it is what knows that
# `ClickHouse` spells `DATE_TRUNC` as `dateTrunc` and `SUM` as `sum`, which is not a difference
# worth maintaining by hand. Confined to `generate.rs` so a pre-1.0 API change touches one file.
#
# **This crate exists so that this line is not in `sutura-semantic`'s manifest.** A build that
# executes plans on the engine and renders nothing used to link a SQL generator through the core;
# `cargo xtask check-boundaries` now fails if that edge comes back.
polyglot-sql = { workspace = true }
serde = { workspace = true }
# Read for exactly one question, and it is a question the typed API cannot answer. An aggregate's
# `FILTER (WHERE ..)` is a `filter` FIELD on eleven different node structs rather than a node of its
# own, so a walk over the AST sees its predicate as an ordinary child and nothing marks it; the typed
# way to ask would be the child-path API, whose `ChildPathSegment` is `pub(crate)`. The serialized
# form is where the field name is visible. Not a new dependency anywhere: `sutura-domain` already
# compiles it for the definition digest, so this adds an edge and no lockfile entry.
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
