# A reading worker group whose `egress` entry is every address, which would leave its policy bounding
# nothing.
environment: production
security:
  metricsToken:
    secretName: sutura-metrics-token
  inbound:
    keySetSecretName: sutura-inbound-keys
workerPool:
  enabled: true
  issuer:
    name: sutura-nodes
networkPolicy:
  enabled: true
readingWorkers:
  groups:
    orders:
      sources: [orders]
      egress:
        - cidr: 0.0.0.0/0
          port: 5432
      catalogs:
        - name: model
          kind: markdown
          dir: /srv/sutura/catalog
          data_dir: /srv/sutura/data
          version: "1"
config:
  base:
    security:
      identity: multi-user
      inbound:
        mode: direct
        resource: https://sutura.example.com
        authorization_server: https://issuer.example.com
        algorithms: [RS256]
    sources:
      orders:
        kind: files
        data_dir: /srv/sutura/orders
        posture: shared-service-user
        acknowledged_because: "a directory this deployment owns"
