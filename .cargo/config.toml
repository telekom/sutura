# lld everywhere: link time dominates the inner loop once a workspace has more than a few
# crates. devenv supplies clang/lld, which is what makes this portable rather than a
# per-machine setup note.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-apple-darwin]
linker = "lld"
[target.x86_64-apple-darwin]
linker = "lld"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# musl is deliberately unsupported for now; kept as a note rather than deleted so a
# reader knows it was considered.
#[target.x86_64-unknown-linux-musl]
#linker = "musl-gcc"
