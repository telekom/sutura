<script>
  const svg = document.querySelector('.diagram-container > svg');
  const edges = [...svg.querySelectorAll('[data-edge-id]')];
  const show = (id) => {
    svg.classList.add('focus');
    svg.querySelectorAll('.on').forEach((el) => el.classList.remove('on'));
    svg.querySelector(`[data-node-id="${id}"]`).classList.add('on');
    for (const e of edges) {
      if (e.dataset.edgeFrom !== id && e.dataset.edgeTo !== id) continue;
      e.classList.add('on');
      for (const end of [e.dataset.edgeFrom, e.dataset.edgeTo]) {
        svg.querySelector(`[data-node-id="${end}"]`).classList.add('on');
      }
    }
  };
  const clear = () => svg.classList.remove('focus');
  for (const node of svg.querySelectorAll('[data-node-id]')) {
    node.addEventListener('mouseenter', () => show(node.dataset.nodeId));
    node.addEventListener('focus', () => show(node.dataset.nodeId));
    node.addEventListener('mouseleave', clear);
    node.addEventListener('blur', clear);
  }
  document.getElementById('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });
</script>
