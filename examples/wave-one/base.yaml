# The settings template for wave one - a `datahub` catalog, a `bigquery` source under one shared
# credential, a real issuer. Copy this to your own `base.yaml`, replace every `<...>` placeholder,
# and serve it. The `datahub` catalog keys and the served `catalog.kind: datahub` come from issue
# #202's served PR. This is the shape `served/e2e.rs`'s runnable cell maps onto - `shared-service-
# user`, one credential for whoever asks - and NOT the exchanged-identity shape: that source
# executing AS the asking subject is the maintainer's binding (issue #376 P2), and
# `docs/where-identity-is-proven.md` keeps it `unrun`.

server:
  host: "127.0.0.1"
  port: 0

security:
  # The caller's identity arrives per request - the asker's own token, never the deployment's.
  identity: "single-user"
  single_user_because: "one shared BigQuery credential answers this catalog's questions for whoever a real issuer verified"
  inbound:
    mode: "direct"
    # The audience this deployment validates - copies of the issuer's own discovery document.
    resource: "<https://your-issuer.example.com/resource>"
    authorization_server: "https://your-issuer.example.com"
    key_set_file: "/etc/sutura/issuer-jwks.json"
    algorithms: ["RS256"]

telemetry:
  format: "bunyan"

catalogs:
  - name: "metrics"
    kind: "datahub"
    # Two required but unread path fields (a stated limit of the settings surface) - the datahub
    # reader opens the endpoint, not a directory.
    dir: "/unused-for-datahub"
    data_dir: "/unused-for-datahub"
    version: "<your-build-or-commit>"
    # Your own DataHub instance, serving the structured-property document ADR 0016 requires.
    endpoint: "http://127.0.0.1:<datahub-port>"
    token_file: "/etc/sutura/datahub-pat"
    # The structured-property name your deployment chose for the certified metric document.
    metric_property: "<your-metric-property>"

sources:
  # Named identically to the catalog above - the served `datahub` arm's fixed `bigquery`→name
  # mapping resolves a harvested model to a physical table in THIS source's own dataset.
  metrics:
    kind: "bigquery"
    billing_project: "<your-billing-project>"
    dataset: "<your-dataset>"
    credential_file: "/etc/sutura/bigquery.json"
    max_bytes_billed: 1073741824
    posture: "shared-service-user"
