# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:
    inputs:
      operation:
        description: Run reviewed explicit-projection production mutations
        type: choice
        required: true
        options: [sql-mutations]
      request_id:
        description: Exact reviewed mutation request
        type: string
        required: true
      expected_helper_sha:
        description: Exact reviewed helper commit
        type: string
        required: true
      source_sha:
        description: Exact frozen source commit
        type: string
        required: true
      source_tree:
        description: Exact tree of the frozen source commit
        type: string
        required: true
      comparison_sha:
        description: Exact ancestor for the finishing comparison
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: inbound-finishing-gates-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: rust-mcp-16core
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the exact reviewed mutation request and helper
        if: github.event_name == 'workflow_dispatch'
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          COMPARISON_SHA: ${{ inputs.comparison_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          EXPECTED_HELPER_SHA: ${{ inputs.expected_helper_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = telekom/sutura
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/ci/explicit-projection-mutations-1970-57621da4
          test "$OPERATION" = sql-mutations
          test "$REQUEST_ID" = 57621da4-aaa8-40c2-81a7-49788d30bf84
          test "$SOURCE_SHA" = f3fc15632ea5e0f6b6c1e2df78e7da664ddcb9b0
          test "$SOURCE_TREE" = e9635d02892ced3a6c68951bafd91c8b13250da3
          test "$COMPARISON_SHA" = 38de15bece6539352d4831d464188e386043593d
          [[ "$EXPECTED_HELPER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HELPER_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_HELPER_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HELPER_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(sha256sum devco/inbound_verifier_proof.py)" = "618678e649fcf47867935ffcd59a30649096525c64d6ca54e9a7d732fef27707  devco/inbound_verifier_proof.py"
          test "$(sha256sum devco/sql1909-finishing-mutations.json)" = "626b748d098c4b16d90b84b6d49383729aef63443a7639e1abba5421e0f4d03b  devco/sql1909-finishing-mutations.json"
          test "$(sha256sum devco/sql1970-mutation-ownership.json)" = "1d9d616d0709127bdd01dec431dfc048f9b97a5a177f49b042cc2f177e228f1a  devco/sql1970-mutation-ownership.json"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/reclaim-disk
        if: github.event_name == 'workflow_dispatch'

      - name: Open KVM for the full validation gate
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            keep-outputs = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: $/.github/actions/nix-store-cache
        with:
          scope: ci

      - name: markdown, yaml, toml and python
        if: github.event_name != 'workflow_dispatch'
        run: bash nix/format-text.sh check

      - name: Run the requested source checks
        if: github.event_name == 'workflow_dispatch'
        working-directory: source
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          COMPARISON_SHA: ${{ inputs.comparison_sha }}
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND
          export CARGO_TERM_COLOR=never NO_COLOR=1
          for revision in "$SOURCE_SHA" "$SOURCE_TREE" "$COMPARISON_SHA"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git show -s --format=%P HEAD)" = "$COMPARISON_SHA"
          mkdir -p target/inbound-verifier-proof
          cp ../devco/sql1909-finishing-mutations.json target/inbound-verifier-proof/mutation-plan.bound.json
          cp ../devco/sql1970-mutation-ownership.json target/inbound-verifier-proof/mutation-ownership.bound.json
          finishing_plan_path="$RUNNER_TEMP/finishing-plan.json"
          printf '{"source_sha":"%s","source_tree":"%s","comparison_sha":"%s"}\n' "$SOURCE_SHA" "$SOURCE_TREE" "$COMPARISON_SHA" > "$finishing_plan_path"
          finishing_operations=(validate ship-check)
          if [[ "$OPERATION" == preflight ]]; then
            finishing_operations=(preflight)
          elif [[ "$OPERATION" == gates-mutations ]]; then
            finishing_operations+=(mutations)
          elif [[ "$OPERATION" == sql-mutations ]]; then
            finishing_operations=(sql-mutations)
          fi
          for finishing_operation in "${finishing_operations[@]}"; do
            nix shell --inputs-from . nixpkgs#python3 nixpkgs#just nixpkgs#pixi nixpkgs#devenv nixpkgs#betterleaks --command python3 -I ../devco/inbound_verifier_proof.py "$finishing_operation" "$finishing_plan_path"
          done

      - name: Retain evidence and any generated changes
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inbound-finishing-gates-${{ github.run_id }}
          path: source/target/inbound-verifier-proof/
          if-no-files-found: error
          retention-days: 14
