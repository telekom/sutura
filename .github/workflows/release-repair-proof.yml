name: release-repair-proof

on:
  push:
    branches: [ci/release-repair-proof-final]
  workflow_dispatch:
    inputs:
      task:
        description: Proof to run
        required: true
        type: choice
        options:
          - format-export
          - validate
          - ship-check
          - fuzz-smoke
          - verify
      sha:
        description: Exact commit to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  format-export:
    if: inputs.task == 'format-export'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.event.before || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            fallback = true

      - name: Format VENDOR.md and export the result
        run: |
          set -euo pipefail
          nix run .#dprint -- fmt VENDOR.md
          mkdir -p proof
          cp VENDOR.md proof/VENDOR.md
          git diff --binary -- VENDOR.md > proof/VENDOR.md.patch
          git diff --numstat -- VENDOR.md > proof/VENDOR.md.numstat
          git rev-parse HEAD > proof/source-sha
          sha256sum proof/VENDOR.md proof/VENDOR.md.patch proof/VENDOR.md.numstat proof/source-sha

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-repair-format
          path: proof/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  validate:
    if: github.event_name == 'push' || inputs.task == 'validate' || inputs.task == 'verify'
    runs-on: rust-mcp-32core
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.event.before || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            fallback = true

      - name: Run just validate with the pinned secret scanner
        run: nix shell nixpkgs#betterleaks nixpkgs#devenv nixpkgs#pixi --command bash -lc 'nix run .#just -- validate'

  ship-check:
    if: github.event_name == 'push' || inputs.task == 'ship-check' || inputs.task == 'verify'
    runs-on: rust-mcp-32core
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.event.before || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            fallback = true

      - name: Run just ship-check
        run: nix shell nixpkgs#devenv nixpkgs#pixi --command bash -lc 'nix run .#just -- ship-check'

  fuzz-smoke:
    if: github.event_name == 'push' || inputs.task == 'fuzz-smoke' || inputs.task == 'verify'
    runs-on: rust-mcp-32core
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.event.before || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            fallback = true

      - name: Run just fuzz-smoke
        run: nix shell nixpkgs#devenv --command bash -lc 'nix run .#just -- fuzz-smoke'
