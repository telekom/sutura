apiVersion: v2
name: sutura
description: |
  Identity-aware semantic data runtime, served over HTTP. One Deployment running the
  published `sutura serve` image over a settings tree - the same directory-plus-env-vars
  layering `sutura-config` reads everywhere else, so this chart configures nothing the
  binary itself does not.
type: application
# The chart's own version, bumped on a template or values change. Independent of appVersion.
version: 0.1.0
# `sutura`'s own version is the release tag (docs/verifying-a-release.md), not this crate
# workspace's placeholder - there is no single tag to pin here without this file rotting on
# every release, so `image.tag` defaults to `latest` rather than to this field. Kept at a
# fixed placeholder rather than tracking a moving tag no mechanism here enforces agreement
# with; see `values.yaml`'s `image.tag` for what actually decides the pulled digest. A RELEASED
# chart is packaged with `--app-version <tag>` (`.github/actions/publish-chart`), so its default
# image is the one that release pushed; `latest` is only what a checkout renders.
appVersion: "latest"
home: https://github.com/telekom/sutura
sources:
  - https://github.com/telekom/sutura
keywords:
  - semantic-layer
  - metrics
  - data-runtime
maintainers:
  - name: the sutura authors
    url: https://github.com/telekom/sutura
# Artifact Hub listing metadata - #149 branch 4. Keys read off
# https://artifacthub.io/docs/topics/annotations/helm/ at implementation time, not from memory:
# a wrong key fails silently as a missing listing field rather than as an error, per the
# owner's own warning on #149. `license` and `links` are the two documented keys this chart
# has real values for; no `maintainers` override (the block above already carries no personal
# name or email) and no signing-related key - that page names `signKey` for a GPG-signed
# `.prov` file, which this chart does not produce, and no Helm-chart-kind annotation
# advertising cosign/Sigstore verification was found there, so none is asserted.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/telekom/sutura
    - name: support
      url: https://github.com/telekom/sutura/issues
