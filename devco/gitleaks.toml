# betterleaks configuration.
#
# `useDefault = true` is load-bearing: a config file REPLACES the default rule set unless it
# extends it, so omitting this would leave a scanner that reports nothing and a gate that
# always passes - the worst possible failure mode for a secret check.
[extend]
useDefault = true

[allowlist]
description = "Imported prose and generated tool output: neither is our source"
# A GCP API enum, not a credential: `key_algorithm="KEY_ALG_RSA_2048"` on the service-account Key
# resources in the test-infra pulumi program trips the `generic-api-key` rule (it is exactly the
# `key...= "UPPERCASE_VALUE"` shape that rule exists for). Suppressing by the enum's VALUE keeps
# every real constructor in the same file scanned - the alternative, exempting the pulumi path,
# would walk past a genuine key typed in the same file. Deliberately narrow; nothing a real
# secret could contain is also called KEY_ALG_RSA_2048.
regexes = [
    '''KEY_ALG_RSA_2048''',
]
# Scoped to PATHS rather than to a rule or a regex. `.agents/skills/**` is imported prose
# whose sha256 `cargo xtask check-skills` verifies, so the usual escape hatch - a
# `betterleaks:allow` comment on the offending line - is unavailable here: editing a
# mirrored file to silence a scanner would make the recorded hash a lie.
#
# What actually tripped: 09_universal_guidelines.md in the Microsoft Rust guidelines shows
# `let key = "REDACTED";` as an example of what NOT to write, and the `generic-api-key` rule
# matched the literal. The file is documentation about avoiding hardcoded secrets.
#
# Deliberately narrow. Our own code and configuration are still scanned, which is the
# point: this exempts imported prose, not the repository.
paths = [
    '''\.agents/skills/engineering/ms-rust/.*''',
    '''\.agents/skill-library/.*''',

    # Generated by the local toolchain, gitignored, and never committed. `dir .` walks them
    # anyway, so the push-tier sweep was failing on findings CI's clean checkout cannot
    # reproduce - a gate that cries wolf, which is how a real finding gets waved through.
    #
    # What tripped: devenv bakes each `devenv shell -c` invocation into a script under
    # `.devenv/`, so an ad-hoc verification run that used the example access token left that
    # token on disk seven times over. Allowlisted by PATH, so anything these tools generate
    # into a scanned directory is still scanned.
    # MEASURED, the first time the keycloak tier was ever started: `nix/keycloak-tier.nix` writes
    # the realm's generated client secret, admin password and per-subject passwords to
    # `.sutura-dev/keycloak-realm.json` - a reader needs them to ask for a token - and the sweep
    # then reported two `generic-api-key` findings, so `just secrets`, `just validate` and the
    # push hook all went red for anyone with a tier up. Nothing there was ever committable: the
    # directory is gitignored, every value is generated per `start`, the file is `0600`, and
    # `stop` removes it. CI's clean checkout cannot reproduce any of it, which is the cry-wolf
    # shape this block already exists for.
    '''\.sutura-dev/.*''',
    '''\.devenv/.*''',
    '''\.pixi/.*''',
    # The token fuzzer's seeds, and ONLY that one directory. A seed for `fuzz_targets/bearer_token`
    # is a JWT by construction - that is what the target parses - so the `jwt` rule matches its
    # SHAPE while nothing there is a credential: the header/claims are `example.com` fixtures and
    # the signature segment is padding no key produced.
    #
    # MEASURED on the way in: `fuzz/seeds/bearer_token/alg-none` (an `{"alg":"none"}` header over
    # a `user@example.com` subject and an empty signature) tripped the `jwt` rule, so the commit
    # hook, `just secrets` and `just validate` all went red on a file that is a parser input.
    #
    # WHY A PATH AND NOT A `betterleaks:allow` COMMENT, which is the escape hatch this file prefers:
    # a seed has no comment syntax, and `fuzz/seeds/**` is byte-exact in `text-hygiene` precisely
    # because a crash reproducer stops reproducing if anything edits it.
    #
    # DELIBERATELY NARROW, and the narrowness is the control: the other three seed directories are
    # still scanned, so a credential pasted into a JSON or catalog seed is still a finding. What
    # this DOES walk past is a real token committed into this one directory - stated rather than
    # implied, because `cargo xtask check-fuzz` reads seed directories for emptiness and never
    # reads their content.
    '''fuzz/seeds/bearer_token/.*''',
    '''target/.*''',
    '''result(-[a-z0-9-]+)?/.*''',
]
