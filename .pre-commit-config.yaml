# Hooks, run by `prek` (a single Rust binary - no Python runtime needed to lint Rust).
# The config format is pre-commit's, so it stays reversible: `pre-commit` runs it too.
#
# Tiered by cost on purpose. A hook that takes 40 s on every commit gets disabled by the
# team inside a week, so fast checks run on commit and slow ones on push.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push, commit-msg]
minimum_pre_commit_version: "3.0.0"

repos:
  - repo: local
    hooks:
      # --- on commit: fast, and scoped to the touched area -------------------
      - id: rust-fmt
        name: cargo fmt
        # Through xtask, not `cargo fmt --all`: `--all` formats every package cargo
        # metadata reports, INCLUDING path dependencies that `[workspace] exclude` keeps out
        # of the member list. It wanted to rewrite the vendored mimalloc source, which is the
        # one thing vendoring must not do. xtask derives the package list instead.
        entry: bash -c 'source nix/stable-env.sh; exec cargo run -q -p xtask -- fmt --check'
        language: system
        files: \.rs$
        pass_filenames: false

      # `--all-features` is not optional here: the adapters are feature-gated and
      # default-off, so without it clippy inspects almost nothing and reports success.
      #
      # THROUGH `nix/stable-env.sh`, and this is the fix rather than the decoration. That file's own
      # header says why: "Clippy's lint set differs between channels and this repo enables the whole
      # `restriction` category with `-D warnings`. Nightly clippy knows lints stable does not, so
      # gating on nightly means local failures CI cannot reproduce and local passes CI rejects." It
      # then says it is sourced by the devenv gate scripts and the justfile recipes - and this hook
      # was not one of them, so every commit inside the dev shell gated on NIGHTLY clippy while CI
      # gated on stable.
      #
      # That is not theoretical. A nightly moved and brought `rest_pattern_accessible_field` and
      # `assert_is_empty` with it, and the hook went red on files nobody had touched - including
      # `xtask/src/text.rs`, which is what makes this pre-existing rather than a new rule. `-D
      # warnings` turns each one into a wall in front of every commit in the repository.
      #
      # `bash -c` because `language: system` runs the entry as a command rather than through a
      # shell, so there is nothing to source it otherwise.
      #
      # THE ANCHOR IS LOAD-BEARING, and not for tidiness. `rust-clippy-push` below aliases this
      # exact scalar, so the two stages cannot invoke clippy differently - and cargo's fingerprints
      # are keyed on the invocation, so a divergence of ONE flag would stop the push stage reusing
      # what this hook just built and turn a one-second no-op into a full workspace check. One YAML
      # node is the only form of "the same command" that cannot drift; `cargo xtask check-hook-tiers`
      # is what fails if somebody replaces the alias with a copy.
      - id: rust-clippy
        name: cargo clippy (-D warnings, all features, on stable)
        entry: &clippy bash -c 'source nix/stable-env.sh; exec cargo clippy --workspace --all-targets --all-features -- -D warnings'
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

      # Every cheap structural gate, in one hook. It was eight, and all eight walk the
      # whole repo regardless of `files:` scoping - so eight hooks meant eight redundant
      # tree walks. xtask owns which gates these are (`Kind::Hygiene`).
      - id: hygiene
        name: structural gates
        entry: bash -c 'source nix/stable-env.sh; exec cargo run -q -p xtask -- hygiene'
        language: system
        pass_filenames: false
        always_run: true

      # Narrowed by the changed files pre-commit passes us: editing one crate should not
      # pay for a workspace check. Clippy below still sees the whole workspace, so this is
      # fast feedback, never the only thing that inspects the code. A path that belongs to
      # no package widens to `--workspace` rather than checking less than was asked.
      - id: rust-check-changed
        name: cargo check (changed packages only)
        entry: bash -c 'source nix/stable-env.sh; exec cargo run -q -p xtask -- check-changed "$@"' --
        language: system
        files: \.rs$
        pass_filenames: true
        # `pass_filenames: true` lets prek PARTITION the paths and run this hook once per
        # partition, concurrently. Two simultaneous invocations on one target directory means two
        # `cargo metadata` calls, two xtask builds, and one of them blocked on the build-directory
        # lock for the duration - all of it to check the same workspace. Serial is strictly
        # cheaper here, and one line.
        require_serial: true

      # A commit is the claim that the change works, so the tests run BEFORE it, not on push.
      # They were on pre-push, which inverts that: the claim is already in history by the time
      # anything checks it, and a failure then needs a second commit to undo the first.
      #
      # Through nix/run-gate.sh, which falls back to nix and then to a notice. Called
      # `cargo nextest` directly before, and on a host without it every commit would be
      # blocked with "no such command" - a hook that cannot run must not be a wall. CI runs
      # this unconditionally, so the fallback delays a finding rather than losing it.
      - id: rust-tests
        name: cargo nextest (all features)
        entry: bash nix/run-gate.sh tests
        language: system
        pass_filenames: false

      # nextest does not run doctests. Separate hook so its absence is visible rather than
      # assumed to be covered above.
      - id: rust-doctests
        name: doctests
        entry: bash -c 'source nix/stable-env.sh; exec cargo test --doc --workspace --all-features'
        language: system
        pass_filenames: false

      # The jscpd copy/paste gate (issue #474). Scoped by `files:` to the Rust that can
      # duplicate and the things that decide the verdict - the allowlist, the gate, and the
      # nix provisioning. It scans the WHOLE first-party Rust tree (`crates/`, `xtask/`, the
      # same paths `check-jscpd` uses), not just the diff: a clone is a fact about two files
      # that rarely sit in one edit.
      #
      # Through nix/run-gate.sh, the same tiering the tests and CRAP hooks use - and jscpd is
      # the only pin for the version, so `cargo xtask check-pins` fails if it reappears in
      # pixi.toml. The fail-closed verdict with the allowlist is `checks.hygiene`; where this
      # host cannot run the gate, it delays the finding to CI rather than blocking the commit.
      - id: jscpd
        name: copy/paste detection (jscpd)
        entry: bash nix/run-gate.sh jscpd
        language: system
        files: ^(crates/.*\.rs|xtask/.*\.rs|devco/dup-ignore|xtask/src/jscpd\.rs|nix/(jscpd\.nix|run-gate\.sh)|flake\.nix)$
        pass_filenames: false

      # The CRAP score: cyclomatic complexity weighted by the tests that cover it.
      #
      # SCOPED BY `files:` so it does not fire on unrelated edits. The regex is the scored crate
      # plus everything that can change the verdict without touching it - the policy, the gate,
      # the pin, and the manifests that decide what compiles. Editing the HTTP crate must not pay
      # for a coverage build; editing `.cargo-crap.toml` must.
      #
      # COMMIT STAGE, not push, and that is affordable rather than brave: the scope is
      # `sutura-domain`, whose whole instrumented build is 11 s cold and 4 s warm. Every wider
      # scope was measured and is in docs/crap.md; `--workspace` is over six minutes and never
      # reached a test.
      #
      # Through `nix/run-gate.sh`, which falls back to `nix run .#crap` and then to a notice. The
      # gate itself FAILS when a tool is missing - a score is the whole point and a run that
      # produced none has judged nothing - so the tiering belongs here, in the bypassable layer,
      # and not in the gate.
      - id: rust-crap
        name: CRAP score (complexity weighted by coverage)
        entry: bash nix/run-gate.sh crap
        language: system
        files: ^(crates/sutura-domain/.*\.rs|\.cargo-crap\.toml|xtask/src/crap\.rs|nix/(crap\.nix|run-gate\.sh|stable-env\.sh)|rust-toolchain\.toml|Cargo\.(toml|lock))$
        pass_filenames: false
        require_serial: true

      # Every shell script we ship, and the glob IS the list.
      #
      # It was two hand-written lists - two files named in the justfile, one in ci.yml - under a
      # comment claiming to be exhaustive, which it was of neither. `nix/run-gate.sh` was in
      # neither, and that file decides whether the tests, the secret sweep, the supply-chain gate
      # and now the CRAP score run AT ALL: a `set -eu` slip there turns four gates into silent
      # no-ops at once. A `files:` glob cannot drift the way a transcribed list does.
      #
      # Through nix, the only pin for shellcheck - its version decides what it reports, so
      # `cargo xtask check-pins` fails if it reappears in pixi.toml. Skipped with a notice where
      # nix is absent, like the other nix-backed hooks here.
      #
      # IT IS A COMMIT HOOK, and it sat under the push banner below for its whole life while
      # CONTRIBUTING.md listed it as a push gate. It declares no `stages:`, so it inherits
      # `default_stages: [pre-commit]` - the banner was the only thing saying otherwise. Moved
      # rather than restaged: the tier it has always RUN at is the right one, since a `.sh` edit is
      # cheap to check and the finding is most useful before the commit claiming the script works.
      - id: shellcheck
        name: shell scripts
        entry: >-
          bash -c 'command -v nix >/dev/null 2>&1
          && exec nix run .#shellcheck -- -x "$@"
          || echo "shellcheck skipped - no nix on this host, CI enforces it"' --
        language: system
        files: \.sh$
        pass_filenames: true

      # --- on push: what only makes sense against the whole tree, or was never
      # --- compiled at all because a rebase runs no commit hook ---------------
      # The whole tree, not just the diff. The commit-stage scan above is staged-only, so a
      # finding in a file committed long ago reaches CI unseen - which is exactly what happened.
      - id: secret-sweep
        name: secrets, whole tree (as CI scans it)
        entry: bash nix/run-gate.sh secrets
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-deny
        name: advisories, licences, bans, sources
        entry: bash nix/run-gate.sh supply-chain
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Formatting, on the channel CI uses.
      #
      # THE SPLIT THIS EXISTS FOR: local tasks build on the cranelift nightly for speed, and CI
      # is the authority and runs stable. That is deliberate, and for anything that CODEGENS it
      # costs nothing but time. rustfmt is different - its OUTPUT can differ between channels, so
      # the commit-stage `rust-fmt` hook above can be green on nightly while `checks.fmt` is red.
      # Today the two agree byte-for-byte over this tree, so this is latent rather than live, and
      # a latent divergence only CI can see is the exact shape of the clippy incident this repo
      # already had.
      #
      # Push is the right tier for the same reason the whole-tree secret sweep is here: it is the
      # last local chance to see what CI will see. And it is CHEAP - `run-gate.sh fmt-parity`
      # builds the flake check, which compiles nothing, so with nix present this is a cache
      # lookup rather than a second toolchain.
      - id: fmt-parity
        name: formatting on stable (as CI checks it)
        entry: bash nix/run-gate.sh fmt-parity
        language: system
        files: \.rs$
        pass_filenames: false
        stages: [pre-push]

      # THE PUSH STAGE COMPILES. Until this hook it did not, and that was a hole rather than a
      # tier: every compiling gate was on COMMIT, and a rebase runs no commit hook at all - so a
      # conflict resolution went to the remote with nothing having compiled it. Measured, three
      # times in one day: a hand-resolved merge whose `sutura-config` did not build; a CLEAN merge
      # of two branches where one changed a signature and the other added a call site against the
      # old one, which git cannot see as a conflict at all; and a branch red on CI's format step.
      #
      # AN ALIAS OF THE COMMIT-STAGE ENTRY, and that is the whole reason this is affordable.
      # cargo keys its fingerprints on the invocation, so the identical command reuses what the
      # commit hook built: measured on this tree at 1.0 s for a push whose commits went through a
      # commit hook, against 76.6 s for the same clippy into an empty target directory. A gate that
      # makes `git push` slow gets bypassed with `--no-verify`, and then it guards nothing.
      #
      # `cargo check` was the other candidate and is strictly worse: clippy and check do not share
      # fingerprints for the workspace's own crates, so `cargo check` here is a second pass over
      # them - 3.5 s measured immediately after a warm clippy, against clippy's own 1.0 s - to
      # learn less than clippy already reports. The DEPENDENCY closure is shared, which is why that
      # figure is seconds rather than another 76; what pays twice is our own fifteen crates.
      #
      # LAST in the stage, because the three gates above are cheaper and one of them reads better:
      # `fmt-parity` runs rustfmt, which cannot PARSE a file with an unclosed delimiter, so a
      # syntax error is already reported there - verified. What only a compiler sees is a tree that
      # parses and does not type-check, which is the merge case above.
      #
      # SCOPED by `files:`, which is the only honest narrowing available: at this stage prek passes
      # the paths between the remote ref and the local one, so a docs-only push pays nothing.
      # Whether the pushed commits ALREADY went through a commit hook is not detectable - a rebased
      # commit is indistinguishable from a hooked one - so within a Rust-touching push it is
      # unconditional, and the fingerprint reuse rather than a detector is what keeps it cheap.
      - id: rust-clippy-push
        name: cargo clippy (again, because a rebase ran no commit hook)
        entry: *clippy
        language: system
        files: \.(rs|toml)$
        pass_filenames: false
        stages: [pre-push]

      # --- on commit-msg ------------------------------------------------------
      # `default_install_hook_types` above declares `commit-msg`, and AGENTS.md states the
      # convention. Until this hook existed, neither of those checked anything.
      - id: commit-msg
        name: conventional commit subject
        entry: cargo run -q -p xtask -- commit-msg
        language: system
        stages: [commit-msg]

      # Secret detection on the staged diff, when the tool is available. `--redact` keeps a
      # finding out of terminal scrollback and out of any log.
      #
      # It says so and continues when betterleaks is absent, which is deliberate and is not a
      # gate failing open: a hook is bypassable with `--no-verify`, so it was never the
      # enforcement point. CI runs the scan over the whole tree ungated, and that is what
      # decides. Blocking every commit on a host where the tool cannot be installed would only
      # teach people to pass `--no-verify` habitually, which costs more than it saves.
      - id: betterleaks
        name: detect hardcoded secrets (CI is authoritative)
        entry: >-
          sh -c 'command -v betterleaks >/dev/null 2>&1 ||
          { echo "betterleaks not on PATH - skipped here; CI enforces the scan"; exit 0; };
          betterleaks git --pre-commit --config devco/gitleaks.toml --redact --staged --verbose'
        language: system
        pass_filenames: false

      # Workflow static analysis: template injection into `run:`, over-permissive tokens,
      # untrusted checkout.
      #
      # Through nix, which is the ONLY pin for it - the version decides what it reports, so a
      # second pin in pixi would be a second verdict. Skipped with a notice where nix is
      # absent, the same way the secret scan behaves: CI runs it unconditionally, so a skip
      # here delays the finding to the PR rather than losing it.
      - id: zizmor
        name: GitHub Actions static analysis
        # A block scalar, not a plain one: the command contains `: `, which YAML reads as a
        # mapping inside a plain scalar and rejects outright.
        entry: >-
          bash -c 'command -v nix >/dev/null 2>&1
          && exec nix run .#zizmor -- .github/workflows
          || echo "zizmor skipped - no nix on this host, CI enforces it"'
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
