[package]
name = "sutura-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "The sutura binary. Composes adapters; contains no business logic."

[[bin]]
name = "sutura"
path = "src/main.rs"

[features]
# In-process TLS termination for `sutura serve`. Default-off; see `sutura-http`'s feature of the
# same name.
#
# Named on BOTH crates rather than only on the library, because this is the crate that produces
# the binary: `--features tls` is what an operator types, and it has to reach `sutura-config` as
# well so the startup refusal for "asked for in-process TLS, built without it" agrees with what is
# actually linked. Arrived here whole from `sutura-serve`'s manifest of the same name -
# `github.com/telekom/sutura#685` step 2 folded that crate into this one's `serve` module.
tls = ["sutura-config/tls", "sutura-http/tls"]

# The BigQuery adapter, and with it the outbound HTTP stack its wire needs.
#
# **Default-off, and the reason is the ARTEFACT rather than the four cross builds** - the same
# decision every other adapter feature below carries. No published binary links an outbound
# TLS stack, and `checks.shipped-features` asserts that out of the binary's own embedded dependency
# list rather than out of this manifest.
#
# **The build-cost reason this comment used to give was measured false, and the correction is worth
# more than the sentence was.** `sutura-exec-bigquery`'s `wire` pulls `ureq` and its rustls closure -
# `ring` included, which compiles C and assembly - but that dependency is `optional`, so at cargo's
# default set it contributes nothing. The closure is in all four `sutura-deps-<triple>` derivations
# regardless: `crane.buildDepsOnly` is deliberately unscoped so the checks can share one dependency
# derivation, and it builds dev-dependencies, of which `sutura-catalog-datahub` has a NON-optional
# one on `ureq` for its provisioned-instance probe. Measured with `cargo tree` on 2026-09-04: on
# `aarch64-unknown-linux-musl` that dev-dependency is the ONLY edge into `ureq` at the default set,
# and a second host-side copy arrives as a build-dependency of `libduckdb-sys`. So making this
# feature non-optional would add nothing to any cross dependency derivation - what it would change
# is what the published binary links. `docs/adr/0017` carries the measurement.
#
# So the adapter arrives by asking: `cargo build -p sutura-cli --features bigquery`, or
# `--all-features`, which is what `just lint`, `just test` and every nix check already pass - so the
# registration is compiled, linted and tested on every run, and a bare `cargo build` is unchanged.
#
# **WHAT SHIPS is `nix/shipped.nix`'s decision and not this line's**, and it publishes the binary
# with cargo's DEFAULT features. The gate that holds it is named in the first paragraph;
# what this one adds is that turning the feature on here would not change what a release contains.
#
# **Which gate sees the feature OFF, because every other one passes `--all-features`.**
# `cargo xtask check-default-features`, in `just gates`, derives its package list from
# `nix/shipped.nix`'s `binaries` - so this crate is in it - and runs `cargo check` AND `cargo clippy`
# at the DEFAULT set: that is what compiles the `cfg(not(feature = "bigquery"))` half of
# `src/sources/bigquery.rs` and the one-variant `Opened` beside it, and clippy is in there because
# `cargo check` cannot see a lint. **Neither of them RUNS anything**, both stopping at metadata, so
# the `cfg(not(feature = "bigquery"))` TEST in `src/sources/bigquery.rs` was compiled by that gate
# and executed by no venue at all until `cargo xtask check-default-feature-tests` - same package
# list, same set, and it links and runs. Both reach CI now, as `nix run .#default-features` and
# `nix run .#default-feature-tests` in the required `ci` job, so this lane's lint half is a required
# check rather than the four `cross` link builds and a developer's memory.
bigquery = ["dep:sutura-exec-bigquery", "sutura-exec-bigquery/adbc"]

# The Postgres adapter, and with it the outbound TLS the source channel verifies against.
#
# **Default-off, and the reason is the ARTEFACT rather than the four cross builds** - the same
# decision `bigquery` above carries. `sutura-exec-postgres` is pure Rust, but `tokio-postgres-rustls`
# pulls the rustls closure with `ring` in it; keeping this feature off leaves that out of the
# published binary until a deployment asks for it.
#
# **`dep:tokio-postgres` too, arrived from `sutura-serve`'s own `postgres` feature at the fold -
# a strict superset of what this crate declared before it.** `tokio_postgres::Config` is used only
# by `tests/served/harness/postgres.rs`, which loads the example corpus into the real tier before
# starting the composed binary; it is a normal, optional dependency rather than a dev-dependency
# because Cargo has no way to make a dev-dependency optional, so it sits here unused by anything
# `sutura serve` itself calls. The adapter owns every driver type `sutura serve` composes with.
postgres = ["dep:sutura-exec-postgres", "dep:tokio-postgres"]

# The ClickHouse adapter, over its HTTP interface.
#
# **Default-off for the ARTEFACT reason `bigquery` above states**, plus one this feature has on its
# own: `sutura-exec-clickhouse` depends on `ureq`/`sutura-tls` NON-optionally (its own manifest says
# why - no composition root linked it, so there was no artefact for a feature to keep a TLS stack
# out of), so the edge into the outbound closure is this line and nothing narrower. `optional` is
# what makes the dependency ABSENT from the default build rather than merely unused, which is the
# property the four cross builds need.
#
# **It is not in `nix/shipped.nix`'s `features`, `allFeatures` or `probeFeatures`, and that is a
# decision rather than an omission.** Every other adapter feature is in `features` since
# `docs/adr/0017`'s Fifteenth amendment - one binary, every adapter compiled in. This one is held
# back because a correctness fix for the adapter is still open at the time this feature landed:
# `github.com/telekom/sutura#955` measured 6 of 23 parameter-binding corpus questions answering
# WRONG against the real `clickhouse-server` `compose.services.yaml` provisions, under ClickHouse's
# default `join_use_nulls = 0` - an outer join's unmatched side arriving as `''` where the engine
# says `NULL`. That issue carries the server version it was measured on; repeating it here would be
# a number no mechanism compares. A published binary that
# links this adapter before that lands is a deployment that can be handed a wrong number, so the
# feature is reachable by `--features clickhouse` and by `--all-features` (which is what `just
# lint`, `just test` and every nix check pass, so the registration is compiled, linted and tested on
# every run) and by no release. Adding the three `nix/shipped.nix` entries is the follow-up once
# `#955` has merged.
clickhouse = ["dep:sutura-exec-clickhouse"]

# The Oracle adapter, over Oracle's own pure-Rust driver.
#
# **Default-off for the ARTEFACT reason `bigquery` above states**: `optional` keeps the driver and
# its own `rustls` stack ABSENT from a build that did not ask for it.
#
# **Not in `nix/shipped.nix`'s `features`, `allFeatures` or `probeFeatures`, and for `clickhouse`'s
# kind of reason - measured, not feared.** Asked against `compose.services.yaml`'s real `oracle`
# image, every whole-plan question this repository renders for `Dialect::Oracle` ends in `LIMIT n`,
# which the server refuses (`ORA-03049`) - so a published binary linking this adapter today would
# answer no whole-plan question from an Oracle source (`github.com/telekom/sutura#127` carries the
# measurement). Reachable by `--features oracle` and `--all-features`, which is what every gate
# passes, and by no release.
oracle = ["dep:sutura-exec-oracle"]

# The DataHub metadata adapter's HTTP reader (issue #202), for `sutura serve`'s `catalog.kind:
# datahub`, and with it the outbound HTTP stack that reader needs.
#
# **Default-off for the same ARTEFACT reason `bigquery` above is**, and arrived from
# `sutura-serve`'s manifest at the fold. `sutura-catalog-datahub` already has a non-optional
# `ureq` DEV-dependency (its own `tests/provisioned.rs`), so this feature adds no new edge into
# the outbound TLS closure at the four cross builds' shared dependency derivation.
#
# `sutura-catalog-datahub/http` rather than a bare feature name on the dependency alone, mirroring
# `bigquery` above: the adapter crate's own feature gates its reader module, and this crate's
# feature is what an operator building `sutura` types.
datahub = ["dep:sutura-catalog-datahub", "sutura-catalog-datahub/http"]

# The agent surface: `sutura-mcp`'s streamable-HTTP transport, mounted by the composition root at
# `sutura serve`'s `/mcp`.
#
# **Default-off, and the reason is the ARTEFACT plus the identity posture rather than build time.**
# No published binary should serve a second, independently routed tool surface by accident, and the
# surface only makes sense behind leg 1 (`security.inbound`) - so this feature turns on
# `sutura-mcp`'s `http` module (`sutura-mcp` itself is already an unconditional dependency, for
# `sutura mcp`'s own stdio transport) and `sutura-http`'s `agent` feature that holds the mount point
# and the assembly-time refusal. Arrived from `sutura-serve`'s manifest at the fold - there
# `sutura-mcp` was optional and this feature also named `dep:sutura-mcp`; here it is already linked,
# so only the two sub-features carry over. `nix/shipped.nix` gains no `probeFeatures` entry here -
# `sse-stream`'s musl link is unattempted, deferred to a follow-up, the same deferral
# `checks.shipped-features` already documents.
agent = ["sutura-mcp/http", "sutura-http/agent"]

[dependencies]
sutura-app = { workspace = true }
sutura-catalog-local = { workspace = true }
# `catalog.kind: okf` - github.com/telekom/sutura#970. Not optional and behind no feature: the
# crate is a directory read over `sutura-domain + serde + serde_norway + thiserror`, the same
# closure `sutura-catalog-local` already is, so `.agents/skills/sutura/crate-map/SKILL.md`'s
# reason for a default-off feature (the ARTEFACT a native or outbound-TLS dependency would add)
# does not apply - this build links it unconditionally, the way it links markdown.
sutura-catalog-okf = { workspace = true }
# The settings tree, for `sutura prompt` alone. It is here so the prompt an operator pipes into an
# agent's configuration is rendered from the SAME layered configuration the service would read -
# `prompt.instructions_file` and `prompt.catalog_prose`, defaults then files then one variable per
# key - rather than from a second set of flags that could disagree with it.
sutura-config = { workspace = true }
sutura-domain = { workspace = true }
sutura-semantic = { workspace = true }
# `crate::serve::kind::AnyWarehouseError` - the closed-enum error erasing whichever adapter this
# build linked, `#[error(transparent)]` per variant. `telekom/sutura#112`'s enum is the first thing
# in this crate that needed a typed error of its own rather than the `Result<_, String>` this root
# is exempt into everywhere else.
thiserror = { workspace = true }
# `security.outbound.transport_anchors` (`github.com/telekom/sutura#125`) - the shared bundle-or-
# system-store read, resolved ONCE in `crate::sources::resolve_outbound_anchors` regardless of which
# adapter feature is on, the same way `sutura-config` itself is unconditional: a declaration is read
# and, on a build with no linked fixed-host client, simply unused - never a second per-feature copy
# of this dependency line.
sutura-tls = { workspace = true }
# Rendering, and this binary IS a SQL consumer: `sutura compile` exists to print the statement for a
# dialect somebody named on the command line, without opening a data system at all. So the
# generator is in this binary's tree deliberately and by a declared edge, which is the difference
# from before - it used to arrive through `sutura-semantic`, unasked, in every consumer of the core.
sutura-sql = { workspace = true }
# THE engine, and not feature-gated, because a binary that cannot answer anything is not a binary
# anybody wants. It is pure Rust, so it cross-compiles to musl - which is what forced the DuckDB
# adapter to be default-off, and is exactly the constraint this does not have.
sutura-exec-datafusion = { workspace = true }
# The BigQuery adapter, behind the `bigquery` feature above. `optional` is what makes the dependency
# ABSENT from the default build rather than merely unused, which is the property the cross builds need.
sutura-exec-bigquery = { workspace = true, optional = true }
# The Postgres adapter, behind the `postgres` feature above. `optional` is what makes the dependency
# ABSENT from the default build rather than merely unused, which is the property the cross builds
# need. The adapter owns its driver's connection config, so this root names no driver crate itself.
sutura-exec-postgres = { workspace = true, optional = true }
# The driver config used by `sutura serve`'s served-e2e loader, behind the `postgres` feature.
# Normal composition maps the declaration into `sutura_exec_postgres::connection`, so it names no
# driver type; `tests/served/harness/postgres.rs` loads the example corpus into the real tier
# before starting the composed binary and needs `Config` for that one setup connection. The
# adapter owns all TLS types, so this root needs no TLS crate. Optional rather than a
# dev-dependency because Cargo cannot make a dev-dependency optional - see `sutura-serve`'s
# former manifest, folded in at `github.com/telekom/sutura#685` step 2.
tokio-postgres = { workspace = true, optional = true }
# The ClickHouse adapter, behind the `clickhouse` feature above. Optional for the same reason
# `sutura-exec-bigquery` is: absent, not merely unused, from a build that did not ask for it. The
# adapter owns its own endpoint, credential and TLS types, so this root names no HTTP client itself.
sutura-exec-clickhouse = { workspace = true, optional = true }
# The Oracle adapter, behind the `oracle` feature above - optional for `sutura-exec-bigquery`'s
# reason. The adapter owns its driver's connection, so this root names no `oracledb` type itself.
sutura-exec-oracle = { workspace = true, optional = true }
# The DataHub metadata adapter, behind the `datahub` feature above. Optional for the same reason
# `sutura-exec-bigquery` is: absent, not merely unused, from a build that did not ask for it.
sutura-catalog-datahub = { workspace = true, optional = true }
# the single-player composition. An agent client launches the process and speaks MCP on its pipes,
# matching `examples/single-player` - which is exactly the shape roadmap wanted. The dependency is
# pure Rust (`rmcp`, `schemars`), so it cross-compiles to musl like the engine it drives.
sutura-mcp = { workspace = true }
# `sutura serve`'s HTTP surface, unconditional the same way `sutura-mcp` above is: since
# `github.com/telekom/sutura#685` step 2 folded `sutura-serve` into this crate's `serve` module,
# the transport it composes is a normal edge of the one composition-root crate rather than of a
# second binary.
sutura-http = { workspace = true }
# For `axum::Router` in one signature. The router is BUILT by `sutura-http`; this crate only names
# the type on its way to `serve::run`.
axum = { workspace = true }
# `TracingAuditSink`, the implementor of the `AuditSink` the service requires, plus the async
# runtime that drives `serve_stdio` and `serve::run`. The sink writes to `tracing`; a locally
# launched `sutura query`/`mcp` process has no subscriber, so records go nowhere until a
# composition installs one - the same posture `sutura serve` takes deliberately, since it installs
# one at boot.
sutura-runtime = { workspace = true }
# The runtime `serve_stdio` and `serve::run` build. `net`, `signal` and `sync` arrived from
# `sutura-serve`'s own manifest at the fold - the listener, the shutdown signal and the shutdown
# flag `serve::run` needs and `serve_stdio` does not. `rt-multi-thread` is on regardless of which
# command runs - the engine drives its own current-thread runtime but the workspace resolves the
# feature through it - so this feature line is not a decision about how wide either command runs.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
# A question arrives as a file a person wrote, so it is read the same way a catalog document is.
serde_norway = { workspace = true }
# `serve::run`'s own logging, moved here from a dev-dependency at the fold: `sutura-serve` logged
# unconditionally, and folding it in means every `sutura` invocation links `tracing` now rather
# than only a test binary's.
tracing = { workspace = true }
# The allocator, and Linux only. A target table rather than a plain dependency plus a `cfg`:
# this way the C is never compiled - not even a build script - on a macOS or Windows laptop,
# so the one platform we ship on is the only one that pays for it. `Cargo.lock` still records
# it, because a lockfile is target-agnostic by design.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { workspace = true }

[dev-dependencies]
# The domain's own `fixtures` feature, for `plan::RefusingCombiner` - the fake over
# `docs/adr/0007`'s second driven port. The served root builds the REAL combiner; this crate's own
# suite composes services that answer single-source questions, where a combiner that answered would
# be inventing a federated answer nothing reads.
sutura-domain = { workspace = true, features = ["fixtures"] }
# `tests/example.rs` runs `examples/single-player` and pins what came out. Snapshots rather than
# hand-written expectations, for the reason the rest of the repo uses them: a typed expectation
# asserts what somebody wished the generator did. Every test in it runs in the default build: the
# engine ships, so there is no longer a build in which the example cannot be executed.
insta = { workspace = true }
# The far side of the `mcp` handshake test: a real MCP client from the same SDK, over an in-memory
# pipe. Nothing this crate wrote sits between the assertion and the protocol.
rmcp = { workspace = true, features = ["client"] }
# The request JSON in that test, and the tool result's structured content. Also the audit records
# `src/audit.rs` reads back: a record is asserted by KEY, which needs the line parsed.
serde_json = { workspace = true }
# `testing::Capture`, the writer `src/audit.rs` puts a subscriber over. Declared again HERE rather
# than as a feature on the normal dependency above, which is what keeps `test-capture` out of the
# shipped build: dev-dependencies are not in the graph a `cargo build` resolves. The same
# arrangement `sutura-http` uses, and for the same reason - a second copy of that writer would be a
# second thing to keep in step.
sutura-runtime = { workspace = true, features = ["test-capture"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
# `tower::util::ServiceExt::oneshot`, for driving an assembled `sutura_http::router` over `/mcp`
# in `serve::tests::agent_identity` - the same shape `sutura_mcp`'s own hermetic tests drive the
# transport with. A dev-dependency (and a dev-edge of an already-linked crate), so it adds nothing
# to the shipped-features set. `util` is the feature `oneshot` lives in.
tower = { workspace = true, features = ["util"] }
# `tests/served.rs`'s harness client, for the one thing `served/harness.rs`'s own hand-rolled
# plaintext parser does not cover: a request to a REAL server it did not write -
# `nix/keycloak-tier.nix`'s own Keycloak, over its token endpoint and its JWKS document. Folded in
# from `sutura-serve`'s manifest: `sutura-exec-bigquery::wire` is this crate's own precedent for
# the exact shape (`.post(url).send_form(form)`, `.get(url).call()`, `body_mut().read_to_string()`).
ureq = { workspace = true }
# Decodes a compact JWT's payload segment (base64url, unpadded) to read the `aud` a real issuer
# minted, rather than assuming one - see `served/harness/keycloak.rs`. Already pinned for
# `sutura-exec-bigquery`'s assertion signing; `URL_SAFE_NO_PAD` is the one engine this crate reaches
# for, so a hand-rolled decoder is not a second implementation of something this workspace already
# carries correctly.
base64 = { workspace = true }
# The mock authorization server, for the leg-1 cases in `tests/served.rs`: a generated key pair, a
# JWK set published to a real path and a token minter every claim of which is a parameter. The same
# fixture `sutura-http` drives its router tests from - the feature is named because it is
# default-off in that crate.
sutura-dev = { workspace = true, features = ["mock-issuer"] }
# The boot-line TLS anchors cell (`tests/served/datahub.rs`): a real `rustls` loopback server
# presenting an `rcgen`-issued IP-SAN leaf whose CA a composed `datahub` deployment declares as
# `security.outbound.transport_anchors`, so the served binary's catalog boot proves the anchored
# handshake against the same corpus its plaintext sibling serves. Both are already pinned at the
# workspace root and resolved in `Cargo.lock` via `sutura-exec-postgres`'s rustls closure, so this
# adds no new package and dev-edges are exempt from the shipped-features gate. Folded from
# `sutura-serve`'s manifest by `github.com/telekom/sutura#685` step 2 at #768's merge.
rcgen = { workspace = true }
rustls = { workspace = true }

[lints]
workspace = true
