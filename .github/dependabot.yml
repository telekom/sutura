# Every action is pinned by commit SHA, which is right and means nothing updates them when an
# action ships a security fix. Dependabot preserves the pin and updates the trailing version
# comment, so the pins stay current without becoming mutable tags.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # The commit-msg gate requires a conventional subject, including on a bot's commits.
      prefix: "ci"

  - package-ecosystem: cargo
    # Both locks, so a bump reaches the fuzz workspace too. `cargo xtask check-lock-coverage`
    # fails on a Cargo.lock in the tree that no entry here covers.
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      # One PR for a patch sweep rather than five. A minor or major bump stays separate,
      # because that is the one worth reading. Groups are first-match ("If a dependency matches
      # more than one rule, it's included in the first group that it matches"), so the Arrow
      # family is excluded to reach its own group. oracledb, the one pre-release pinned today, is
      # excluded by NAME: Dependabot classed its beta.3 -> beta.4 API break as a patch, and
      # `update-types` has no pre-release class, so a second pre-release rides here unless named.
      patch-level:
        patterns: ["*"]
        exclude-patterns: ["arrow*", "parquet", "datafusion*", "adbc*", "oracledb"]
        update-types: ["patch"]
      # Arrow is a type vocabulary: DataFusion, ADBC and arrow-* must land one major together or
      # `check-arrow` goes red on the half that merged. No `group-by` here, because
      # `group-by: dependency-name` makes one PR per dependency and would split this group again.
      # duckdb is left out on purpose: it resolves its own Arrow major, a duplicate tolerated in
      # `devco/arrow-majors-allow`, so it does not have to move with this group.
      arrow:
        patterns: ["arrow*", "parquet", "datafusion*", "adbc*"]
      # utoipa and utoipa-axum (and utoipa-swagger-ui) resolve as separate updates in a minor or
      # major bump; pairing them with `group-by: dependency-name` does not work because they have
      # different names. This group catches them by pattern, and a group spans both directories
      # in one PR - read from dependabot-core's source; no such PR is observed yet. Placed before
      # `each-across-directories` so the first-match rule applies.
      utoipa:
        patterns: ["utoipa*"]
      # Everything left - a minor, a major, oracledb - in one PR per dependency across both
      # directories, so the fuzz lock moves with the root one. From the options reference
      # (https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference):
      # "When set to `dependency-name`, Dependabot will create a single pull request for each
      # dependency update across all specified directories, rather than separate pull requests per
      # directory." Without this group, "Any outdated dependencies that do not match a rule are
      # updated in individual pull requests", and nothing documented puts those across directories.
      each-across-directories:
        patterns: ["*"]
        group-by: dependency-name
