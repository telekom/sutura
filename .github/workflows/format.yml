# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry-sql-snapshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: rust-mcp-16core
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Generate and measure Foundry render goldens
        run: |
          set -euo pipefail
          mkdir -p target
          nix build --impure --expr '
            let flake = builtins.getFlake (toString ./.); in
            flake.checks.x86_64-linux.nextest.overrideAttrs (old: {
              INSTA_UPDATE = "always";
              checkPhase = builtins.replaceStrings
                [ "--workspace --all-features" ]
                [ "--workspace --all-features -E \"test(dialects::foundry::) | test(legs::foundry::) | test(qualified::foundry::) | package(sutura-sql) | test(foundry_property_type_words_pin_numeric_widths_and_leave_nested_types_unmapped)\"" ]
                old.checkPhase;
              postInstall = (old.postInstall or "") + "\ncp crates/sutura-app/tests/snapshots/*@foundry.snap $out/\n";
            })
          ' -L --out-link target/foundry-sql-snapshots 2>&1 | tee target/foundry-sql-proof.log
          mkdir -p target/foundry-sql-export
          cp target/foundry-sql-snapshots/*@foundry.snap target/foundry-sql-export/
          git rev-parse HEAD > target/foundry-sql-export/source-head.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: foundry-sql-snapshots
          path: |
            target/foundry-sql-export/
            target/foundry-sql-proof.log
          if-no-files-found: error

      - name: Measure the focused SQL and type cells against mapping mutations
        run: |
          set -euo pipefail
          mkdir -p target/foundry-sql-mutation
          git rev-parse HEAD > target/foundry-sql-mutation/source-head.txt
          status=0
          nix build --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              mutation = builtins.path {
                path = ./nix/draft-readiness/foundry-sql-mapping.patch;
                name = "foundry-sql-mapping.patch";
              };
            in flake.checks.x86_64-linux.nextest.overrideAttrs (old: {
              NEXTEST_PROFILE = "nofailfast";
              checkPhase = builtins.replaceStrings
                [ "--workspace --all-features" ]
                [ "--workspace --all-features -E \"test(foundry_ontology_sql_keeps_values_bound_and_uses_spark_date_buckets) | test(foundry_property_type_words_pin_numeric_widths_and_leave_nested_types_unmapped)\"" ]
                old.checkPhase;
              postPatch = (old.postPatch or "") + "\npatch -p1 < ${mutation}\n";
            })
          ' -L --no-link 2>&1 | tee target/foundry-sql-mutation/mutation.log || status=$?
          if [ "$status" -eq 0 ]; then
            echo "the mapping mutations unexpectedly pass" >&2
            exit 1
          fi
          python3 - <<'PY'
          import pathlib
          import re

          expected = {
              "foundry_ontology_sql_keeps_values_bound_and_uses_spark_date_buckets",
              "foundry_property_type_words_pin_numeric_widths_and_leave_nested_types_unmapped",
          }
          log = pathlib.Path("target/foundry-sql-mutation/mutation.log").read_text()
          log = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", log)
          failed = set(re.findall(r"\bFAIL\b[^\n]*::([a-zA-Z0-9_]+)", log))
          if failed != expected:
              raise SystemExit(f"expected failures {sorted(expected)}, observed {sorted(failed)}")
          print(f"measured mapping mutation failures: {sorted(failed)}")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: foundry-sql-mutation
          path: target/foundry-sql-mutation/
          if-no-files-found: error

      - uses: ./.github/actions/nix-store-cache-report
        if: always()

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent, for the reason security-audit.yml gives: with it, a pull request could add
          # a substituter and a trusted key and have CI fetch attacker-built store paths whose
          # signature verifies.
          extra_nix_config: |
            fallback = true

      # The candidate set is `git ls-files`, so the checkout above IS the input. `fetch-depth` is
      # left at its default: the script reads the working tree, not a diff against a base.
      - name: markdown, yaml, toml and python
        run: bash nix/format-text.sh check
