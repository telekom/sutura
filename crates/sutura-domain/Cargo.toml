[package]
name = "sutura-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "Domain types today, port traits with the first adapter. No framework dependencies, by CI check."

[dependencies]
serde = { workspace = true }
# The canonical form of a definition set, and its hash. **Both are here because the digest has to be
# computed by code the domain trusts.** They used to live in the catalog adapter, with
# `PinnedDefinitions::pin` taking the hashing function from whoever called it - which a review showed
# leaves the hole the type existed to close: safe public code could pass `|_| Ok(elsewhere)` and pair
# any digest with any definitions.
#
# The cost was measured rather than estimated, and the estimate it replaces was wrong. Twelve crates
# transitively - `sha2` brings `cfg-if`, `cpufeatures`, `digest`, `block-buffer`, `crypto-common`,
# `hybrid-array` and `typenum`; `serde_json` brings `itoa`, `memchr` and `zmij` - plus `libc`, which
# `cpufeatures` declares for `aarch64-linux` only and which appears in the boundary gate's graph
# because `cargo metadata` resolves every target. None is a framework, every one of them was already
# compiled into the shipped binary through `sutura-catalog-local`, and no lockfile entry is new: this
# moves an edge, not a dependency. `xtask/src/boundaries.rs` holds the same note beside the allowlist.
serde_json = { workspace = true }
# What `identity::Secret` wraps. **Taken for a compile error, not for a runtime behaviour:**
# `secrecy::SecretString` has no `Display` and no `PartialEq`, so a `{}` interpolation, a `%` tracing
# field and `==` all stop compiling against a credential - and the hand-written `Display` that used
# to print `REDACTED` left every one of those representable. Zeroize-on-drop comes with it and is the
# part nothing here had at all.
#
# `default-features = false`, and the omitted feature is the point rather than a size decision: the
# `serde` feature is what gives `SecretBox` a `Deserialize`, which is the one impl the identity
# module's "a caller cannot state its own identity" invariant needs absent. `docs/adr/0020` decides
# this and records what the alternative would have cost.
#
# Two crates transitively, `secrecy` and `zeroize`, both `Apache-2.0 OR MIT` - no new licence, and no
# framework. The root manifest carries the count; `xtask/src/boundaries.rs` is where the allowlist
# entry makes it arguable in a diff.
secrecy = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

# Two features, both default-off and adding no dependency: `warehouse::agreement`, the typed
# comparison the differential legs make, and `warehouse::csv`, the shared fixture schema. They are
# features rather than unconditional modules because both are adapter-test support in the interior
# of the hexagon, and `sutura_runtime`'s `test-capture` is the shape this repository already uses for
# that - a consumer asks for one explicitly.
#
# The limit, stated where the switches are: nothing asserts a shipped binary leaves either off.
# `checks.shipped-features` reads the crate names out of an artefact and these features add none, so
# what keeps them out of a release is cargo's default set and review.
[features]
agreement = []
fixtures = []

[lints]
workspace = true
