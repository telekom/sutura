# lld everywhere: link time dominates the inner loop once a workspace has more than a few
# crates. devenv supplies clang/lld, which is what makes this portable rather than a
# per-machine setup note.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-Z", "next-solver=coherence"]

# ARMv8.3-A FLOOR for the two aarch64 targets. `flake.nix` compiles the allocator's C with
# `-march=armv8.3-a`; these are the Rust half of that agreement, so both compilers target the
# same floor: `+lse` (v8.1) for `cas`/`ldadd` atomics instead of `ldxr`/`stxr` retry loops, and
# `+rcpc` (v8.3) for `ldapr` acquire loads, which is the mimalloc 3.5.0 win. Enumerated rather
# than the tidier `+v8.3a`, because rustc 1.98 accepts that but reports it as an UNSTABLE
# `-Ctarget-feature` and would warn on every build; `+lse` and `+rcpc` are stable. These
# aarch64 artifacts require ARMv8.3-A or later.
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "target-feature=+lse,+rcpc", "-Z", "next-solver=coherence"]

# The apple targets go through clang TOO, and for a reason a bare `lld` did not survive: rustc
# emits `-liconv` for a darwin host, libiconv is its own store path under nix rather than part of
# the SDK, and an unwrapped lld has no search path for it. Every link failed with
# `lld: error: library not found for -liconv` - in the dev shell and in the nix sandbox alike, so
# `cargo check` passed and `cargo test` could not link. clang here is nixpkgs' cc WRAPPER: it
# supplies the -L flags for whatever the build inputs are and hands the link to the same lld, which
# is exactly the arrangement the two linux targets above already had.
[target.aarch64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-Z", "next-solver=coherence"]

[target.x86_64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-Z", "next-solver=coherence"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = ["-Z", "next-solver=coherence"]

# musl: the two statically-linked release targets. Supported now - this block used to say
# "deliberately unsupported", and `nix build .#sutura-x86_64-unknown-linux-musl` is what
# changed that.
#
# THE FLAGS LIVE HERE AND NOT IN `flake.nix`, and that is the load-bearing part. cargo reads
# exactly ONE of four sources of extra rustc flags, first match wins:
# `CARGO_ENCODED_RUSTFLAGS`, then `RUSTFLAGS`, then a matching `target.<triple>.rustflags`,
# then `build.rustflags` (`CARGO_BUILD_RUSTFLAGS`). So a per-target table SILENCES the
# environment variable rather than adding to it: crane's example passes
# `CARGO_BUILD_RUSTFLAGS = "-C target-feature=+crt-static"`, and doing that here would have
# looked correct and linked dynamically, because these tables outrank it. Checked against the
# pinned crane (692f7e9): for a cross build it exports `CARGO_TARGET_<TRIPLE>_LINKER`,
# `CC_<triple>`, `CXX_<triple>`, `AR_<triple>` and the `TARGET_*` aliases, and sets neither
# `RUSTFLAGS` nor `CARGO_ENCODED_RUSTFLAGS`.
#
# `+crt-static` is already the default for a `*-linux-musl` target. It is spelled out because
# "statically linked" is the property being shipped, and a compiler default is not a promise.
#
# No `linker` key on purpose. The Nix build supplies the real musl cross cc through
# `CARGO_TARGET_<TRIPLE>_LINKER`, which outranks anything written here, and there is no musl
# cc in the dev shell - so a value here could only be a lie that fails at link time. Build
# these two targets with `nix build .#sutura-<triple>`.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-Z", "next-solver=coherence"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static,+lse,+rcpc", "-Z", "next-solver=coherence"]
