# Publish on a tag: plain cross-built binaries AND a container image.
#
# Both, deliberately. A plain binary is what someone drops on a host or into another
# image; a container is what a platform schedules. Shipping only one of them forces every
# consumer into the other's packaging model.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload assets
  packages: write   # push the image to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      # The release profile is the cheap-to-build one by default; a release that needs
      # maximum throughput builds `release-performance` instead, as a deliberate choice.
      # A release must not ship something the gates never saw. Lints and tests first,
      # reusing the same cargoArtifacts, then the artifact.
      # No devenv: CI needs only `nix`. Every gate is a flake output running the same
      # xtask binary a developer runs.
      - name: Lints and tests before building anything shippable
        run: |
          set -eu
          nix build .#checks.x86_64-linux.hygiene -L
          nix build .#checks.x86_64-linux.fmt -L
          nix build .#checks.x86_64-linux.clippy -L
          nix run .#deny
          nix build .#checks.x86_64-linux.nextest -L

      - name: Build ${{ matrix.target }}
        run: nix build .#sutura-${{ matrix.target }} -L

      - name: Package with a checksum
        run: |
          set -eu
          mkdir -p dist
          install -m755 "$(find ./result/bin -type f | head -1)" "dist/sutura"
          tar -C dist -czf "sutura-${{ matrix.target }}.tar.gz" sutura
          sha256sum "sutura-${{ matrix.target }}.tar.gz" > "sutura-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            sutura-${{ matrix.target }}.tar.gz
            sutura-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Build the image with Nix
        run: nix build .#oci -L

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `created` is pinned in flake.nix, so the same source yields the same digest — which
      # is what makes "which build is running" an answerable question.
      - name: Load, tag, push
        run: |
          set -eu
          ./result | docker load
          docker run --rm sutura:latest --version
          tag="${GITHUB_REF_NAME#v}"
          docker tag sutura:latest "${IMAGE}:${tag}"
          docker tag sutura:latest "${IMAGE}:latest"
          docker push "${IMAGE}:${tag}"
          docker push "${IMAGE}:latest"
          docker image inspect sutura:latest --format 'digest: {{.Id}}'

  publish:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
      - name: Attach the binaries to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sutura-*.tar.gz
            sutura-*.tar.gz.sha256
          generate_release_notes: true
