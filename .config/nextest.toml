# nextest, and the one thing this repository needs from it: a SKIP that a reader can see.
#
# The problem is structural rather than a setting anybody forgot. libtest has three outcomes - pass,
# fail, ignored - and `#[ignore]` is decided at compile time, so a test that discovers at RUNTIME
# that there is nothing to test against has no honest result to return. It returns a pass. nextest
# captures the output of a passing test by default, so the notice explaining what did NOT run goes
# nowhere, and a run that connected to no service reads exactly like one that connected to all of
# them.
#
# `AGENTS.md` is unambiguous that a false pass is the worst outcome a check has, so the override
# below shows the output of the tests that can decline. It is scoped rather than global: turning
# `success-output` on for the whole suite would print every passing test's stdout and the notice
# would be lost in it, which is the same failure with more scrolling.
#
# The other half of the honesty lives in the code, not here: `sutura_dev::provisioned` writes the
# notice with SKIPPED in the first column - the same word `xtask dev-up` prints when it declines -
# and `sutura_dev::requirement` decides whether declining is allowed at all. Where the tier is
# required, the test fails instead, and a failure needs no configuration to be visible.
#
# This is the only nextest configuration in the repository. `checks.nextest` in `flake.nix` reads the
# whole tree, so it picks this up too, which is deliberate: the nix sandbox has no docker socket, so
# those tests skip there and the log should say so.

# `github.com/telekom/sutura#692`: without a ceiling, one cell that never reaches a `.await` again -
# a mispaired OS thread, a barrier nobody releases - holds the whole run open until a human notices
# and sends SIGTERM by hand, which is what happened at 3293s. `terminate-after = 5` on a 60s period
# is 5 minutes, the number `#692`'s own thread states as the bar for ANY test in this suite. The
# longest legitimately slow cell found by reading the workspace is nowhere close: postgres's own
# cancellation-under-load cell (`crates/sutura-exec-postgres/tests/deadline.rs`) asserts its OWN
# elapsed time stays under 18s, and the most generous reply budget in the default suite
# (`crates/sutura-cli/tests/mcp.rs`) is 120s of slack around a local reply that returns in a
# fraction of that - so 5 minutes has no legitimately slow cell within an order of magnitude of it.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# For complete mutation runs: NEXTEST_PROFILE=nofailfast just test.
# A PASS line proves a cell ran; this profile still honors filters and ignored tests.
[profile.nofailfast]
fail-fast = false
# Named explicitly rather than left to fall through to `[profile.default]`: the ceiling above is
# the point of this profile too, and a custom profile that trusted inheritance while default-only
# fell through to `#692`'s hang is the reader's confusion this is written to stay out of.
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
# The compose tier's own integration test, which is the only target that can decline. Matched by
# binary rather than by test name, so a test added to that file is covered without a second edit -
# and nothing else in the workspace becomes noisy.
filter = 'binary(provisioned)'
success-output = "immediate"

[[profile.default.overrides]]
# The conformance packs, which decline for a SECOND reason and are the header above's argument
# applied to it. `sutura_conformance::Outcome::Declined` is an adapter saying *I cannot do this* -
# `dry_run` answering `NotAsked`, so nothing was checked before the rows were read - and libtest has
# no outcome for that either, so it returns a pass. Without this override the engine's pre-flight
# cell is byte-for-byte the shape of the DuckDB cell for the same behaviour, where DuckDB prepared
# the statement and the engine checked nothing. Measured on a green `just test`: `DECLINED` appeared
# zero times in 2696 lines.
#
# It carries the census line too, and that is the half worth naming: the packs print behaviours over
# cases per adapter precisely because a suite that reports a ratio it has not earned is the failure
# this repository has already met twice - and a ratio discarded on every green run is not read at
# all.
#
# Scoped by BINARY, like the override above: `conformance` is every adapter's binding and `bound` is
# the packs crate's own, so a behaviour added to a pack is covered without a second edit here.
filter = 'binary(conformance) + binary(bound)'
success-output = "immediate"
