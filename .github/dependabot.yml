# Every action is pinned by commit SHA, which is right and means nothing updates them when an
# action ships a security fix. Dependabot preserves the pin and updates the trailing version
# comment, so the pins stay current without becoming mutable tags.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # The commit-msg gate requires a conventional subject, including on a bot's commits.
      prefix: "ci"

  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      # One PR for a patch sweep rather than five. A minor or major bump stays separate,
      # because that is the one worth reading.
      patch-level:
        patterns: ["*"]
        exclude-patterns: ["arrow*", "parquet", "datafusion*", "adbc*", "oracledb"]
        update-types: ["patch"]
      # Arrow and crates that must share its major version bump together in one PR,
      # so releases of datafusion / adbc do not leave the resolver stranded.
      arrow:
        patterns: ["arrow*", "parquet", "datafusion*", "adbc*"]
      # Pre-releases out of the patch group so each gets its own PR.
      oracledb-prerelease:
        patterns: ["oracledb"]
