# Source: sutura/templates/worker-pool.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release-operator
  labels:
    app.kubernetes.io/name: sutura
    helm.sh/chart: sutura-0.1.0
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sutura-operator
      app.kubernetes.io/instance: test-release
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sutura-operator
        app.kubernetes.io/instance: test-release
    spec:
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: test-release-operator
      # The operator reads the cluster with its own account's token.
      automountServiceAccountToken: true
      containers:
        - name: operator
          image: "ghcr.io/telekom/sutura:latest-operator-musl"
          imagePullPolicy: IfNotPresent
          args: ["run"]
          env:
            - name: SUTURA_ENVIRONMENT
              value: "production"
            - name: SUTURA__OPERATOR__API_GROUP
              value: "sutura.telekom.github.io"
            - name: SUTURA__OPERATOR__WORKERS
              value: "test-release-workers"
            - name: SUTURA__OPERATOR__SERVING
              value: "test-release"
            - name: SUTURA__SECURITY__METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sutura-metrics-token
                  key: token
            - name: SUTURA__SERVER__TLS_NODE_AUTHORITY
              value: /etc/sutura/node/ca.crt
          volumeMounts:
            # Only the CA bundle, not the pair the CSI driver also issues into this volume: the
            # operator verifies a pod's server certificate and holds no node client identity of its
            # own (`subPath` selects one file from the volume; the driver still writes the other two,
            # outside this container's view).
            - name: node
              mountPath: /etc/sutura/node/ca.crt
              subPath: ca.crt
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
      volumes:
        # No `client auth` usage: this covers the operator's own pod and certificate, not its RBAC
        # token. If this certificate were ever presented as a client one, every node's own TLS gate
        # refuses it - webpki checks a client certificate's EKU as required-if-present.
        - name: node
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: sutura-nodes
              csi.cert-manager.io/issuer-kind: Issuer
              csi.cert-manager.io/dns-names: test-release-operator.default.svc
              csi.cert-manager.io/key-usages: digital signature,key encipherment,server auth
              csi.cert-manager.io/duration: 720h
              csi.cert-manager.io/fs-group: "65532"

