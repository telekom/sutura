# DOES TPC-H ACROSS NODES EQUAL ONE NODE?
#
# `nix/tpch-across-nodes.nix` boots four NixOS VMs over TPC-H at SF10, generated by the pinned
# DuckDB (`nix/tpch-data.nix`): a serving node that holds the DuckDB star, two reading workers and
# PostgreSQL. The same questions are asked of a single node that holds the whole star (REF), of the
# federated catalog on one node (ONE) and of the serving node with its two readers (MANY).
# `nix/tpch/acceptance.json` lists the questions that MANY must answer, equal to REF. ONE must
# answer equal to REF or refuse `result_too_large`, and any other refusal fails. PostgreSQL's
# statement log shows the readers, and not the serving node, read each split leg's `ctid` ranges.
# That file, `nix/tpch-across-nodes.nix` and `nix/tpch-across-nodes.py` say what this observes and
# what it does not.
#
# ON CHANGE, AND ON DISPATCH, AND NOT ON A SCHEDULE. A pull request runs it only when it touches
# what reads a split leg across nodes - the PostgreSQL split, the combine across nodes, the
# federated service and its reading worker, the transport of a leg, the serving and worker side of
# the CLI - or the venue itself. `merge_group` is absent on purpose: it takes no
# `paths` filter (see `ci.yml`), so a queue entry would run a long VM test on every change, and
# nothing in the queue waits for it. There is no `schedule`, and the SF10 data is never built by a
# job that has not asked for it.
#
# IT GATES NOTHING. `devco/required-contexts` classifies the job `[advisory]`. The timeout is 90
# minutes. Runs 42342552818 and 42343995219 took about 13 minutes each; every run builds DuckDB with
# `tpch` linked in and the data, which no store this repository publishes holds. A run with a cold
# dependency closure is not measured. A red run says an answer differs, a refusal is not the one
# listed, or a split leg was not read across nodes - read the log in the artifact. A pull request
# from a fork or from Dependabot is skipped: the runner group is the repository's own.
#
# THE RUNNER is `rust-mcp-16core`, which the other NixOS VM tests run on and which this job asks for
# `/dev/kvm` as they do. The VMs take 16 + 4 + 4 + 4 GiB of its memory and the star about 6 GiB of
# its disk on top of the nix store; `reclaim-disk` guards the disk. The wall time is measured above;
# the peak of the memory and of the disk is not.
#
# WHAT A FAILED RUN KEEPS. The test fails when any rule fails, so the build leaves no output; the
# artifact then holds the log, which prints the table and every result. A passing run keeps
# `results.json` and `ranges.md` too. It is `nix run`, and not a `nix build` of a check, because
# `just ci` builds every check and `cargo xtask check-workflows` refuses any other literal build in a
# pull-request workflow: `apps.tpch-across-nodes` holds the test as a dependency.
name: tpch-across-nodes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/sutura-exec-postgres/src/adbc/split.rs"
      - "crates/sutura-exec-postgres/src/adbc/split/**"
      - "crates/sutura-exec-datafusion/src/combine.rs"
      - "crates/sutura-exec-datafusion/src/combine/**"
      - "crates/sutura-cli/src/serve/**"
      - "crates/sutura-app/src/federated.rs"
      - "crates/sutura-app/src/federated/**"
      - "crates/sutura-app/src/reading_worker.rs"
      - "crates/sutura-app/src/reading_worker/**"
      - "crates/sutura-domain/src/plan/split.rs"
      - "crates/sutura-domain/src/plan/remote.rs"
      - "crates/sutura-domain/src/plan/remote/**"
      - "crates/sutura-domain/src/plan/federated/combiner.rs"
      - "crates/sutura-domain/src/plan/federated/combiner/**"
      - "crates/sutura-exec-postgres/src/adbc.rs"
      - "crates/sutura-sql/src/generate/pages.rs"
      - "dev/src/agree.rs"
      - "dev/src/agree/**"
      - "nix/tpch-across-nodes.nix"
      - "nix/tpch-across-nodes.py"
      - "nix/tpch-data.nix"
      - "nix/multi-node-idp.py"
      - "nix/tpch/**"
      - ".github/workflows/tpch-across-nodes.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: rust-mcp-16core
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/reclaim-disk
        with:
          minimum-gb: "40"

      - name: Open KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          # The stores this repository publishes, as `ci.yml`'s VM jobs declare them: the served
          # binary is the shipped one, and a store that holds it saves building it here. Neither
          # holds DuckDB with `tpch` linked in or the data, which every run builds.
          extra_nix_config: |
            fallback = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - name: TPC-H across nodes
        shell: bash
        run: nix run .#tpch-across-nodes -L -- --out results 2>&1 | tee tpch-across-nodes.log

      - name: Collect the results
        if: always()
        run: |
          mkdir -p results
          cp tpch-across-nodes.log results/ || true
          if [ -f results/ranges.md ]; then
            cat results/ranges.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tpch-across-nodes
          path: results/
          if-no-files-found: warn
