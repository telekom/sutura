# pixi owns tooling that ships as a conda or Python package, and nothing else. The Rust
# toolchain and the build come from Nix - two owners for one version is one too many.
#
# Channels here are public, because this repo is public. An internal mirror is configured in
# pixi's GLOBAL config (~/.pixi/config.toml), so no internal URL is ever committed. See
# docs/enterprise-mirrors.md.

[workspace]
name = "sutura-tooling"
version = "0.1.0"
description = "Workflow static analysis for sutura."
channels = ["conda-forge"]
# linux-aarch64 included because the release cross-builds for it: tooling that cannot resolve
# on a platform we ship to is tooling nobody can run there.
platforms = ["linux-64", "linux-aarch64", "win-64", "osx-arm64"]

[dependencies]
# THE RULE: one resolver per language. pixi owns every Python package; nix owns everything
# else and every tool whose version decides what a GATE reports.
#
# Everything that reports findings - zizmor, actionlint, shellcheck, betterleaks, clippy,
# nextest, cargo-deny - is pinned by nix and ONLY by nix, because a different version reports
# differently and two pins for one verdict is two sources of truth. Pinning them here as well
# and generating this table from flake.nix was tried; it worked, and it was still a
# synchroniser standing between two pins. Removing the overlap removes the need for it.
#
# What is left runs or interprets other things. A different prek still runs the same hooks; a
# different 3.13 still runs the same script. Neither can change what a gate concludes, so a
# range is honest here and there is nothing to keep in step.
#
# The docs toolchain is Python, so it lives here rather than in a `python3.withPackages` in
# flake.nix - which is where it started, and it did not work. mike shells out to mkdocs, and
# composing them through nix produced an environment where `mkdocs` ran but could not import
# `pymdownx`; two resolvers for one interpreter is exactly the failure that predicts. One
# resolver owns the interpreter and everything in it.
#
# It is an ISOLATED feature, not a dependency of the default environment: the docs env pulls
# in mkdocs-material and its whole tree, and a hook runner has no business resolving against
# that. `pixi run -e docs <task>` is the only way in.
#
# `cargo xtask check-pins` fails if a tool ever appears both here and as a flake app.

# The hook runner. Here rather than in the dev shell because a git hook runs in whatever
# environment the commit came from, and outside `devenv shell` a nix-provided prek is not on
# PATH - every hook failed with "prek: not found" and blocked the commit outright. pixi's
# env lives in the repo, so `pixi run prek` resolves from anywhere.
prek = ">=0.4.14,<0.5"

# For the skill-sync script. The only Python this repo runs, and it runs at maintenance time
# rather than on any gate or query path - see the no-interpreter invariant in AGENTS.md.
python = ">=3.13,<3.14"

# ---------------------------------------------------------------------------- docs ---
# Isolated on purpose. `solve-group` is deliberately absent: sharing one with the default
# environment would make the linters resolve against mkdocs-material's tree, and a docs bump
# could then move a gate's version. Separate solve, separate env, no interaction.
[feature.docs.dependencies]
# The site generator and the theme.
#
# The `<2` ceiling is a DECISION, not caution. Material for MkDocs prints a warning on every
# build about what MkDocs 2.0 does, and three of its points rule it out here: the plugin system
# is removed, so mike and every extension we use stop working; there is no migration path; and
# it is currently UNLICENSED, which a public Apache-2.0 repo cannot depend on at all. There is
# also no Material release targeting it. Raise this ceiling only when Material itself does.
# https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.7,<10"
# The versioned publisher. mike writes each version into its own directory on `gh-pages`,
# maintains versions.json and renders the root redirect.
mike = ">=2.1.3,<3"
# `pymdownx.superfences`, which mkdocs.yml names for the mermaid fence. mkdocs-material
# depends on it but does not re-export it, and mike's mkdocs subprocess must be able to
# import it - it could not when the two came from different resolvers.
pymdown-extensions = ">=11,<12"

[feature.docs.tasks]
# `--strict`: mkdocs warns about a broken link and publishes anyway, which is how a docs site
# rots. `cargo xtask check-docs` covers the nav-versus-disk half.
docs = "mkdocs build --strict --clean"
docs-serve = "mkdocs serve"
# `--alias-type=redirect`: mike's default alias is a git SYMLINK, which GitHub Pages does not
# resolve - `latest/` would serve the literal text "0.3.0" rather than the page.
docs-deploy = "mike deploy --update-aliases --alias-type=redirect"
docs-list = "mike list"
# Escape hatch for exercising the publish path without touching gh-pages: pass
# `-b <branch>`. Any extra argument reaches mike, since a pixi task appends what follows.
mike = "mike"

# -------------------------------------------------------------------- infra ---
# The Pulumi Python runtime for the test infrastructure under `test-infra/`. Isolated,
# the same shape as `docs`: no-default-feature, only `pixi run -e infra <cmd>` reaches it,
# so the pulumi tree (its pypi deps included) never perturbs the default solve or a gate.
#
# Pinning is the major-ceiling style this file already uses for non-gate tooling: a different
# pulumi-gcp within the major still provisions the same resources, and the exact number is
# whatever the solve resolves on the day it is locked. Re-check the majors against the
# changelogs before widening either ceiling.
[feature.infra.dependencies]
python = ">=3.13,<3.14"
# `python -m pip` must work in this environment even though pixi owns the packages: pulumi's
# python runtime probes the interpreter it was launched with via `pip list --format json` to
# discover package requirements, and it FAILS when pip is absent. pip is a package manager, not
# a resolver we build on, so pinning it here does not conflict with the one-resolver rule.
pip = "*"

[feature.infra.pypi-dependencies]
# EXACT, and it MUST equal the nix-pinned pulumi CLI (`pkgs.pulumi`, exposed in the dev shell as
# $PULUMI_VERSION and built by CI as `nix build .#pulumi`). The CLI and the SDK it drives have to
# agree; nix is the authority for the version, so this pin is set to nix's value by hand and the
# two are bumped together. The pypi `pulumi` package is the SDK; the CLI is the nix binary.
pulumi = "==3.255.0"
# >=9 : 7.x shipped no bigquery.RowAccessPolicy, so the two-principal isolation could only be
# applied with a SEPARATE gcp CLI. 9.x exposes it as a first-class resource, keeping `up`
# self-contained. `gcp.projects.Service` (also used for API bootstrap) exists in both.
pulumi-gcp = ">=9,<10"

[feature.infra.tasks]
# `pulumi` is a command, not a task, so these are thin 1:1 aliases a justfile can call with
# the environment already attached. `--stack`/flags flow through as appended arguments.
#
# `cwd:` is the whole point of writing the long form: pixi runs a task from the PROJECT root
# and IGNORES the shell's working directory, so `cd test-infra/pulumi/google && pixi run -e
# infra preview` still invoked pulumi from the workspace root and pulumi could not find
# Pulumi.yaml ("searching upwards from )"). Naming the project dir here makes the task correct
# regardless of where it is launched. The `pulumi` CLI itself is the NIX-pinned binary (devenv
# on the dev shell, `nix run .#pulumi` / `nix build .#pulumi` in CI - the pypi `pulumi` package
# is the Python SDK the runtime interprets, not a CLI, and conda-forge has no cross-platform
# CLI), so `pulumi` on PATH is what this task resolves, and the cwd is the only part that has
# to be right.
#
# NO CLOUD, NO SHARED BUCKET: the state backend and the encryption passphrase come from the
# environment, never from pulumi cloud. `PULUMI_BACKEND_URL` is a `file://` URL set by the
# justfile / workflow to the project-local `.pulumi/` directory, and `PULUMI_CONFIG_PASSPHRASE`
# is a secret (CI) or machine env (local) - neither is committed here. `--local` as a CLI flag
# does not exist on this pulumi version, which is why the backend is handled through the env.
[feature.infra.tasks.preview]
cmd = "pulumi preview"
cwd = "test-infra/pulumi/google"

[feature.infra.tasks.up]
cmd = "pulumi up"
cwd = "test-infra/pulumi/google"

# -------------------------------------------------------------------- gcloud ---
# The Google Cloud CLI, for the BigQuery steps of the plan. Reached as a CONTAINER and declared as
# a task rather than as a package, and that is a decision rather than an implementation detail.
#
# WHY NOT A DEPENDENCY. conda-forge's `google-cloud-sdk` has no `win-64` build - checked on
# 2026-08-29, it resolves on `linux-64`, `linux-aarch64` and `osx-arm64` and the name does not
# exist for `win-64` at all - and this workspace declares `win-64`. The rule at the top of the
# platform list applies: tooling that cannot resolve on a platform we ship to is tooling nobody can
# run there. The obvious repair is a package on three platforms and a container on the fourth,
# which is two invocations to keep in step, and the one that drifts is the one nobody runs. One
# container everywhere resolves wherever docker does, and the service tier already requires docker,
# so this adds no prerequisite.
#
# ISOLATED like `docs`, and here that is nearly free: the feature declares no packages, so
# `no-default-feature = true` keeps the hook runner and the maintenance interpreter out of a login
# and there is nothing for either solve to perturb.
#
# NOTHING IS WRITTEN INTO THIS REPOSITORY. Authentication state belongs outside the tree, so the
# developer's own gcloud configuration directory is bind-mounted in and both logins land there -
# which is where a native `gcloud`, `bq` or any client library already looks for `credentials.db`
# and for the application-default credentials. Authenticate once and everything on the host is
# authenticated afterwards; there is no repo-local copy to leak and none to clean up.
#
# WHICH PROJECT is not this repository's business and is deliberately absent: a developer names a
# project in their own environment. `.envrc` already sources a file under the user's config
# directory for exactly this class of value, and `docs/enterprise-mirrors.md` is the generic form.

[feature.gcloud.tasks.gl]
# Both logins, in one task, because doing one and forgetting the other is the failure that looks
# like a broken adapter: `gcloud auth login` authorizes the CLI and
# `gcloud auth application-default login` is what a client library reads. `--no-launch-browser` on
# both - verified against the pinned image's own `--help` on 2026-08-29 - because a container has
# no browser to open, and `-it` because an interactive login needs a real foreground terminal.
#
# `${VAR:-default}` IS NOT AVAILABLE HERE, which is why the two defaults are command
# substitutions. pixi runs a task in its own shell rather than in the system one, and that shell
# does not implement default-value expansion - measured, not assumed: it passes the text through
# verbatim, so a mount written that way would be a literal path. Task-level `env` cannot supply the
# defaults either, because it OVERRIDES a variable the developer already exported, which is the
# opposite of what both of these need.
#
# CLOUDSDK_CONFIG is gcloud's own variable, so honouring it means a developer who has moved their
# configuration directory needs no second setting. The `$HOME/.config/gcloud` fallback is gcloud's
# documented default on Linux and macOS. ON WINDOWS the directory is under `%APPDATA%\gcloud` and
# there is no expansion that reaches it from here, so a Windows developer sets `CLOUDSDK_CONFIG`
# to that path once - in their shell profile or in the file `.envrc` sources - and this task
# follows it. Guessing a cross-shell expansion instead would work nowhere.
#
# THE IMAGE COMES THROUGH `SUTURA_IMAGE_REGISTRY`, the same variable every service in
# `compose.services.yaml` is reached through, with the same public default. A network behind a
# registry mirror has no route to the public registry and an unprefixed reference does not fall
# back - it fails - so a bare image name is not a style choice, it is a login that cannot run
# there. `xtask/src/compose.rs` checks that the default here and the one in the compose file agree,
# because the two spellings cannot be compared by reading.
#
# The tag is pinned like the compose tier's, checked against the registry on 2026-08-29. Only
# `amd64` is published for it - a single manifest, not a list - so an arm64 host runs it under
# emulation and docker says so on every run. That is irrelevant for an interactive login and worth
# knowing before it reads as a fault.
#
# ON A NATIVE LINUX DOCKER ENGINE the container writes as root, so files it creates in the mounted
# directory are root-owned on the host and a later native `gcloud` cannot rewrite them; the repair
# is one `chown` of that directory back to yourself. Docker Desktop maps ownership and does not
# have the problem. Not worked around here because every way to do it needs a second, per-platform
# invocation, which is the shape this whole feature exists to avoid.
cmd = """
export SUTURA_GCLOUD_CONFIG=$(test -n "$CLOUDSDK_CONFIG" && echo "$CLOUDSDK_CONFIG" || echo "$HOME/.config/gcloud")
export SUTURA_GCLOUD_IMAGE=$(test -n "$SUTURA_IMAGE_REGISTRY" && echo "$SUTURA_IMAGE_REGISTRY" || echo docker.io)/google/cloud-sdk:582.0.0-slim
echo "gl: signing in through $SUTURA_GCLOUD_IMAGE, writing to $SUTURA_GCLOUD_CONFIG" &&
mkdir -p "$SUTURA_GCLOUD_CONFIG" &&
docker run --rm -it -v "$SUTURA_GCLOUD_CONFIG:/root/.config/gcloud" "$SUTURA_GCLOUD_IMAGE" gcloud auth login --no-launch-browser &&
docker run --rm -it -v "$SUTURA_GCLOUD_CONFIG:/root/.config/gcloud" "$SUTURA_GCLOUD_IMAGE" gcloud auth application-default login --no-launch-browser
"""

[environments]
# The default environment stays small: the hook runner and the maintenance interpreter.
# `docs` is its own, so neither can perturb the other's solve.
docs = { features = ["docs"], no-default-feature = true }
# `gcloud` holds a task and no packages, so it resolves on all four platforms above by having
# nothing to resolve. What it needs at run time is docker, and no manifest can pin that.
gcloud = { features = ["gcloud"], no-default-feature = true }
# The Pulumi test infrastructure. Isolated so its pypi tree never perturbs a gate's solve.
infra = { features = ["infra"], no-default-feature = true }

[tasks]
# Refresh every imported skill and rewrite .agents/skills.lock.json. Mirrors are re-fetched
# at their pinned ref; `adapted` skills are never overwritten; ms-rust is regenerated. The
# lock is what makes "has anyone edited a mirror?" answerable - `cargo xtask check-skills`
# compares its hashes against what is on disk.
skills-refresh = "python .agents/skills-sync.py"
# Re-hash what is checked out without fetching, for a network with no egress.
skills-relock = "python .agents/skills-sync.py --offline"
# Just the Microsoft guidelines. A no-op when their content has not changed.
ms-rust-refresh = "python .agents/skills/engineering/ms-rust/generate.py"
# Installing the hooks and running them, so both go through the same prek.
hooks-install = "prek install --hook-type pre-commit --hook-type pre-push --hook-type commit-msg"
hooks-run = "prek run --all-files"
