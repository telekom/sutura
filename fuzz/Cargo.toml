# The fuzz crate: libFuzzer targets over the parsers that read input this deployment does not write.
#
# ITS OWN WORKSPACE, and that is not cargo-fuzz boilerplate copied in. Three consequences are
# deliberate:
#
#   * `#![no_main]` and `libfuzzer-sys` never enter the shipped workspace's dependency graph, so
#     `cargo build` and every nix check on the root workspace are unchanged by this directory
#     existing.
#   * the root workspace's `[profile.*]` tables do not reach here, so the panic strategy this
#     harness measures under is the one declared below rather than one inherited by accident.
#   * a second `Cargo.lock`. `cargo xtask check-fuzz` fails if it is missing, because a fuzz run
#     against an unlocked graph is not reproducible - but `cargo deny` reads the ROOT lock only, so
#     NOTHING HERE IS ADVISORY-CHECKED. Stated as the limit it is; of the fourteen direct
#     dependencies below, seven are first-party path dependencies (six crates plus the vendored,
#     path-pinned `datafusion-distributed`) and the rest are third-party: `libfuzzer-sys`,
#     `serde_json`, `arrow-flight`, `futures-util`, `prost`, `datafusion` and `datafusion-proto`.
#     The BigQuery adapter's Arrow/ADBC graph - excluded transitively - `ureq`, `ring` and `base64`
#     - is advisory-unchecked here for the same reason, the cost of fuzzing the real reply decode
#     that ships behind that feature.
#
# WHY THESE TARGETS. The issue #146 sweep measured that nothing generates input
# against the parsers a caller, a catalog author or an operator's key-set file reaches. `panic =
# "abort"` is on every shipped profile, so a panic inside a third-party parser is the process dying
# rather than an error a caller sees - and clippy at `-D warnings` (which denies `unwrap_used`,
# `expect_used`, `panic`, `indexing_slicing`) does not reach inside those third-party parsers.
# `peer_stage` and `leg_frames` (issue #1680) widen this to the two decodes a NODE runs, not a
# caller: a worker's own protobuf plan decode and a remote leg's Flight frame decode, both over
# bytes the local node did not write.
#
#   * `sql_expression`     - `sutura_sql::expression::compile`, the boundary that turns an authored
#     SQL fragment into a checked AST. It runs `polyglot-sql`'s parser over the fragment text - a
#     third-party recursive-descent parser whose own fragment API has a known empty-token-list
#     abort that is lint-held rather than input-held - plus this crate's refusal guards and a
#     render-and-reparse per dialect.
#   * `question_body`      - the caller JSON both transports accept, through
#     `sutura_http::wire::QuestionBody` then `sutura_domain::query::Query::try_from`, which runs
#     `serde_json` over the input with `deny_unknown_fields` and then the domain newtype parsers.
#   * `token`               - the unauthenticated bearer-token header path through
#     `sutura_http::inbound::token::TokenValidator`, with a fixed public-only key set. The target
#     covers header parsing and failed verification; it does not claim coverage of signed claims
#     or the HTTP layer's non-UTF-8 rejection.
#   * `catalog_document`   - `sutura_catalog_local::LocalCatalog::load`, the untrusted-author
#     boundary: a catalog can be authored in a third-party system, so the operator serving it did
#     not necessarily write it. Runs the frontmatter split, `serde_norway` and the domain newtypes
#     behind a catalog document; asserts load determinism (same bytes, same digest) rather than
#     only "did not abort".
#   * `key_set_document`   - `sutura_http::inbound::keys::KeySet::parse`, the JWK-set document an
#     operator's key-set file or authorization server supplies. Runs `serde_json`, then
#     `jsonwebtoken`'s JWK decode, base64 and `KeyId::parse`; asserts a parsed set is never empty.
#   * `leg_wire`           - `sutura_domain::plan::LegWire`, the typed leg a remote node's Flight
#     transport carries in its descriptor. Runs `serde_json` with `deny_unknown_fields` and then
#     `LegWire::parse` against a fixed two-source pinned catalog with one crossing relationship,
#     so certification is reachable past the first metric lookup for both leg kinds - *A new
#     parser at a trust boundary*, `docs/adr/20261017032054-leg-transport-between-sutura-nodes.md`'s
#     own reason to fuzz it. The bound parameters are fixed per leg kind, so nothing fuzzes them.
#   * `peer_stage`         - a worker's own decode of a coordinator-sent stage: `DistributedCodec`
#     over `datafusion_proto::bytes::physical_plan_from_bytes_with_proto_converter`, the exact call
#     `datafusion-distributed`'s worker channel runs on `request.plan` before anything in the plan
#     executes (`vendor/datafusion-distributed/src/worker/impl_coordinator_channel.rs`). The worker
#     registers no user codec or function (`crates/sutura-exec-datafusion/src/combine/across.rs`,
#     `grant.rs`), so this harness builds the session the same minimal way. It does not drive
#     execution past the decode: `SamplerExec::kick_off_first_sampler` dials out, which this target
#     must not do.
#   * `leg_frames`         - `sutura_flight::receive_request`, the remote leg's `DoExchange` frame
#     decode a Node B server runs over bytes a Node A client sent. The harness itself splits the
#     input into zero or more length-delimited `FlightData` messages (the framing one `DoExchange`
#     stream carries), then polls `receive_request` once over a synchronous `stream::iter` - every
#     `.await` point in it resolves immediately against that stream, so one poll either completes
#     the call or the harness's own assertion catches a future that started waiting on nothing.
#
#   A former target, over the wire transport's `jobs.query` reply decode, was removed with the
#   wire transport (`AdbcBigQuery` replaced it; ADBC has its own decode path).
#
# NOT A COMPILE GATE ON `pull_request`, and that is a limit stated rather than a gap closed by
# this file. `cargo xtask check-fuzz` (the hygiene-sweep gate, on every pull request) verifies this
# manifest's WIRING - a `[[bin]]` entry, a seed directory, a matrix line - and compiles nothing; the
# only things that ever compile these six targets are a release-tag or manual-dispatch run of
# `.github/workflows/fuzz.yml` and a developer's `just ship-check` over a diff in the fuzzed tree. No
# commit hook replays them. So a change to first-party API surface these targets bind to -
# `LocalCatalog::new`/`root`/`load`, `PinnedDefinitions::digest`, `KeySet::parse`/`count`/`ids`,
# `LegWire::parse`, and the sibling targets' own signatures - that breaks a target merges green on
# `ci` and is found at the next tag or manual dispatch, unless its author ran `ship-check`.

# An empty table, which is what makes this directory a workspace root of its own. Without it cargo
# refuses outright: "current package believes it's in a workspace when it's not".
[workspace]

[package]
name = "sutura-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "libFuzzer targets over parsers that read untrusted input."

[package.metadata]
cargo-fuzz = true

# `cargo::non_kebab_case_bins` warns twice on every build here, and the ALLOW is the decision rather
# than the shortcut. A target name is not cosmetic in this directory: it is a filesystem key.
# `cargo xtask check-fuzz` requires `path` to be exactly `fuzz_targets/<name>.rs`, so a `[[bin]]`
# renamed on its own fails that gate, and the same string also indexes `seeds/<name>/` (tracked),
# `dictionaries/<name>.dict` (tracked), `corpus/<name>/` and `artifacts/<name>/` (both libFuzzer's
# own, both gitignored, both possibly being written right now) and the `target:` matrix in
# `.github/workflows/fuzz.yml`. A coherent kebab-case rename therefore moves both sources, both
# dictionaries and every tracked file under `seeds/` - `git ls-files fuzz/seeds` is the count - and
# orphans whatever a live run has in the two untracked directories.
#
# It would also diverge from the tool that adds the next target: `cargo fuzz add <name>` writes
# `fuzz_targets/<name>.rs` and libFuzzer derives its per-target paths from that stem, so the next
# target added the supported way arrives in snake_case and the tree ends up spelling both.
#
# Nothing is red either way - this workspace is not built under `-D warnings` and the root
# workspace's lints do not reach it - so the choice was between two recurring warnings a reader has
# to re-derive every time and one recorded decision. This is the recorded decision.
[lints.cargo]
non_kebab_case_bins = "allow"

[dependencies]
libfuzzer-sys = "0.4"
sutura-domain = { path = "../crates/sutura-domain" }
sutura-http = { path = "../crates/sutura-http" }
sutura-sql = { path = "../crates/sutura-sql" }
sutura-config = { path = "../crates/sutura-config" }
sutura-catalog-local = { path = "../crates/sutura-catalog-local" }
sutura-flight = { path = "../crates/sutura-flight" }
serde_json = "1"
arrow-flight = { version = "=59.2.0", default-features = false }
futures-util = "0.3"
prost = { version = "=0.14.4", default-features = false }
datafusion = { version = "=55.1.0", default-features = false, features = [
  "parquet",
  "datetime_expressions",
  "compression",
] }
datafusion-distributed = { path = "../vendor/datafusion-distributed", version = "=4.0.0", default-features = false, features = [
  "grpc",
  "parquet",
] }
datafusion-proto = { version = "=55.1.0", default-features = false }

# Vendored exactly as the root `[patch.crates-io]` resolves them, less `datafusion-federation` -
# `source_gaps` (`xtask/src/fuzz/lock_drift.rs`) refuses a mismatch, and `cargo tree -i <crate>`
# under `fuzz/Cargo.lock` is what decided this is the subset the fuzz graph actually resolves.
[patch.crates-io]
datafusion-proto = { path = "../vendor/datafusion-proto" }
datafusion-proto-common = { path = "../vendor/datafusion-proto-common" }
datafusion-physical-plan = { path = "../vendor/datafusion-physical-plan" }
arrow-ipc = { path = "../vendor/arrow-ipc" }

# `panic = "abort"`, matching every shipped profile in the root manifest - which is the whole
# argument this directory exists for. A harness that unwound where the deployment aborts would be
# measuring a build nobody runs.
#
# MEASURED, because the interaction is the thing that could have made this harness blind:
# `libfuzzer-sys`'s `fuzz_target!` installs a panic hook that calls `abort()` regardless, and
# libFuzzer handles `SIGABRT` by default - so the crash is still attributed to the input that
# caused it and the artifact is still written under `fuzz/artifacts/<target>/`. Setting the
# strategy explicitly changes what is compiled, not whether a finding is reportable.
#
# No `debug` key: cargo-fuzz passes `--config profile.release.debug="line-tables-only"` on the
# command line, which wins over the manifest, so one written here would be a value with no effect.
[profile.release]
panic = "abort"

[[bin]]
name = "sql_expression"
path = "fuzz_targets/sql_expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "question_body"
path = "fuzz_targets/question_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token"
path = "fuzz_targets/token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_document"
path = "fuzz_targets/catalog_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_set_document"
path = "fuzz_targets/key_set_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "leg_wire"
path = "fuzz_targets/leg_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "peer_stage"
path = "fuzz_targets/peer_stage.rs"
test = false
doc = false
bench = false

[[bin]]
name = "leg_frames"
path = "fuzz_targets/leg_frames.rs"
test = false
doc = false
bench = false
