# A reading worker group that declares no `egress` while `networkPolicy.enabled` is set: its policy
# admits DNS and the listed addresses only, so the group could not reach its network-backed source.
environment: production
security:
  metricsToken:
    secretName: sutura-metrics-token
  inbound:
    keySetSecretName: sutura-inbound-keys
workerPool:
  enabled: true
  issuer:
    name: sutura-nodes
networkPolicy:
  enabled: true
readingWorkers:
  groups:
    orders:
      sources: [orders]
      catalogs:
        - name: model
          kind: markdown
          dir: /srv/sutura/catalog
          data_dir: /srv/sutura/data
          version: "1"
config:
  base:
    security:
      identity: multi-user
      inbound:
        mode: direct
        resource: https://sutura.example.com
        authorization_server: https://issuer.example.com
        algorithms: [RS256]
    sources:
      orders:
        kind: postgres
        host: orders.db.example.com
        port: 5432
        database: orders
        user: sutura
        password_file: /srv/sutura/password
        transport_mode: verified
        transport_anchors: system
        posture: shared-service-user
        acknowledged_because: "a directory this deployment owns"
