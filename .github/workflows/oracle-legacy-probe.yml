name: oracle-legacy-probe

on:
  pull_request:
    paths:
      - ".github/workflows/oracle-legacy-probe.yml"
      - "nix/oracle-legacy-probe.sh"
      - "nix/oracle-native-probe.sh"
      - "nix/oracle-public-dh-probe.py"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: rust-mcp-16core
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - name: Export pinned formatting with source proof
        run: |
          mkdir -p target/oracle-format
          git rev-parse HEAD > target/oracle-format/source-head
          git rev-parse 'HEAD^{tree}' > target/oracle-format/source-tree
          git ls-files -s > target/oracle-format/source-index
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then sha256sum "$file"; fi
          done < <(git ls-files -z) > target/oracle-format/source-inputs.sha256
          status=0
          bash nix/format-text.sh fmt || status=$?
          git diff --binary > target/oracle-format/formatted.patch
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oracle-format
          path: target/oracle-format
  oracle-native-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: rust-mcp-16core
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - name: Measure patched native negotiation
        run: nix shell --inputs-from . nixpkgs#just nixpkgs#python3 --command just oracle-native-probe
      - name: Keep public negotiation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-native-probe
          path: target/oracle-native-probe
  oracle-legacy-probe:
    concurrency:
      group: oracle-legacy-probe-${{ github.ref }}
      cancel-in-progress: false
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: rust-mcp-16core
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - name: Measure the old XE fixture
        run: nix shell --inputs-from . nixpkgs#just --command just oracle-legacy-probe
      - name: Keep exact server and image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-legacy-probe
          path: target/oracle-legacy-probe
