# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent, for the reason security-audit.yml gives: with it, a pull request could add
          # a substituter and a trusted key and have CI fetch attacker-built store paths whose
          # signature verifies.
          extra_nix_config: |
            fallback = true

      # The candidate set is `git ls-files`, so the checkout above IS the input. `fetch-depth` is
      # left at its default: the script reads the working tree, not a diff against a base.
      - name: markdown, yaml, toml and python
        run: bash nix/format-text.sh check

      - name: Generate the HTTP catalog lockfile
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          git apply <<'MANIFEST_PATCH'
          diff --git a/crates/sutura-catalog-openapi/Cargo.toml b/crates/sutura-catalog-openapi/Cargo.toml
          index 80ed2065d..1ffdfebcd 100644
          --- a/crates/sutura-catalog-openapi/Cargo.toml
          +++ b/crates/sutura-catalog-openapi/Cargo.toml
          @@ -8,12 +8,25 @@ repository.workspace = true
           publish = false
           description = "EXPERIMENTAL. A SemanticCatalog adapter over an HTTP metadata API, configured by a pinned OpenAPI 3.0/3.1 document and a data-only mapping file of JSON Pointers - a declaring source."
           
          +[features]
          +# Off by default for `sutura-catalog-cube`'s reason: what arrives with it is an outbound TLS stack,
          +# and no published binary links one it did not ask for.
          +http = ["dep:ureq", "dep:sutura-tls", "dep:sutura-http-client"]
          +
           [dependencies]
           sutura-domain = { workspace = true }
          +sutura-bounded-read = { workspace = true }
           serde = { workspace = true }
           serde_json = { workspace = true }
           serde_norway = { workspace = true }
           thiserror = { workspace = true }
          +ureq = { workspace = true, optional = true }
          +sutura-tls = { workspace = true, optional = true }
          +sutura-http-client = { workspace = true, optional = true }
           
           [lints]
           workspace = true
          +
          +[dev-dependencies]
          +# The loopback fake server `tests/http_reader.rs` answers the reader with.
          +sutura-http-client = { workspace = true, features = ["test"] }
          diff --git a/crates/sutura-cli/Cargo.toml b/crates/sutura-cli/Cargo.toml
          index a7a5df998..664dfce9b 100644
          --- a/crates/sutura-cli/Cargo.toml
          +++ b/crates/sutura-cli/Cargo.toml
          @@ -114,6 +114,9 @@ openmetadata = ["dep:sutura-catalog-openmetadata", "sutura-catalog-openmetadata/
           # `openmetadata`'s reason: its outbound TLS stack arrives through `sutura-http-client`, which also
           # carries a `cube` source's `delegation` exchange.
           cube = ["dep:sutura-catalog-cube", "sutura-catalog-cube/http", "dep:sutura-exec-cube", "dep:sutura-http-client"]
          +# EXPERIMENTAL: the OpenAPI metadata adapter's HTTP reader (issue #1727), for `catalog.kind:
          +# openapi`. Default-off for `openmetadata`'s reason, and in no published binary's `features`.
          +openapi = ["dep:sutura-catalog-openapi", "sutura-catalog-openapi/http"]
           # A `node` source: legs another sutura node runs, over Arrow Flight (#137). Default-off because it
           # links the gRPC client and HTTP/2; `sutura-http-client` carries the source's `delegation` exchange.
           node = ["dep:sutura-exec-node", "dep:sutura-http-client"]
          @@ -236,6 +239,8 @@ sutura-catalog-datahub = { workspace = true, optional = true }
           sutura-catalog-openmetadata = { workspace = true, optional = true }
           # The Cube metadata adapter, behind the `cube` feature above, optional for `openmetadata`'s reason.
           sutura-catalog-cube = { workspace = true, optional = true }
          +# The EXPERIMENTAL OpenAPI metadata adapter, behind the `openapi` feature above, for the same reason.
          +sutura-catalog-openapi = { workspace = true, optional = true }
           # The RDBMS metadata adapter, behind the `rdbms` feature above. Optional for the same reason
           # `sutura-catalog-datahub` is: absent, not merely unused, from a build that did not ask for it -
           # its `live` feature pulls the reader and its outbound TLS stack, and this root links neither
          MANIFEST_PATCH
          nix run .#cargo -- update --workspace

      - name: Export the generated lock and manifest inputs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-http-lock
          path: |
            Cargo.lock
            crates/sutura-catalog-openapi/Cargo.toml
            crates/sutura-cli/Cargo.toml
          if-no-files-found: error
          retention-days: 1
