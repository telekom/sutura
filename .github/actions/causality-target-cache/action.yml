# THE WRITABLE CAUSALITY TARGET DIR, CARRIED ACROSS RUNS ON THE SAME KEY AS THE STORE.
#
# `.github/actions/nix-store-cache` carries `/nix/store`, and a bare cargo cannot read it. The
# three flake apps at the tail of the `ci` job (`apps.causality`, `apps.default-features`,
# `apps.default-feature-tests`) share ONE writable target dir - `target/causality-target` - into
# which `nix/cargo-env.nix`'s `cargoWarmStart` unpacks the store-only `ciArtifacts` closure. Only
# those unpacked bytes are cache-substituted; every actual rust recompile happens in that writable
# dir, and persisting it is what this entry is for.
#
# THE INPUT IS `paths`, PLURAL, AND `path:` WAS SILENTLY IGNORED FOR AS LONG AS IT STOOD.
# `nix-community/cache-nix-action` declares no `path` input at the pinned sha, and the runner said
# so - `##[warning]Unexpected input(s) 'path', valid inputs are ['primary-key',
# 'restore-prefixes-first-match', ..., 'paths', 'paths-macos', 'paths-linux', ...]` - on the
# restore step AND the post/save step of run `34470757484`. The pin never moved, so that warning
# was on every run this action ever made, and nobody read it. With the input dropped the action
# took its own default (`nix: true` makes the path list `["/nix"]`), so this entry held A SECOND
# COPY OF THE NIX STORE and never held the target dir at all. Measured on run `34470757484`:
# 3,164,321,181 bytes saved under the causality key in 19.5 s, in a run whose store-cache save was
# itself skipped on a primary-key hit - a duplicate multi-gigabyte entry per dependency generation.
# Run `34464339590` printed the other half, `hit on this dependency generation; ...; 0 MB on disk`:
# a hit carrying nothing. That is the shape the witness below now refuses.
#
# `nix: false` IS THE OTHER HALF OF THE FIX, not a tidy-up. The plural input is APPENDED to the
# default rather than replacing it - `paths = (nix ? ["/nix"] : []).concat(<input>)`, read in the
# pinned action's own `dist/restore/index.js` and again in `dist/save/index.js`, which its `paths`
# description also states. So the correct spelling ALONE would still have cached the whole store.
#
# WHAT THE FIRST VERSION OF THIS HEADER CLAIMED, AND WHAT IS MEASURED INSTEAD. It asserted a
# `14 s -> 180 s` causality swing as the problem this action solves. Both halves are corrected:
#
#   * THE SWING SURVIVED THE CHANGE. `Test causality` on `main` still ran 176 s (run
#     `34450156778`) and 179 s (`34429887129`) after this action shipped, against 14-19 s on most
#     runs - which follows, since nothing was ever persisted.
#   * AND THE SWING IS NOT EVIDENCE ABOUT THIS CACHE EITHER WAY. The fast runs are fast because
#     the gate COMPILES NOTHING: `34470757484` answered `NOT MECHANICALLY SEPARABLE` in 15 s, while
#     `34450156778` reached `ok - red on base, green on head` and paid two builds. A cold target
#     dir is not what separates them, and no run has measured one verdict warm against cold. So
#     what persisting the dir buys is UNMEASURED, and the witness below is what will first say
#     whether an entry is carried at all.
#
# WHY THE SAME KEY THE STORE USES. The entry's own stamp is the mechanism, not the cache key
# matching: `cargoWarmStart` writes the `cargoArtifacts` store path into
# `target/causality-target/.sutura-warm-start` and re-unpacks only when that stamp disagrees. Keying
# this cache on the exact two-digest pair `nix-store-cache` uses (lock generation + manifest/flake
# tree) makes the store path's derivation move exactly when the key moves, so:
#
#   - a lockfile / manifest / flake change MISSES (or restores an older generation with a
#     mismatched stamp) and the warm start unpacks fresh - the persisted recompiles are discarded
#     and rebuilt, correctly;
#   - a source-only change leaves the key alone, the restore HITS with a matching stamp, and the
#     warm start skips the unpack - the previous run's recompile survives and is reused. That is
#     the whole saving.
#
# THE KEY PREFIX CARRIES A SHAPE VERSION (`-v2`) for exactly one reason. An entry written before
# the fix above holds `/nix` and not the target dir, and its key is otherwise IDENTICAL - so
# restoring one would be a primary-key hit over an empty target dir, which is the witness's own
# refusal fired over a correct tree. The version segment makes those entries unreachable instead of
# arguing about them. Both digests are untouched, so nothing the paragraph above says about
# invalidation moves.
#
# The two spellings are otherwise deliberate copies of the store action: `restore-prefixes-first-match`
# gives the lockfile-moving push a fallback to the newest prior generation, `save:` gates the write
# to a push to `main` (restore on every event), and a pull-request path can never write. NO commit
# sha and NO `if:`, for `nix-store-cache`'s reasons - a source-only change must reuse the generation
# and a gated restore is a stopped restore.
#
# ONE ENTRY PER JOB SHAPE is why `scope` exists (a shared key would have two jobs overwrite each
# other's entry), mirroring the store action's own `scope`.
name: causality-target-cache
description: Restore the writable causality target dir (target/causality-target) from the Actions cache on every event; write it only from a push to main.

inputs:
  scope:
    description: What job's writable cargo dir this entry is - `ci`, `bq`, a target triple. Two jobs must not share one entry.
    required: true

runs:
  using: composite
  steps:
    # THE RESTORE EXTRACTS AS ROOT, WHICH IS WHY `target/` IS CREATED HERE AND NOT BY IT.
    #
    # An archive built from `paths: target/causality-target` holds NO `target/` member - measured
    # with GNU tar 1.35, the runner's own version: the member list is `target/causality-target/`,
    # its files and its subdirectories, and nothing else. So `tar -x` has to CREATE the intermediate
    # `target/`, and a directory tar creates rather than unpacks takes the EXTRACTING PROCESS's
    # ownership and umask instead of the archive's. The pinned action extracts privileged -
    # `sudo /usr/bin/tar -xf ... -P -C <workspace>`, read in run `34499576269` - so the first hit
    # after #586 left `target/` as `root:root drwxr-xr-x`, `nix/cargo-env.nix`'s
    # `mkdir -p "$CARGO_HOME"` one level down died with `mkdir: Permission denied`, `install` then
    # had no directory to put `config.toml` in, and cargo exited 101. Every `merge_group` run after
    # the entry existed failed there. The `main` push that WROTE it passed only because it missed,
    # and so created `target/` itself as the job's own user - which is what this step now does on
    # every event.
    #
    # A directory that already exists is left alone: tar sets metadata only on members it unpacks,
    # so a pre-existing non-member parent keeps its owner and its mode (measured - `mkdir -m 700
    # target` survives the extraction as `drwx------`). Creating it here, before the restore, is
    # therefore what makes the privileged extraction unable to own it, rather than a repair of a
    # tree it already owns.
    #
    # ONLY `target/`, NEVER `target/causality-target`. That one IS a member, so pre-creating it
    # would change no ownership - and it would break the save: the witness header below rests on
    # the action writing NO entry for an absent path on a docs-only push, where an empty directory
    # would instead store an empty entry and the next run would restore a primary-key hit over
    # nothing, which is that witness's own refusal fired over correct work.
    - name: The job's own user owns target/ before the restore can
      shell: bash
      run: |
        set -eu
        mkdir -p target

    - id: target
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        # The writable dir alone carries the recompile; `CARGO_HOME` holds only a config that
        # points at the vendored closure the store serves, so it is deliberately not cached.
        # PLURAL, and `nix: false` beside it - see the header: the singular is not an input, and
        # with `nix: true` this list is appended to `["/nix"]` rather than replacing it.
        paths: target/causality-target
        nix: false
        primary-key: causality-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('flake.nix', 'nix/**', 'devco/rust-toolchain-nightly.toml', '.cargo/config.toml', '**/Cargo.toml') }}
        restore-prefixes-first-match: |
          causality-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}-
          causality-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-
        save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    # THE WITNESS: IT REPORTS A COLD CACHE AND REFUSES A RESTORE THAT CARRIED NOTHING.
    #
    # A MISS is legitimate on the first run of a dependency generation, so it prints and carries on
    # - reddening on a cold cache is inverted logic, which `nix-store-cache`'s own witness header
    # argues at length and this step keeps.
    #
    # `restored && 0 MB` IS A DIFFERENT SHAPE AND NOT A WEAKER ONE, which is why this one step both
    # reports and refuses. The action says it restored an entry for this key and the directory that
    # key names is empty: that cannot be a cold start, so it is a broken cache - the entry holds
    # something other than what the key claims, or the paths it was saved under are not the paths
    # this job reads. It is the exact shape the `path:` defect produced: `0 MB on disk` on every
    # run, and on a run where an entry survived long enough to be restored the whole line -
    # `hit on this dependency generation; ...; 0 MB on disk`, run `34464339590` - with nothing
    # reading it. This is the mechanism that would have caught it; without it the fix is a claim.
    #
    # AND IT IS NOT THE SHAPE THAT WAS DELETED FOR BEING UNSOUND. `xtask/src/workflows/publication.rs`
    # records a witness job removed because it grepped a job LOG, where a refusal and prose
    # describing one are the same bytes. This reads the action's own `hit` output and a `du` of the
    # directory the key names - two things a log cannot forge.
    #
    # Held over BOTH restore legs (`hit` is a primary-key hit or a prefix match), because an older
    # generation that restored zero bytes is the same defect.
    #
    # WHY NO LEGITIMATE ENTRY CAN BE EMPTY, which is what stops this reddening correct work. The
    # tail apps that build into this dir are all `if: steps.classify.outputs.rust == 'true'`, so a
    # docs-only push to `main` restores here and never creates the directory - and the save then
    # writes NOTHING rather than an empty entry: the pinned action's own save path throws
    # `Path Validation Error: Path(s) specified in the action for caching do(es) not exist, hence
    # no cache is being saved.`, and `saveImpl` catches it into `logWarning` and returns, so the
    # step is green and no entry exists. The next run therefore MISSES, which passes. Read in
    # `dist/save/index.js` at the pinned sha; if a future version starts saving an empty path
    # instead, this refusal is what will say so, on the run after.
    - name: What the causality-target cache carried
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        HIT: ${{ steps.target.outputs.hit }}
        HIT_PRIMARY: ${{ steps.target.outputs.hit-primary-key }}
        RESTORED: ${{ steps.target.outputs.restored-key }}
        WRITES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        set -eu
        # A GUARD RATHER THAN `du ... | cut -f1 || echo 0`, because that fallback's `||` binds to
        # the PIPELINE and so depends on a flag THIS SCRIPT DOES NOT SET. Measured on an absent
        # directory: `bash --noprofile --norc -e -o pipefail` gives `0` (the runner's own
        # invocation for `shell: bash`, so that is what CI has been reading), and the same line
        # under `-e` alone gives the EMPTY STRING - after which the refusal below would read
        # `[: : integer expected`, exit 2 and not fire. The refusal needs a number whatever the
        # caller's shell flags are, so the number is produced here instead of inherited.
        #
        # AND `du -sm` IS THE WRONG MEASURE FOR "DID THE SAVE CARRY ANYTHING", separately from
        # the guard. `du -sm` is an ALLOCATED-BLOCKS figure that ROUNDS UP TO A WHOLE MEBIBYTE: a
        # directory holding only empty files still owns an allocation block for its inode and
        # entries, and on a filesystem whose block is 4 KiB `du -sm` reports `1` - so a restore
        # that carried NOTHING reads as `1 MB` and a refusal that needs `-eq 0` never fires. It
        # passed on the machines that wrote it (APFS and an overlay both report an empty dir as 0)
        # and reddened nothing on CI until the witness's `(empty)` leg ran there: GitHub's Ubuntu
        # runner filesystem allocates the directory's block, `du -sm` answered 1, and the step
        # that is MEANT to refuse a hit over an empty target went green. A useful witness measures
        # what a restore actually writes: FILE CONTENT BYTES, not block allocation. The refusal
        # below asks whether the dir holds any regular file larger than 0 bytes - the identical
        # semantic in bytes on every filesystem - and keeps `du -sm` only as the human-facing
        # "size on disk" report.
        #
        # `find ... -size +0c -print -quit | grep -q .` is the predicate, and its shape matters:
        # `+0c` is a file LARGER than 0 bytes in POSIX find (`c` selects byte units), portable to
        # GNU and BSD find; `-quit` stops the walk at the first match, so grep's early `-q` exit
        # cannot SIGPIPE a still-running find (which, under `-e -o pipefail`, would fail the step
        # on the value it is trying to read). An absent or empty directory walks nothing and grep
        # finds nothing, which is the refusal shape.
        mb=0
        carried=0
        if [ -d target/causality-target ]; then
          mb="$(du -sm target/causality-target | cut -f1)"
          if find target/causality-target -type f -size +0c -print -quit 2>/dev/null | grep -q .; then
            carried=1
          fi
        fi
        if [ "$HIT_PRIMARY" = "true" ]; then
          restore="hit on this dependency generation"
        elif [ "$HIT" = "true" ]; then
          restore="restored an older generation ($RESTORED)"
        else
          restore="MISS - no entry for this dependency generation; the writable target starts cold and recompiles what the warmed closure lacks"
        fi
        if [ "$WRITES" = "true" ]; then
          write="this run is PERMITTED to write the entry (push to main); an exact-key hit skips the save"
        else
          write="restore-only, nothing written"
        fi
        {
          printf '### causality target cache (%s)\n\n' "$SCOPE"
          printf '| | |\n| --- | --- |\n'
          printf '| restore | %s |\n' "$restore"
          printf '| write | %s |\n' "$write"
          printf '| target dir size after restore | %s MB |\n' "$mb"
        } >> "$GITHUB_STEP_SUMMARY"
        printf 'causality-target-cache(%s): %s; %s; %s MB on disk\n' \
          "$SCOPE" "$restore" "$write" "$mb"
        # NO BACKTICKS AND NO `$` IN THIS MESSAGE: it is single-quoted, and ShellCheck's SC2016
        # refuses a backtick there (`just lint-actions` reddened on the first spelling of it).
        if [ "$HIT" = "true" ] && [ "$carried" -eq 0 ]; then
          printf 'causality-target-cache(%s): RED - an entry was restored for this key and target/causality-target holds no non-empty file.\n' "$SCOPE" >&2
          printf 'A restore carrying no content bytes is a broken cache, not a cold one. Check that the paths input (plural) still names the dir this job builds in, that nix is still false, and read this step for an "Unexpected input(s)" warning from the runner.\n' >&2
          exit 1
        fi

    # THE SECOND REFUSAL: A RESTORED TREE THIS JOB CANNOT WRITE INTO.
    #
    # The step above proves bytes ARRIVED. It cannot see the other way this cache breaks, which is
    # the one that killed the merge queue: the entry restores perfectly, the witness reports
    # 13745 MB, and the job dies 8 minutes later inside cargo with `mkdir: Permission denied` and
    # no mention of a cache anywhere in the message. Ownership is not something a `du` can read,
    # so it gets its own probe.
    #
    # IT DOES THE OPERATION THAT BROKE, rather than asking `[ -w ]` about it. `-w` answers from
    # `access(2)` on the calling user's credentials and says nothing about a directory whose mode
    # permits what a mount, an attribute or a full filesystem then refuses - the same class of
    # mistake as reading `du -sm` for "did the save carry anything". A `mkdir` followed by an
    # `rmdir` is the operation `nix/cargo-env.nix` performs, so a green here is that operation
    # having succeeded and not a proxy for it.
    #
    # BOTH DIRECTORIES, FOR DIFFERENT REASONS. `target/` is the one the extraction CREATES, and the
    # step at the top of this file is what stops it owning that - so this is the mechanism holding
    # that step, including against someone moving it below the cache step, where `mkdir -p` on an
    # existing root-owned directory succeeds and changes nothing. `target/causality-target` is an
    # archive MEMBER, so its ownership is whatever the saving run recorded, which this action does
    # not control and a future privileged save could change. It is probed only when it exists,
    # because a MISS legitimately leaves it absent and reddening on a cold cache is inverted logic.
    - name: The restored causality target is writable by this job
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
      run: |
        set -eu
        unwritable=0
        for dir in target target/causality-target; do
          if [ ! -d "$dir" ]; then continue; fi
          probe="$dir/.sutura-write-probe.$$"
          if mkdir "$probe" 2>/dev/null; then
            rmdir "$probe"
            continue
          fi
          unwritable=1
          # NO BACKTICKS AND NO `$` IN THESE MESSAGES: they are single-quoted, and ShellCheck's
          # SC2016 refuses either there - the same trap the refusal above records.
          printf 'causality-target-cache(%s): RED - %s exists and this job cannot create a directory inside it.\n' "$SCOPE" "$dir" >&2
          ls -ld "$dir" >&2
        done
        if [ "$unwritable" -eq 1 ]; then
          printf 'The cache restore extracts with sudo tar, so any directory it CREATES rather than unpacks is owned by root and nothing later in this job can write there. Check that the step which creates target/ still runs BEFORE the cache step in this action.\n' >&2
          exit 1
        fi
        printf 'causality-target-cache(%s): the restored tree is writable by this job\n' "$SCOPE"
