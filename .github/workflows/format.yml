name: execution capture preparation
on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: execution-capture-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
      - name: markdown, yaml, toml and python
        if: github.event_name != 'workflow_dispatch'
        run: bash nix/format-text.sh check
      - name: Generate protocol and format the exact candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          helper="$GITHUB_WORKSPACE/.github/scripts"
          candidate="$RUNNER_TEMP/execution-capture-source"
          output="$RUNNER_TEMP/execution-capture-output"
          git fetch --no-tags origin "$SOURCE_SHA"
          git worktree add --detach "$candidate" "$SOURCE_SHA"
          cd "$candidate"
          nix develop --command python3 "$helper/prepare-execution-capture.py" "$SOURCE_SHA" "$output" "$helper"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: execution-capture-preparation-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/execution-capture-output/
          retention-days: 7
