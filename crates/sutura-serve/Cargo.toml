[package]
name = "sutura-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The service binary. Composes adapters and the transport; contains no business logic."

[[bin]]
name = "sutura-serve"
path = "src/main.rs"

[features]
# In-process TLS termination. Default-off; see `sutura-http`'s feature of the same name.
#
# Named on BOTH crates rather than only on the library, because this is the crate that produces the
# binary: `--features tls` on the binary is what an operator types, and it has to reach
# `sutura-config` as well so the startup refusal for "asked for in-process TLS, built without it"
# agrees with what is actually linked.
tls = ["sutura-config/tls", "sutura-http/tls"]

# The BigQuery adapter, and with it the outbound HTTP stack its wire needs.
#
# **Default-off, and the reason is the FOUR CROSS BUILDS rather than a preference for narrow
# defaults.** `sutura-exec-bigquery`'s own `wire` feature pulls `ureq` and its rustls closure -
# including `ring`, which compiles C and assembly - and two of the four release triples are musl.
# Those builds pass `--package sutura-cli`, so they never compile THIS crate; what they do compile is
# the whole workspace's dependency closure, because crane's `buildDepsOnly` is deliberately unscoped
# so the checks can share it. A non-optional dependency here would therefore put the outbound TLS
# stack into all four cross dependency derivations, for a binary that links none of it.
#
# So the adapter arrives by asking: `cargo build -p sutura-serve --features bigquery`, or
# `--all-features`, which is what `just lint`, `just test` and every nix check already pass - so the
# registration below is compiled, linted and tested on every run, and only the four cross builds and
# a bare `cargo build` are unchanged.
#
# **The limit, and it is the same one `tls` already has: no gate compiles this crate with the feature
# OFF.** Every check passes `--all-features` and the release derivations build `--package sutura-cli`,
# so the `cfg(not(feature = "bigquery"))` half of `open_bigquery` - and the one-variant
# `OpenedSources` beside it - are held by `cargo check -p sutura-serve` on a developer's machine and
# by review. Closing it means a second compile of one binary in CI, which is a cost this feature is
# not worth on its own; it is written down here so the next feature on this crate does not have to
# rediscover it.
bigquery = ["dep:sutura-exec-bigquery", "sutura-exec-bigquery/wire"]

[dependencies]
# For `sources`: which data systems a bundle reads from, so the engine is opened for the ones the
# catalog actually names rather than for a guess.
sutura-app = { workspace = true }
sutura-catalog-local = { workspace = true }
sutura-config = { workspace = true }
sutura-domain = { workspace = true }
sutura-exec-datafusion = { workspace = true }
# The BigQuery adapter, behind the `bigquery` feature above. Optional is what makes the dependency
# ABSENT from the default build rather than merely unused, which is the property the cross builds need.
sutura-exec-bigquery = { workspace = true, optional = true }
sutura-http = { workspace = true }
# For `axum::Router` in one signature. The router is BUILT by `sutura-http`; this crate only names
# the type on its way to `serve`.
axum = { workspace = true }
sutura-runtime = { workspace = true }
# `enable_all` needs `net` and `time` to exist as methods, `rt-multi-thread` is the server runtime,
# `signal` is the shutdown listener and `sync` is what the shutdown flag is built on. No `macros`:
# `#[tokio::main]` is deliberately not used - see the note on `run` in `src/main.rs`.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }

# For `tests/served.rs`, which spawns this crate's own binary and then reads two documents: the
# service's own log (one JSON object per line, because the fixture configures `telemetry.format:
# bunyan`) and the JSON body of every reply.
#
# **`serde_json` and NOT an HTTP client**, and the choice is the same one this crate's `bigquery`
# feature is default-off for. `ureq` would arrive with rustls and `ring`, and `crane.buildDepsOnly`
# is deliberately unscoped so the checks can share one dependency derivation - so the four cross
# builds, two of them musl, would compile that closure for a binary that links none of it. What the
# test needs is one plaintext loopback request with a fixed shape, which it writes to a `TcpStream`
# itself. `serde_json` is already in the target graph as `sutura-http`'s own dependency, so this
# adds nothing to `Cargo.lock` and nothing to any build.
[dev-dependencies]
serde_json = { workspace = true }

# The allocator, and Linux only. A target table rather than a plain dependency plus a `cfg`, for
# the reason `sutura-cli`'s manifest gives: this way the C is never compiled - not even a build
# script - on a macOS or Windows laptop, so the one platform we ship on is the only one that pays
# for it. `Cargo.lock` still records it, because a lockfile is target-agnostic by design.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { workspace = true }

[lints]
workspace = true
