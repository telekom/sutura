# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:
    inputs:
      operation:
        description: Check fuzz metadata or run both finishing tasks on the pinned source
        type: choice
        required: true
        options: [preflight, gates, width-validator]
      expected_helper_sha:
        description: Exact temporary proof helper commit
        type: string
        required: false
      source_sha:
        description: Exact frozen source commit
        type: string
        required: true
      source_tree:
        description: Exact tree of the frozen source commit
        type: string
        required: true
      comparison_sha:
        description: Exact ancestor for the finishing comparison
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.operation || 'format' }}-${{ inputs.source_sha || 'format' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  format:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent, for the reason security-audit.yml gives: with it, a pull request could add
          # a substituter and a trusted key and have CI fetch attacker-built store paths whose
          # signature verifies.
          extra_nix_config: |
            fallback = true

      # The candidate set is `git ls-files`, so the checkout above IS the input. `fetch-depth` is
      # left at its default: the script reads the working tree, not a diff against a base.
      - name: markdown, yaml, toml and python
        run: bash nix/format-text.sh check

  finishing-tasks:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(inputs.operation == 'gates' && '["validate","ship-check"]' || inputs.operation == 'width-validator' && '["width-validator"]' || '["preflight"]') }}
    runs-on: rust-mcp-16core
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/reclaim-disk

      - name: Open KVM for the full validation gate
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: $/.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Run the requested source checks
        working-directory: source
        env:
          OPERATION: ${{ inputs.operation }}
          TASK: ${{ matrix.task }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          COMPARISON_SHA: ${{ inputs.comparison_sha }}
          HELPER_SHA: ${{ inputs.expected_helper_sha }}
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND
          export CARGO_TERM_COLOR=never NO_COLOR=1
          for revision in "$SOURCE_SHA" "$SOURCE_TREE" "$COMPARISON_SHA"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          done
          finishing_plan_path="$RUNNER_TEMP/finishing-plan.json"
          printf '{"source_sha":"%s","source_tree":"%s","comparison_sha":"%s"}\n' "$SOURCE_SHA" "$SOURCE_TREE" "$COMPARISON_SHA" > "$finishing_plan_path"
          case "$OPERATION:$TASK" in
            width-validator:width-validator)
              [[ "$HELPER_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$(git -C .. rev-parse HEAD)" = "$HELPER_SHA"
              test "$GITHUB_WORKFLOW_SHA" = "$HELPER_SHA"
              test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
              test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
              test "$SOURCE_TREE" = cc413f608f15a23d204dd5721e99085bff68f7d8
              test "$COMPARISON_SHA" = 39fe9886db7480381153e8d0cd2c6245547b43ad
              test "$(git merge-base "$COMPARISON_SHA" "$SOURCE_SHA")" = "$COMPARISON_SHA"
              test -z "$(git status --porcelain)"
              proof_out=target/inbound-verifier-proof/width-validator
              mkdir -p "$proof_out"
              cp "$finishing_plan_path" "$proof_out/inputs.json"
              git ls-files --stage -z > "$proof_out/index-before.z"
              set +e
              nix shell --inputs-from . nixpkgs#python3 --command python3 -I ../devco/width_validator_proof.py > "$proof_out/proof.log" 2>&1
              proof_status=$?
              set -e
              cat "$proof_out/proof.log"
              printf '%s\n' "$proof_status" > "$proof_out/exit.status"
              git ls-files --stage -z > "$proof_out/index-after.z"
              cmp "$proof_out/index-before.z" "$proof_out/index-after.z"
              test -z "$(git status --porcelain)"
              exit "$proof_status"
              ;;
            gates:validate|gates:ship-check|preflight:preflight) ;;
            *) exit 2 ;;
          esac
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#just nixpkgs#pixi nixpkgs#devenv nixpkgs#betterleaks --command python3 -I ../devco/inbound_verifier_proof.py "$TASK" "$finishing_plan_path"

      - name: Retain evidence and any generated changes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inbound-finishing-gates-${{ github.run_id }}-${{ matrix.task }}
          path: source/target/inbound-verifier-proof/
          if-no-files-found: error
          retention-days: 14

  # Task success is required here; independent acceptance still reads both exact-source packets.
  finishing:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [finishing-tasks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every finishing task
        env:
          TASKS_RESULT: ${{ needs.finishing-tasks.result }}
        run: |
          set -eu
          test "$TASKS_RESULT" = success
