# The curated licence review: OSS Review Toolkit, on a schedule.
#
# WHAT THIS IS FOR, and it is not the licence gate. `cargo deny check` is the gate - an exact
# allowlist of SPDX identifiers with `unused-allowed-license = "deny"`, run on every dependency
# change and weekly, and it is ours. What it cannot produce is an ATTRIBUTION document: it answers
# "is this identifier allowed" and says nothing about the notices an Apache-2.0 dependency's own
# NOTICE file obliges a distributor to carry.
#
# THE ATTRIBUTION DOCUMENT IS NO LONGER MISSING, which is what changed here. `ATTRIBUTION.md` is
# committed, generated by `just attribution` from `cargo metadata`, and gated by
# `cargo xtask check-attribution` against `Cargo.lock`. So this workflow is no longer the only
# answer to that question - it is the CURATED SECOND OPINION: a different tool over the same
# declared metadata, plus a NOTICE rendering and an OSV advisory pass, produced by something that
# is not the code it is reporting on. `docs/adr/0021`'s attribution amendment decides which of the
# two owns what.
#
# AND THE TAG TRIGGER IS GONE, deliberately, which is the other change. It used to run here on
# `push: tags` and keep its reports with `actions/upload-artifact` - a CI artifact that expires
# after ninety days, is not signed, and is not committed, so the one output an auditor would ask
# for was the one output no consumer could obtain or verify. It cannot be fixed by uploading to the
# release afterwards either: this repository has GitHub's immutable releases enabled, so once a
# release is published its assets can never be added to, and a second workflow racing the first
# cannot become an asset of it. So the tag path moved INTO `release.yml`, where the report is
# packed, signed with the release's own Sigstore certificate, given SLSA provenance and attached
# before the release is published. `.github/actions/licence-review` is the sequence both callers
# share.
#
# What stays here is the SCHEDULE, which is what this run is actually good at: catching a world
# that changed under a lock nobody touched - the argument `security-audit.yml` makes for its own
# weekly run - and doing it without holding a token that can write anything.
#
# NO EXTERNAL CONFIG REPOSITORY, and that is a decision with evidence rather than a shortcut. The
# conventional setup points ORT at `github.com/telekom/ort-config`; checked at revision `3863658b`,
# nothing in it applies here - zero curations for the `Crate` package type, and the one change that
# repository documents as its own configures the ScanCode scanner, which this workflow does not
# run. `.ort.yml` in the repository root carries the four exclusions that DO apply, written for
# this repository, and its header records that check in full.
#
# NO EVALUATOR, for the same reason and one more. ORT's policy rules live in that repository as 76
# kB of Kotlin plus 330 kB of licence classifications; vendoring them would duplicate `deny.toml`,
# rot, and make us the maintainer of a copy. Without them there is nothing to evaluate against, so
# the step is absent rather than disabled - which also removes the failure mode where a rule added
# upstream turns a scheduled job red on a tree nobody touched.
#
# NO SCANNER. A source-code licence scan of this dependency closure is hours of work and wants a
# shared result cache to be worth running at all; without one it would re-scan the same crates
# every week. What this job uses is the analyzer's DECLARED licences, which is what crate metadata
# carries.
#
# NOT ON PULL REQUESTS, and that is cost rather than principle. The ORT image is tens of gigabytes
# and the sequence is minutes; paying that per pull request buys a slower version of a check
# `cargo-deny` already ran.
name: licence-review

on:
  schedule:
    # Tuesday 05:23 UTC. Off the hour for `security-audit.yml`'s reason - jobs on the hour queue
    # behind everyone else's - and a different day, so the two heavy weekly jobs do not contend.
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ort:
    runs-on: rust-mcp
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ORT labels its result with the project's VCS metadata, so a shallow clone would leave
          # the reports describing an unknown revision.
          fetch-depth: 0
          persist-credentials: false

      # NO `pack-to`: nothing here signs or publishes, so a tarball would be a second copy of what
      # the upload below carries. The release path is where a packed, signed report belongs.
      - uses: ./.github/actions/licence-review

      # `if: always()`, because a failed run still leaves partial results and those are exactly
      # what somebody debugging it needs. The whole directory rather than named files: which
      # reports exist is decided by the action's `-f` list, and a hardcoded list here would
      # silently drop one the day that changes.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licence-review-${{ github.sha }}
          path: ort-output/
          if-no-files-found: error
          retention-days: 90

      # What a reader sees without downloading an artifact. An index and nothing more: the numbers
      # that matter are in the reports, and a summary that extracted them would be a second place
      # for them to be wrong.
      - name: Say what was produced
        if: always()
        run: |
          set -eu
          {
            echo "## Licence review"
            echo
            echo "| Report | Bytes |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Globbed, so a reporter added to the action's `-f` list appears here without a second
          # list agreeing to it.
          found=0
          for f in ort-output/reports/*; do
            [ -f "$f" ] || continue
            # Double-quoted with an escaped backtick, matching the tables in release.yml. A
            # single-quoted format string is the obvious way to write a literal backtick, and
            # SC2016 fires on it - reasonably, since inside single quotes a backtick is as inert
            # as it looks and a linter cannot tell that from a mistake. Note the wording: a
            # comment whose first word after `#` is the linter's own name is read as a DIRECTIVE,
            # which is how this line first failed the lint it is explaining.
            printf "| \`%s\` | %s |\n" "$(basename "$f")" "$(wc -c < "$f")" >> "$GITHUB_STEP_SUMMARY"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "| none - the reporter produced nothing | |" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            printf "Downloadable as the \`licence-review-%s\` artifact.\n" "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          find ort-output -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort || true
