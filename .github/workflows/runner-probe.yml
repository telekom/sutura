# IS THE HOST BEING USED, AND WHICH `max-jobs`/`cores` PAIR USES IT BEST?
#
# THE FINDING THIS EXISTS FOR: nothing in this repository has ever measured either half. CI installs
# nix through `cachix/install-nix-action`, whose own `install-nix.sh` writes `max-jobs = auto` and
# nothing else, and no workflow, composite action or script under `nix/` sets `cores`, `NIX_CONFIG`
# or `--max-jobs` - so ordinary CI runs at `max-jobs = auto, cores = 0`, which is *every derivation
# offered every core*. Whether that saturates the host or thrashes it was argued and never read.
#
# WHY THE PAIR AND NOT ONE OF THEM. They multiply. `max-jobs` is how many derivations build at once
# and `cores` is how many cores each is offered (0 = all), so `auto`/`0` on a 32-core host is up to
# 32 x 32. The two coherent shapes are one derivation with the whole host, or N derivations each
# bounded to a share - and which wins is empirical, because it depends on how much of the wall clock
# is one big `cargo` invocation (crane exports `CARGO_BUILD_JOBS=$NIX_BUILD_CORES`, so cargo's own
# parallelism IS `cores`) against many small derivations, where `max-jobs` is what fills the host.
#
# ARMS DIFFER FROM `reference` IN ONE FACTOR EACH, and the reason is this repository's own history:
# three CI diagnoses were refuted after a combined change produced a number nobody could attribute.
# `one-job` moves `max-jobs` alone. `bounded` is the other coherent SHAPE and moves both, which is
# stated rather than hidden - it is a third point, not a controlled contrast with `one-job`.
#
# IT GATES NOTHING AND REPORTS EVERYTHING. `devco/required-contexts` classifies all three jobs
# `[advisory]`. It runs on a dispatch and on a pull request that touches this file or the action it
# calls - which is exactly when its numbers are what a reviewer needs.
#
# WHAT IT MEASURED, on 2026-09-09, two attempts of run 34337027276, `nix build
# .#checks.x86_64-linux.clippy` from an empty store (73 -> 3541 paths, identical in every arm) on
# `rust-mcp-32core`, which `nproc` reads as **32 cores, 126 GiB, ~1.1-1.7 TB free**:
#
#   | arm | pair, from `nix config show` | wall (n=2) | mean busy | peak |
#   | --- | --- | --- | --- | --- |
#   | reference | max-jobs 32 (from `auto`), cores 0 | 208 s, 258 s | 22.3%, 22.8% | 92%, 96% |
#   | one-job   | max-jobs 1, cores 0                | 365 s, 303 s | 15.6%, 15.1% | 96%, 94% |
#   | bounded   | max-jobs 4, cores 8                | 290 s, 288 s | 16.4%, 16.5% | 26%, 26% |
#
# THE PAIR IS NOT CHANGED, and the measurement is why. The reference - what CI already does - was
# fastest in both attempts, and its slowest run (258 s) beats every run of both alternatives. So
# the oversubscription argument does not survive contact: `max-jobs = 32` is a CEILING, not an
# allocation, and nix starts only as many builds as the graph offers - which for a crane closure is
# one heavy cargo derivation at a time behind a wide fan of fetches and unpacks. What `auto` buys
# here is that fan running in parallel; capping it to one job costs 18-45%.
#
# READ THE LIMITS WITH THE NUMBERS. Within-arm spread is 24% (reference) and 20% (one-job), so
# reference-against-bounded (258 s against 288 s) is INSIDE the spread and not a result;
# reference-against-one-job clears it. `cores = 8` is visible as a mechanism rather than as a
# number - the `bounded` arm's peak never exceeds 26%, which is a quarter of the host, exactly what
# that setting means.
#
# THE TABLE IS DATED FOR A SECOND REASON: it was taken with `cache.nixos.org` as the only
# substituter. Once a binary cache carries this project's own closure, an arm starting from an
# empty store SUBSTITUTES most of these 3541 paths instead of building them - so these arms become
# even more fetch-bound, the numbers move, and a pre-cache number must not be averaged with a
# post-cache one. Re-run the probe on the same commit rather than comparing across that boundary;
# it costs three cold builds and answers it exactly.
#
# AND THE ANSWER TO *fully utilise the host* IS NOT THIS PAIR. The best arm leaves the host 77%
# idle on average while peaking above 90%: this workload is dominated by fetching and unpacking
# ~3.4 GiB and by a dependency graph that serialises, not by a shortage of offered cores. Three
# places that ceiling actually lives, none of them a nix setting: the cold store (issue #512's
# allocation, a settings action), the traversal in `nix run .#default-features` (issue #511), and
# `ci.yml` invoking its gates as SEQUENTIAL `nix build` steps, which by construction offers the
# scheduler one heavy derivation at a time. Merging those steps into one invocation would let
# `max-jobs` fill the host and would cost per-step attribution in the log - named here, not taken.
#
# WHAT IT CANNOT ANSWER: cost. A runner's price per minute is in no API this repository can read, so
# a latency-per-cost verdict needs that number from the billing side. This file supplies latency and
# utilisation, on a stated cache state, and nothing more.
name: runner-probe

on:
  # A measurement tool, run when a runner needs checking - never on a pull request or a push.
  # It builds the clippy check cold on several hosts (3x32-core + 1x16-core), which is a job's
  # worth of CPU every time it runs, and its arms are measurement for the owner rather than a
  # gate any commit must pass.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE REFERENCE ARM: the pinned host, exactly the settings ordinary CI uses today.
  reference:
    runs-on: rust-mcp-32core
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The one line ordinary CI passes, and no substituter: `cargo xtask check-workflows`
          # refuses one, and a probe is not the place to widen what CI trusts.
          extra_nix_config: |
            fallback = true

      - uses: ./.github/actions/host-probe
        with:
          arm: 32core-reference-auto-jobs
          workload: .#checks.x86_64-linux.clippy

  # ONE FACTOR: `max-jobs`. Everything else is the reference.
  one-job:
    runs-on: rust-mcp-32core
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            fallback = true
            max-jobs = 1

      - uses: ./.github/actions/host-probe
        with:
          arm: 32core-one-job
          workload: .#checks.x86_64-linux.clippy

  # THE OTHER COHERENT SHAPE: four derivations, each bounded to a quarter of a 32-core host. Two
  # factors from the reference, deliberately, because the shape is the point rather than the contrast.
  bounded:
    runs-on: rust-mcp-32core
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            fallback = true
            max-jobs = 4
            cores = 8

      - uses: ./.github/actions/host-probe
        with:
          arm: 32core-four-jobs-eight-cores
          workload: .#checks.x86_64-linux.clippy
