[package]
name = "sutura-catalog-datahub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "A SemanticCatalog adapter over DataHub's entity aspects: a DECLARING source."

[dependencies]
sutura-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The compiler: the multi-player example test (`tests/multi_player.rs`) proves the recorded
# DataHub catalog answers a question all the way to a plan, which is the "integration" its README
# promises. Dev-only, so the library closure stays serde + thiserror + sutura-domain.
sutura-semantic = { workspace = true }

# The provisioned-instance probe (`tests/provisioned.rs`) asks the compose tier's `datahub` profile
# whether GMS is reachable on the port this worktree allocated. Both are DEV-ONLY and that is the
# load-bearing part: the library still declares no HTTP client, because there is no `AspectReader`
# over one yet - `docs/adr/0016` leaves the read path's cost open, and a transport dependency in the
# library closure would be this crate claiming a reader it has not got.
#
# `ureq` rather than a second client: `sutura-exec-bigquery`'s wire already resolves this version and
# feature set, so nothing new enters `Cargo.lock` - the same argument `docs/adr/0018` makes, and
# `cargo xtask check-shared-client` is what holds it.
sutura-dev = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true
