# sutura for many users: Keycloak is the identity provider, DataHub is the catalog (one shared
# service token), and BigQuery is asked as the caller's own service account - built, and not yet
# proven against Google.
# Run ./setup.sh and the Pulumi program in infra/ first. Every port binds 127.0.0.1 only: the
# secrets setup.sh writes to .env and the user passwords in keycloak/realm.json are for a local
# demo and must never be reachable from another host.

# The DataHub services copy the CI tier's (compose.services.yaml), and nothing compares the two.

x-datahub-backend-environment: &datahub-backend-environment
  DATAHUB_GMS_HOST: datahub-gms
  DATAHUB_GMS_PORT: "8080"
  DATAHUB_PRECREATE_TOPICS: "true"
  DATAHUB_SQL_SETUP_ENABLED: "true"
  DATAHUB_TOKEN_SERVICE_SALT: sutura-example-salt
  # Generated by setup.sh into .env. GMS refuses an HS256 key shorter than 256 bits.
  DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SIGNING_KEY:?run ./setup.sh first}
  EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
  EBEAN_DATASOURCE_HOST: mysql:3306
  EBEAN_DATASOURCE_USERNAME: root
  EBEAN_DATASOURCE_PASSWORD: ${DATAHUB_DB_PASSWORD:?run ./setup.sh first}
  EBEAN_DATASOURCE_URL: jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2
  ELASTICSEARCH_HOST: search
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_PROTOCOL: http
  ELASTICSEARCH_USE_SSL: "false"
  ELASTICSEARCH_IMPLEMENTATION: opensearch
  ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
  ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
  ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
  ENTITY_VERSIONING_ENABLED: "true"
  GRAPH_SERVICE_IMPL: elasticsearch
  KAFKA_BOOTSTRAP_SERVER: broker:29092
  KAFKA_SCHEMAREGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
  SCHEMA_REGISTRY_TYPE: INTERNAL
  DATAHUB_TELEMETRY_ENABLED: "false"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      # The admin console: http://127.0.0.1:8180/admin, user admin, the password in .env.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run ./setup.sh first}
      # The issuer in every token. sutura and Google both require https://. Nothing fetches this
      # URL: sutura reads the keys from a file, and Google reads the keys Pulumi uploads.
      KC_HOSTNAME: https://localhost:8443
      KC_HOSTNAME_ADMIN: http://127.0.0.1:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      # realm.json reads it as ${SUTURA_EXCHANGE_SECRET}.
      SUTURA_EXCHANGE_SECRET: ${SUTURA_EXCHANGE_SECRET:?run ./setup.sh first}
    ports:
      - 127.0.0.1:8180:8080
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # The realm's signing key lives here. A new volume is a new key: run ./setup.sh and
      # `pulumi up` again.
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 15s

  datahub-kafka:
    image: confluentinc/cp-kafka:8.2.2
    hostname: broker
    command:
      - /bin/bash
      - -c
      - |
        file_path="/var/lib/kafka/data/clusterID"
        if [ ! -f "$$file_path" ]; then
           /bin/kafka-storage random-uuid > $$file_path
           kafka-storage format --ignore-formatted -t $$(cat "$$file_path") -c /etc/kafka/kafka.properties
        fi
        export CLUSTER_ID=$$(cat "$$file_path")
        /etc/confluent/docker/run
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_BROKER_ID: "1"
      KAFKA_PROCESS_ROLES: controller, broker
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:39092
      KAFKA_LISTENERS: BROKER://broker:29092,CONTROLLER://broker:39092
      KAFKA_ADVERTISED_LISTENERS: BROKER://broker:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_MESSAGE_MAX_BYTES: "5242880"
      KAFKA_MAX_MESSAGE_BYTES: "5242880"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
      KAFKA_LOG4J_LOGGERS: org.apache.kafka.image.loader.MetadataLoader=WARN
    volumes:
      - datahub-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server broker:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

  datahub-mysql:
    image: mysql:8.2
    hostname: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: datahub
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${DATAHUB_DB_PASSWORD:?run ./setup.sh first}
    volumes:
      - datahub-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h mysql -u root --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 20s

  datahub-opensearch:
    image: opensearchproject/opensearch:2.19.3
    hostname: search
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx1024m -Dlog4j2.formatMsgNoLookups=true
    volumes:
      - datahub-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail 'http://search:9200/_cluster/health?wait_for_status=yellow&timeout=0s'"]
      interval: 5s
      timeout: 15s
      retries: 24
      start_period: 30s

  datahub-system-update:
    image: acryldata/datahub-upgrade:v1.7.0
    hostname: datahub-system-update
    command: ["-u", "SystemUpdate"]
    depends_on:
      datahub-kafka:
        condition: service_healthy
      datahub-mysql:
        condition: service_healthy
      datahub-opensearch:
        condition: service_healthy
    environment:
      <<: *datahub-backend-environment

  datahub:
    image: acryldata/datahub-gms:v1.7.0
    hostname: datahub-gms
    depends_on:
      datahub-system-update:
        condition: service_completed_successfully
    environment:
      <<: *datahub-backend-environment
      DATAHUB_SERVER_TYPE: quickstart
      METADATA_SERVICE_AUTH_ENABLED: "true"
      AUTH_POLICIES_ENABLED: "true"
      MAE_CONSUMER_ENABLED: "true"
      MCE_CONSUMER_ENABLED: "true"
      PE_CONSUMER_ENABLED: "true"
      ENTITY_SERVICE_ENABLE_RETENTION: "true"
      ES_BULK_REFRESH_POLICY: NONE
      JAVA_OPTS: -Xms1g -Xmx1g
      DATAHUB_UPGRADE_HISTORY_KAFKA_CONSUMER_GROUP_ID: generic-duhe-consumer-job-client-gms
    ports:
      - 127.0.0.1:8081:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://datahub-gms:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 45s

  # Writes the realm's public keys and sutura's two secrets into the sutura-run volume, then loads
  # dbt/manifest.json and the two certified metrics into DataHub. Exits when DataHub has
  # indexed them.
  loader:
    image: python:3.13-alpine
    entrypoint: ["python", "/loader/load.py"]
    depends_on:
      keycloak:
        condition: service_healthy
      datahub:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      DATAHUB_GMS_URL: http://datahub-gms:8080
      DATAHUB_TOKEN_SIGNING_KEY: ${DATAHUB_TOKEN_SIGNING_KEY:?run ./setup.sh first}
      SUTURA_EXCHANGE_SECRET: ${SUTURA_EXCHANGE_SECRET:?run ./setup.sh first}
    volumes:
      - ./loader:/loader:ro
      - ./dbt/manifest.json:/dbt/manifest.json:ro
      - ./.local:/out
      - sutura-run:/run/sutura

  sutura:
    image: ghcr.io/telekom/sutura:${SUTURA_VERSION:?set SUTURA_VERSION to a release that reads workload_identity.delegation, or a local image}
    command: serve
    # sutura binds 127.0.0.1:8080. In a container that is the container itself, so it uses the host
    # network, and reaches Keycloak and DataHub on their 127.0.0.1 ports.
    network_mode: host
    depends_on:
      loader:
        condition: service_completed_successfully
    environment:
      SUTURA_CONFIG_DIR: /conf
    volumes:
      # base.yaml, and development.yaml that infra/ writes: the BigQuery source.
      - ./conf:/conf:ro
      - sutura-run:/run/sutura:ro

volumes:
  keycloak-data:
  datahub-kafka-data:
  datahub-mysql-data:
  datahub-opensearch-data:
  sutura-run:
