# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:
    inputs:
      operation:
        description: Run the reviewed chart proof on the pinned source
        type: choice
        required: true
        options: [helm-proof]
      source_sha:
        description: Exact frozen source commit; must match the reviewed plan
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: inbound-chart-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: rust-mcp-16core
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: 5c4f252b4ac2bfc7dc834dc1197b642b026c12f7
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Retain exact inputs before setup
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir helm-evidence
          cp devco/helm_inbound_proof.py devco/inbound-helm-plan.json helm-evidence/

      - uses: ./.github/actions/reclaim-disk
        if: github.event_name == 'workflow_dispatch'

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - name: markdown, yaml, toml and python
        if: github.event_name != 'workflow_dispatch'
        run: bash nix/format-text.sh check

      - name: Run the reviewed chart proof on the pinned source
        if: github.event_name == 'workflow_dispatch'
        working-directory: source
        env:
          INSTA_UPDATE: "no"
          GIT_OPTIONAL_LOCKS: "0"
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND
          export CARGO_TERM_COLOR=never NO_COLOR=1
          nix shell --no-update-lock-file --no-write-lock-file --inputs-from . nixpkgs#python3 nixpkgs#just --command python3 -I ../devco/helm_inbound_proof.py --plan ../devco/inbound-helm-plan.json --head . --base ../base --output ../helm-evidence/collection 2>&1 | tee ../helm-evidence/bootstrap.log

      - name: Retain the complete chart evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inbound-chart-proof-${{ github.run_id }}
          path: helm-evidence/
          if-no-files-found: error
          retention-days: 14
