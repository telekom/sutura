[package]
name = "sutura-exec-foundry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "EXPERIMENTAL: a Warehouse adapter over Foundry Ontology SQL."

[features]
# Foundry's HTTP and Arrow transport are deliberately opt-in: the default build links no
# network client or Arrow IPC decoder for a source the shipped binary does not enable.
http = [
  "dep:ureq",
  "dep:sutura-http-client",
  "dep:sutura-tls",
]

[dependencies]
sutura-domain = { workspace = true }
sutura-sql = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
ureq = { workspace = true, optional = true }
sutura-http-client = { workspace = true, optional = true }
sutura-tls = { workspace = true, optional = true }

[lints]
workspace = true
