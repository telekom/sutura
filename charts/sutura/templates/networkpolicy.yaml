{{/*
NetworkPolicies closing github.com/telekom/sutura#1680 finding 6: the headless workers Service was
reachable from every namespace, gated only on the node certificate check finding 5 narrows. These
restrict ingress to the worker pods and egress from the operator pod, and bound the worker pools'
own links: the release's nodes reach one another on the service port and nothing else, a combining
worker reaches no source, and a reading worker reaches only the source addresses its group declares
under `egress`. The serving pods' own egress is not restricted - they read the data sources and reach
an identity provider this chart cannot name. Off by default (`networkPolicy.enabled`) - see values.yaml for why.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $name := include "sutura.name" . }}
{{- $fullname := include "sutura.fullname" . }}
---
# Serving pods keep their public port: this rule is additive, not restrictive, so it changes
# nothing by itself. It exists so a namespace that later adds its own default-deny NetworkPolicy
# still serves this port without the chart's intent being tribal knowledge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "sutura.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sutura.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
{{- if .Values.workerPool.enabled }}
---
# Workers answer this release's nodes and the operator's metric scrapes.
# Metrics share the node port; their bearer check and the worker transport's client certificate
# check still decide which operations an allowed peer may call.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-workers
  labels:
    {{- include "sutura.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- include "sutura.nodePeers" . | nindent 8 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}-operator
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
---
# A combining worker holds no source, so it needs no address outside this release: it dials this
# release's nodes on the service port and nothing else. DNS stays open because this chart does not
# know the cluster resolver's address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-workers-egress
  labels:
    {{- include "sutura.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- include "sutura.nodePeers" . | nindent 8 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- range $group, $spec := .Values.readingWorkers.groups }}
---
# Reading workers of group {{ $group }} reach this release's nodes on the service port, as every node
# does - another group's readers and the combining workers serve join inputs a stage reads - and
# reach network-backed sources and catalogs only at the addresses the group declares under `egress`,
# plus DNS. Local `files`, `duckdb`, `markdown`, `okf` and `datacontract` entries need no destination
# rule. One policy per group, selected by the group's own label. Groups can share a destination when their
# declarations overlap. The policy does not validate a source's `host` against its destinations.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-reading-{{ $group }}
  labels:
    {{- include "sutura.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-reading-worker
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $group | quote }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- include "sutura.nodePeers" $ | nindent 8 }}
      ports:
        - port: {{ $.Values.service.port }}
          protocol: TCP
  egress:
    - to:
        {{- include "sutura.nodePeers" $ | nindent 8 }}
      ports:
        - port: {{ $.Values.service.port }}
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range (dig "egress" (list) $spec) }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - port: {{ .port | int }}
          protocol: TCP
    {{- end }}
{{- end }}
---
# The operator reads serving and worker metrics and calls the Kubernetes API. This permits the
# node port, not an HTTP path: the metrics token authorizes scrapes and TLS verifies the node.
# The operator holds only the node CA, not a client certificate. DNS stays open for API discovery.
# STATED LIMIT: the API server's own address is cluster-specific and this chart has no way to name
# it, so this bounds the port (443, the apiserver's common port, and 6443, its other common one),
# not the destination - it does not stop the operator reaching some other HTTPS endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "sutura.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "sutura.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}-worker
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- end }}
{{- end -}}
