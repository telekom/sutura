[package]
name = "sutura-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The service binary. Composes adapters and the transport; contains no business logic."

[[bin]]
name = "sutura-serve"
path = "src/main.rs"

[features]
# In-process TLS termination. Default-off; see `sutura-http`'s feature of the same name.
#
# Named on BOTH crates rather than only on the library, because this is the crate that produces the
# binary: `--features tls` on the binary is what an operator types, and it has to reach
# `sutura-config` as well so the startup refusal for "asked for in-process TLS, built without it"
# agrees with what is actually linked.
tls = ["sutura-config/tls", "sutura-http/tls"]

# The BigQuery adapter, and with it the outbound HTTP stack its wire needs.
#
# **Default-off, and the reason is the ARTEFACT rather than the four cross builds.** No published
# binary links an outbound TLS stack, and `checks.shipped-features` asserts that out of each
# binary's own embedded dependency list rather than out of this manifest.
#
# **The build-cost reason this comment used to give was measured false.** It said a non-optional
# dependency here would put the TLS stack into all four cross dependency derivations. It is already
# in all four: `crane.buildDepsOnly` is unscoped so the checks can share one dependency derivation,
# and it builds dev-dependencies - `sutura-catalog-datahub` has a non-optional one on `ureq`, which
# `cargo tree` shows on 2026-09-04 to be the only edge into it for a musl target at the default set.
# `sutura-exec-bigquery`'s own `ureq` is `optional` behind `wire` and contributes nothing there.
# `docs/adr/0017` carries the measurement and what it does not cover.
#
# So the adapter arrives by asking: `cargo build -p sutura-serve --features bigquery`, or
# `--all-features`, which is what `just lint`, `just test` and every nix check already pass - so the
# registration below is compiled, linted and tested on every run, and only the four cross builds and
# a bare `cargo build` are unchanged.
#
# **Two gates read this crate with the feature OFF, and they are the only ones that do.** Every check
# passes `--all-features`, so the `cfg(not(feature = "bigquery"))` half of `open_bigquery` - and the
# one-variant `OpenedSources` beside it - is covered by `cargo xtask check-default-features` for the
# compile and the lint, and its test by `cargo xtask check-default-feature-tests`, which the first
# only compiled. Both derive their package list from `nix/shipped.nix`, which names this crate, and
# both run in `just gates`; only the second has a `ci.yml` step, so the compile half's CI venue is
# still the four `cross` link builds and its lint half has none. Beyond that: the host triple only,
# and nothing about a feature no shipped binary enables.
bigquery = ["dep:sutura-exec-bigquery", "sutura-exec-bigquery/wire"]

# Loads and drops a real fixture table over BigQuery - `sutura-exec-bigquery`'s own `fixtures`
# feature, turned on here for `just e2e-datahub-bigquery` alone.
#
# **Kept off `bigquery` itself, on purpose.** `fixtures` is a write path (`CREATE OR REPLACE TABLE` /
# `DROP TABLE`) this binary's composition root (`src/bigquery.rs`) never calls - nothing routes an
# HTTP request to it - and `sutura-exec-bigquery`'s own doc for it says "no shipped build holds it".
# Folding it into `bigquery` would make that false for the one build that DOES turn `bigquery` on
# alone: `nix/shipped.nix`'s `probeFeatures`, which measures the operator-facing adapter's own cost.
# A separate feature keeps that probe measuring exactly what `--features bigquery` means for an
# operator, while `--all-features` - what `just lint`, `just test`, `just e2e-datahub-bigquery` and
# every nix check already pass - still turns this on too, since that flag enables every feature this
# manifest declares.
bigquery-e2e-fixtures = ["bigquery", "sutura-exec-bigquery/fixtures"]

# The Postgres adapter, and with it the outbound TLS the source channel verifies against.
#
# **Default-off, and the reason is the ARTEFACT rather than the four cross builds** - the same
# decision `bigquery` above carries. `sutura-exec-postgres` is pure Rust, but `tokio-postgres-rustls`
# pulls the rustls closure with `ring` in it; keeping this feature off leaves that out of the
# published binary until a deployment asks for it. `checks.shipped-features` already asserts `ring`
# is absent from both shipped binaries, so turning this on is an entry there rather than a drift.
#
# It requires no wire feature of its own - unlike `bigquery`, there is no HTTP stack here, only the
# rustls connector the driver links.
postgres = ["dep:sutura-exec-postgres", "dep:tokio-postgres"]

# The DataHub metadata adapter's HTTP reader (issue #202), and with it the outbound HTTP stack that
# reader needs.
#
# **Default-off for the same ARTEFACT reason `bigquery` above is.** `sutura-catalog-datahub` already
# has a non-optional `ureq` DEV-dependency (its own `tests/provisioned.rs`), so this feature adds no
# new edge into the outbound TLS closure at the four cross builds' shared dependency derivation - the
# same measurement `bigquery`'s own comment records, applied to the crate that already carried it.
#
# `sutura-catalog-datahub/http` rather than a bare feature name on the dependency alone, mirroring
# `bigquery = [..., "sutura-exec-bigquery/wire"]`: the adapter crate's own feature gates its reader
# module, and this crate's feature is what an operator building `sutura-serve` types.
datahub = ["dep:sutura-catalog-datahub", "sutura-catalog-datahub/http"]

# The agent surface: `sutura-mcp`'s streamable-HTTP transport, mounted by the composition root.
#
# **Default-off, and the reason is the ARTEFACT plus the identity posture rather than build time.**
# No published binary should serve a second, independently routed tool surface by accident, and the
# surface only makes sense behind leg 1 (`security.inbound`) - so this feature links the transport
# (`dep:sutura-mcp`, `sutura-mcp/http`) AND turns on `sutura-http`'s `agent` feature that holds the
# mount point and the assembly-time refusal. A build without it cannot name `sutura_mcp::http` at
# all, so "the route is compiled out" is a fact about the artefact rather than a runtime branch.
# `nix/shipped.nix` gains no `probeFeatures` entry here - `sse-stream`'s musl link is unattempted,
# deferred to a follow-up, the same deferral `checks.shipped-features` already documents.
agent = ["dep:sutura-mcp", "sutura-mcp/http", "sutura-http/agent"]

[dependencies]
# For `sources`: which data systems a bundle reads from, so the engine is opened for the ones the
# catalog actually names rather than for a guess.
sutura-app = { workspace = true }
sutura-catalog-local = { workspace = true }
sutura-config = { workspace = true }
sutura-domain = { workspace = true }
sutura-exec-datafusion = { workspace = true }
# `security.outbound.transport_anchors` (`github.com/telekom/sutura#125`) - resolved ONCE in
# `main::outbound_anchors` regardless of which adapter feature is on, the same way this crate's own
# `sutura-config` dependency is unconditional.
sutura-tls = { workspace = true }
# The BigQuery adapter, behind the `bigquery` feature above. Optional is what makes the dependency
# ABSENT from the default build rather than merely unused, which is the property the cross builds need.
sutura-exec-bigquery = { workspace = true, optional = true }
# The DataHub metadata adapter, behind the `datahub` feature above. Optional for the same reason
# `sutura-exec-bigquery` is: absent, not merely unused, from a build that did not ask for it.
sutura-catalog-datahub = { workspace = true, optional = true }
sutura-http = { workspace = true }
# The agent-surface transport, behind the `agent` feature above. Optional is what makes the
# transport ABSENT from the default build rather than merely unused - the property the compose root
# refuses on when it is enabled but this build does not link it.
sutura-mcp = { workspace = true, optional = true }
# For `axum::Router` in one signature. The router is BUILT by `sutura-http`; this crate only names
# the type on its way to `serve`.
axum = { workspace = true }
# The Postgres adapter, behind the `postgres` feature above. Optional is what makes the dependency
# ABSENT from the default build rather than merely unused, which is the property the cross builds need.
sutura-exec-postgres = { workspace = true, optional = true }
# The driver config used by the served-e2e loader, behind the same feature. Normal composition maps
# the declaration into `sutura_exec_postgres::connection`, so it names no driver type; the fixture
# loads the example corpus into the real tier before starting the composed binary and needs `Config`
# for that one setup connection. The adapter owns all TLS types, so this root needs no TLS crate.
tokio-postgres = { workspace = true, optional = true }
sutura-runtime = { workspace = true }
# `enable_all` needs `net` and `time` to exist as methods, `rt-multi-thread` is the server runtime,
# `signal` is the shutdown listener and `sync` is what the shutdown flag is built on. No `macros`:
# `#[tokio::main]` is deliberately not used - see the note on `run` in `src/main.rs`.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }

# For `tests/served.rs`, which spawns this crate's own binary and then reads two documents: the
# service's own log (one JSON object per line, because the fixture configures `telemetry.format:
# bunyan`) and the JSON body of every reply.
#
# **`serde_json` and NOT an HTTP client**, and the surviving reason is the shape of the test rather
# than the cost of the closure. What it needs is one plaintext loopback request with a fixed shape,
# which it writes to a `TcpStream` itself; `serde_json` is already in the target graph as
# `sutura-http`'s own dependency, so this adds nothing to `Cargo.lock` and nothing to any build.
#
# **What this comment used to claim, and what measurement did to it:** that `ureq` here would make
# the four cross builds compile rustls and `ring` for a binary linking none of it. That closure is
# already in all four dependency derivations - `crane.buildDepsOnly` is unscoped and builds
# dev-dependencies, and `sutura-catalog-datahub` already has a non-optional `ureq` dev-dependency -
# so the cost argument was spent before it was written. The narrower reasons above are the real ones,
# and they are about THIS request only - the plaintext loopback one this suite makes of its own
# spawned binary. `ureq` below is a second fixture's client, talking to somebody else's server.
[dev-dependencies]
serde_json = { workspace = true }
# The log-capture writer, for the one test that reads a boot line back - `sutura-http` already
# depends on the same feature for the identical reason, and its own Cargo.toml carries the argument
# for a second entry rather than a normal-dependency feature: the helpers around the writer use
# `expect`, which is denied outside test code.
sutura-runtime = { workspace = true, features = ["test-capture"] }
# `served/harness/keycloak.rs`'s client, for the ONE thing the reasons above do not cover: a request
# to a REAL server this suite did not write - `nix/keycloak-tier.nix`'s own Keycloak, over its token
# endpoint and its JWKS document. That is not "one plaintext loopback request of a fixed shape" -
# it is whatever a real Quarkus/Keycloak answers, chunked or not, and `served/harness.rs`'s own
# hand-rolled `parse` deliberately refuses a chunked response. Already paid for, per the comment
# above; `sutura-exec-bigquery::wire` is this crate's own precedent for the exact shape
# (`.post(url).send_form(form)`, `.get(url).call()`, `body_mut().read_to_string()`).
ureq = { workspace = true }
# Decodes a compact JWT's payload segment (base64url, unpadded) to read the `aud` a real issuer
# minted, rather than assuming one - see `keycloak.rs`'s own header. Already pinned for
# `sutura-exec-bigquery`'s assertion signing; `URL_SAFE_NO_PAD` is the one engine this crate reaches
# for, so a hand-rolled decoder is not a second implementation of something this workspace already
# carries correctly.
base64 = { workspace = true }
# The mock authorization server, for the leg-1 cases in `tests/served.rs`: a generated key pair, a
# JWK set published to a real path and a token minter every claim of which is a parameter.
#
# **The same fixture `sutura-http` drives its router tests from**, which is the whole reason it lives
# in `sutura-dev` rather than in either crate: what this suite adds is not a second issuer but the
# same one pointed at a composed binary, so a deployment configured with the issuer's own names and a
# key set it published is the shape both venues test. The feature is named because it is default-off
# in that crate - `xtask` links the same library for a compose project name and should not compile a
# crypto backend for it.
sutura-dev = { workspace = true, features = ["mock-issuer"] }

# The allocator, and Linux only. A target table rather than a plain dependency plus a `cfg`, for
# the reason `sutura-cli`'s manifest gives: this way the C is never compiled - not even a build
# script - on a macOS or Windows laptop, so the one platform we ship on is the only one that pays
# for it. `Cargo.lock` still records it, because a lockfile is target-agnostic by design.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { workspace = true }

[lints]
workspace = true
