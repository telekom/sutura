[package]
name = "sutura-catalog-datahub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "A SemanticCatalog adapter over DataHub's entity aspects: a DECLARING source."

[features]
# Off by default, for the reason `sutura-exec-bigquery`'s `wire` feature is: what arrives with it is
# an outbound TLS stack, and no published binary links one it did not ask for -
# `.agents/skills/sutura/crate-map/SKILL.md`'s "Why a networked adapter hides behind a default-off
# feature". `dep:ureq` rather than a plain feature name, so the optional dependency below has no
# feature of its own a caller could enable without meaning to.
http = ["dep:ureq", "dep:sutura-tls", "dep:base64"]

[dependencies]
sutura-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The real `AspectReader` (`src/http.rs`), behind the `http` feature above. `ureq` rather than a
# second client: `sutura-exec-bigquery`'s wire already resolves this version and feature set, so
# nothing new enters `Cargo.lock` - the same argument `docs/adr/0018` makes, and
# `cargo xtask check-shared-client` is what holds it.
ureq = { workspace = true, optional = true }
# The loaded outbound trust anchors a deployment's `security.outbound.transport_anchors` resolves to,
# behind the same default-off `http` feature as `ureq`: replacing `ureq`'s compiled-in roots with a
# deployment's own CA is a TLS-decision, so it arrives with the TLS stack and not in the `serde +
# thiserror + sutura-domain` library closure. Normal (not dev), because `src/http.rs`'s constructor
# folds the loaded certificates into `ureq`'s own `RootCerts` at runtime, not in a test.
#
# **`sutura-tls` carries no network client** - it reads bytes and returns `CertificateDer`; which
# ureq-based adapter turns those bytes into `ureq::tls::RootCerts` is each adapter's own decision,
# stated in that crate's module header. This crate makes the same fold `sutura-exec-bigquery`'s
# `wire/tls.rs` makes, over the same `LoadedAnchors`.
sutura-tls = { workspace = true, optional = true }
# `tls_roots.rs`'s PEM armoring of a declared client identity (`github.com/telekom/sutura#911`) -
# `ureq`'s own `PrivateKey::from_der` needs a `ureq::tls::KeyKind` it never re-exports, so this
# crate re-encodes the already-loaded DER as PEM instead and hands it to `from_pem`. Already
# resolved in `Cargo.lock` at this version (`sutura-exec-bigquery`'s own `wire/tls.rs` does the
# identical fold), so this is a new edge and not a new package.
base64 = { workspace = true, optional = true }

[dev-dependencies]
# The compiler: the multi-player example test (`tests/multi_player.rs`) proves the recorded
# DataHub catalog answers a question all the way to a plan, which is the "integration" its README
# promises. Dev-only, so the library closure with the `http` feature OFF stays serde + thiserror +
# sutura-domain.
sutura-semantic = { workspace = true }

# The provisioned-instance probe (`tests/provisioned.rs`) asks the compose tier's `datahub` profile
# whether GMS is reachable on the port this worktree allocated, over its own hand-built requests -
# it is not `src/http.rs`'s reader, and predates it. Kept as an unconditional dev-dependency rather
# than folded into the `http` feature's optional one, so that suite still builds with the feature
# off: the two are independent claims (the platform answers; this crate's own reader is correct)
# and a developer running `just test` without `--features http` should still get the first.
sutura-dev = { workspace = true }
ureq = { workspace = true }
# The TLS handshake cells (`tests/http_reader.rs::tls_anchors`, behind the `http` feature): a real
# `rustls::ServerConnection` on a loopback `TcpListener` presenting an `rcgen`-issued self-signed
# leaf, dialled by the reader's own `ureq::Agent` built from a declared bundle - the same fixture
# shape `sutura-exec-bigquery`'s `wire/tests/tls.rs`, `sutura-tls`'s own suite and
# `sutura-exec-postgres`'s hermetic negative all rest on. Both are already pinned at the workspace
# root (and already resolved in `Cargo.lock` via `sutura-exec-postgres`'s rustls closure), so this
# adds no new package and dev-edges are exempt from the shipped-features gate.
rcgen = { workspace = true }
rustls = { workspace = true }

[lints]
workspace = true
