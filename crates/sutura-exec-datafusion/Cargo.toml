[package]
name = "sutura-exec-datafusion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "A Warehouse adapter that executes a plan in process with DataFusion, generating no SQL."

[dependencies]
sutura-domain = { workspace = true }
# NOT `sutura-semantic`, and that absence is the whole crate. The sibling DuckDB adapter depends on
# the compiler for its last stage because it speaks SQL; this one executes the plan directly, so
# there is no dialect to render for, no identifier to quote and no placeholder to position.
datafusion = { workspace = true }
# One runtime, built once and kept beside the session context. See the struct.
#
# `rt-multi-thread` ADDS to the base `rt` the workspace entry asks for, and it is the whole of what
# lets `with_worker_threads` exist: `Builder::new_multi_thread` is not in the build without it.
# `time` is the other addition: `tokio::time::timeout` around `execute`'s `rows` future needs the
# feature compiled in as well as `enable_time()` on the runtime at construction, which is what
# stops a question at its deadline (`telekom/sutura#160`, `docs/adr/0029`). Still no `enable_all`,
# so still no I/O driver, which a plan over a local file does not need.
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
thiserror = { workspace = true }

# The conformance packs, which `tests/conformance.rs` binds this engine to. A DEV-dependency, for
# the reason the sibling adapter's manifest gives.
[dev-dependencies]
sutura-conformance = { workspace = true }
# Only for the `Stream` trait, to hand-roll a synthetic `PartitionStream` the deadline test never
# finishes on its own. Already in the graph via `sutura-exec-postgres`, so this is a new edge, not
# a new crate.
futures-util = { workspace = true }
# `sutura_dev::tolerance`: the deadline tests' wall-clock margin widens on a shared dev machine and
# stays CI's own strict number everywhere else. Already in the graph via `sutura-exec-postgres`'s
# own dev-dependencies, so this is a new edge, not a new crate.
sutura-dev = { workspace = true }

[features]
fixtures = ["sutura-domain/fixtures"]
# Test-harness construction that observes the engine's operator-reservation pool. It is default-off
# because no shipped binary reads a live reservation; `sutura-app` enables it only as a dev-dependency.
measurement = []

[[test]]
name = "conformance"
required-features = ["fixtures"]

[lints]
workspace = true
