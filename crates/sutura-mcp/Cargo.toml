[package]
name = "sutura-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "The agent-facing surface. Transport only: one tool over MCP, and it decides nothing a question depends on."

[features]
# The streamable-HTTP server transport, default-off - `telekom/sutura#378` PR3, `docs/adr/0023`.
#
# Requests `rmcp`'s own `transport-streamable-http-server`, which pulls three sibling features -
# `transport-streamable-http-server-session`, `server-side-http`, `transport-worker` - and, of the
# eleven package names those touch, resolves exactly ONE new package: `sse-stream`. The other ten
# (`uuid`, `rand`, `tokio-stream`, `http`, `http-body`, `http-body-util`, `bytes`, `base64`, `tower`,
# `async-trait`, `tower-service`) already resolve through `axum`/`tower-http` elsewhere in this
# workspace. Measured against `Cargo.lock` with `grep -c '^name = "<crate>"$'`, not assumed from
# the vendored source alone.
#
# Off by default so a plain `cargo build`/`just check` never resolves `sse-stream` at all. This is
# NOT the `crate-map` skill's native/outbound-TLS rule - the closure pulls no HTTP client
# (`server-side-http` names neither `reqwest` nor `oauth2`) - it is a separate posture decision: a
# new in-process server listener is a bigger surface than a background TLS client, and the spec
# this feature answers (`telekom/sutura#378`'s decision comment) says default-off explicitly.
#
# Nothing in `sutura-mcp` MOUNTS this yet: `http.rs`'s `service`/`config` are a plain
# `tower_service::Service` a composition root nests behind its own layers - PR4's job.
http = ["rmcp/transport-streamable-http-server"]

[dependencies]
# The service, behind the driving port. This crate calls `answer` and nothing else; every rule about
# what may be answered lives on the other side of that call.
sutura-app = { workspace = true }
# The two BOUNDS this transport is subject to, as the parsed newtypes an operator's numbers become.
# A normal dependency since `telekom/sutura#339`, and it was a dev-dependency until then on the
# argument that nothing in `src/` reads a setting - which is still true and is not what changed.
# What changed is that the reply deadline has to arrive here as `RequestTimeout` and not as a bare
# duration: `server.request_timeout_seconds` is refused at zero and above five minutes by that
# type's own `parse`, and a transport that took a `Duration` would be a second place where those
# refusals do not apply. The composition root still does all the reading - this crate names two
# types and loads no document. `sutura-http`, the sibling in the same class, holds the whole
# `Settings` for its token gate, so the edge itself is the transport-layer norm here rather than a
# new one.
sutura-config = { workspace = true }
sutura-domain = { workspace = true }
# For ONE type - `http::request::Parts` - and nothing this crate accepts connections over. This is
# what `Asking::PerRequest` reads a `sutura_app::Asked` out of: the pinned `rmcp` HTTP server
# transport injects the request's own `Parts` into `rmcp::service::RequestContext::extensions`
# (`docs/adr/0023`), and `sutura-http`'s `establish_asked` inserts `Asked` into that same `Parts`
# value's OWN extensions before this crate ever sees it - the two transports never call each other,
# they agree on one wire type. Not the whole `http` crate's request/response machinery, and not a
# step toward this crate opening a socket: `telekom/sutura#378`'s PR3 is where the transport feature
# that actually produces one of these arrives, behind `sutura-mcp`'s own default-off `http` feature.
http = { workspace = true }
# For ONE function - `spawn_carrying_span` - and not for anything this crate installs. The `Surface`
# port is synchronous and the engine behind it drives its own runtime, so a port call has to leave
# the async worker; `clippy.toml` bans `tokio::task::spawn_blocking` because a pool thread has no
# current span, and this crate is a caller routed through the one permitted call rather than a
# second `#[expect]` for the same ban. Nothing here touches a subscriber, a panic hook or a signal
# handler.
sutura-runtime = { workspace = true }
# The Model Context Protocol, spoken by the SDK rather than by us. See `src/lib.rs` for why a
# hand-rolled JSON-RPC server was rejected: a server we frame ourselves cannot be shown to
# interoperate, and the tests here drive it with this crate's own client.
#
# `default-features = false` on the workspace entry drops `macros`: the `#[tool]` attribute would
# generate code inside this crate, and this workspace gates on the whole clippy `restriction`
# category with `-D warnings`, so generated code is a lint surface nobody wrote and nobody can fix
# locally. `ServerHandler` is implemented by hand instead - three methods.
rmcp = { workspace = true }
# THE schema source. `AskArgs` derives `JsonSchema` and `schema_for!` dumps it; nothing here hand
# writes a tool schema. It is on a WIRE type in this crate and never on a domain type - see the
# note on the workspace entry.
schemars = { workspace = true }
serde = { workspace = true }
# The tool result's structured content is JSON, and the input schema is a `serde_json` object
# because that is the type `rmcp::model::Tool` carries.
serde_json = { workspace = true }
thiserror = { workspace = true }
# For ONE type - `task::JoinError`, in `NotServed` - and for nothing this crate spawns itself: the
# blocking call goes through `sutura-runtime`, which is where the ban on a bare `spawn_blocking` is
# discharged. The workspace entry's `rt` is what makes that type exist.
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The committed schema dump. Reviewed as a diff, never typed: a new or widened tool input changes
# the snapshot and the byte-compare fails until somebody re-accepts it.
insta = { workspace = true }
# The other transport, for ONE differential test: that its `QuestionBody` and this crate's own
# `AskArgs` parse the same wire input into the same `Query`, through the one shared conversion now
# inward of both in `sutura_domain::question`. *An adapter never calls another adapter* is a NORMAL-
# dependency rule - `cargo xtask check-boundaries` walks `Edges::Normal` only - and a dev-dependency
# between two adapters of the same class is exempt for exactly this reason: it is how a differential
# reaches a second real implementation to compare against, the same shape
# `sutura-exec-bigquery` dev-depends on `sutura-exec-datafusion` for. Adds no PACKAGE to
# `Cargo.lock`: `sutura-http`'s whole tree is already resolved there, by `sutura-cli`.
sutura-http = { workspace = true }
# The far side of every test in `src/server.rs`: a REAL MCP client from the same SDK, over an
# in-memory duplex. That is what "with no client of ours in the loop" means - nothing this crate
# wrote sits between the assertion and the protocol.
rmcp = { workspace = true, features = ["client"] }
# The SAME dependency as above, with the log-capture writer turned on. A cancelled MCP request gets
# no response by protocol, so the handler finishing its wait is observable only as a log line. The
# writer comes from `sutura-runtime` rather than being copied here, and the feature stays out of the
# shipped graph because this is a dev-dependency.
sutura-runtime = { workspace = true, features = ["test-capture"] }
# `macros` and `rt-multi-thread` for the tests themselves, `io-util` for `tokio::io::duplex`, which
# is the pipe the client and the server are joined by.
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
# The hermetic driver for `http.rs`'s own `#[cfg(feature = "http")]` tests: a real `axum::Router`
# nests the streamable-HTTP transport behind a stand-in for `sutura_http::capability::establish_asked`,
# and `tower::ServiceExt::oneshot` (below) drives a real HTTP request/response cycle through it with
# no socket. Adds no PACKAGE: `sutura-http`'s whole tree - axum included - is already resolved here
# by the dev-dependency above. `default-features = false` plus the same feature list `sutura-http`
# itself requests, so this crate's tests do not widen axum's own feature set beyond what already
# resolves.
axum = { workspace = true }
# `util`, for `ServiceExt::oneshot` - not requested anywhere else in this workspace today, so
# whether it adds a package is unmeasured without a resolve; its own dependants (`futures-util`,
# `pin-project-lite`) are already common transitive names across this graph.
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
