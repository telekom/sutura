# sutura over this example: the published image, one user, local CSV files.
# docs/examples/single-player.md explains each setting. docs/serving.md is the full reference.
services:
  sutura:
    # SUTURA_VERSION selects the release. Without it, the image is `latest`.
    image: ghcr.io/telekom/sutura:${SUTURA_VERSION:-latest}
    # The image prints its version without a command. `serve` starts the HTTP server.
    command: serve
    # The server binds 127.0.0.1:8080. Inside a container, that is the container itself, so the
    # container uses the host network. A bind other hosts can reach needs a token and a declared
    # TLS terminator (docs/serving.md).
    network_mode: host
    working_dir: /examples
    volumes:
      - .:/examples:ro
    environment:
      SUTURA__SECURITY__IDENTITY: single-user
      SUTURA__SECURITY__SINGLE_USER_BECAUSE: "one operator reading their own files"
      SUTURA__SOURCES__LOCAL__KIND: files
      SUTURA__SOURCES__LOCAL__DATA_DIR: /examples/data
      SUTURA__SOURCES__LOCAL__POSTURE: shared-service-user
