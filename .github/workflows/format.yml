name: peer-stage-fuzz-smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: rust-mcp-32core
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - name: Record exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/peer-stage-smoke"
          git rev-parse HEAD > "$RUNNER_TEMP/peer-stage-smoke/source-sha"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/peer-stage-smoke/source-tree"
          sha256sum fuzz/seeds/peer_stage/parquet-projection-out-of-bounds > "$RUNNER_TEMP/peer-stage-smoke/seed.sha256"
      - name: Replay every committed fuzz seed
        run: |
          set -euo pipefail
          nix shell --inputs-from . nixpkgs#just --command just fuzz-smoke 2>&1 | tee "$RUNNER_TEMP/peer-stage-smoke/smoke.log"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: peer-stage-smoke-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/peer-stage-smoke/
          if-no-files-found: error
