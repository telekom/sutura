# Default values for the sutura chart.

# Image that runs the service.
image:
  repository: ghcr.io/telekom/sutura
  # Image tag. Empty means the chart's app version.
  tag: ""
  # C library of the image: `musl` (default, a static image; the tag gets the suffix `-musl`) or
  # `glibc` (the tag has no libc suffix). An explicit `tag` wins and is used as is.
  variant: musl
  # When true, run the optimised image of the same version: the tag gets the suffix `-performance`,
  # before the variant's suffix (`<version>-performance-musl`). That image exists only for releases
  # where it was published. An explicit `tag` wins and is used as is.
  performance: false
  pullPolicy: IfNotPresent

# Secrets that hold image pull credentials.
imagePullSecrets: []

# Service account used by the pod. The chart creates a dedicated account by default and does not
# mount Kubernetes' API token; an explicit projected token can still be added with extraVolumes.
serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

# Deployment environment: development, test or production.
environment: ""

# Number of pod replicas. Not rendered while autoscaling is enabled.
replicaCount: 1

# A HorizontalPodAutoscaler for the Deployment. Enabled, it owns the replica count.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  # Average CPU use across pods, as a percentage of each pod's CPU request. Empty leaves CPU out.
  # Needs resources.requests.cpu or resources.limits.cpu.
  targetCPUUtilizationPercentage: 70
  # Average sutura_execution_slots_in_use per pod: questions running at once. Empty leaves it out.
  # Needs an adapter that serves this Prometheus series through the custom metrics API.
  targetSlotsInUsePerPod: ""

# Settings files that the service reads.
config:
  # Contents of base.yaml. They override the built-in defaults.
  base: {}
  # Contents of the environment file. They override base.
  environment: {}

# Log output of the service. Both are written to base.yaml; a `telemetry` key in `config.base` or
# `config.environment` overrides them.
telemetry:
  # Log format: `bunyan` (default, one JSON object per line) or `pretty` (for a terminal).
  format: bunyan
  # Log filter directive, for example `info` (default) or `sutura=debug`.
  filter: info

# Credentials and TLS declarations for the service.
security:
  # Access token that clients send to use the API.
  accessToken:
    # Secret that holds the access token.
    secretName: ""
    secretKey: token
  # Separate token that gates the metrics endpoint.
  metricsToken:
    # Secret that holds the metrics token.
    secretName: ""
    secretKey: token
  # Where TLS ends: none, sidecar, ingress or in-process.
  tlsTermination: ""
  # Inbound caller identity.
  inbound:
    # Secret that holds the key set that verifies caller tokens.
    keySetSecretName: ""
    keySetSecretKey: jwks.json

# TLS that this process terminates itself.
tls:
  enabled: false
  secretName: ""

# Service that exposes the pod inside the cluster.
service:
  type: ClusterIP
  port: 8080

# Rate limiter for the service.
rateLimit:
  enabled: true

# CPU and memory limits and requests for the container.
resources: {}

# Workers that a question reading several data systems is planned across, sized by `sutura-operator`
# between `min` and `max`. Off renders no worker, operator or SuturaWorkerPool definition. On, the
# serving pods terminate TLS themselves with a certificate from cert-manager's CSI driver, which must be
# installed, and the release installs a cluster-wide CustomResourceDefinition. A question reading one
# data system never goes across.
workerPool:
  enabled: false
  # API group of the SuturaWorkerPool definition.
  apiGroup: sutura.telekom.github.io
  # Fewest workers, with no demand at all. 0 keeps none until a question wants one.
  min: 0
  # Most workers, whatever the demand.
  max: 4
  # Idle workers kept beyond demand, so a question does not wait for one to start.
  warm: 0
  # Seconds an idle worker above demand stays before it is removed.
  idleAfterSeconds: 300
  # cert-manager issuer that signs every node's certificate. Its CA certificate is the node
  # authority, so it must be a CA issuer.
  issuer:
    name: ""
    kind: Issuer
  # Lifetime of a node certificate. A process reads its certificate once, at start, so a pod that runs
  # longer than this presents an expired one until it restarts.
  certificateDuration: 720h
  # Leg bytes above which a question reading several data systems goes across. Empty: the question's
  # own working set ceiling.
  acrossAboveBytes: ""
  # Seconds a question that goes across waits for a worker. Empty: no wait, and a question with no
  # worker is refused. Must be below server.request_timeout_seconds.
  waitForWorkersSeconds: 20
  # CPU and memory limits and requests for each worker.
  resources: {}
  operator:
    image:
      # Empty means the app version with `-operator`, then `-musl` when image.variant is musl.
      tag: ""
    resources: {}

# Engine thread and memory settings for the runtime.
runtime:
  # Number of engine worker threads. Empty derives from the CPU limit.
  engineWorkerThreads: ""
  # Working set size in bytes. Empty derives from the memory limit.
  workingSetMaxBytes: ""

# Liveness and startup probes for the pod.
probes:
  # Startup probe, with a large failure budget for a slow boot.
  startup:
    failureThreshold: 30
    periodSeconds: 5
  # Liveness probe.
  liveness:
    periodSeconds: 10
    failureThreshold: 3

# Metrics endpoint and its scrape configuration.
metrics:
  # ServiceMonitor object for the metrics endpoint.
  serviceMonitor:
    enabled: false
    interval: 30s

# Annotations added to the pod.
podAnnotations: {}
# Labels added to the pod.
podLabels: {}

# Security context for the whole pod.
podSecurityContext:
  runAsNonRoot: true
  # The image runs as user 65532. Set runAsUser and runAsGroup to pin a user.
  seccompProfile:
    type: RuntimeDefault

# Security context for the container.
containerSecurityContext:
  allowPrivilegeEscalation: false
  # Read-only root filesystem.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Labels that select the nodes that run the pod.
nodeSelector: {}
# Taints the pod tolerates on a node.
tolerations: []
# Rules that place the pod on specific nodes.
affinity: {}

# Volumes this chart does not model by name.
extraVolumes: []
# Volume mounts this chart does not model by name.
extraVolumeMounts: []
# Environment variables added to the container. A name sutura reads as a `security` setting
# (`SUTURA__SECURITY` then `__`, `.` or `[`, in any letter case) is refused: set it in
# `config.environment`, or with `security.accessToken`, `security.metricsToken` or
# `security.inbound.keySetSecretName`. A name sutura reads as a variable the chart sets is refused.
extraEnv: []
