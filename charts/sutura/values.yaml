# Default values for the sutura chart.

# Image that runs the service.
image:
  repository: ghcr.io/telekom/sutura
  # Image tag. Empty means the chart's app version.
  tag: ""
  pullPolicy: IfNotPresent

# Secrets that hold image pull credentials.
imagePullSecrets: []

# Deployment environment: development, test, staging or production.
environment: ""

# Number of pod replicas.
replicaCount: 1

# Settings files that the service reads.
config:
  # Contents of base.yaml. They override the built-in defaults.
  base: {}
  # Contents of the environment file. They override base.
  environment: {}

# Credentials and TLS declarations for the service.
security:
  # Access token that clients send to use the API.
  accessToken:
    # Secret that holds the access token.
    secretName: ""
    secretKey: token
  # Separate token that gates the metrics endpoint.
  metricsToken:
    # Secret that holds the metrics token.
    secretName: ""
    secretKey: token
  # Where TLS ends: none, sidecar, ingress or in-process.
  tlsTermination: ""
  # Inbound caller identity.
  inbound:
    # Secret that holds the key set that verifies caller tokens.
    keySetSecretName: ""
    keySetSecretKey: jwks.json

# TLS that this process terminates itself.
tls:
  enabled: false
  secretName: ""

# Service that exposes the pod inside the cluster.
service:
  type: ClusterIP
  port: 8080

# Rate limiter for the service.
rateLimit:
  enabled: true

# CPU and memory limits and requests for the container.
resources: {}

# Engine thread and memory settings for the runtime.
runtime:
  # Number of engine worker threads. Empty derives from the CPU limit.
  engineWorkerThreads: ""
  # Working set size in bytes. Empty derives from the memory limit.
  workingSetMaxBytes: ""

# Liveness and startup probes for the pod.
probes:
  # Startup probe, with a large failure budget for a slow boot.
  startup:
    failureThreshold: 30
    periodSeconds: 5
  # Liveness probe.
  liveness:
    periodSeconds: 10
    failureThreshold: 3

# Metrics endpoint and its scrape configuration.
metrics:
  # ServiceMonitor object for the metrics endpoint.
  serviceMonitor:
    enabled: false
    interval: 30s

# Annotations added to the pod.
podAnnotations: {}
# Labels added to the pod.
podLabels: {}

# Security context for the whole pod.
podSecurityContext:
  runAsNonRoot: true
  # User id the image sets for its process.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Security context for the container.
containerSecurityContext:
  allowPrivilegeEscalation: false
  # Read-only root filesystem.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Labels that select the nodes that run the pod.
nodeSelector: {}
# Taints the pod tolerates on a node.
tolerations: []
# Rules that place the pod on specific nodes.
affinity: {}

# Volumes this chart does not model by name.
extraVolumes: []
# Volume mounts this chart does not model by name.
extraVolumeMounts: []
# Environment variables added to the container.
extraEnv: []
