[package]
name = "sutura-exec-clickhouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "A Warehouse adapter over ClickHouse, through its ADBC driver and the compiled ClickHouse dialect."

[dependencies]
sutura-domain = { workspace = true }
# Rendering, shared with every other SQL adapter: this adapter asks `sutura-sql` to render the plan
# for `Dialect::ClickHouse` rather than growing a second set of quoting and placeholder decisions.
# NOT `sutura-semantic`: compiling stops at a plan, the port carries the plan, and this adapter
# never compiles anything.
sutura-sql = { workspace = true }
# The bundle-or-system-store read and the client-identity read, shared with the Postgres source
# channel and the BigQuery wire so the refusals for an unreadable, empty or malformed
# bundle/identity are not re-derived a third time. This crate's own `tls` module hands the result
# to the driver as PEM text; `sutura-tls` builds no connection.
sutura-tls = { workspace = true }
# `sutura-cli` is the one composition root that links this crate, behind its default-off
# `clickhouse` feature (see the crate's own `src/lib.rs` module header), which keeps the adapter and
# its driver out of a source build that did not ask for it.
#
# Named directly because `tls.rs` reads the host-store error by name, not because it adds a new
# package to `Cargo.lock`.
rustls-native-certs = { workspace = true }
thiserror = { workspace = true }
# The driver manager, its trait surface and Arrow: the vendored ClickHouse driver's one interface.
adbc_core = "0.24"
adbc_driver_manager = "0.24"
arrow-array = "59"
arrow-schema = "59"
sutura-adbc = { workspace = true }

[features]
# The fixture tier - its credential, a private database per open and a CSV importer - for the golden
# matrix in `sutura-app`'s tests. `sutura-domain/fixtures` is the shared CSV classification it types
# columns with. Default-off, like `sutura-exec-postgres`'s feature of the same name.
fixtures = ["sutura-domain/fixtures"]

[[test]]
name = "conformance"
required-features = ["fixtures"]

[[test]]
name = "execute_as"
required-features = ["fixtures"]

[[test]]
name = "adbc_execute_as"
required-features = ["fixtures"]

[[test]]
name = "reload"
required-features = ["fixtures"]

[dev-dependencies]
sutura-dev = { workspace = true }
# `sutura_conformance::corpus` supplies this crate's own tests a real plan, posture and credential
# fixture, so they drive the port against a real corpus question rather than a hand-built plan
# nobody reviewed.
sutura-conformance = { workspace = true }
# A generated self-signed pair, for the in-crate tests that exercise the TLS construction refusals
# against real anchor/identity material - the same crate `sutura-exec-postgres` and `sutura-http`
# rest their own TLS tests on, so no new crate enters the dev graph.
rcgen = { workspace = true }

[lints]
workspace = true
