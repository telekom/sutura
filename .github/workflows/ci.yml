# Order: classify -> lints -> tests -> build. Explicit steps rather than one
# `nix flake check`, because flake checks run in arbitrary order and the release build must
# come after the lints meant to gate it. `flake.nix` excludes the package from `checks` for
# the same reason.
#
# Steps are gated on the classification, which fails open. The structural gates never are:
# they judge docs too.
#
# Every action is pinned by commit. A tag is mutable and these run with the job's token.
name: ci

# Prose-only changes do not start a run at all. `classify` inside the job can skip work but
# not the runner, the Nix install or the cache restore; a path filter skips those too.
#
# What still runs for those paths: docs.yml, which builds the book and runs the text and
# documentation gates. Nothing about a PROSE edit goes unchecked - it is checked by the
# cheaper workflow.
#
# `.json` and `.toml` are NOT ignored, so a change to skill-router.json or a manifest brings
# the full chain back.
#
# NOT EVERY MARKDOWN FILE IS PROSE, and that is why this is `paths` and no longer
# `paths-ignore: ["**/*.md", ...]`. A SEMANTIC CATALOG IS A DIRECTORY OF MARKDOWN DOCUMENTS -
# `examples/single-player/catalog/**` is one, and it is now the only one - and a
# metric's `measure:` decides what SQL we generate. Under the old filter, editing one changed
# the generator's output, started nothing but docs.yml, which runs no tests, and reported green.
# Both golden suites read that directory, so the tests that would have caught it were
# already written and simply never ran.
#
# `paths` with `!` rather than `paths-ignore` plus exceptions, because the two cannot be
# combined: "You cannot use both the `paths` and `paths-ignore` filters for the same event in a
# workflow." The `!` form needs something to subtract from - "If you define a path with the `!`
# character, you must also define at least one path without the `!` character" - and the leading
# `**` is that something: it "matches all files and directories in the repository and is the
# default when no paths filter is used", so the list starts from exactly what no filter at all
# would have matched - the dot directories `.github/` and `.cargo/` included.
#
# THE LIST IS ORDERED, NOT GROUPED, AND THE ORDER IS THE MECHANISM. GitHub walks the patterns
# top to bottom and the LAST match decides: "A matching negative pattern (prefixed with `!`)
# after a positive match will exclude the path. A matching positive pattern after a negative
# match will include the path again." So it reads as one sentence - everything, minus prose,
# plus the catalogs back, minus everything under docs/ - and re-sorting it changes what runs.
#
# The catalogs come back by WHAT THEY ARE, a `catalog/` or `fixtures/` directory, rather than by
# which crate or example holds them, so moving one between `crates/` and `examples/` cannot
# quietly drop it out of CI. A markdown fixture introduced somewhere else would need a line
# here; `xtask/src/changes.rs` carries the same note on the classifier side, which is the second
# gate a catalog edit has to get past.
#
# `!docs/**` is LAST deliberately, and it is the one exclusion that must win outright: a page
# under docs/ has its own workflow and must never start this 120-minute one, not even if
# somebody writes `docs/.../catalog/x.md`.
#
# `!mkdocs.yml` sits beside it, and it is a FIX rather than a refinement. This file and docs.yml
# each claim to be complements - "exactly one workflow starts for any given edit" - and they were
# not: `mkdocs.yml` is in docs.yml's filter AND matched the leading `**` here, so an ADR-only pull
# request that added a nav entry started BOTH, paying this 120-minute chain and the docs job's own
# gates for a prose change. It cannot affect what cargo produces: `mkdocs.yml` is read by mkdocs
# and by `check-docs`, which docs.yml runs. Measured on the pull request that found this,
# `docs/adr/**` plus `mkdocs.yml` was the whole diff bar one line.
#
# **WORKFLOW CODE IS THE EXCEPTION TO "exactly one workflow", and it is deliberate.** An earlier
# version of this filter also excluded `.github/workflows/docs.yml`, by the same argument - a
# workflow file is read by nothing but Actions. That argument is wrong, and review caught it: the
# only static analysis any workflow gets is `zizmor`, `actionlint` and `shellcheck`, and all three
# are STEPS IN THIS FILE rather than part of `hygiene`. `cargo xtask check-workflows` does not
# cover the gap either - it cross-checks referenced nix output names and nothing else. So excluding
# docs.yml meant a change to it could merge with no workflow analysis at all, and invalid YAML in a
# workflow can stop that workflow from running its own checks. A docs.yml-only pull request now
# pays for this chain, which is the honest price of linting the thing that decides what gets
# linted. Any `.github/**` path is in the same class: do not add an exclusion for one.
#
# NOT excluded, and deliberately: `devco/**`. `devco/max-lines-ignore` decides what `max-lines`
# exempts, so a change to it changes what a gate accepts and the gate has to run. It is a
# configuration file for our own tooling, not prose, and the fact that one edit to it happened to
# exempt a docs directory does not make it docs.
#
# A path filter matches the event's CHANGED FILES and the workflow runs if at least one of them
# survives the list, so a commit touching a README and a metric runs - the metric is the reason
# CI exists.
#
# `ci` IS a required check now - it is the one context in the `main` ruleset's
# `required_status_checks` - so the sentence this paragraph used to state as a hypothetical is
# live: a required check that never RUNS blocks the merge rather than failing it. GitHub's own
# words, checked 2026-08-31: "If a workflow is skipped due to path filtering, branch filtering or
# a commit message ... then checks associated with that workflow will remain in a 'Pending'
# state." The `merge_group` trigger below is that failure fixed for one event; the path filters
# above can still leave it pending on a pull request targeting `main`, and that exposure is the
# promotion path only, because the `dev` ruleset requires no status check at all.
on:
  push:
    # `dev` IS THE TRUNK and `main` is the release ref. Both are listed, and the second one is
    # not redundant: a promotion to `main` is a fast-forward of commits CI already judged on
    # `dev`, but it is also what triggers a release, and a ref nothing validated is a poor thing
    # to publish from. Cheap insurance - the work is cached from the `dev` run.
    #
    # The expensive trunk-only steps below key on `refs/heads/dev`, not on this list. A promotion
    # pays for the lints and the tests, not for a second release build of the same tree.
    branches: [dev, main]
    paths:
      - "**"
      - "!**/*.md"
      - "!LICENSE"
      - "!NOTICE"
      - "**/catalog/**/*.md"
      - "**/fixtures/**/*.md"
      - "!docs/**"
      - "!mkdocs.yml"
  # The same list twice, and it has to stay the same list. A filter that let a path start a run
  # on the trunk but not on the pull request that introduced it would report the merge green and
  # then fail immediately after it.
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!LICENSE"
      - "!NOTICE"
      - "**/catalog/**/*.md"
      - "**/fixtures/**/*.md"
      - "!docs/**"
      - "!mkdocs.yml"
  # THE MERGE QUEUE. A queued pull request gets a ref under
  # `gh-readonly-queue/<base>/pr-<N>-<sha>` and a `merge_group` event, and `ci` is the one context
  # the `main` ruleset requires - so with nothing listening the required check never reports, and
  # the queue's own `check_response_timeout_minutes` elapses, at which point GitHub assumes a check
  # that never concluded FAILED and drops the entry. MEASURED rather than reasoned, 2026-08-31:
  # `refs/heads/gh-readonly-queue/main/pr-107-<sha>` was on the remote while
  # `actions/runs?event=merge_group` listed ZERO runs, so the event had fired and nothing in this
  # repository had ever answered one. That entry did not merge from the queue - it was retargeted
  # to `dev`, which requires no status check, and merged there.
  #
  # **BARE, AND THE OMISSION IS THE ONLY FORM THIS TRIGGER HAS.** There is no `paths:` key here
  # because `merge_group` does not take one - it supports the single activity type
  # `checks_requested` and no `paths`, `paths-ignore`, `branches` or `branches-ignore` filter
  # (GitHub's events reference, checked 2026-08-31) - so a filter copied down from the two
  # triggers above is an invalid workflow rather than a narrower one. Not asserted: `paths: ["**"]`
  # was written here and `actionlint` - the step in this very file - refused it, `"paths" filter is
  # not available for merge_group event. it is only for push, pull_request, pull_request_target
  # events`. Next to two heavily filtered triggers the absence reads as an oversight, which is why
  # it is written down.
  #
  # WHAT THAT COSTS, said plainly: a docs-only entry in the queue now starts this workflow where
  # the filters above would have skipped it. `classify` inside the `ci` job still gates every
  # expensive step, so the bill is the runner, the Nix install and the cache restore - not the
  # lints, the tests, the coverage run or the build.
  #
  # EVERY OTHER REF TEST IN THIS FILE WAS CHECKED AGAINST THIS EVENT, because a `merge_group`
  # run's `github.ref` is `refs/heads/gh-readonly-queue/...` and matches neither trunk nor the
  # release ref. The three trunk-only steps - `Publish the CRAP baseline`, `Release build`,
  # `Image` - test `== 'refs/heads/dev'`, so a queue entry SKIPS them, which is right and is left
  # alone: a queue entry is not a promotion and must not publish a baseline or an image. The
  # `cross` job's test was the one that came out wrong under the same reading and it MOVED to the
  # event - see its own comment. `concurrency` is right as it stands: `cancel-in-progress` is
  # `github.event_name == 'pull_request'`, so a merge-queue run is never cancelled, and the queue
  # ref is unique per entry so it shares no group with the pull request's own run.
  #
  # THE TWO EVENT TESTS ARE RIGHT AS THEY STAND AND ARE LEFT ALONE. `crap-comment` gates on
  # `pull_request`, so a queue entry posts nothing - there is no pull request to comment on.
  # `bigquery-acceptance` gates on a push or a same-repository pull request, so a queue entry skips
  # it: it is not a required context, nothing has it in `needs`, and the pull request it came from
  # already ran it. Making a queue entry call a cloud provider would be a decision about cost and
  # about a secret, not a fix, so it is named here rather than taken.
  #
  # SCOPE: this file only, and deliberately. `ci` is the only required context, so adding
  # `merge_group` to `docs.yml` or `security-audit.yml` would buy a duplicate run and nothing
  # else. If `verify` or `audit` is ever made required, its workflow needs this trigger too or
  # the queue stalls exactly the way this change fixes.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch. The next push's base is the previous push, so a
  # cancelled run's commits get classified out of the following range and are never validated
  # by any completed run - the same "green while actually red" shape as using the wrong base.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # THE SHIPPED SET, and it must stay in step with `binaries` in `nix/shipped.nix` and with
  # `BINARIES` in `release.yml`. It is not DERIVED from either: a workflow cannot evaluate a flake
  # before it has installed nix, and a matrix takes literals.
  #
  # TWO RULES KEEP IT HONEST, and only the second reaches the direction that matters. The cross
  # matrix BUILDS every name in it, so a name that is not a nix package fails the link check; and
  # `cargo xtask check-shipped-binaries` - a `hygiene` gate, so the `Structural gates` step runs
  # it - compares this literal against `nix/shipped.nix`, which is what catches a binary that
  # ships and is named here by nobody.
  BINARIES: sutura sutura-serve

jobs:
  ci:
    # SKIPPED ON THE RELEASE COMMIT, and the three jobs below `needs: [ci]` so they skip with it.
    # version-bump.yml pushes `chore(release): vX.Y.Z` to `main` under a GitHub App installation
    # token, because the `main` ruleset requires a pull request and GITHUB_TOKEN cannot be given
    # a bypass without bypassing every workflow here. An App token's push DOES start workflow
    # runs, so that commit would otherwise re-run this whole workflow - and it is the most
    # expensive commit in the repository to re-run, because it moves the workspace version and
    # therefore crane's dependency derivation, so nothing in the build cache is reusable.
    #
    # WHAT IS GIVEN UP: `main` gets no `ci` run for that commit. Its tree is the promoted one
    # plus a version number, release.yml builds and publishes from the tag, and the promotion PR
    # that put the content on `main` was gated by this workflow - so what is skipped is a second
    # opinion about a one-line diff, at the price of a cold full-workspace build.
    #
    # `head_commit` exists on `push` and on nothing else. A `pull_request` event reads the empty
    # string and runs, which is what stops this from silently withholding a REQUIRED check: a
    # promotion PR whose tip happens to be a release commit is still gated.
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore(release):') }}
    runs-on: rust-mcp
    # 120 rather than 60, and the reason is a dependency rather than a slow test. The engine
    # brought DataFusion and Arrow in, so the closure the `nextest` check compiles is now one of
    # the largest in the ecosystem. A COLD run - the first on a new dependency set, before
    # `magic-nix-cache` has anything to restore - spends most of an hour compiling before a
    # single test runs, and 60 killed exactly that run mid-`Tests`. Warm runs are far quicker;
    # the cap has to survive the cold one that fills the cache for the rest.
    timeout-minutes: 120
    # SCOPED TO THIS JOB, and it restates `contents: read` because a job-level block REPLACES the
    # workflow-level one rather than adding to it - omitting the line would take away the read
    # this job's checkout needs.
    #
    # `actions: read` is the new grant and it is here rather than at the workflow level because
    # exactly one thing needs it: the CRAP delta below reads the `crap-baseline` artifact that a
    # PREVIOUS run on `main` produced. Listing another run's artifacts and downloading from it
    # are both `actions` scope; `contents: read` cannot reach either. It is a READ scope, it can
    # see nothing a person browsing the Actions tab of this public repository cannot, and it is
    # granted to the job that already reads the whole tree.
    permissions:
      contents: read
      actions: read
    # Published so the `cross` matrix below can gate on the same classification rather than
    # recomputing it. Recomputing would need the full history in five jobs and could disagree
    # with itself; one classification, one verdict.
    outputs:
      build: ${{ steps.classify.outputs.build }}
      # Whether a rendered CRAP delta comment exists for the `crap-comment` job below.
      # A job output rather than a second lookup there: that job holds a write scope and
      # must stay as small as possible, so it is told what to do rather than deciding.
      crap_delta: ${{ steps.crap_delta.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # classify and the causality gate diff against the base commit.
          fetch-depth: 0
          persist-credentials: false

      # BEFORE nix installs, because /nix/store is what fills. `ubuntu-latest` ships ~20 GB of
      # SDKs this repository does not use against a 14 GB budget, and both `Doctests` and
      # `Test causality` have died on `No space left on device` compiling a dependency closure
      # that is legitimately one of the largest in the ecosystem.
      #
      # A local composite action so `docs`, `release` and the cross matrix can call the same
      # thing. See `.github/actions/reclaim-disk` for why it is local and why it cannot affect
      # the Nix cache.
      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent: with it, a pull request could add a substituter and a trusted key and have
          # CI fetch attacker-built store paths whose signature verifies. Anything CI needs
          # goes here, where the workflow diff shows it.
          extra_nix_config: |
            fallback = true

      # Carries /nix/store between runs. Without it every run recompiles from scratch.
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Toolchain in use
        run: |
          set -eu
          nix --version
          cat rust-toolchain.toml

      # What to compare against. This gets its own step because getting it wrong is subtle
      # and was wrong: `github.event.before` is the PREVIOUS PUSH on the branch, so a push
      # whose last commit only touched docs classified as docs-only and skipped the Rust
      # chain - reporting green while the branch itself was red. The whole branch is the unit
      # of review, so the whole branch is the unit of comparison.
      - name: Resolve the base to compare against
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            # The merge base, not the base tip: it is the whole PR even if the target moved.
            base="$(git merge-base "$PR_BASE" HEAD || true)"
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            # On the default branch, what is newly ON it is exactly the right scope.
            base="$BEFORE"
          else
            # A push to a topic branch: judge the branch, not the push.
            base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)"
          fi
          # An all-zero SHA (new branch) or an empty value means fail open, not skip.
          case "$base" in 0000000000000000000000000000000000000000|"") base="" ;; esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then
            echo "comparing against $base ($(git rev-list --count "$base..HEAD" 2>/dev/null || echo '?') commit(s))"
          else
            echo "no usable base: everything will run"
          fi

      # A docs-only edit needs the structural gates and nothing else; a flake edit needs the
      # whole chain. An unmapped path, a bad base ref or an empty diff all run everything.
      - name: Classify the change
        id: classify
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -eu
          if [ -n "$BASE" ]; then
            nix run .#xtask -- classify --since "$BASE"
          else
            nix run .#xtask -- classify
          fi

      - name: Structural gates
        run: nix build .#checks.x86_64-linux.hygiene -L

      # UNCONDITIONAL, like the structural gates above and for the same reason: it judges every
      # file, so gating it on the `rust` classification would let a docs or workflow file arrive
      # attributed to nobody. It is seconds - no cargo, no dependency closure - so there is
      # nothing to save by skipping it.
      - name: Licensing
        run: nix build .#checks.x86_64-linux.reuse -L


      - name: Format
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.fmt -L

      - name: Clippy
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.clippy -L

      # An app, not a check: it fetches the advisory database and a build sandbox has no
      # network. The app also supplies the pinned cargo.
      - name: Supply chain
        if: steps.classify.outputs.deps == 'true'
        run: nix run .#deny

      # The authoritative secret scan. The pre-commit hook is best-effort - it can be
      # bypassed, and it cannot run on a host without the tool - so the enforcement point has
      # to be here. Never gated on classification: a credential can be committed in any file.
      - name: Secrets
        run: nix run .#betterleaks -- dir . --config devco/gitleaks.toml --redact --verbose

      - name: Workflow static analysis
        if: steps.classify.outputs.run_all == 'true'
        run: |
          set -eu
          nix run .#zizmor -- .github/workflows
          nix run .#actionlint
          # Every shell script we ship, and now the glob really IS the list. It used to name one
          # file under this comment, so `nix/run-gate.sh` - which decides whether the tests, the
          # secret sweep, the supply-chain gate and the CRAP score run at all - was linted by
          # nothing. An empty list would pass by checking nothing, so it is a failure.
          mapfile -t scripts < <(find . -name '*.sh' -not -path './.git/*' -not -path './target/*' | sort)
          printf 'shellcheck: %d script(s)\n' "${#scripts[@]}"
          test "${#scripts[@]}" -gt 0
          nix run .#shellcheck -- -x "${scripts[@]}"

      - name: Tests
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.nextest -L

      # nextest deliberately does not run doctests, so a `///` example that stops compiling
      # would pass unnoticed. A separate check, so the gap is visible rather than assumed.
      - name: Doctests
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.doctest -L

      # CRAP: cyclomatic complexity weighted by the tests that cover it. Neither a complexity
      # limit nor a coverage percentage catches the combination on its own, which is what makes it
      # worth a step of its own.
      #
      # IN THIS JOB, blocking, and that is a cost decision with numbers behind it. Coverage is a
      # SEPARATE PROFILE: `-C instrument-coverage` shares nothing with the artifacts the `Tests`
      # step above just cached. Measured in the dev container on 16 cores, `--workspace` coverage
      # spent over 80 CPU-minutes and 6m18 wall recompiling DataFusion, Arrow and DuckDB and never
      # reached a single test. On this runner's four vCPUs that is twenty minutes and up, added to
      # a job whose timeout was already raised from 60 to 120 because the tests alone killed it.
      # That belongs nowhere in CI, let alone here.
      #
      # What runs instead is scoped to `sutura-domain`, whose dependency set is serde and
      # thiserror. MEASURED in the sandbox: 10.2 s of instrumented compile, on top of the
      # dependency derivation the Clippy and Tests steps above already build - the check shares
      # `cargoArtifacts` with them, so no second one is created. At that price a blocking step in
      # the job that already gates the branch is the right home; a scheduled or non-blocking job
      # would let a regression merge and be noticed later, which for a metric about untested
      # complexity is most of the value gone.
      #
      # The scope is one line in xtask/src/crap.rs, and docs/crap.md carries the measured cost of
      # every wider option plus what this one does not see. `rust` rather than a narrower
      # classification: the policy file, the pin and the manifests all change the verdict, and the
      # commit hook is the thing that scopes by path.
      #
      # `-o result-crap` AND THE COPY exist so the delta steps below cost NO SECOND COVERAGE RUN.
      # The check writes a path-portable copy of its score report into `$out`, which is the only
      # channel out of a Nix build sandbox; this lifts it into the workspace under a plain name.
      # Every consumer below reads that one file. Nothing is measured twice.
      - name: CRAP score
        if: steps.classify.outputs.rust == 'true'
        run: |
          set -eu
          nix build .#checks.x86_64-linux.crap -L -o result-crap
          install -m644 result-crap/crap-baseline.json crap-baseline.json

      # THE DELTA GATE, in four steps: resolve the base's baseline, download it, compare, publish.
      #
      # WHY A DELTA AT ALL, when the step above already enforces CRAP 30 absolutely. An absolute
      # threshold cannot say "worse than the base". A function that slides from CRAP 12 to CRAP 29
      # passes it, every time, and nothing anywhere reports that it moved. The delta answers the
      # other question, and the two are kept independent on purpose: the threshold is the rule
      # that still holds when there is no baseline, and the delta is the rule that still holds
      # over code whose inherited debt is already above the line.
      #
      # THE BASE MUST BE THE MERGE BASE AND NOTHING ELSE. `steps.base` above already resolves it -
      # `git merge-base`, not the base branch tip - and this reuses that value rather than
      # computing a second one. The difference is not cosmetic. Against "the latest baseline on
      # main" the comparison lies in both directions: work that landed on main after the branch
      # point reads as this branch's regression, and improvements that landed there read as this
      # branch's improvements. A gate that reports regressions somebody else caused is a gate
      # that gets switched off.
      #
      # SO THE MATCH IS EXACT, AND A MISS IS A WARNING RATHER THAN A FAILURE. The merge base is
      # not guaranteed to have a baseline: a push to `main` carrying several commits gets one CI
      # run, so the middle commits never produced an artifact, and artifacts expire. Failing there
      # would fail pull requests for the shape of somebody else's push - which is not a finding
      # about this branch, and would train everybody to re-run the job until it went away. It
      # SKIPS instead, loudly, and the absolute threshold above has already run either way. That
      # is a deliberate trade: the delta is a ratchet on top of a gate, not the gate.
      - name: Find the CRAP baseline for the merge base
        id: crap_baseline
        if: github.event_name == 'pull_request' && steps.classify.outputs.rust == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ -z "$BASE" ]; then
            echo "::warning title=CRAP delta::No merge base was resolved, so there is nothing to compare against; the absolute CRAP threshold above still ran."
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Captured rather than piped straight into a filter: a token or permission problem must
          # not read as "no baseline exists". The two outcomes are one warning apart and the
          # difference matters when somebody asks why the delta never runs.
          if ! artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=crap-baseline&per_page=100" 2>&1)"; then
            echo "::warning title=CRAP delta::Listing the crap-baseline artifacts failed, so the delta is skipped. The absolute CRAP threshold above still ran."
            printf '%s\n' "$artifacts"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The default branch AND the exact base SHA. Branch alone would match a baseline from a
          # release branch; SHA alone would match one built on a fork of the same commit.
          run_id="$(
            printf '%s' "$artifacts" |
              jq -r --arg base "$BASE" --arg branch "$DEFAULT_BRANCH" '
                .artifacts[]
                | select(.expired == false)
                | select(.workflow_run.head_branch == $branch)
                | select(.workflow_run.head_sha == $base)
                | .workflow_run.id
              ' | head -n 1
          )"
          if [ -z "$run_id" ]; then
            echo "::warning title=CRAP delta::No crap-baseline artifact exists for the exact merge base $BASE, so the delta is skipped rather than compared against a stale or newer baseline. The absolute CRAP threshold above still ran."
          else
            echo "baseline from workflow run $run_id, built at the merge base $BASE"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the CRAP baseline
        if: steps.crap_baseline.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crap-baseline
          path: crap-base
          # Another run's artifact, which is what `actions: read` on this job is for.
          github-token: ${{ github.token }}
          run-id: ${{ steps.crap_baseline.outputs.run_id }}

      # No compiler, no coverage, no cargo-crap: two JSON files in, a verdict out. `nix run
      # .#xtask` is the binary this workflow already builds for `classify`, so this step adds a
      # few seconds of file reading and nothing else.
      #
      # The rendered markdown goes to the step summary HERE, where it needs no token at all, and
      # is uploaded for the `crap-comment` job below, which holds the only write scope on any job
      # a pull request can reach. Other workflows do hold write scopes - the site, a release, the
      # optimised release build, a version bump, the cache prune - and none of those scopes is on a
      # job a pull request can start: four of the five do not run on a pull request at all, and
      # docs.yml, which does, gates its publishing job off that event.
      #
      # The verdict is re-raised at the end rather than short-circuiting, so the summary and the
      # artifact exist even when the ratchet failed - which is exactly when a reader wants them.
      - name: CRAP delta
        id: crap_delta
        if: steps.crap_baseline.outputs.run_id != ''
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -u
          status=0
          nix run .#xtask -- crap-delta \
            --baseline crap-base/crap-baseline.json \
            --head crap-baseline.json \
            --comment crap-delta.md \
            --base "$BASE" || status=$?
          if [ -s crap-delta.md ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            { echo; cat crap-delta.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload the CRAP delta comment
        if: ${{ !cancelled() && steps.crap_delta.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crap-delta-comment
          path: crap-delta.md
          if-no-files-found: error
          retention-days: 7

      # MAIN ONLY: this commit's report becomes the baseline every pull request branched from it
      # compares against. Uploaded from the same file the step above already produced, so `main`
      # pays nothing for it beyond the upload.
      #
      # 30 days, which is the one real limit on this mechanism: a pull request whose merge base is
      # older than that gets the warning and the skip above. That is the right failure - a branch
      # a month behind `main` has a comparison problem the CRAP gate cannot fix.
      - name: Publish the CRAP baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.classify.outputs.rust == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crap-baseline
          path: crap-baseline.json
          if-no-files-found: error
          retention-days: 30

      # The pages under docs/api/ are GENERATED from the library crates' doc comments and
      # COMMITTED, because rustdoc JSON is nightly-only and the docs job has stable and nothing
      # else. A committed generated file rots silently, so this regenerates them and
      # byte-compares: a doc comment that changed without a regeneration fails here instead of
      # publishing a stale page as current. Locally the same gate is
      # `cargo xtask check-api-docs`, and the fix it asks for is `just api`.
      #
      # THE ONLY NIGHTLY STEP in this workflow, deliberately. `--output-format json` is an
      # unstable rustdoc option, so the stable toolchain everything else here uses rejects `-Z`
      # outright. That is why it is its own flake output rather than folded into a check above:
      # the output brings its own nightly toolchain and its own interpreter for the generator.
      #
      # `api` is set by classify for a library crate's sources, for the generator, for the
      # committed pages, and for the manifests - the pages are generated with `--all-features`,
      # so a feature or a dependency can add a public re-export with no doc comment touched. The
      # gate is self-scoping on top of that: a change touching only private code regenerates to
      # identical output and passes, so nothing here has to guess which Rust changes reach the
      # public surface.
      - name: API reference pages
        if: steps.classify.outputs.api == 'true'
        run: nix build .#checks.x86_64-linux.api-docs -L

      # A changed test must fail against base behaviour and pass with the change. Compiles
      # twice in a worktree, so it needs git history and a writable tree.
      - name: Test causality
        if: steps.classify.outputs.rust == 'true'
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -eu
          if [ -z "$BASE" ]; then
            echo "no usable base ref; causality not checked"
            exit 0
          fi
          nix run .#causality -- --since "$BASE"

      # MAIN ONLY: release-profile codegen, the one-binary assertion and the image. Branches
      # build every target under the `ci` profile instead - see the `cross` job below - so what
      # main adds is the profile and the container, not the target coverage.
      #
      # The remaining exposure, stated because it is real: a break that needs release codegen to
      # appear - thin LTO, `opt-level = 1` - turns main red rather than the pull request. Cross
      # and libc breakage does not, because `cross` builds all four, and `panic = "abort"` is no
      # longer in that list: the `ci` profile sets it too.
      - name: Release build
        if: steps.classify.outputs.build == 'true' && github.ref == 'refs/heads/dev'
        run: |
          set -eu
          # BOTH SHIPPED BINARIES. `nix/shipped.nix` lists them, and since #111 that list has two
          # entries: the command-line tool and the server. Building only the first is how the
          # HTTP surface came to ship in no artefact at all.
          nix build .#sutura -L -o result-sutura
          nix build .#sutura-serve -L -o result-sutura-serve
          # One executable, with the expected name, and no toolchain in the closure - for every
          # shipped binary at every shipped target. It shipped three binaries and a full cargo
          # once; this is the assertion that stops that returning.
          nix build .#checks.x86_64-linux.one-binary -L
          # And which FEATURES the published binaries carry, read out of their own embedded
          # dependency list rather than out of a manifest. `nix/shipped.nix` decides that both
          # ship with default features - no `tls`, no `bigquery` - and this is what makes that a
          # gate rather than a comment.
          nix build .#checks.x86_64-linux.shipped-features -L
          nix build .#sutura-aarch64-unknown-linux-gnu -L -o result-aarch64
          nix build .#sutura-serve-aarch64-unknown-linux-gnu -L -o result-serve-aarch64
          file result-sutura/bin/sutura result-aarch64/bin/sutura
          file result-sutura-serve/bin/sutura-serve result-serve-aarch64/bin/sutura-serve

      # ONE IMAGE PER SHIPPED BINARY, and the two smoke tests are deliberately not the same
      # test. `--version` is all the two surfaces have in common and it proves the least
      # interesting thing about either; for the server the claim worth making is #111's own
      # provable outcome - that somebody runs the PUBLISHED IMAGE and asks a question over HTTP -
      # so `.github/serve-smoke.sh` asks one, asserts the certified figure in the answer, and
      # asserts that a question the catalog refuses comes back refused. `release.yml` runs the
      # same script per target; this is the one that runs on every push to the trunk.
      - name: Images
        if: steps.classify.outputs.build == 'true' && github.ref == 'refs/heads/dev'
        run: |
          set -eu
          nix build .#oci -L -o result-oci
          ./result-oci | docker load
          docker run --rm sutura:latest --version
          docker run --rm sutura:latest doctor
          nix build .#oci-serve -L -o result-oci-serve
          ./result-oci-serve | docker load
          # The SAME script `release.yml` runs per target: start the image, ask the corpus
          # question, assert the certified figure, and assert that a question the catalog
          # refuses is refused. One file rather than two copies - they had already drifted on
          # the catalog version while both were inline.
          ./.github/serve-smoke.sh sutura-serve:latest

  # THE ONLY JOB IN THIS REPOSITORY THAT HOLDS A WRITE SCOPE, and it exists as a separate job for
  # exactly that reason.
  #
  # WHAT NEEDS IT: posting the CRAP delta table as a pull-request comment. A comment on a pull
  # request is an ISSUE comment to the API, and creating or editing one needs
  # `pull-requests: write`. There is no read-only route to it, and the alternative - leaving the
  # table in the step summary, where it needs no token - was judged not enough: a reviewer reads
  # the conversation, not the run page.
  #
  # WHY IT IS NOT ON THE `ci` JOB. A job-level `permissions:` block is the narrowest grant GitHub
  # offers, and this job is the narrowest job that can be built: it checks nothing out, compiles
  # nothing, runs no code from the pull request, and touches exactly one artifact and one API
  # endpoint. The `ci` job builds and tests the branch's own code; a write token there would be
  # reachable by anything that code can influence. Here there is nothing to influence.
  #
  # DELIBERATE, NOT INHERITED. This repository is public and its workflow-level grant is
  # `contents: read`; that line was not widened, and this block does not change it for any other
  # job. The grant was reviewed and approved as a security decision, and the four properties
  # below are what the decision rests on. Removing any one of them changes the decision:
  #
  #   1. `pull_request`, NEVER `pull_request_target`. On a `pull_request` event the token is
  #      scoped to the head repository, so a fork PR gets a read-only token whatever this block
  #      says - and the `if` below skips forks rather than failing on them.
  #   2. NO CHECKOUT. This job never materialises the pull request's tree, so no `run:` here can
  #      execute anything the pull request author wrote.
  #   3. NO UNTRUSTED TEXT IN A SHELL BODY. Every `${{ }}` below reaches the script through `env:`
  #      and is read as a shell variable. The PR title, branch name and body are never
  #      interpolated - they are not used at all.
  #   4. THE COMMENT BODY IS OURS. It is rendered by `cargo xtask crap-delta` from two JSON
  #      reports this pipeline produced, and it is posted through `--input` with a jq-built JSON
  #      payload rather than assembled by string concatenation.
  #
  # What an attacker could do if those properties were lost: with a write scope and any way to run
  # their own code in this job, they could edit or delete comments on any pull request in the
  # repository, and use the same token to post approvals-looking comments. They could not push to
  # a branch or read a secret - `contents` and `secrets` are not granted here. That is the blast
  # radius the four properties above hold to nothing, and it is what the `zizmor` gate reads this
  # block for.
  crap-comment:
    needs: [ci]
    # `!cancelled()` and not `success()`: the comment is MOST useful when the delta failed.
    # The fork guard is property 1 above - a fork's token is read-only, so posting would fail
    # rather than being denied, and a red job for a comment nobody could have posted teaches
    # nothing.
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.ci.outputs.crap_delta == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: rust-mcp
    timeout-minutes: 5
    permissions:
      # Posting or editing the one comment. Nothing else is granted: `contents` is absent because
      # this job checks nothing out, and a job-level block sets every unlisted scope to `none`.
      pull-requests: write
      # Reading the artifact the `ci` job uploaded. `actions/download-artifact` resolves it
      # through the Actions API, which `pull-requests` does not cover.
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crap-delta-comment
          path: crap-delta

      # DELIVERY, NOT VERDICT, and `continue-on-error` is what says so. The gate already ran in
      # the `ci` job and its result is that job's exit code. If the API call fails here - a rate
      # limit, a transient 502 - the run must not turn red for a comment, and it must not turn
      # green either: it stays exactly as `ci` left it.
      #
      # `gh` and `jq` rather than a JavaScript action: both ship on the runner, and this repository
      # pins every action by digest, so not adding a fourth one to keep pinned is worth two more
      # lines of shell.
      - name: Post or update the CRAP delta comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          body=crap-delta/crap-delta.md
          # The marker is hardcoded HERE and asserted against the file, rather than read out of
          # it. That way a rename in `xtask/src/crap/delta.rs` fails loudly instead of quietly
          # posting a second comment on every push forever.
          marker='<!-- sutura-crap-delta -->'
          if ! head -n 1 "$body" | grep -qxF "$marker"; then
            echo "the rendered comment does not begin with $marker" >&2
            echo "refusing to post a comment the next run cannot find and replace" >&2
            exit 1
          fi
          # jq builds the JSON, so a backtick or a quote in the table cannot break the payload.
          jq -Rs '{body: .}' "$body" > payload.json
          existing="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" |
              jq -r --arg marker "$marker" '
                .[] | select(.body != null and (.body | startswith($marker))) | .id
              ' | head -n 1
          )"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input payload.json > /dev/null
            echo "updated comment $existing"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input payload.json > /dev/null
            echo "posted a new comment on pull request $PR_NUMBER"
          fi

  # PULL REQUESTS: every target, `ci` profile, no image. The counterpart to the two main-only
  # steps above - main proves what SHIPS, a branch proves every arch still COMPILES AND LINKS.
  #
  # Why the archs are checked on the branch at all, rather than deferred with the release build:
  # the allocator is C, compiled once per target, and cross breakage lives there rather than in
  # the Rust. A glibc-only run would not see it. So the coverage stays on the pull request and
  # only the PROFILE moves to main.
  #
  # A MATRIX rather than four `nix build` lines in `ci`, and the reason is wall clock, not
  # cost: four runners is more total compute than one runner doing the same four builds in
  # sequence, because each job builds its own dependency closure instead of reusing the
  # previous target's. What it buys is that a branch waits for ONE target instead of four,
  # while a person is watching. Same trade release.yml's matrix makes, and stated the same way.
  #
  # `needs: [ci]` keeps the file's stated order - classify, lints, tests, then build - so a
  # tree that fails clippy does not spend four runners proving it also links.
  #
  # Note what does NOT protect the attribute names below: `check-workflows` tracks apps and
  # `checks.*` only, and ignores `nix build .#<package>` on purpose, because the cross package
  # names are generated by interpolation and a text scan cannot know them. A typo in a target
  # here surfaces in CI and nowhere earlier.
  # The one job in this file that talks to a real cloud service, and therefore the one that can
  # claim ACCEPTANCE rather than rendering. `docs/adr/0017` decided this belonged outside CI and its
  # amendment records what changed: an ENVIRONMENT secret is not exposed to a `pull_request` run from
  # a fork, which was that decision's whole stated reason.
  #
  # **Its own job, deliberately.** A failure here is attributable to the endpoint rather than mixed
  # into the lint-and-test job, and the rest of CI does not wait on a network call to a cloud
  # provider.
  #
  # **A fork's pull request SKIPS and everything in-repo RUNS**, which is this repository's own rule:
  # skip where the runner had no choice, fail where somebody typed the command. The condition is on
  # the head repository rather than on `github.event_name`, because a pull request from a BRANCH of
  # this repository can see the secret and should be held to it.
  #
  # It waits for `ci`, so the dependency closure that job fills is available before this one asks the
  # cache for it and a red local gate spends no cloud request. Nothing needs this job, so an endpoint
  # failure still does not hold the cross matrix; whether it becomes required is a branch-protection
  # decision rather than one this file makes.
  bigquery-acceptance:
    needs: [ci]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: rust-mcp
    # The endpoint answers in seconds; what takes the time is compiling the crate under the pinned
    # toolchain on a cold cache.
    timeout-minutes: 60
    permissions:
      contents: read
    # **The environment is the mechanism, not decoration.** GitHub does not expose an environment's
    # secrets to a `pull_request` run from a fork, which is exactly the exposure `docs/adr/0017`
    # refused CI over - so naming it here is what makes the amendment true rather than asserted.
    environment: bq-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            fallback = true

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # **The credential reaches the runner and never the repository, a log, or a command line.**
      #
      # Written through `env` into a file under `$RUNNER_TEMP`, which is OUTSIDE the checkout. Three
      # separate reasons, and the second is the one that cost a real failure:
      #
      #   1. a key inside the tree is one `git add .` from a public leak;
      #   2. the secret sweep scans the WORKING TREE and does not honour `.gitignore`, so a key in the
      #      checkout fails `just secrets` and blocks the push stage for everyone - measured, three
      #      leaks, on a developer machine;
      #   3. `$RUNNER_TEMP` is discarded with the runner.
      #
      # `printenv` rather than `echo "$VAR"` and never `${{ }}` in a shell body: a multi-line JSON key
      # is exactly the shape that defeats naive log masking, so nothing here interpolates it, echoes it
      # or passes it as an argument. `umask 077` before the write, so it is never briefly readable.
      - name: Place the credential outside the checkout
        env:
          SUTURA_BQ_KEY: ${{ secrets.svc_suturua_bq_ci }}
        run: |
          set -eu
          if [ -z "${SUTURA_BQ_KEY:-}" ]; then
            echo "the bq-test environment holds no svc_suturua_bq_ci secret" >&2
            exit 1
          fi
          umask 077
          printenv SUTURA_BQ_KEY > "$RUNNER_TEMP/bq-key.json"
          # The shape, never the content: enough to know a key arrived and nothing that reveals it.
          echo "credential placed, $(wc -c < "$RUNNER_TEMP/bq-key.json") bytes, outside the checkout"

      # **Mask the three resource names before anything can print them, and this step exists because
      # of a channel the rest of the job would otherwise open.**
      #
      # Workflow logs on a PUBLIC repository are public. The wire carries the endpoint's own `message`
      # on a refusal - bounded, deliberately, because a `400 invalidQuery` with only a reason code is
      # undiagnosable - and that message quotes the resource it refused, as `project:dataset.table`. So
      # a FAILING acceptance run would print a project id, a dataset and a table name into a log
      # anybody can read, which is exactly the class `AGENTS.md` says not to disclose.
      #
      # `::add-mask::` is the mechanism that fits, because it does not care WHERE the value appears: it
      # redacts it from every subsequent log line in the job, including a panic message from a test.
      # Masking the diagnostic away is the right trade in this direction - a maintainer who needs the
      # unredacted message runs the leg locally, where the log is theirs.
      #
      # The project id is read from the key rather than configured, for the reason the fixture reads it
      # from the key: a service-account key names its own project, and a second declaration is a second
      # answer to *who pays*. `python3 -c` rather than a shell read, so the value never becomes a shell
      # word that could be logged by `set -x`.
      - name: Mask the resource names
        env:
          K: ${{ runner.temp }}/bq-key.json
          SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
          SUTURA_BQ_TABLE: ${{ vars.SUTURA_BQ_TABLE }}
        run: |
          set -eu
          python3 -c 'import json,os;print("::add-mask::" + json.load(open(os.environ["K"]))["project_id"])' \
            2>/dev/null || { echo "the key names no project_id" >&2; exit 1; }
          for name in SUTURA_BQ_DATASET SUTURA_BQ_TABLE; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "the bq-test environment defines no $name - it names a resource this leg has to be pointed at" >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "$(printenv "$name")"
          done
          echo "three resource names masked for the rest of this job"
        # `K` separately, so the credential path is an environment value rather than an interpolation.
        # Same rule the rest of this file follows: no `${{ }}` reaches a shell body.

      # `nix run .#bigquery-acceptance` and not a check: `checks.*` run in the nix sandbox, which has
      # no network. `check-workflows` verifies that this output exists.
      #
      # The dataset and the table come from `vars`, which are not secrets and are also not written into
      # this repository - the values name a project's resources and belong in the environment. The
      # BILLING PROJECT comes from the key's own `project_id`, so there is no third variable to get
      # wrong. All three fail loudly when unset rather than skipping, because reaching this step is
      # already a statement of intent.
      - name: Acceptance leg
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bq-key.json
          SUTURA_BQ_DATASET: ${{ vars.SUTURA_BQ_DATASET }}
          SUTURA_BQ_TABLE: ${{ vars.SUTURA_BQ_TABLE }}
        run: |
          set -eu
          nix run .#bigquery-acceptance -- --no-capture

      # Always, so a cancelled or failed run does not leave a key on a runner that some other job on
      # the same machine could read.
      - name: Remove the credential
        if: always()
        run: |
          set -eu
          rm -f "$RUNNER_TEMP/bq-key.json"

  cross:
    needs: [ci]
    # Same `== 'true'` test the main-only steps use, against the classification `ci` published.
    #
    # THE EVENT, NOT THE REF, and the difference is four runners per queue entry. This job IS the
    # pull-request link check, so it now says so. What it said before was two exclusions -
    # `github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main'` - which named the two
    # refs a run was known to arrive on and let through anything else. A `merge_group` run arrives
    # on `refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>`, which is neither, so every queued
    # entry would have built all four targets a SECOND time, over the pull request's own commits
    # rebased onto the base - possibly batched with the entries ahead of them, which is a tree the
    # merge itself will produce and not one a link check is the gate for. Positive on the
    # event rather than negative on a list of refs: a ref shape nobody has seen yet cannot make it
    # wrong, and the condition now states the intent instead of enumerating its exceptions.
    if: needs.ci.outputs.build == 'true' && github.event_name == 'pull_request'
    runs-on: rust-mcp
    # 120 for the same reason as `ci`, with more of it: each target in the matrix compiles that
    # same large closure again for its own triple, and none of them shares the host's artifacts.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      # One red job names the target that broke; cancelling the other three would only tell you
      # that something did. Same reasoning as release.yml, and here the work discarded would
      # also be work the cache had already paid for.
      fail-fast: false
      matrix:
        # The four shipped triples. Deliberately the same list as release.yml's `build`, so the
        # branch checks exactly the set that later becomes an artifact - if a target is added
        # there and not here, it ships without ever having been built on a pull request.
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      # No `fetch-depth: 0` here: nothing in this job diffs against a base. `ci` owns that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before nix installs: /nix/store is what fills. See
      # `.github/actions/reclaim-disk` for why this is local and why it cannot
      # affect the Nix cache.
      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # Same reasoning as the `ci` job: the flag that would let flake.nix add its own
          # substituter stays absent, so a pull request cannot point CI at a store it controls.
          extra_nix_config: |
            fallback = true

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # Through `env` rather than interpolated into the script: a matrix literal is not
      # attacker-controlled, but the rule that no `${{ }}` reaches a shell body is worth more
      # as a rule than as a case-by-case judgement.
      # EVERY SHIPPED BINARY, and the loop is what makes this job the measurement issue #111
      # asks for. A second shipped executable changes what has to LINK for two musl triples -
      # the allocator's C included - and this is the job that answers whether it does, on the
      # pull request, rather than at tag time after four cross builds have been paid for.
      - name: Link check
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          for bin in $BINARIES; do
            nix build ".#${bin}-${TARGET}-ci" -L -o "result-ci-${bin}"
            # Proves the arch, not just the exit code: a linker that silently produced a host
            # binary would pass a bare build.
            file "result-ci-${bin}/bin/${bin}"
          done
          # Not a silent cap: a green branch must not read as having validated what ships.
          echo "::notice::${TARGET}: ci profile, compile-speed settings. Release-profile codegen, the one-binary and shipped-features assertions and the container images are built on main, not here."

      # DOES EVERY SHIPPED BINARY CARRY ITS OWN DEPENDENCY LIST, and can the tool the release
      # path uses read it back out? A local composite action; its header says why it is not
      # inline here and what `nix/auditable.nix` and `release.yml` depend on it for.
      - uses: ./.github/actions/embedded-dependency-list
        with:
          target: ${{ matrix.target }}
          binaries: ${{ env.BINARIES }}
