[package]
name = "sutura-exec-duckdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry: sutura ships as an OCI image, not as crates.
publish = false
description = "A Warehouse adapter over DuckDB, for local development and single-file work."

[dependencies]
sutura-domain = { workspace = true }
# Rendering, shared with every other SQL adapter: this adapter speaks SQL, so it asks `sutura-sql`
# to render the plan for its dialect rather than growing a second set of quoting and placeholder
# decisions. NOT `sutura-semantic`: compiling stops at a plan, the port carries the plan, and this
# adapter never compiles anything - it renders what it was handed.
sutura-sql = { workspace = true }
thiserror = { workspace = true }
# The one transport (`telekom/sutura#913`). `DuckDB` is its own ADBC driver, so the driver manager
# opens the engine's `duckdb_adbc_init` from this artefact's link or a mounted `libduckdb`;
# `sutura-adbc` owns the workspace's one `unsafe` ADBC site, so this adapter adds none, and the two
# Arrow crates name what the driver hands back.
adbc_core = { version = "0.24" }
adbc_driver_manager = { version = "0.24" }
arrow-array = { version = "59" }
arrow-schema = { version = "59" }
sutura-adbc = { workspace = true }

# The conformance packs, which `tests/conformance.rs` binds this adapter to. A DEV-dependency and
# never more than one: the harness holds this adapter to the port's contract, and nothing shipped
# should be able to reach it.
[dev-dependencies]
sutura-conformance = { workspace = true }

[features]
fixtures = ["sutura-domain/fixtures"]

[[test]]
name = "conformance"
required-features = ["fixtures"]

[[test]]
name = "raw"
required-features = ["fixtures"]

[lints]
workspace = true
