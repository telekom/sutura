name: format
run-name: Remote own-grant proof ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact published base commit
        type: string
        required: true
      base_tree:
        description: Exact base source tree
        type: string
        required: true
      candidate_tree:
        description: Reviewed prepared source reconstructed from the frozen patch
        type: string
        required: true
      helper_tree:
        description: Exact reviewed helper tree
        type: string
        required: true
      request_id:
        description: Unique proof request UUID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: remote-own-grant-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: rust-mcp-16core
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          path: base-source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci
      - name: Execute twelve exact-source native proof rows
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          BASE_TREE: ${{ inputs.base_tree }}
          CANDIDATE_TREE: ${{ inputs.candidate_tree }}
          HELPER_TREE: ${{ inputs.helper_tree }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_PROFILE_TEST_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND DUCKDB_LIB_DIR DUCKDB_INCLUDE_DIR
          nix develop --impure --expr 'import ./devco/remote-own-grant-env.nix { source = ./base-source; }' --command python3 -I devco/remote_own_grant_proof.py
      - name: Keep original failures and exact restoration receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-own-grant-proof-${{ inputs.request_id }}-${{ github.run_id }}
          path: target/remote-own-grant-proof/
          if-no-files-found: error
          retention-days: 14
