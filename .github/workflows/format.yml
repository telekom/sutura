# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format
run-name: Oracle bootstrap index diagnostic ${{ inputs.request_id }}

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact frozen source commit
        type: string
        required: true
      source_tree:
        description: Exact frozen source tree
        type: string
        required: true
      request_id:
        description: Unique reviewed diagnostic request UUID
        type: string
        required: true
      prerequisite_json:
        description: Independently reviewed exact-tree full native pass receipt
        type: string
        required: true
      prerequisite_sha256:
        description: SHA256 of the exact prerequisite receipt input
        type: string
        required: true

permissions:
  contents: read

jobs:
  format:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent, for the reason security-audit.yml gives: with it, a pull request could add
          # a substituter and a trusted key and have CI fetch attacker-built store paths whose
          # signature verifies.
          extra_nix_config: |
            fallback = true

      # The candidate set is `git ls-files`, so the checkout above IS the input. `fetch-depth` is
      # left at its default: the script reads the working tree, not a diff against a base.
      - name: markdown, yaml, toml and python
        run: bash nix/format-text.sh check

  proof:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: oracle-reader-admission-proof-${{ github.ref }}
      cancel-in-progress: false
    runs-on: rust-mcp-32core
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - uses: $/.github/actions/nix-store-cache
        with:
          scope: ci
      - name: Capture strict raw-index bootstrap boundaries
        working-directory: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          REQUEST_ID: ${{ inputs.request_id }}
          PREREQUISITE_JSON: ${{ inputs.prerequisite_json }}
          PREREQUISITE_SHA256: ${{ inputs.prerequisite_sha256 }}
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND
          export CARGO_TERM_COLOR=never NO_COLOR=1
          [[ "$REQUEST_ID" == 0c1c6832-dc8a-4b2f-ab17-071fcf60fb94 ]]
          [[ "$SOURCE_SHA" == d994a05519aa8f20d39c842861c46e2eb23890d1 ]]
          [[ "$SOURCE_TREE" == 0d39cb5ec946a2b142a413f8b98a9678ec830959 ]]
          [[ "$GITHUB_REF_NAME" == ci/oracle-index-diagnostic-0c1c6832 && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          umask 077
          diag_dir="$RUNNER_TEMP/oracle-index-$REQUEST_ID"
          mkdir -- "$diag_dir"
          export INDEX_DIAGNOSTIC_DIR="$diag_dir"
          index="$(git --no-optional-locks rev-parse --path-format=absolute --git-path index)"
          readonly index diag_dir
          capture_index() {
            local boundary="$1" status="$2"
            printf 'phase=outer-shell\nboundary=%s\nexit=%s\nutc=%s\npid=%s\nsource=%s\ntree=%s\nhelper=%s\nrun=%s\nattempt=%s\njob=%s\nrequest=%s\ncwd=%s\nGIT_OPTIONAL_LOCKS=%s\n' \
              "$boundary" "$status" "$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" "$$" \
              "$SOURCE_SHA" "$SOURCE_TREE" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" \
              "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$REQUEST_ID" "$PWD" "${GIT_OPTIONAL_LOCKS-unset}" \
              > "$diag_dir/$boundary.metadata.txt" || return
            stat --printf '%d %i %s %f %y %z\n' "$index" > "$diag_dir/$boundary.stat-before" || return
            cp -- "$index" "$diag_dir/$boundary.index" || return
            stat --printf '%d %i %s %f %y %z\n' "$index" > "$diag_dir/$boundary.stat-after" || return
            sha256sum "$diag_dir/$boundary.index" > "$diag_dir/$boundary.sha256" || return
            cmp -s "$diag_dir/$boundary.stat-before" "$diag_dir/$boundary.stat-after"
          }
          finish() {
            local status=$? capture_status equal=0
            trap - EXIT
            set +e
            capture_index outer-after "$status"
            capture_status=$?
            if (( status == 0 && capture_status != 0 )); then status=$capture_status; fi
            if cmp -s "$diag_dir/outer-before.index" "$diag_dir/outer-after.index"; then
              equal=1
            elif (( status == 0 )); then
              status=1
            fi
            printf 'exit=%s\ncapture_exit=%s\nraw_equal=%s\nnative_executed=false\n' \
              "$status" "$capture_status" "$equal" > "$diag_dir/terminal.txt" || status=1
            (
              cd "$diag_dir" || exit 1
              for file in *; do
                if [[ "$file" != manifest.sha256 ]]; then sha256sum -- "$file" || exit 1; fi
              done
            ) > "$diag_dir/manifest.sha256" || status=1
            exit "$status"
          }
          trap finish EXIT
          capture_index outer-before 0
          printf '%q ' nix shell --inputs-from . nixpkgs#python3 nixpkgs#coreutils --command python3 -I ../devco/oracle_reader_admission_proof.py > "$diag_dir/command.txt"
          command -v nix > "$diag_dir/nix-path.txt"
          sha256sum "$(command -v nix)" > "$diag_dir/nix.sha256"
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#coreutils --command python3 -I ../devco/oracle_reader_admission_proof.py
      - name: Retain strict index diagnostics and original failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-index-diagnostic-${{ inputs.request_id }}-${{ github.run_id }}
          path: |
            source/target/oracle-index-diagnostic/
            ${{ runner.temp }}/oracle-index-${{ inputs.request_id }}/
          if-no-files-found: error
          retention-days: 14
