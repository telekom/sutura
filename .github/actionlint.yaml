# actionlint's view of which runner labels exist. It ships a list of the standard GitHub-hosted
# labels and rejects anything else as `label "..." is unknown`, which is the right default: a typo
# in `runs-on` is otherwise a job that queues for 24 hours and is then cancelled - `timeout-minutes`
# does not apply to queue time, so nothing fails fast.
#
# `rust-mcp` is a GitHub-hosted LARGER runner, not a self-hosted one. The key is still
# `self-hosted-runner.labels`, because actionlint draws no distinction between the two - its own
# documentation lists `windows-latest-xl`, a larger-runner name, under this key.
#
# This file is the whole enforcement: a label added to `runs-on` and not named here fails
# `just lint-ci`, and a label named here that no runner group serves is caught by the job queueing
# rather than by a gate. So the entry is a claim that an org runner group serves this repository -
# which is a permission on the GitHub side and cannot be checked from the tree.
#
# PINNED HOSTS, AND THE BARE PREFIX IS ABSENT ON PURPOSE. The runner group now serves
# `rust-mcp-32core` and `rust-mcp-16core` beside the older `rust-mcp`, and which machine a bare
# `runs-on: rust-mcp` lands on is not something this repository can read - so a timing taken under
# it is a timing on an unknown host, which is what made the label unusable for a comparison. Every
# `runs-on:` in `.github/workflows` therefore names its host: a larger runner where Rust is
# compiled, `ubuntu-latest` where nothing is.
#
# `rust-mcp` is gone from the list below so that a drift back to it FAILS rather than lands: a
# workflow change sets `run_all` in `cargo xtask classify` (`.github/**` is a run-all pattern),
# `run_all` runs `ci.yml`'s workflow static analysis step, and that step's `nix/lint-workflows.sh`
# runs `actionlint` against this file - inside `ci`, the one required context. The refusal is
# `label "rust-mcp" is unknown. available labels are ...`.
#
# `rust-mcp-16core` IS in use: the mostly-cached jobs moved to it, measured at the same median
# wall as the 32-core label. The build-and-publish jobs stayed on 32.
# change first measures it.
self-hosted-runner:
  labels:
    - rust-mcp-32core
    - rust-mcp-16core
