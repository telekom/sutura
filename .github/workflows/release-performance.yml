# The optimised build, on request only.
#
# `release-performance` is `release` plus fat LTO and a single codegen unit. That is minutes
# of extra compile time for a binary worth shipping only once throughput has actually been
# measured - so it is a separate, manually dispatched workflow rather than an input on the
# normal release. Nothing schedules it and no tag triggers it.
#
# WHAT IT DOES NOT DO: `target-cpu=native`. That is the obvious next optimisation and it is
# deliberately absent, because these artifacts are *published* - a binary tuned for the
# runner's CPU would fault with SIGILL on an older one, and a Nix derivation hash does not
# represent the CPU it was built on, so the mismatch would not even be visible. A build
# pinned to a known deployment host can make that trade; a downloadable release cannot.
#
# WHAT IT PUBLISHES, on `publish=true` from a tag - everything the normal release publishes for
# the binary, built at this profile, and nothing built and discarded:
#
# | Kind | Where |
# | --- | --- |
# | four tarballs, their `.sha256`, both musl image tarballs, the SBOMs, `image-digests.txt` | the `<version>-performance` prerelease |
# | a Sigstore bundle per asset, SLSA provenance over all of them | the same prerelease |
# | four leaves `<version>-performance-<triple>` | the registry, signed, each with its SBOM attested |
# | lists `<version>-performance` (glibc) and `<version>-performance-musl` | the registry, signed, with provenance |
#
# A SEPARATE RELEASE, because the normal one cannot take them: this repository has GitHub's
# immutable releases enabled, so `v<version>`'s assets froze when it was published and an upload
# returns `HTTP 422: Cannot upload assets to an immutable release` - observed on the v0.1.0 run of
# this file, which used to try. So the optimised build gets its own release, created WITH every
# asset in one `gh release create`, and never an upload onto an existing one.
#
# ITS TAG IS `<version>-performance`, WITHOUT THE `v`, and that is a ruleset rather than a taste:
# `refs/tags/v*` creation is restricted to named bypass actors, and this job's token is not one,
# so `v<version>-performance` would be refused. Outside `v*` it also cannot trigger `release.yml`,
# which moves `latest`. The immutable-release setting locks the tag once the release is published.
#
# `latest` is never moved, and no asset or tag shares a name with the normal release, so nothing
# starts running an optimised build by accident.
#
# ONE BINARY, `sutura`, and it carries the HTTP surface too as `sutura serve` - since
# `github.com/telekom/sutura#685` step 2 folded the `sutura-serve` binary this comment used to
# name into the one this file already builds. Before that fold there was a second binary with its
# own `-performance` sibling built for free (`packages.sutura-serve-performance`,
# `packages.oci-serve-performance`) and this file deliberately did not build it, on the reasoning
# that fat LTO is minutes of compile time for throughput SOMEBODY HAS MEASURED, and nobody had
# measured the server's. That reasoning has nothing left to apply to: one binary, one measurement
# question, answered by whichever workload asked for `--features` this build was told to carry.
#
# REUSED, NOT COPIED: `build-artefacts` (binaries, images, smoke tests, SBOMs) with
# `profile: performance`, `push-images` (leaves, lists, digest records) and `attest-and-sign` -
# the composite actions `release.yml` calls, so the two publishers cannot drift apart. The
# third-party actions are the ones `release.yml` uses, pinned by the same commits. Publishing is
# `gh` and `docker` rather than a release action, for the same reason as release.yml.
name: release-performance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "build" to confirm the optimised build'
        required: true
        type: string
      publish:
        description: "Push the images and create the <version>-performance release (requires a tag ref)"
        required: false
        default: false
        type: boolean

# Nothing broad at the workflow level. `validate` reads a text input and needs no write
# at all; only `publish` writes, and only when asked to.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  BINARIES: sutura

jobs:
  # A 20-minute build should not start because someone clicked the wrong button.
  validate:
    # `ubuntu-latest`: two string comparisons. `build` below keeps the Rust runner, which is
    # where the 20-minute build this confirmation guards actually happens.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          if [ "$CONFIRM" != "build" ]; then
            echo '::error::Type "build" to confirm the optimised build.'
            exit 1
          fi
          # Publishing writes to a release and to GHCR, so it needs a tag to write *to*.
          if [ "$PUBLISH" = "true" ] && ! printf '%s' "$REF" | grep -q '^refs/tags/'; then
            echo "::error::publish=true requires a tag ref; got $REF"
            exit 1
          fi
          echo "confirmed - ref $REF, publish=$PUBLISH"

  gates:
    needs: [validate]
    runs-on: rust-mcp-32core
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before nix installs: /nix/store is what fills. See
      # `.github/actions/reclaim-disk` for why this is local and why it cannot
      # affect the Nix cache.
      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent: with it, a pull request could add a substituter and a trusted key and have
          # CI fetch attacker-built store paths whose signature verifies. Anything CI needs
          # goes here, where the workflow diff shows it.
          # AND THE STORES THIS REPOSITORY PUBLISHES, which is why the pair below is here rather
          # than only in `ci.yml`: a store this repository fills and never reads is spend with no
          # return, and a tag-started run used to read none of them. Both halves are COMMITTED, so
          # a reviewer sees them in the diff and `cargo xtask check-workflows` compares them - it
          # now also refuses an installer step that names NEITHER. Nix verifies every path against
          # the keys below; what bounds the poison risk is narrower and differs per store - see
          # `ALLOWED` in `xtask/src/workflows/cache_scope/retired/stores.rs`.
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      # Carries /nix/store between runs: the same action at the same commit as ci.yml and
      # release.yml. The argument for why a path that PUBLISHES may share a cache is written out
      # in full in release.yml - the Actions cache is scoped by ref, a run restores only from its
      # own ref and from the default branch, and a cache a pull request wrote lives in
      # `refs/pull/.../merge`, where only that pull request's own re-runs can read it. This
      # workflow is dispatched by hand and, when it publishes, from a tag: the same two scopes
      # release.yml reads, and no pull request can write to either.
      #
      # The win is bigger here than anywhere else in the repo. Fat LTO with a single codegen unit
      # is the slowest build there is, this job runs the full gate set before it starts, and a
      # person clicked the button and is waiting.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # Same rule as the normal release: nothing shippable is built before the gates pass.
      # These reuse the `release`-profile artifacts, which is why they are cheap here.
      - name: Lints and tests before building anything shippable
        run: |
          set -eu
          nix build .#checks.x86_64-linux.hygiene -L
          nix build .#checks.x86_64-linux.fmt -L
          nix build .#checks.x86_64-linux.clippy -L
          nix run .#deny
          nix build .#checks.x86_64-linux.nextest -L
          nix build .#checks.x86_64-linux.doctest -L
          nix build .#checks.x86_64-linux.one-binary -L
          # And which FEATURES the artefacts this release publishes carry, read out of their own
          # embedded dependency list. `nix/shipped.nix` decides it; this is what asserts it.
          nix build .#checks.x86_64-linux.shipped-features -L

  # FOUR targets, one runner each - the matrix `release.yml`'s `build` runs, and
  # `xtask/src/workflows/cross_link.rs` holds the two to the same list. Fat LTO is the slowest
  # build there is, so four runners in parallel is the wall-clock the person who clicked waits.
  build:
    needs: [gates]
    runs-on: rust-mcp-32core
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Before nix installs: /nix/store is what fills. See
      # `.github/actions/reclaim-disk` for why this is local and why it cannot
      # affect the Nix cache.
      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The same installer and stores as `gates` above - see the reason written there.
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # The release's own build sequence at the other profile: binaries, images run as
      # `sutura serve` on x86_64, and an SBOM per image. Unconditional, so a dry run
      # (`publish=false`) builds and runs everything a publish would push.
      - uses: ./.github/actions/build-artefacts
        with:
          target: ${{ matrix.target }}
          binaries: ${{ env.BINARIES }}
          profile: performance

      - name: Hand the artifacts to publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.target }}
          path: |
            dist/
            images/
            facts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The only job holding write tokens, and it compiles and executes nothing: it moves bytes
  # `build` produced, signs them, and creates the release - `release.yml`'s split, same reason.
  publish:
    needs: [build]
    if: ${{ inputs.publish }}
    runs-on: rust-mcp-32core
    timeout-minutes: 60
    permissions:
      contents: write # create the <version>-performance release
      packages: write # push to GHCR, and the signatures and attestations that sit beside it
      id-token: write # mint the OIDC token Fulcio signs a certificate against
      attestations: write # store the SLSA provenance against this repository
    env:
      TARGETS: >-
        x86_64-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        x86_64-unknown-linux-musl
        aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The same installer and stores as `gates` above - see the reason written there.
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - name: Collect what the matrix built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-*
          merge-multiple: true

      # `attest-and-sign` signs what it is handed, so a missing artefact would be a quietly
      # absent one rather than an unsigned one. This is what refuses it.
      - name: Check that every build arrived
        run: |
          set -eu
          test -n "$BINARIES" || { echo "::error::BINARIES is empty: this step would expect no artefact"; exit 1; }
          missing=0
          for target in $TARGETS; do
            for bin in $BINARIES; do
              if [ "$bin" = sutura ]; then key="${target}-performance"; else key="${bin#sutura-}-${target}-performance"; fi
              for f in "dist/${bin}-${target}-performance.tar.gz" "dist/${bin}-${target}-performance.tar.gz.sha256" \
                "images/sutura-oci-${key}.tar.gz" "dist/sutura-oci-${key}.cdx.json" "dist/sutura-oci-${key}.spdx.json"; do
                if [ ! -s "$f" ]; then
                  echo "::error::${key}: ${f} is missing or empty"
                  missing=1
                fi
              done
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -l dist images

      - name: Push the images
        uses: ./.github/actions/push-images
        with:
          targets: ${{ env.TARGETS }}
          binaries: ${{ env.BINARIES }}
          profile: performance
          image: ${{ env.IMAGE }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      # Before the release exists, as in `release.yml`: every file in `dist/` gets a Sigstore
      # bundle and SLSA provenance, every image reference a signature, every leaf its SBOM.
      - name: Attest and sign
        uses: ./.github/actions/attest-and-sign
        with:
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      # ONE `gh release create` with every asset, never an upload onto an existing release - the
      # header says why. `--target` pins the new tag to the commit that was built rather than to
      # the default branch's head. A release of that name already existing is a refusal: once
      # published it can never be changed, and a leftover draft is invisible to users.
      - name: Publish the performance release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          release="${GITHUB_REF_NAME#v}-performance"
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          if [ ! -s dist/sutura-provenance.intoto.jsonl ]; then
            echo "::error::missing provenance release asset"
            exit 1
          fi
          if gh release view "$release" >/dev/null 2>&1; then
            echo "::error::a release ${release} already exists. Published, it is immutable and cannot be repaired; a draft is a leftover - delete it with 'gh release delete ${release} --yes --cleanup-tag' and re-run."
            exit 1
          fi
          {
            echo "The \`release-performance\` build of [${GITHUB_REF_NAME}](${repo}/releases/tag/${GITHUB_REF_NAME}): the same commit, fat LTO and one codegen unit, no \`target-cpu=native\`. The change list, the licence statement and the chart are on that release."
            echo
            echo "## Images"
            echo
            echo "| Variant | Tag | Platforms |"
            echo "| --- | --- | --- |"
            printf "| glibc | \`%s:%s\` | linux/amd64, linux/arm64 |\n" "$IMAGE" "$release"
            printf "| static musl | \`%s:%s-musl\` | linux/amd64, linux/arm64 |\n" "$IMAGE" "$release"
            echo
            echo '```'
            cat dist/image-digests.txt
            echo '```'
            echo
            printf "Every asset has a \`<asset>.sigstore.json\` bundle and SLSA provenance, verified as [Verifying a release](%s/blob/%s/docs/verifying-a-release.md) describes.\n" "$repo" "$GITHUB_REF_NAME"
          } > notes.md
          cat notes.md
          count="$(find dist -maxdepth 1 -type f | wc -l)"
          gh release create "$release" dist/* --target "$SHA" --title "$release" --notes-file notes.md --prerelease --latest=false
          attached="$(gh release view "$release" --json assets --jq '.assets | length')"
          echo "published ${release} with ${attached} asset(s)"
          if [ "$attached" -ne "$count" ]; then
            echo "::error::attached ${attached} asset(s) but dist/ holds ${count}"
            exit 1
          fi
