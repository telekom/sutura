# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:
    inputs:
      operation:
        description: Run the finishing gates on the pinned source
        type: choice
        required: true
        options: [profile-diagnostic]
      source_sha:
        description: Exact frozen source commit; must match the reviewed plan
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: inbound-finishing-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.event_name == 'workflow_dispatch'
    runs-on: rust-mcp-16core
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: datafusion-profile-diagnostic
            plan: plan-datafusion-profile-diagnostic.json
            mode: profile-diagnostic

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
        if: github.event_name == 'workflow_dispatch'

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - name: markdown, yaml, toml and python
        if: github.event_name != 'workflow_dispatch'
        run: bash nix/format-text.sh check

      - name: Associate parser output and run the pinned proof
        working-directory: source
        env:
          PROOF_MODE: ${{ matrix.mode }}
          PROOF_PLAN: ${{ matrix.plan }}
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND
          export CARGO_TERM_COLOR=never NO_COLOR=1
          mkdir -p target/inbound-verifier-proof/parser
          cp ../devco/inbound_verifier_proof.py target/inbound-verifier-proof/collection-runner.py
          cp "../devco/$PROOF_PLAN" target/inbound-verifier-proof/collection-plan.json
          cp ../devco/profile.just target/inbound-verifier-proof/collection-profile.just
          cp ../devco/check_own_sites.py target/inbound-verifier-proof/parser/check_own_sites.py
          cp ../devco/old_inbound_verifier_proof.py target/inbound-verifier-proof/parser/old_inbound_verifier_proof.py
          old_status=0
          nix shell --inputs-from . nixpkgs#python3 --command python3 -I ../devco/check_own_sites.py ../devco/old_inbound_verifier_proof.py > target/inbound-verifier-proof/parser/old.log 2>&1 || old_status=$?
          printf '%s\n' "$old_status" > target/inbound-verifier-proof/parser/old.exit
          test "$old_status" -ne 0
          grep -F 'accepted unassociated panic evidence' target/inbound-verifier-proof/parser/old.log
          nix shell --inputs-from . nixpkgs#python3 --command python3 -I ../devco/check_own_sites.py ../devco/inbound_verifier_proof.py > target/inbound-verifier-proof/parser/new.log 2>&1
          printf '0\n' > target/inbound-verifier-proof/parser/new.exit
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#just nixpkgs#pixi nixpkgs#devenv --command python3 -I ../devco/inbound_verifier_proof.py "$PROOF_MODE" "../devco/$PROOF_PLAN"

      - name: Retain evidence and any generated changes
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inbound-proof-${{ strategy.job-index }}-${{ github.run_id }}
          path: source/target/inbound-verifier-proof/
          if-no-files-found: error
          retention-days: 14
