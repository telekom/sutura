# DOES EVERY COMMITTED `devco/claim-mutations/` PATCH STILL KILL THE CELL IT NAMES?
#
# `workflow_dispatch` ONLY. The task recompiles this workspace once per committed patch, so a person
# starts it when the set needs re-verifying; no push, pull request, merge-queue entry or schedule
# does. `cargo xtask check-claim-mutations` is the cheap apply-only half and runs in every `ci`;
# this is the half that rebuilds and runs each cell under its mutation.
#
# CI runs a gate through a flake app: `nix run .#claim-mutation-kills` is `just
# check-claim-mutation-kills` with the pinned toolchain, the cargo environment, the warm start and
# the same tier bring-up (`nix/with-tier.sh`, `sutura_tier_up`).
#
# THE CACHE IS READ-ONLY here, by two different holds. Cachix: the job has no auth token, so it
# cannot push to a binary cache. The GitHub Actions cache: `nix-store-cache` saves only on a push to
# `main`, and a run is not one. That second hold is the save condition AND this trigger list, and
# no gate reads the trigger list - review holds it. Likewise `contents: read` on the job.
#
# THE TIMEOUT IS THE HOSTED LIMIT, not an estimate. One run over every patch may not finish inside
# it, because the set takes the patch count times the time for each patch, and that time is not
# measured on the runner. The task prints the patch count when it starts.
#
# THE SHARD INPUT splits the set: `shard` is `<i>/<n>`, and `n` dispatches `1/n` to `n/n` cover every
# patch once. Position `p`, counted from 0, of the sorted patch names goes to shard `p % n + 1`, so
# dispatch all `n` from the same commit. As an estimate, not a bound: choose `n` of at least the
# patch count divided by 300, rounded up. The 300 is 360 minutes less 60 for setup, at about 1 minute
# for each patch. This repo records about 68 s for each isolated rebuild
# (`xtask/src/causality/rot.rs`), and at that time 300 patches take about 340 minutes, which leaves
# about 20 of the 360 for checkout, the nix install, the cache restore and the first build. For the
# first dispatch use `n = 3`, and read the time for each patch from that run before choosing a
# smaller `n`. The default `1/1` is the whole set. A malformed value is refused with exit 2, and
# never runs the whole set.
#
# A run stops at the first patch that no longer kills its cell. A timeout is not a verdict.
name: claim-mutation-kills
run-name: claim-mutation-kills ${{ inputs.shard }}

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Which slice of the patches to run, as <i>/<n> with 1 <= i <= n, for example 2/4"
        type: string
        default: "1/1"

permissions: {}

jobs:
  claim-mutation-kills:
    runs-on: rust-mcp-16core
    permissions:
      contents: read
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: $/.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Check every committed claim mutation still kills its cell
        env:
          SHARD: ${{ inputs.shard }}
        run: nix run .#claim-mutation-kills -- --shard "$SHARD"

      - uses: $/.github/actions/nix-store-cache-report
        if: always()
