name: An SBOM of one image
description: >
  Scan one target's image tarball with syft and write CycloneDX and SPDX inventories into `dist/`,
  asserting that the crate graph the binary carries is really in them.

inputs:
  target:
    description: The Rust triple this image was built for, naming its tarball and its outputs.
    required: true
  version:
    description: >
      What syft records as the source version. `github.ref_name` from the caller, so a scan is
      labelled with the tag it belongs to rather than with whatever syft would infer.
    required: true

# A LOCAL composite action, for `attest-and-sign`'s reasons: every action this repository calls is
# pinned by digest and reviewed, a local one cannot drift from the workflow that uses it, and
# `release.yml` is hand-written configuration under the 1000-line cap `cargo xtask max-lines`
# enforces. That header predicted the cap would be reached by the next artefact kind added to the
# release path, and said the split would then be made under pressure rather than for a reason. It
# was reached by the licence statement, and this is the split - moved intact, because the argument
# below is the part worth keeping.
#
# The caller needs nothing but `contents: read`: this reads a local tarball and writes two files.
runs:
  using: composite
  steps:
    # An SBOM of the IMAGE, per target, and what it does and does not describe is the whole
    # point of this comment.
    #
    # It reads the image TARBALL rather than the daemon or the registry, so what it inventories
    # is exactly the bytes `publish` pushes - not an image resolved by a tag that could have
    # moved between two steps. Decompressed to a scratch file rather than piped, because
    # `docker-archive:` seeks within the archive; the copy is transient and is deleted in the
    # same step, so peak disk is what the `Image` step in the calling job already reached.
    #
    # CALLED FROM `build` and not from `publish`, for the reason release.yml's job header gives:
    # this is compute, and the job holding the write tokens compiles and inspects nothing.
    #
    # **WHAT IT COVERS.** The image's files - which is the binary, `cacert` and `tzdata`, since
    # there is no shell and no package manager in there - AND the crate graph the binary was
    # compiled from, because `nix/auditable.nix` builds it with `cargo auditable` and `syft`
    # reads that ELF section back out with its `cargo-auditable-binary-cataloger`.
    #
    # **THE SECOND HALF IS NOT READ OUT OF A LOCK FILE, AND THAT IS THE POINT.** A document
    # generated from `Cargo.lock` beside the binary is a CHECKED claim about it - the two can
    # drift and neither says so - and it would also be the WRONG graph: `sutura-cli` links the
    # engine only, while `libduckdb-sys` and the BigQuery wire put `ureq`, rustls and `ring` in
    # the resolve for a binary that links none of them. What is inventoried here is what the
    # compiler actually put in, from inside the bytes being scanned. `nix/auditable.nix` carries
    # the argument; `docs/adr/0021`'s amendment is the decision.
    #
    # Two formats, because they have different consumers rather than because more is better.
    # CycloneDX is what `cosign attest --type cyclonedx` carries into the registry and what the
    # licence-review toolchain reads; SPDX is what most ingestion pipelines take. Both are
    # generated from one scan, so they cannot disagree.
    #
    # ASSERTED rather than described, like the static-linking and manifest-list claims that
    # surround the call site, and the assertion is now about CONTENT rather than about the file existing.
    # The failure this catches is specific and silent: if the embedded section stops being
    # produced - a crane bump that drops `cargoBuildCommand`, a `cargo-auditable` that changes
    # its wrapper - the scan still succeeds, still writes valid CycloneDX, and inventories three
    # files. Nothing downstream can tell that apart from a correct run, so the count and one
    # named crate are checked here.
    - name: SBOM
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
      run: |
        set -eu
        mkdir -p dist
        gzip -dc "images/sutura-oci-${TARGET}.tar.gz" > sbom-input.tar
        nix run .#syft -- scan "docker-archive:sbom-input.tar" \
          --source-name "sutura-${TARGET}" \
          --source-version "${VERSION}" \
          -o "cyclonedx-json=dist/sutura-oci-${TARGET}.cdx.json" \
          -o "spdx-json=dist/sutura-oci-${TARGET}.spdx.json"
        rm -f sbom-input.tar
        for sbom in "dist/sutura-oci-${TARGET}.cdx.json" "dist/sutura-oci-${TARGET}.spdx.json"; do
          if [ ! -s "$sbom" ]; then
            echo "::error::${sbom} was not written"
            exit 1
          fi
          # No jq: it is not a pinned tool here, and neither question needs a JSON parser.
          #
          # **`grep -o ... | wc -l`, NEVER `grep -c`.** `grep -c` counts matching LINES, and
          # syft writes JSON on ONE line - so it returns 1 for a document naming 241 packages
          # and 1 for a document naming none. This step shipped with `grep -c` and would have
          # failed every release; `ci.yml`'s cross job is what caught it, on the pull request,
          # which is the argument for that check existing at all.
          #
          # COUNTED PER FORMAT rather than through a shared key. `"name":` also appears in tool
          # blocks, properties and metadata, so it is a proxy rather than a count; CycloneDX
          # gives every component a `"bom-ref"` and SPDX gives every package an `"SPDXID"`, and
          # a two-line case buys an exact number.
          case "$sbom" in
            *.cdx.json) key='"bom-ref"' ;;
            *) key='"SPDXID"' ;;
          esac
          named="$(grep -o "$key" "$sbom" | wc -l)"
          # A FLOOR, not a fixed number. The exact count moves with every dependency bump, so
          # pinning it would make `just update` fail on a correct tree - and this check is not
          # about the count being right, it is about the embedded section being THERE. Without
          # it the answer is three files; with it, the engine alone brings DataFusion, Arrow and
          # tokio. MEASURED on 2026-08-31: 241 CycloneDX components and 242 SPDX ids, against
          # three files without the section - so 100 sits between the two by an order of
          # magnitude and a dropped adapter cannot trip it.
          if [ "${named:-0}" -lt 100 ]; then
            echo "::error::${sbom} names ${named} thing(s), expected at least 100 - the cargo auditable section is missing, so this inventories the image's files and not the crates the binary was built from"
            exit 1
          fi
          # AND the engine by name. The floor above would still pass on a document listing a
          # hundred of the wrong things; DataFusion is the one crate `sutura-cli` cannot ship
          # without, so its absence means the section describes something other than this binary.
          if ! grep -q '"datafusion"' "$sbom"; then
            echo "::error::${sbom} does not name datafusion, which the shipped binary links: this is not an inventory of the crates it was built from"
            exit 1
          fi
          printf '%s: %s named entries\n' "$sbom" "$named"
        done
        # NO `.sha256` sidecar, unlike the tarballs. The tarballs have one because they predate
        # anything better and a consumer's script may read it; an SBOM ships from the first
        # release that has signatures, and its Sigstore bundle already commits to its digest and
        # says who produced it. Adding a bare hash beside a signature is a weaker mechanism next
        # to a stronger one, and the failure mode is a reader checking the weak one.
        ls -l dist
