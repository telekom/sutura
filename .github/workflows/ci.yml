# ORDER MATTERS, and it is why this uses explicit steps rather than one `nix flake check`.
#
#   0. classify — what does this change require?
#   1. lints    — structural gates, formatting, clippy, supply chain
#   2. tests    — the test suite
#   3. build    — only then the release artifacts
#
# Steps 1-3 are gated on the classification, which FAILS OPEN: anything unrecognised runs
# everything. The structural gates are never gated — they are what judge a docs-only change.
#
# `nix flake check` runs its entries in ARBITRARY order, so the release build could be
# realised before the lints meant to gate it. Sequential steps make the dependency real: a
# failing lint stops the job before anything is built. `flake.nix`'s `checks` deliberately
# excludes the package for the same reason.
#
# COMPILE BUDGET
#
# One job, because separate jobs cannot share a /nix/store and steps can. Every step reuses
# ONE `cargoArtifacts` derivation (see flake.nix), so the dependency tree is compiled once
# for lints, tests and the build together — not once per step. The image references the
# native build rather than recompiling it; the host architecture is not cross-built at all
# (`sutura-x86_64-unknown-linux-gnu` aliases the native derivation, since a "cross" x86_64
# build on an x86_64 runner is a second full compile for a byte-identical result); and
# magic-nix-cache carries the store across runs. Net: one native plus one aarch64
# dependency build, and zero on a cache hit.
#
# CRANELIFT is never used here, by construction: nothing in this workflow, in flake.nix or in
# any tracked Cargo config enables it. It is a development-only codegen backend — a developer
# opts in via a gitignored override, and CI simply never does.
#
# No devenv: it is a dev-shell tool, and CI needs only `nix`. Every gate is a flake output.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The classifier diffs against the base commit, which a shallow clone lacks.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      # Carries /nix/store between runs. Without it every run recompiles from scratch,
      # which is the same waste as duplicated jobs, just spread over time.
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # --------------------------------------------------------------- 0. classify ---
      # What does this change actually require? A docs-only edit needs the structural gates
      # and nothing else; a flake edit needs the whole chain.
      #
      # It FAILS OPEN by construction: a path matching no area, an unusable base ref or an
      # empty diff all set `run_all`, and the step prints why. The failure mode guarded
      # against is not a wasted minute — it is a new directory nobody classified being
      # silently skipped while this job reports green.
      #
      # Run through `nix run` because there is no cargo on the runner — that is the point of
      # not installing devenv.
      - name: Classify the change
        id: classify
        run: |
          set -eu
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          # A new branch reports an all-zero "before"; an empty base makes classify fail open.
          case "$base" in
            0000000000000000000000000000000000000000|"") base="" ;;
          esac
          if [ -n "$base" ]; then
            nix run .#xtask -- classify --since "$base"
          else
            nix run .#xtask -- classify
          fi

      # ------------------------------------------------------------------ 1. lints ---
      # Cheapest first: a stray CRLF, an over-long file or a dead dependency fails early
      # rather than after a dependency build.
      #
      # NOTE: no devenv anywhere in this workflow. devenv is a dev-shell tool; CI needs
      # only `nix`, and every gate below is a flake output that runs the same xtask binary
      # a developer runs.
      - name: Structural gates (line endings, max-lines, unused deps, boundaries)
        run: nix build .#checks.x86_64-linux.hygiene -L

      - name: Format
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.fmt -L

      - name: Clippy
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.clippy -L

      # A flake app, not a check: it fetches the advisory database and a Nix build sandbox
      # has no network. The app puts the PINNED cargo on PATH — `nix run nixpkgs#cargo-deny`
      # does not, and would audit with whatever cargo the runner happens to ship.
      - name: Supply chain (advisories, licences, bans, sources)
        if: steps.classify.outputs.deps == 'true'
        run: nix run .#deny

      # ------------------------------------------------------------------ 2. tests ---
      - name: Tests
        if: steps.classify.outputs.rust == 'true'
        run: nix build .#checks.x86_64-linux.nextest -L

      # ------------------------------------------------------------------ 3. build ---
      # Only now, and reusing the dependency artifacts the steps above already realised.
      - name: Release build (native)
        if: steps.classify.outputs.build == 'true'
        run: nix build .#sutura -L

      - name: Release build (aarch64, cross)
        if: steps.classify.outputs.build == 'true'
        run: nix build .#sutura-aarch64-unknown-linux-gnu -L -o result-aarch64

      - name: Assert each binary is the architecture requested
        if: steps.classify.outputs.build == 'true'
        run: |
          set -eu
          file result/bin/sutura result-aarch64/bin/sutura
          # A cross-compile that silently produced host binaries would otherwise pass.
          file result/bin/sutura         | grep -q 'x86-64'
          file result-aarch64/bin/sutura | grep -qE 'aarch64|ARM aarch64'

      - name: OCI image
        if: steps.classify.outputs.build == 'true'
        run: nix build .#oci -L -o result-oci

      - name: Load it and prove the binary runs
        if: steps.classify.outputs.build == 'true'
        run: |
          set -eu
          ./result-oci | docker load
          docker run --rm sutura:latest --version
          docker run --rm sutura:latest doctor
          docker image inspect sutura:latest --format 'digest: {{.Id}}'

      - uses: actions/upload-artifact@v4
        if: steps.classify.outputs.build == 'true'
        with:
          name: sutura-binaries
          path: |
            result/bin/sutura
            result-aarch64/bin/sutura
          if-no-files-found: error
