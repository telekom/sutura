# `minimal.yaml` with an explicit `image.tag` and the performance flag left at its default: the tag is used as is.
environment: production
security:
  accessToken:
    secretName: sutura-access-token
  metricsToken:
    secretName: sutura-metrics-token
  tlsTermination: ingress
image:
  tag: "pinned-tag"
config:
  base:
    security:
      identity: single-user
      single_user_because: "a test deployment one operator runs with their own credentials"
