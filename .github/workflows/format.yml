name: format

on:
  workflow_dispatch:
    inputs:
      expected_helper_sha:
        description: Exact reviewed helper commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: catalog-overlay-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-proof:
    runs-on: rust-mcp-16core
    timeout-minutes: 360
    env:
      EXPECTED_HELPER_SHA: ${{ inputs.expected_helper_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      NO_COLOR: "1"
      SUTURA_DOCKER_PROBE_TIMEOUT_SECS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the reviewed helper before checking out the product
        id: binding
        run: python3 .github/catalog-overlay-venue.py guard
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.binding.outputs.source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            keep-outputs = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - uses: $/.github/actions/nix-store-cache
        with:
          scope: ci
      - name: Run the bound native venue and complete mutation inventories
        working-directory: source
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#just nixpkgs#pixi nixpkgs#devenv nixpkgs#betterleaks \
            --command python3 -I ../.github/catalog-overlay-venue.py venue
      - name: Keep the venue, source, inventories and original exit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-overlay-proof
          path: |
            ${{ runner.temp }}/catalog-overlay-venue
            source/target/inbound-verifier-proof
            source/target/oracle-native-probe
            source/target/oracle-legacy-probe
          if-no-files-found: error
          retention-days: 14
