[package]
name = "sutura-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to a registry, and not shipped either: every consumer takes it as a
# DEV-dependency, so no artefact contains it. `sutura-dev` is the same shape one directory up.
publish = false
description = "Conformance packs: one set of test bodies over the ports, bound to an adapter by a macro."

[features]
default = []
compile = ["dep:sutura-semantic", "dep:sutura-sql", "dep:serde_json"]

[dependencies]
# The default pack family reaches only the ports. Compile packs opt into the compiler and renderer,
# never a catalog or data-system adapter; `check-boundaries` holds both that set and the feature.
#
# `agreement` is asked for here rather than by each consumer, and asking for it IS the point: what
# makes two answers the same answer is `sutura_domain::warehouse::agreement`'s to decide, and a pack
# that compared rows any other way would be the second comparison policy that record forbids. The
# feature is default-off in the domain and this crate is a dev-dependency everywhere, so nothing
# published gains it - the limit that module states about itself is unchanged.
sutura-domain = { workspace = true, features = ["agreement"] }
sutura-semantic = { workspace = true, optional = true }
sutura-sql = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

# The developer-workflow crate, for ONE test and one reason: `src/lib.rs` spells
# `SUTURA_DEV_REQUIRE_TIER` and its truthiness a second time, because `not_here` has to judge an
# absence and this crate may not reach the crate that publishes that decision - the harness rule in
# `xtask/src/boundaries/harness.rs` excludes the workflow crate from its NORMAL closure.
#
# **A dev-dependency is what that rule permits, by design and in its own header:** what may not
# happen is a pack BODY compiled against something, and a pack body is `src/`. So the duplication is
# pinned by `tests/bound.rs` against `sutura_dev::requirement::FORCE` and `requirement::decide`
# rather than left to drift, which is the shape `nix/with-tier.sh` records paying for once.
[dev-dependencies]
sutura-dev = { workspace = true }

[lints]
workspace = true
