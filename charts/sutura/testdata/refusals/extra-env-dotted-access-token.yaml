# The access token comes from an `extraEnv` variable with a `.` after `SECURITY`, which the binary
# reads as `security.access_token`, beside `direct`: the binary refuses to start
# (`NotFitToServe::DeploymentTokenSharesTheHeader`).
environment: production
security:
  metricsToken:
    secretName: sutura-metrics-token
  tlsTermination: ingress
config:
  base:
    security:
      inbound:
        mode: direct
        resource: https://sutura.example.com
        authorization_server: https://issuer.example.com
        key_set_file: /etc/sutura/inbound-keys/jwks.json
        algorithms: [RS256]
extraEnv:
  - name: SUTURA__SECURITY.ACCESS_TOKEN
    value: placeholder-access-token-long-enough
