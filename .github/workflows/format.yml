# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:
    inputs:
      operation:
        description: Check fuzz metadata or run both finishing tasks on the pinned source
        type: choice
        required: true
        options: [preflight, gates, chart-regenerate]
      expected_helper_sha:
        description: Exact helper commit for chart generation
        type: string
        required: false
      source_sha:
        description: Exact frozen source commit
        type: string
        required: true
      source_tree:
        description: Exact tree of the frozen source commit
        type: string
        required: true
      comparison_sha:
        description: Exact ancestor for the finishing comparison
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.operation || 'format' }}-${{ inputs.source_sha || 'format' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  format:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately
          # absent, for the reason security-audit.yml gives: with it, a pull request could add
          # a substituter and a trusted key and have CI fetch attacker-built store paths whose
          # signature verifies.
          extra_nix_config: |
            fallback = true

      # The candidate set is `git ls-files`, so the checkout above IS the input. `fetch-depth` is
      # left at its default: the script reads the working tree, not a diff against a base.
      - name: markdown, yaml, toml and python
        run: bash nix/format-text.sh check

  finishing-tasks:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'chart-regenerate'
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(inputs.operation == 'gates' && '["validate","ship-check"]' || '["preflight"]') }}
    runs-on: rust-mcp-16core
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/reclaim-disk

      - name: Open KVM for the full validation gate
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: $/.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Run the requested source checks
        working-directory: source
        env:
          OPERATION: ${{ inputs.operation }}
          TASK: ${{ matrix.task }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          COMPARISON_SHA: ${{ inputs.comparison_sha }}
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_NET_OFFLINE CARGO_PROFILE_DEV_CODEGEN_BACKEND CARGO_UNSTABLE_CODEGEN_BACKEND
          export CARGO_TERM_COLOR=never NO_COLOR=1
          for revision in "$SOURCE_SHA" "$SOURCE_TREE" "$COMPARISON_SHA"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          done
          finishing_plan_path="$RUNNER_TEMP/finishing-plan.json"
          printf '{"source_sha":"%s","source_tree":"%s","comparison_sha":"%s"}\n' "$SOURCE_SHA" "$SOURCE_TREE" "$COMPARISON_SHA" > "$finishing_plan_path"
          case "$OPERATION:$TASK" in
            gates:validate|gates:ship-check|preflight:preflight) ;;
            *) exit 2 ;;
          esac
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#just nixpkgs#pixi nixpkgs#devenv nixpkgs#betterleaks --command python3 -I ../devco/inbound_verifier_proof.py "$TASK" "$finishing_plan_path"

      - name: Retain evidence and any generated changes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inbound-finishing-gates-${{ github.run_id }}-${{ matrix.task }}
          path: source/target/inbound-verifier-proof/
          if-no-files-found: error
          retention-days: 14

  # Task success is required here; independent acceptance still reads both exact-source packets.
  finishing:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.operation != 'chart-regenerate'
    needs: [finishing-tasks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every finishing task
        env:
          TASKS_RESULT: ${{ needs.finishing-tasks.result }}
        run: |
          set -eu
          test "$TASKS_RESULT" = success

  # Temporary generation operation on an isolated helper branch; never merge this helper.
  chart-generation:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'chart-regenerate'
    runs-on: rust-mcp-16core
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=
      - name: Bind and regenerate the accepted chart snapshot
        working-directory: source
        env:
          HELPER_SHA: ${{ inputs.expected_helper_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          COMPARISON_SHA: ${{ inputs.comparison_sha }}
        run: |
          set -euo pipefail
          [[ "$HELPER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .. rev-parse HEAD)" = "$HELPER_SHA"
          test "$GITHUB_SHA" = "$HELPER_SHA"
          test "$SOURCE_SHA" = 5d5b1da263e08a2aef5ca167b7ffb3a2385c1002
          test "$COMPARISON_SHA" = "$SOURCE_SHA"
          test "$SOURCE_TREE" = e7df4023c74665f40cad495a4630493bab0aa657
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(sha256sum ../devco/chart-generation-source.patch | cut -d ' ' -f 1)" = d2d87d85aa63ed75bb0b458c619ea3f82ad5fed1a1e261f5cbd04365d619ec32
          git apply --unidiff-zero --index ../devco/chart-generation-source.patch
          test "$(git write-tree)" = "$SOURCE_TREE"
          evidence="$GITHUB_WORKSPACE/chart-generation-evidence"
          mkdir -p "$evidence"
          printf '%s\n' "$HELPER_SHA" > "$evidence/helper-sha.txt"
          printf '%s\n' "$SOURCE_SHA" > "$evidence/source-base.txt"
          printf '%s\n' "$SOURCE_TREE" > "$evidence/source-tree.txt"
          git diff --cached --binary --full-index > "$evidence/reconstructed-source.patch"
          for name in reading-workers-network-policy reading-workers worker-pool-ipv6 worker-pool-network-policy worker-pool-operator-digest worker-pool; do
            nix run .#helm -- template test-release charts/sutura -f "charts/sutura/testdata/values/pool/$name.yaml" > "charts/sutura/testdata/golden/pool/$name.yaml"
          done
          chart_tmp="$(mktemp -d)"
          trap 'rm -rf "$chart_tmp"' EXIT
          cp -r charts/sutura "$chart_tmp/unguarded"
          sed -i '/include "sutura.requireOffHostPosture"/d' "$chart_tmp/unguarded/templates/deployment.yaml" "$chart_tmp/unguarded/templates/configmap.yaml"
          for name in reading-workers-group-without-sources reading-workers-undeclared-source reading-workers-without-inbound; do
            nix run .#helm -- template test-release "$chart_tmp/unguarded" -f "charts/sutura/testdata/refusals/$name.yaml" > "charts/sutura/testdata/golden/unguarded/$name.yaml"
          done
          printf '%s\n' charts/sutura/testdata/golden/pool/reading-workers-network-policy.yaml charts/sutura/testdata/golden/pool/reading-workers.yaml charts/sutura/testdata/golden/pool/worker-pool-ipv6.yaml charts/sutura/testdata/golden/pool/worker-pool-network-policy.yaml charts/sutura/testdata/golden/pool/worker-pool-operator-digest.yaml charts/sutura/testdata/golden/pool/worker-pool.yaml charts/sutura/testdata/golden/unguarded/reading-workers-group-without-sources.yaml charts/sutura/testdata/golden/unguarded/reading-workers-undeclared-source.yaml charts/sutura/testdata/golden/unguarded/reading-workers-without-inbound.yaml | sort > "$evidence/expected-paths.txt"
          git diff --name-only | sort > "$evidence/actual-paths.txt"
          diff -u "$evidence/expected-paths.txt" "$evidence/actual-paths.txt"
          mapfile -t goldens < "$evidence/expected-paths.txt"
          git diff --binary --full-index -- "${goldens[@]}" > "$evidence/generated.patch"
          sha256sum "${goldens[@]}" > "$evidence/generated.sha256"
          tar -cf "$evidence/generated-goldens.tar" "${goldens[@]}"
      - name: Judge the generated chart
        working-directory: source
        run: |
          set -euo pipefail
          status=0
          nix run .#just -- chart 2>&1 | tee "$GITHUB_WORKSPACE/chart-generation-evidence/chart.log" || status=$?
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/chart-generation-evidence/chart-pipeline.exit"
          exit "$status"
      - name: Retain exact generated source and chart verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-generation-${{ github.run_id }}
          path: chart-generation-evidence/
          if-no-files-found: warn
          retention-days: 14
