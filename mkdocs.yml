# The documentation site: mkdocs-material, versioned by mike.
#
# The versioning is the reason for this stack rather than mdBook. mike publishes each version
# into its own directory on `gh-pages`, maintains `versions.json`, renders the root redirect and
# feeds the version selector Material already ships - all of which had to be hand-written under
# mdBook. `docs/publishing.md` describes the resulting layout.
#
# Every tool named here comes from pixi's isolated `docs` environment - `pixi run --frozen -e
# docs docs` locally, `nix run .#pixi -- run --frozen -e docs docs` in CI, where a bare tool
# name exits 127. There is deliberately no mkdocs and no mike flake app: mike shells out to
# mkdocs, and composing the two through nix produced an mkdocs that could not import
# `pymdownx`. One resolver owns the interpreter and everything in it, and nothing here comes
# from pip or npm.

site_name: sutura
site_description: Answers questions about data as the person or agent asking, using metric definitions somebody certified.
site_url: https://telekom.github.io/sutura/
repo_url: https://github.com/telekom/sutura
repo_name: telekom/sutura
# `docs/` is the source directory, the mkdocs default, and there is no extra level under it:
# a page's path is its URL, which is the layout every mkdocs reader expects. `docs/.tools/`
# holds the API page generator; mkdocs skips a dot-prefixed path, so it is never published.
edit_uri: edit/main/docs/

theme:
  name: material
  # Material otherwise emits a stylesheet link to fonts.googleapis.com and a preconnect to
  # fonts.gstatic.com on every page. `false` drops both and falls back to the system font stack,
  # which is what keeps the site self-contained - it has to render behind a proxy with no direct
  # egress, and a page that phones a CDN also puts every reader in that CDN's logs. Checked by
  # `cargo xtask check-docs`, because the default is the insecure one and nothing else would say.
  font: false
  # Paths relative to the docs directory. `cargo xtask check-docs` fails if either stops
  # resolving: mkdocs renders a broken image for a missing logo rather than failing the build.
  logo: assets/sutura.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.tooltips
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Auto, following the reader's system preference, and first so it is the default.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # `custom` for both, because Telekom magenta is not one of Material's named palette
    # colours. The values live in docs/css/telekom.css, per scheme, with the measured contrast
    # ratio beside each - see the comment at the top of that file for why they differ.
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # `CONTRIBUTING.md` and `CHANGELOG.md` live at the repository root, because that is where
  # GitHub looks for them, and are rendered into a page by an INCLUDE rather than a copy -
  # `docs/contributing.md` and `docs/changelog.md` are the include and nothing else, so the
  # prose has one home and cannot drift.
  #
  # `base_path` is the repository root: snippets resolve against the process working
  # directory, which is where mkdocs is invoked from, and `.` is already the default - it is
  # written out because the include reaches OUTSIDE the docs directory and that is the part a
  # reader will not assume. `check_paths` is the one that matters: it defaults to false, and
  # a snippet that stops resolving is then published as the literal `--8<--` line on a green
  # build.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  # Mermaid, through Material's own SuperFences integration rather than the mermaid2 plugin,
  # because that integration is what hands mermaid the active colour scheme - a bare CDN import
  # leaves every diagram stuck in light mode.
  #
  # KNOWN GAP, and this comment used to state the opposite: Material does NOT bundle the mermaid
  # library. Its own bundle loads `https://unpkg.com/mermaid@11/dist/mermaid.min.js` at runtime,
  # confirmed by watching the request. So a diagram does not render for a reader with no direct
  # egress - the reader `theme.font: false` exists to protect - and degrades to a code block.
  # Fixing it means vendoring mermaid under docs/assets and pointing Material at it. Until then
  # a mermaid fence is a nice-to-have, and no page may depend on one to be understood.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Explicit, not derived from filenames. A nav that falls out of directory order silently
# reorders itself when a page is added, and `cargo xtask check-docs` checks this list against
# the files on disk in both directions.
# Four sections and an arc: what this is, then what the words mean and how to run it, then how
# to work on it, then what to look up. The split that matters is Guide against Development -
# the flat list this replaced put a contributor's environment setup and a reader's first
# question at the same level, and a reader had no way to tell which pages were addressed to
# them.
#
# No section index pages. Material would render one for each section heading, and `index.md`
# already routes to every page here; three more landing pages would restate that table three
# times. `navigation.indexes` stays on because a section index is worth having as soon as a
# section has enough pages to need one.
nav:
  - Introduction: index.md
  - Guide:
    - Concepts: concepts.md
    - Getting started: getting-started.md
    - Questions and answers: qa.md
    - The agent prompt: agent-prompt.md
  - Development:
    - Contributing: contributing.md
    - The CRAP gate: crap.md
    - Building without direct egress: enterprise-mirrors.md
    - Publishing the docs: publishing.md
  - Reference:
    - Architecture: architecture.md
    - Serving over HTTP: serving.md
    - The implementation plan: implementation-plan.md
    - The plan, BigQuery: implementation-plan-bigquery.md
    - The plan, identity and services: implementation-plan-identity-and-services.md
    - Decisions:
      - First-party semantic models: adr/0001-first-party-semantic-models.md
      - A closed vocabulary for measures: adr/0002-a-closed-vocabulary-for-measures.md
      - DataFusion for local execution: adr/0003-datafusion-for-local-execution.md
      - A named escape hatch for authored SQL: adr/0004-a-named-escape-hatch-for-authored-sql.md
      - A refusal carries a status: adr/0005-a-refusal-carries-a-status.md
      - Several databases behind one data system, declined: adr/0006-several-databases-behind-one-data-system.md
      - Federating across different data systems: adr/0007-federating-across-different-data-systems.md
      - A credential per leg, for the calling subject: adr/0008-a-credential-per-leg-for-the-calling-subject.md
      - The plan, from one source to many and one user to many: adr/0009-the-plan-from-one-source-to-many.md
      - Transport security for a source: adr/0010-transport-security-for-a-source.md
      - Pluggable by declaration: adr/0011-pluggable-by-declaration.md
      - Conformance packs for inputs and adapters: adr/0012-conformance-packs-for-inputs-and-adapters.md
      - A raw SQL tool, off by default: adr/0013-a-raw-sql-tool-off-by-default.md
      - How a caller proves who it is: adr/0014-how-a-caller-proves-who-it-is.md
      - An authenticated metrics endpoint: adr/0015-an-authenticated-metrics-endpoint.md
      - What DataHub can carry: adr/0016-what-datahub-can-carry.md
      - What a BigQuery test runs against: adr/0017-what-a-bigquery-test-runs-against.md
      - What the BigQuery wire is built from: adr/0018-what-the-bigquery-wire-is-built-from.md
      - A table outside the connection's own dataset: adr/0019-a-table-outside-the-connections-dataset.md
    - API:
      - api/index.md
      - sutura-domain: api/sutura-domain.md
      - sutura-catalog-local: api/sutura-catalog-local.md
      - sutura-semantic: api/sutura-semantic.md
      - sutura-sql: api/sutura-sql.md
      - sutura-exec-datafusion: api/sutura-exec-datafusion.md
      - sutura-exec-duckdb: api/sutura-exec-duckdb.md
      - sutura-exec-bigquery: api/sutura-exec-bigquery.md
      - sutura-app: api/sutura-app.md
      - sutura-config: api/sutura-config.md
      - sutura-runtime: api/sutura-runtime.md
      - sutura-http: api/sutura-http.md
      - sutura-mcp: api/sutura-mcp.md
      # Dev tooling rather than shipped surface, and last for that reason. It is here because it
      # IS a library now - `xtask`'s compose tier depends on its `Scope`, so that is a real contract
      # and a change to it belongs in a reviewable diff. Narrowing the gate instead was considered
      # and rejected: every first-party crate is `publish = false`, so a `publish` predicate would
      # exempt all fourteen and check nothing.
      - sutura-dev: api/sutura-dev.md
  - Changelog: changelog.md

extra:
  version:
    provider: mike
    # Which version the "you are reading an old version" banner points at. `latest` is the
    # alias mike moves onto each release.
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/telekom/sutura

extra_css:
  - css/telekom.css

# With `mkdocs build --strict` every one of these becomes an error. `omitted_files` is what
# makes a page that is in no nav entry fail the build, which is the same rule check-docs
# enforces without needing a Python environment.
validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

watch:
  - mkdocs.yml
