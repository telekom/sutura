      - uses: $/.github/actions/reclaim-disk

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # 31.11.5
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: $/.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Commit through normal hooks and export the source bundle
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          unset BASH_ENV CARGO_UNSTABLE_CODEGEN_BACKEND CARGO_PROFILE_DEV_CODEGEN_BACKEND
          export EVIDENCE="$RUNNER_TEMP/catalog-relationships-source-commit"
          export MESSAGE="$EVIDENCE/commit-message.txt"
          test "$(git --no-optional-locks write-tree)" = "$EXPECTED_TREE"
          nix shell --inputs-from . nixpkgs#just nixpkgs#pixi nixpkgs#devenv nixpkgs#betterleaks --command bash -euo pipefail <<'BUILD' 2>&1 | tee "$EVIDENCE/normal-hooks.log"
          devenv --profile hooks shell bash -euo pipefail <<'COMMIT'
          snapshot() {
              local out="$EVIDENCE/$1"
              mkdir "$out"
              cp "$(git --no-optional-locks rev-parse --git-path index)" "$out/index.raw"
              git --no-optional-locks ls-files --stage -z > "$out/index.entries.z"
              git --no-optional-locks ls-files -z > "$out/tracked.paths.z"
              git --no-optional-locks ls-tree -rz --full-tree "$EXPECTED_TREE" > "$out/tree.manifest.z"
              git --no-optional-locks write-tree > "$out/index.tree"
              git --no-optional-locks rev-parse HEAD > "$out/HEAD"
              git --no-optional-locks status --porcelain=v1 --untracked-files=all > "$out/status.txt"
              git --no-optional-locks diff --binary --full-index > "$out/unstaged.diff"
              git --no-optional-locks diff --cached --binary --full-index > "$out/staged.diff"
              tar --create --gzip --file "$out/tracked.tar.gz" --null --no-recursion --files-from "$out/tracked.paths.z"
          }
          test -z "${SKIP:-}${PREK_SKIP:-}${PRE_COMMIT_ALLOW_NO_CONFIG:-}"
          test -z "${GIT_CONFIG_COUNT:-}${GIT_CONFIG_PARAMETERS:-}"
          test -z "$(git --no-optional-locks config --get core.hooksPath || true)"
          test "$(git --no-optional-locks rev-parse HEAD)" = "$SOURCE_PARENT"
          test "$(git --no-optional-locks write-tree)" = "$EXPECTED_TREE"
          git --no-optional-locks diff --exit-code
          snapshot before
          trap 'COMMIT_STATUS=$?; trap - EXIT; printf "%s\n" "$COMMIT_STATUS" > "$EVIDENCE/normal-commit.status"; snapshot after; exit "$COMMIT_STATUS"' EXIT
          pixi run --frozen hooks-install
          hook_dir="$(git --no-optional-locks rev-parse --git-path hooks)"
          mkdir "$EVIDENCE/hooks"
          for stage in pre-commit commit-msg pre-push; do
              test -x "$hook_dir/$stage"
              cp "$hook_dir/$stage" "$EVIDENCE/hooks/$stage"
          done
          test -z "$(git --no-optional-locks config --get core.hooksPath || true)"
          {
              rustc --version
              cargo --version
              cargo deny --version
              pixi --version
              devenv --version
          } > "$EVIDENCE/versions.log" 2>&1
          git --no-optional-locks commit -F "$MESSAGE" 2>&1 | tee "$EVIDENCE/commit.log"
          git --no-optional-locks cat-file commit HEAD > "$EVIDENCE/commit.raw"
          sed '1,/^$/d' "$EVIDENCE/commit.raw" > "$EVIDENCE/commit-message.actual"
          cmp "$MESSAGE" "$EVIDENCE/commit-message.actual"
          COMMIT
          cmp "$EVIDENCE/before/index.entries.z" "$EVIDENCE/after/index.entries.z"
          cmp "$EVIDENCE/before/tracked.paths.z" "$EVIDENCE/after/tracked.paths.z"
          tar --compare --gzip --file "$EVIDENCE/before/tracked.tar.gz" 2>&1 | tee "$EVIDENCE/tracked-compare.log"
          hooks=(
              'cargo fmt'
              'cargo clippy (-D warnings, all features)'
              'structural gates'
              'cargo check (changed packages only)'
              'copy/paste detection (jscpd)'
              'detect hardcoded secrets (CI is authoritative)'
              'conventional commit subject'
          )
          for hook in "${hooks[@]}"; do
              grep -F "$hook" "$EVIDENCE/commit.log" | grep -Eq '\.+Passed$'
          done
          if grep -Eq '^run-gate: SKIPPED|^format-text: SKIPPED|not on PATH - skipped|skipped - no nix' "$EVIDENCE/commit.log"; then
              exit 1
          fi
          commit="$(git --no-optional-locks rev-parse HEAD)"
          git --no-optional-locks rev-list --parents -n 1 HEAD > "$EVIDENCE/parents.txt"
          test "$(cat "$EVIDENCE/parents.txt")" = "$commit $SOURCE_PARENT"
          test "$(git --no-optional-locks rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git --no-optional-locks write-tree)" = "$EXPECTED_TREE"
          test -z "$(git --no-optional-locks status --porcelain=v1 --untracked-files=all)"
          git --no-optional-locks diff --binary --full-index "$SOURCE_PARENT" HEAD > "$EVIDENCE/source.diff"
          ref="refs/heads/$SOURCE_BRANCH"
          git --no-optional-locks bundle create "$EVIDENCE/source.bundle" "$ref" "^$SOURCE_PARENT"
          git --no-optional-locks bundle verify "$EVIDENCE/source.bundle" 2>&1 | tee "$EVIDENCE/bundle-verify.log"
          test "$(git --no-optional-locks bundle list-heads "$EVIDENCE/source.bundle")" = "$commit $ref"
          remote_main="$(git --no-optional-locks ls-remote --refs origin refs/heads/main)"
          remote_topic="$(git --no-optional-locks ls-remote --refs origin "refs/heads/$SOURCE_BRANCH")"
          remote_parent="$(git --no-optional-locks ls-remote --refs origin "refs/heads/$SOURCE_PARENT_BRANCH")"
          printf '%s\n%s\n%s\n' "$remote_main" "$remote_topic" "$remote_parent" > "$EVIDENCE/remote-bindings.after"
          cmp "$EVIDENCE/remote-bindings.before" "$EVIDENCE/remote-bindings.after"
          bundle_sha="$(sha256sum "$EVIDENCE/source.bundle" | cut -d ' ' -f 1)"
          printf '{"consumer":"%s","helper":"%s","commit":"%s","parents":["%s"],"tree":"%s","ref":"%s","message_sha256":"%s","bundle_sha256":"%s","run_id":"%s","attempt":"%s"}\n' \
              "$CONSUMER" "$EXPECTED_HELPER_SHA" "$commit" "$SOURCE_PARENT" "$EXPECTED_TREE" "$ref" \
              "$MESSAGE_SHA" "$bundle_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$EVIDENCE/receipt.json"
          BUILD
          (cd "$EVIDENCE" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > "$EVIDENCE/SHA256SUMS"

      - name: Retain the source, normal hooks and bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-relationships-source-commit-${{ github.run_id }}
          path: ${{ runner.temp }}/catalog-relationships-source-commit
          if-no-files-found: error
          retention-days: 14
