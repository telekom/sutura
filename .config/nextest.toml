# nextest, and the one thing this repository needs from it: a SKIP that a reader can see.
#
# The problem is structural rather than a setting anybody forgot. libtest has three outcomes - pass,
# fail, ignored - and `#[ignore]` is decided at compile time, so a test that discovers at RUNTIME
# that there is nothing to test against has no honest result to return. It returns a pass. nextest
# captures the output of a passing test by default, so the notice explaining what did NOT run goes
# nowhere, and a run that connected to no service reads exactly like one that connected to all of
# them.
#
# `AGENTS.md` is unambiguous that a false pass is the worst outcome a check has, so the override
# below shows the output of the tests that can decline. It is scoped rather than global: turning
# `success-output` on for the whole suite would print every passing test's stdout and the notice
# would be lost in it, which is the same failure with more scrolling.
#
# The other half of the honesty lives in the code, not here: `sutura_dev::provisioned` writes the
# notice with SKIPPED in the first column - the same word `xtask dev-up` prints when it declines -
# and `sutura_dev::requirement` decides whether declining is allowed at all. Where the tier is
# required, the test fails instead, and a failure needs no configuration to be visible.
#
# This is the only nextest configuration in the repository. `checks.nextest` in `flake.nix` reads the
# whole tree, so it picks this up too, which is deliberate: the nix sandbox has no docker socket, so
# those tests skip there and the log should say so.

# `github.com/telekom/sutura#692`: without a ceiling, one cell that never reaches a `.await` again -
# a mispaired OS thread, a barrier nobody releases - holds the whole run open until a human notices
# and sends SIGTERM by hand, which is what happened at 3293s. `terminate-after = 5` on a 60s period
# is 5 minutes, the number `#692`'s own thread states as the bar for ANY test in this suite. The
# slowest regular cells are postgres (18s) and mcp (120s), a long way from the ceiling. What
# actually sets the margin is the gas family: it measured 174.6s max in three later runs under
# normal CI load (lines 84-85 below), so the margin from the default 300s ceiling is 1.7x for
# those cells. One note: the composite gas cell at the foot of this file measured 410.3s in one
# host-starved run (line 81) but gets a doubled 600s ceiling from the override it sits beside,
# re-added 10-02 after it hit the 300s ceiling in two runs. That single cell is not the one the
# 1.7x above rests on; it carries its own ceiling - so "any test" here means every test but that
# composite cell, the per-gate falsifier cells (360s) and the four 10,000-entry cap cells
# (600s), both at the foot of this file. (No other gas cell has a special ceiling.)
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# For complete mutation runs: NEXTEST_PROFILE=nofailfast just test.
# A PASS line proves a cell ran; this profile still honors filters and ignored tests.
[profile.nofailfast]
fail-fast = false
# Named explicitly rather than left to fall through to `[profile.default]`: the ceiling above is
# the point of this profile too, and a custom profile that trusted inheritance while default-only
# fell through to `#692`'s hang is the reader's confusion this is written to stay out of.
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
# The compose tier's own integration test, which is the only target that can decline. Matched by
# binary rather than by test name, so a test added to that file is covered without a second edit -
# and nothing else in the workspace becomes noisy.
filter = "binary(provisioned)"
success-output = "immediate"

[[profile.default.overrides]]
# The conformance packs, which decline for a SECOND reason and are the header above's argument
# applied to it. `sutura_conformance::Outcome::Declined` is an adapter saying *I cannot do this* -
# `dry_run` answering `NotAsked`, so nothing was checked before the rows were read - and libtest has
# no outcome for that either, so it returns a pass. Without this override the engine's pre-flight
# cell is byte-for-byte the shape of the DuckDB cell for the same behaviour, where DuckDB prepared
# the statement and the engine checked nothing. Measured on a green `just test`: `DECLINED` appeared
# zero times in 2696 lines.
#
# It carries the census line too, and that is the half worth naming: the packs print behaviours over
# cases per adapter precisely because a suite that reports a ratio it has not earned is the failure
# this repository has already met twice - and a ratio discarded on every green run is not read at
# all.
#
# Scoped by BINARY, like the override above: `conformance` is every adapter's binding and `bound` is
# the packs crate's own, so a behaviour added to a pack is covered without a second edit here.
filter = "binary(conformance) + binary(bound)"
success-output = "immediate"

# The fixtures that spawn a REAL nested `cargo nextest run` over a throwaway crate: the gas family,
# `causality::tests` and `rot`'s kill half (the filter also queues `causality::tests`' one pure
# cell). Capped as a GROUP instead of given a longer ceiling. Measured 09-30 at host load 30-60. In
# the dev shell: 1.4-16.1s per gas cell run alone, and 0.1-21.1s for the family at nextest's default
# of one thread per CPU (15 here). In the red `checks.nextest` run the family took 5.7-410.3s, 11 of
# 30 under 60s, and `run_dispatches_to_the_claim_arm` hit the 300s ceiling above; the 410.3s cell
# survived only under a 600s override since removed. That run was host-starved - a pure in-memory
# cell took 9.0s against 0.13s after - so it is not an A/B. Two at a time, three later
# `checks.nextest` runs put the slowest at 118s, 70s and 174.6s (next 61.5s, on a heavier host), so
# the measured margin to the 300s ceiling is 1.7x, not a guarantee. A queued cell has not started
# and the ceiling counts from start (checked on a scratch crate), so the ceiling is unchanged.
# Limits: the sandbox's per-cell slowdown is measured, not explained, and only kept from
# compounding. `github.com/telekom/sutura#1179`, paired runs on one aarch64-darwin host: one gas cell
# took 1.2-4.4x longer in the nix build than in the dev shell, median 1.5x; a no-op exec took
# 6.5-6.8x longer at host load of about 29 and above and 1.25-1.6x at 14-23, flat in the dev
# shell. The darwin sandbox, the inherited crane environment, the cc-wrapper and the
# work-directory volume are ruled out; build-user priority and a host security agent are
# candidates, not shown. Linux CI and a full-suite run in both venues were not measured. This
# bounds the fixtures against each other, not against a loaded host; and in the dev shell it is
# pure cost - 73s for the family against 23s unconstrained.
[test-groups]
real-cargo = { max-threads = 2 }
entry-cap = { max-threads = 1 }
paired-gate = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary_id(xtask::bin/xtask) & (test(/^causality::gas_tests::/) | test(/^causality::tests::/) | test(/^causality::rot::tests::the_kill_half_/))"
test-group = "real-cargo"

[[profile.default.overrides]]
# The one gas cell that runs TWO nested `causality::run`s (the composite `Pass` shape and its
# laundered `Fail` twin), so it gets two cells' ceiling: 600s. Measured 10-02 at host load 50-75 on
# 15 CPUs: it hit the 300s ceiling in two `checks.nextest` runs on unrelated branches (300.26s,
# 300.28s) while the rest of the family passed. Limit: this widens one cell's bound against a
# starved host; it explains nothing about the starvation, and splitting the cell in two would
# restore one run per cell under the default ceiling.
filter = "binary_id(xtask::bin/xtask) & test(=causality::gas_tests::a_claim_cell_and_an_ordinary_test_are_both_proven)"
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
# The live BigQuery cells, which query a real dataset. Measured in the first green run
# (37156913407): the corpus cell 77.9s over 45 questions, 1.7s each, and the differential-agree cell
# 78.3s; every other cell under 22s, and each question carries its own 30s deadline. Two 60s periods
# = 120s, 1.5x the slowest measured. Limit: run 37152629712's corpus cell hit the 300s default with
# no output, about 4x the measurement and not diagnosed - this ceiling surfaces that sooner, it does
# not explain it. `&`, not `+` (a union), so it matches only the cells named `bigquery` and not every
# sutura-app test (the ignored provisioning cell gets it too, at 10-15s); everywhere but the
# `bigquery-conformance` job they skip in milliseconds. The job's one other cell, the two-fact
# differential, has its own override below, because offline it executes real legs.
filter = "package(sutura-app) & test(/bigquery/)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# The two-fact differential, the `bigquery-conformance` job's one live cell not named `bigquery`.
# Measured: 15.4s live (run 37267669815), with `bigquery` available; 3.6s in
# `just validate`, where it executes the `DuckDB`, `DataFusion` and tier legs and skips `BigQuery`.
# 120s is about 8x the live measurement. Limit: that is one live run and one offline run.
filter = "package(sutura-app) & test(=tests::leg_executing_data_systems_agree_with_the_engines_and_a_legless_one_is_refused)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# The per-gate falsifier cells, each running one real gate twice (the control, then one
# own-rule edit) over a scratch copy of the tree. They were one cell that ran all four gates back
# to back and hit the 300s ceiling three times in one day (300.04s, 300.08s, 300.02s, five lanes
# sharing the host). Split, a cell is one gate's work: measured at load 16-22, 5.7s (warm-start),
# 99s (venues), 176s (guidance), 24s (boundaries, after its cargo-metadata cache; 222s before it).
# The group runs them one at a time, because four cargo-heavy gates racing a loaded host is what
# stretched the old cell; 360s is 2x the slowest measured. Limits: a cell's floor is about twice
# its gate, so a host slower than 2x this measurement still reds one; the ceiling and the
# serialising move the threshold, they do not remove the gate's own cost. The pin cell
# `the_paired_set_is_the_four_gates_with_a_cell_each` needs neither.
#
# Each cell is named exactly, and nextest accepts a filter that matches nothing: a typo or a rename
# would put a cell back on the 300s default and out of the group with no red anywhere (measured:
# `warm_start` -> `warmstart` listed 3 of 4, exit 0). `the_nextest_group_names_exactly_the_per_gate_cells`
# compares these names with the cell functions' own. Limit: it reads this text, not nextest's
# evaluation of it, and it does not read `binary_id` or the `paired-gate` definition.
filter = "binary_id(xtask::bin/xtask) & (test(=falsifier::tests::check_boundaries_passes_its_real_inputs_and_refuses_one_violation) | test(=falsifier::tests::check_docs_passes_its_real_inputs_and_refuses_one_violation) | test(=falsifier::tests::check_guidance_passes_its_real_inputs_and_refuses_one_violation) | test(=falsifier::tests::check_venues_passes_its_real_inputs_and_refuses_one_violation) | test(=falsifier::tests::check_warm_start_passes_its_real_inputs_and_refuses_one_violation))"
test-group = "paired-gate"
slow-timeout = { period = "60s", terminate-after = 6 }

# STOPGAP, same flake family: the four 10,000-entry cap cells each write 10,001 files, so they are
# bound by file I/O (and by the endpoint scanner, which reads every new file), not by CPU. One lane
# alone measured the two sutura-bounded-read cells at 89.4s each when run together; under disk
# contention from several lanes the four reach 180-300s and hit the default ceiling. The group runs
# them one at a time and the override gives each 600s. Limits: serialising does not remove their
# I/O or the scan, and a wider ceiling only MOVES the threshold - a host slow enough still reds
# it. The real fix is the area-d change that bounds these cells by work rather than by wall clock.
[[profile.default.overrides]]
filter = "(binary_id(sutura-bounded-read) & test(/^walk::walk_entry_cap_tests::(a_tree_with_more_entries_than_the_cap_is_refused|a_tree_at_exactly_the_cap_is_walked)$/)) | (binary_id(sutura-catalog-okf::refusals) & test(=tests::a_directory_with_more_than_max_entries_is_refused)) | (binary_id(sutura-catalog-datacontract::refusals) & test(=tests::a_directory_with_more_than_ten_thousand_entries_is_refused))"
test-group = "entry-cap"
slow-timeout = { period = "60s", terminate-after = 10 }
