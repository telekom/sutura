name: Measure host utilisation
description: |-
  Reports the host shape (cpus, memory, model), the nix `max-jobs`/`cores` pair a
  derivation actually runs with, and the mean/peak CPU-busy the host sustained
  while a command ran. This is the only runner-utilisation telemetry CI has: the
  repo's `runner-probe` is dispatch-only and measures its own arms, GitHub
  exposes no per-job runner CPU, and the cache report is about store paths, not
  cores. Sampling is from /proc/stat jiffy deltas once a second - a ~0 cost side
  effect, no new derivation.

  The report goes to BOTH the job summary and stdout. The summary is the human-facing
  table; the stdout line is the machine-readable one, because no REST endpoint serves a
  step summary and so a summary-only number cannot be quoted by a later run.
inputs:
  run:
    description: The command (nix build) whose host utilisation to sample.
    required: true
  label:
    description: Short label for the report block, e.g. the step it wrapped.
    required: false
    default: sampled build
runs:
  using: composite
  steps:
    - name: Sample host utilisation across the run
      shell: bash
      env:
        MEASURE_RUN: ${{ inputs.run }}
        MEASURE_LABEL: ${{ inputs.label }}
      run: |-
        set -euo pipefail
        SAMPLES="$RUNNER_TEMP/cpu.samples"
        : > "$SAMPLES"
        sample() {
          # /proc/stat first line: cpu  user nice system idle iowait irq softirq steal ...
          read -r _ rest < /proc/stat
          # shellcheck disable=SC2086
          set -- $rest
          # sum every field except idle (3) and iowait (4)
          local total=0 i idx=0
          for i in "$@"; do
            if [ "$idx" -ne 3 ] && [ "$idx" -ne 4 ]; then total=$((total+i)); fi
            idx=$((idx+1))
          done
          printf '%s %s\n' "$total" "${3:?}"
        }
        prev_total=-1 prev_idle=-1
        {
          while :; do
            read -r total idle < <(sample)
            if [ "$prev_total" -ge 0 ]; then
              dt=$((total-prev_total)); di=$((idle-prev_idle))
              # Guard against a counter wrap or a degenerate sample.
              if [ "$dt" -gt 0 ]; then
                printf '%s\n' "$((100*(dt-di)/dt))" >> "$SAMPLES"
              fi
            fi
            prev_total=$total; prev_idle=$idle
            sleep 1
          done
        } &
        SAMPLER=$!
        trap 'kill "$SAMPLER" 2>/dev/null || true' EXIT

        # Let the first sample land before the measured command starts.
        sleep 1
        # The measured command's failure must NOT skip the report: a build that died is exactly
        # when its utilisation is worth reading. Its status is carried to the end of the step so
        # the step still fails, after reporting, rather than instead of it.
        status=0
        eval "$MEASURE_RUN" || status=$?

        kill "$SAMPLER" 2>/dev/null || true
        wait "$SAMPLER" 2>/dev/null || true

        cpus=$(nproc)
        mem=$(awk '/MemTotal/ { printf "%.0f", $2/1024/1024 }' /proc/meminfo)
        model=$(awk -F: '/^model name/ {print $2; exit}' /proc/cpuinfo | sed 's/^ *//')
        [ -n "$model" ] || model=$(awk -F: '/^Hardware|^Model/ {print $2; exit}' /proc/cpuinfo | sed 's/^ *//')
        cores=$(nix config show cores 2>/dev/null || echo "auto")
        maxjobs=$(nix config show max-jobs 2>/dev/null || echo "auto")
        n=0 sum=0 peak=0
        while read -r v; do
          [ -n "$v" ] || continue
          n=$((n+1)); sum=$((sum+v)); [ "$v" -gt "$peak" ] && peak=$v
        done < "$SAMPLES"
        if [ "$n" -gt 0 ]; then mean=$((sum/n)); else mean=0; peak=0; fi

        {
          echo "### Host utilisation - $MEASURE_LABEL"
          echo
          echo "| cpus | memory (GiB) | model | nix max-jobs | nix cores | samples | mean CPU-busy | peak CPU-busy |"
          echo "|---|---|---|---|---|---|---|---|"
          echo "| $cpus | ${mem:-?} | ${model:-unknown} | $maxjobs | $cores | $n | $mean% | $peak% |"
        } >> "$GITHUB_STEP_SUMMARY"

        # MIRRORED TO STDOUT BECAUSE A STEP SUMMARY IS NOT QUOTABLE. There is no REST endpoint
        # that serves `$GITHUB_STEP_SUMMARY`, so the table above appears in a browser and in
        # nothing a later run, script or agent can read - the numbers had zero occurrences in a
        # full job log. The job log IS served, so one line goes there too, in the same
        # `<instrument>(<scope>): ` shape `host-probe` and `nix-store-cache` already use, and as
        # `key=value` pairs rather than a table so extraction needs no column parsing.
        # No hostname, runner id or token is printed, and `model` is deliberately left to the
        # summary: free text from /proc/cpuinfo is not what a measurement greps for.
        printf 'measure-host(%s): cpus=%s mem=%sGiB max-jobs=%s cores=%s samples=%s mean=%s%% peak=%s%% status=%s\n' \
          "$MEASURE_LABEL" "$cpus" "${mem:-0}" "$maxjobs" "$cores" "$n" "$mean" "$peak" "$status"

        exit "$status"
