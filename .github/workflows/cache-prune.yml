# Delete unreachable pull-request and merge-queue build caches, daily and on request.
#
# GitHub already prunes an entry idle for 7 days and evicts least-recently-used entries when the
# repository allocation fills. THE ALLOCATION ITSELF IS NOT READABLE FROM HERE, and no number in
# this header should be read as one: `repos/{owner}/{repo}/actions/cache/usage-policy` answers 404
# even to a token with repository ADMIN, measured 2026-09-11, and `orgs/{org}/actions/cache/usage`
# answers 403 without `admin:org`. #472 read 100 GB from the repository endpoint and #512 read
# 10 GB from it; it is gone now and neither can be confirmed or refuted, so the headroom is an open
# question for the repository owner rather than an input to this file's budget. Note that the two
# readings cannot both describe a hard resident ceiling: this header's own 2026-09-01 line measures
# 32.95 GB RESIDENT, and 2026-09-12 measures 17.27 GB, so whatever `max_cache_size_gb: 10` meant on
# 2026-09-09 it was not a cap that occupancy stayed under. This file exists
# because LRU cannot know that a ref has become unreachable and will never read its cache again -
# which is true at every allocation.
#
# The Actions cache is scoped by ref. A cache written by a pull request lands under
# `refs/pull/<n>/merge` and can only ever be restored by a run on that same ref, so once the
# pull request is closed it is dead weight. A merge-queue cache under
# `refs/heads/gh-readonly-queue/<base>/pr-<n>-<sha>` has the same lifetime. LRU does not know that,
# so both compete with the `refs/heads/main` entries every future pull request can restore.
#
# Measured on 2026-09-01: 18,688 entries used 32.95 GB. Closed pull requests held 2.63 GB and
# closed merge-queue refs another 3.27 GB; `main` held 11.17 GB and stays explicitly out of scope.
# Actions cache has no per-ref retention setting, so this workflow cannot promise exactly three days
# for `main`; it never deletes those entries and leaves their lifetime to GitHub's idle/LRU policy.
#
# SINCE #490 A PULL REQUEST WRITES NOTHING, so this sweep has less to do rather than more, and the
# 800-deletion budget is deliberately NOT raised: it exists to stay under the hourly API limit, not
# to keep up with volume. MEASURED - the number #472's Proposal 2 §2 asked for: on
# 2026-09-12 the whole repository held SIX entries totalling 17.27 GB and all six were
# `refs/heads/main` - zero `refs/pull/<n>/merge` and zero queue scopes. AND THIS SWEEP'S OWN OUTPUT
# AGREES rather than only the inventory: across every run that reached the `prune` job on 2026-09-10
# and 2026-09-11, 32 of 32 printed `nothing to prune: no cache belongs to a closed pull request or
# queue ref`. The observed deletion rate is therefore ZERO per day against a budget of 800 - not a
# rate approaching it - so a raised budget would protect nothing. Eight further runs in that window
# are `cancelled` and never reached the job, which is why the denominator is 32 and not 40.
# Accumulation is not what the budget is holding back either: the close-event trigger fired 20 times
# on 2026-09-11 alone, on top of the daily schedule.
#
# AND A TRAP IN THE MEASUREMENT, recorded because it is cheap to fall into twice:
# `actions/cache/usage` reported `active_caches_count: 4` against those six rows while its
# `active_caches_size_in_bytes` matched their sum to the byte. The COUNT field is the unreliable
# one - page `actions/caches` and count the rows, and never conclude an entry was evicted from a
# count that disagrees with a listing.
#
# `main`'s entries are not prune candidates here at all - the ref parser below returns no number
# for `refs/heads/main` - so there is nothing for a higher budget to protect.
#
# There IS a second, non-ref-scoped carrier behind this: `docs/adr/0027` provisioned this
# repository's own `sutura.cachix.org`, which every workflow installer names as a substituter, so a
# pull request substitutes what that cache serves in addition to restoring these `main` entries. The
# entries this file spares are still what the Actions store cache restores - the full /nix/store
# closure a ref does not have cached anywhere else - while `sutura.cachix.org` carries the share of
# the closure its own publish path realised.
#
# WHAT IS NOT MEASURABLE FROM OUTSIDE, and the reason no budget change is proposed with a number
# beside it: `orgs/{org}/actions/cache/usage` needs `admin:org` and answers 403 without it, so the
# repository allocation and its headroom cannot be re-read by a contributor. The 100 GB above is
# #472's measurement, not one taken here.
#
# What it costs when it is wrong: re-running CI on an already-closed pull request loses this
# Actions-cache restore. It still substitutes what the binary caches serve and compiles the rest.
# That is slower and still correct, and it is rare enough to be the right trade against evicting
# main's cache.
#
# A close event deletes only the exact `refs/pull/<n>/merge` scope. `pull_request_target` supplies
# the base workflow and a write token for forks too; this is safe because no pull-request code or
# data is executed. Queue refs need a repository-wide scan, so the daily sweep collects those.
#
# THIRD-PARTY ACTIONS: none - and no checkout either. This reads and deletes through the API
# and never needs the source tree.
name: cache-prune

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] fixed base script executes no PR code or data
    types: [closed]
  schedule:
    # Daily at 04:23 UTC and off the hour: scheduled jobs on the hour queue behind everyone else's.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Maximum caches to delete when the API budget allows"
        required: false
        default: "800"
      dry_run:
        description: "List what would be deleted, delete nothing"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  # Two runs would race to delete the same ids and the loser would log 404s as failures.
  group: cache-prune
  cancel-in-progress: false

jobs:
  prune:
    # `ubuntu-latest`: API reads, deletes and shell. No checkout, no nix, no cargo - nothing here
    # touches a store, so the Rust runner had nothing to offer it.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write        # delete cache entries
      pull-requests: read   # decide which pull requests are still open
    steps:
      - name: Delete caches belonging to closed pull requests and queue refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CLOSED_PR: ${{ github.event.pull_request.number }}
          # `inputs` is empty on a schedule, so both carry the scheduled default.
          BUDGET: ${{ inputs.budget || '800' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          # A non-numeric budget would reach `head -n` and abort there with a worse message.
          case "$BUDGET" in ''|*[!0-9]*) echo "::error::budget must be a number, got '$BUDGET'"; exit 1 ;; esac
          case "$CLOSED_PR" in ''|*[!0-9]*) [ -z "$CLOSED_PR" ] || { echo "::error::invalid pull request number '$CLOSED_PR'"; exit 1; } ;; esac

          pr_number_for_ref() {
            case "$1" in
              refs/pull/*/merge)
                number="${1#refs/pull/}"; number="${number%/merge}"
                ;;
              refs/heads/gh-readonly-queue/*/pr-*-*)
                number="${1##*/pr-}"; number="${number%%-*}"
                ;;
              *) return 1 ;;
            esac
            case "$number" in ''|*[!0-9]*) return 1 ;; esac
            printf '%s\n' "$number"
          }

          # ponytail: the parser lives here; these three shapes are its whole contract.
          test "$(pr_number_for_ref refs/pull/123/merge)" = 123
          test "$(pr_number_for_ref refs/heads/gh-readonly-queue/main/pr-456-deadbeef)" = 456
          test -z "$(pr_number_for_ref refs/heads/main || true)"

          : > open.txt
          if [ -z "$CLOSED_PR" ]; then
            # The sweep ABORTS if this fails. An empty result caused by an API failure must not
            # read as "nothing is open" and mark every pull-request cache dead.
            if ! gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" \
                   --jq '.[].number' > open.txt 2>err.txt; then
              echo "::error::could not list open pull requests; refusing to guess what is closed"
              cat err.txt >&2
              exit 1
            fi
            echo "open pull requests: $(paste -sd, open.txt || echo none)"
          fi

          # A close event asks for one exact ref. Scheduled/manual sweeps page the whole repository.
          : > all.tsv
          page=1
          while :; do
            args=(--method GET "repos/${REPO}/actions/caches" -f per_page=100 -f "page=${page}")
            [ -z "$CLOSED_PR" ] || args+=(-f "ref=refs/pull/${CLOSED_PR}/merge")
            gh api "${args[@]}" --jq \
              '.actions_caches[] | [.id, .ref, .size_in_bytes, .key] | @tsv' > page.tsv
            [ -s page.tsv ] || break
            cat page.tsv >> all.tsv
            page=$((page + 1))
          done
          total=$(wc -l < all.tsv)
          echo "cache entries: ${total}"

          # DEAD = scoped to a pull-request or merge-queue ref whose pull request is not open.
          # The parser is an allowlist: `refs/heads/main` and every tag scope return no number,
          # so no rule elsewhere has to protect them.
          : > dead.tsv
          while IFS=$'\t' read -r id ref size key; do
            n="$(pr_number_for_ref "$ref" || true)"
            [ -n "$n" ] || continue
            if [ -n "$CLOSED_PR" ] && [ "$n" != "$CLOSED_PR" ]; then continue; fi
            if grep -qx "$n" open.txt; then continue; fi
            printf '%s\t%s\t%s\t%s\n' "$size" "$id" "$ref" "$key" >> dead.tsv
          done < all.tsv

          if [ ! -s dead.tsv ]; then
            echo "nothing to prune: no cache belongs to a closed pull request or queue ref"
            exit 0
          fi

          # Largest first, so a budgeted run frees the most space it can.
          sort -rn -o dead.tsv dead.tsv
          dead_count=$(wc -l < dead.tsv)
          # awk and not bc: bc is not guaranteed on a runner image and this needs no precision.
          dead_bytes=$(awk -F'	' '{s+=$1} END{print s+0}' dead.tsv)
          echo "dead: ${dead_count} entr(ies), $((dead_bytes / 1000000)) MB"

          limit="$BUDGET"
          if [ "$DRY_RUN" != "true" ]; then
            # Listing is one request per 100 entries and deletion is one request per entry. Read
            # the remaining allowance AFTER listing, then leave room for other repository jobs.
            remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
            case "$remaining" in ''|*[!0-9]*) echo "::error::invalid API allowance '$remaining'"; exit 1 ;; esac
            available=$((remaining > 100 ? remaining - 100 : 0))
            if [ "$limit" -gt "$available" ]; then
              echo "::notice::capping ${limit} requested deletions at ${available} to reserve 100 API calls"
              limit="$available"
            fi
          fi
          head -n "$limit" dead.tsv > batch.tsv
          batch_bytes=$(awk -F'	' '{s+=$1} END{print s+0}' batch.tsv)

          {
            echo "### cache-prune"
            echo
            echo "| | entries | size |"
            echo "| --- | --- | --- |"
            echo "| dead (closed pull requests and queue refs) | ${dead_count} | $((dead_bytes / 1000000)) MB |"
            echo "| this run | $(wc -l < batch.tsv) | $((batch_bytes / 1000000)) MB |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run: would delete $(wc -l < batch.tsv) entr(ies), $((batch_bytes / 1000000)) MB"
            # `head` FIRST. Written the other way round - `cut ... | head -20` - `head` closes
            # the pipe after 20 lines, `cut` dies of EPIPE, and `pipefail` turns a display line
            # into a failed workflow. It did: the first dry run classified 2047 dead entries
            # correctly and then exited 1 on `cut: write error: Broken pipe`. Reading the file
            # with `head` and piping ITS bounded output onward cannot break a pipe.
            head -n 20 batch.tsv | cut -f2,3
            exit 0
          fi

          # One DELETE per entry - the API has no bulk form that does not also need a key - so
          # the budget exists to stay clear of the hourly request limit for GITHUB_TOKEN. A
          # failed delete is a warning and not a failure: the usual cause is an entry GitHub
          # evicted between the listing and here, which is the outcome we wanted anyway.
          ok=0; fail=0
          while IFS=$'\t' read -r size id ref key; do
            if gh api -X DELETE "repos/${REPO}/actions/caches/${id}" --silent 2>/dev/null; then
              ok=$((ok + 1))
            else
              fail=$((fail + 1))
              echo "::warning::could not delete cache ${id} (${ref}); it may already be gone"
            fi
          done < batch.tsv

          echo "deleted ${ok}, failed ${fail}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deleted ${ok}, failed ${fail}." >> "$GITHUB_STEP_SUMMARY"
          if [ "$dead_count" -gt "$(wc -l < batch.tsv)" ]; then
            echo "::notice::$((dead_count - $(wc -l < batch.tsv))) dead entr(ies) remain; raise the budget or wait for the next run"
          fi
