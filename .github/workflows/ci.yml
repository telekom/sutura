# CI enters the SAME devenv shell developers use. If it installed tools its own way,
# "works on my machine" would simply reappear as "works in CI".
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cranelift is a DEVELOPMENT-only codegen backend: it changes codegen, so a bug that
  # reproduces under one backend and not the other is a real possibility. CI and every
  # shipped artifact use the default backend, always.
  SUTURA_CODEGEN_BACKEND: default

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # One command, the same one a developer runs. Each gate asserts a value or a count,
      # never merely a zero exit code.
      - name: gates
        run: devenv shell gates

  # Cross-built binaries for linux x86_64 and aarch64, on every PR — so a
  # cross-compilation break is found now rather than at release time.
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Build ${{ matrix.target }}
        run: nix build .#sutura-${{ matrix.target }} -L

      - name: Prove it is the architecture we asked for
        run: |
          set -eu
          bin=$(find ./result/bin -type f | head -1)
          file "$bin"
          file "$bin" | grep -qiE "$( [ '${{ matrix.target }}' = 'aarch64-unknown-linux-gnu' ] && echo 'aarch64|ARM aarch64' || echo 'x86-64' )"

      - uses: actions/upload-artifact@v4
        with:
          name: sutura-${{ matrix.target }}
          path: result/bin/sutura
          if-no-files-found: error

  # M0's acceptance is not "the workflow exists" — it is that an artifact exists and runs.
  release-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Build the OCI image
        run: nix build .#oci -L

      - name: Load it and prove the binary runs
        run: |
          ./result | docker load
          docker run --rm sutura:latest --version
          docker run --rm sutura:latest doctor

      - name: Record the digest
        run: docker image inspect sutura:latest --format '{{.Id}}'
