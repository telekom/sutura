# A reading worker group named with an upper-case letter and an underscore: the name becomes the
# group's Service name, which is a DNS label.
environment: production
security:
  metricsToken:
    secretName: sutura-metrics-token
  inbound:
    keySetSecretName: sutura-inbound-keys
workerPool:
  enabled: true
  issuer:
    name: sutura-nodes
readingWorkers:
  groups:
    Orders_Readers:
      sources: [orders]
      catalogs:
        - name: model
          kind: markdown
          dir: /srv/sutura/catalog
          data_dir: /srv/sutura/data
          version: "1"
config:
  base:
    security:
      identity: multi-user
      inbound:
        mode: direct
        resource: https://sutura.example.com
        authorization_server: https://issuer.example.com
        algorithms: [RS256]
    sources:
      orders:
        kind: files
        data_dir: /srv/sutura/orders
        posture: shared-service-user
        acknowledged_because: "a directory this deployment owns"
