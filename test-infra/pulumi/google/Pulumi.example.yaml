# Template stack config. COPY to Pulumi.<stack>.yaml with real values and NEVER commit the copy:
# project/pool/principal identifiers are disclosure on the public repo. .gitignore excludes
# Pulumi.*.yaml below, so only this example is tracked.
config:
  sutura-google-test-infra:project: "your-test-project-id"
  sutura-google-test-infra:region: "europe-west1"
  # Optional - a concrete compute region/zone for the GCP provider, so it does not need
  # compute.regions.list (which a BigQuery/IAM-only key lacks). Dataset location stays `region`.
  sutura-google-test-infra:provider_region: "europe-west3"
  sutura-google-test-infra:provider_zone: "europe-west3-a"
  sutura-google-test-infra:dataset: "sutura_identity"
  sutura-google-test-infra:table: "fact_events"
  # The dataset/table the CI BigQuery acceptance+corpus legs run against (the pre-existing,
  # already-populated acceptance dataset). The stack grants its CI service account dataEditor
  # here, and exports these two plus the CI key for the GitHub environment's secrets/vars.
  sutura-google-test-infra:ci_dataset: "sutura_dev"
  sutura-google-test-infra:ci_table: "acceptance"
  # The second, disposable dataset the cross-resource writable venue loads into (its dimension),
  # distinct from `dataset` and `ci_dataset` - the program refuses a collision. Created by the stack
  # and granted dataEditor to the CI service account.
  sutura-google-test-infra:cross_dataset: "your-cross-dataset-id"
  # The CROSS dataset must be created in the SAME location as the acceptance dataset it joins
  # (`ci_dataset`) - BigQuery refuses a cross-location join. Location is immutable on a dataset,
  # so changing this value recreates the venue on the next `up`.
  sutura-google-test-infra:cross_dataset_location: "europe-west1"
  sutura-google-test-infra:group_column: "segment"
  # The grouping value each principal's row access policy grants, and the rows the stack seeds. The
  # two-principal acceptance cell compares an answer against these, so they are exported to the
  # GitHub environment rather than written into the repository - and they must DIFFER, which the
  # cell refuses a fixture over rather than discovering as an equal pair of row sets.
  sutura-google-test-infra:principal_a_rows: "a"
  sutura-google-test-infra:principal_b_rows: "b"
  sutura-google-test-infra:workload_pool_id: "sutura"
  sutura-google-test-infra:workload_provider_id: "oidc"
  # An OIDC issuer whose JWKS Google STS can fetch, minting the JWT subject tokens
  # the caller presents. `accounts.google.com` means the JWTs are Google id_tokens; a
  # self-hosted IdP names its own issuer.
  sutura-google-test-infra:workload_issuer_uri: "https://accounts.google.com"
  # Optional - defaults to the pool's own STS audience (project NUMBER, not id):
  # //iam.googleapis.com/projects/<project-number>/locations/global/workloadIdentityPools/sutura/providers/oidc
  # Set this only to accept EXTRA audiences on top of that default; the default is appended
  # automatically if a configured list omits it.
  # sutura-google-test-infra:workload_allowed_audiences: '["//iam.googleapis.com/projects/<project-number>/locations/global/workloadIdentityPools/sutura/providers/oidc"]'
  # The served-caller proof's SECOND provider on the same pool - `__main__.py`'s own header on it
  # says what travels where. The provider id is any name not already used under this pool.
  sutura-google-test-infra:served_proof_provider_id: "served-proof"
  # The PUBLIC half of a fixed RSA signing key, as a JWKS JSON string - computed OFFLINE by
  # `nix/served-proof-jwks.sh` from a private key generated once and held ONLY as a CI secret
  # (`SUTURA_SERVED_PROOF_SIGNING_KEY`), never here and never applied by this repository's own
  # automation. The `kid` inside it MUST be the literal `served-proof-signing-key-1` -
  # `__main__.py` and `nix/served-proof-tier.nix` both hardcode that string and have to agree on it
  # by hand, since neither file can read the other's source.
  # sutura-google-test-infra:served_proof_jwks_json: '{"keys":[{"kty":"RSA","use":"sig","alg":"RS256","kid":"served-proof-signing-key-1","n":"...","e":"AQAB"}]}'
