  # #1280: `Test causality` AS ITS OWN JOB. It was the last step of `ci` and the one `ci` waited on
  # after everything else had finished, 175 s when it compiled and 9 s when nothing was separable
  # (run 37610275316, run 37606732243). Here it starts beside `ci` and no longer adds to it.
  #
  # THE CONDITION IS THE STEP'S OLD ONE, read off a different job: `rust` and not a push, with `rust`
  # taken from `classify` (#983's second classification) because a job-level `if:` can
  # only read a job that finished before it. `ci-aggregate` holds run-or-fail against `ci`'s OWN
  # `rust` - `needs.ci.outputs.rust` - so the two classifications may disagree and fail closed, as
  # `keycloak-served-test`'s do: `ci` selects and this job does not is a RED aggregate, this job
  # wider than `ci` runs a gate nobody asked for. Nothing here has a `chore(release):` clause: that
  # commit exists only on a push, and this job never runs on one - neither step ran on a push in
  # `ci` either, both carried `!= 'push'`. The step moved verbatim, so its `push` arm stays
  # unreachable, as it was in `ci`, and stays in the file because `xtask`'s fixture runs it.
  #
  # WHAT THIS GIVES UP, stated next to the claim:
  #   * FAIL-FAST. A red causality no longer stops the rest of `ci`, and a red `ci` no longer stops
  #     causality. Both report; `ci-aggregate` is the only place the two meet.
  #   * THE GATING HOP. The step was gated by the required `ci` context; this job is gated by the
  #     required `ci-aggregate` context, through the shell that reads `needs.causality.result`.
  #   * THE WARM TARGET. The two shipped-feature steps, then in `ci`, used to leave
  #     `target/causality-target` warm for this gate. Here the directory holds only what
  #     `cargoWarmStart` unpacks from the store, and the gate compiles the rest.
  #   * ITS OWN SETUP: waiting for `classify`, then checkout, disk and Nix.
  causality:
    needs: [classify]
    if: github.event_name != 'push' && needs.classify.outputs.rust == 'true' && needs.classify.outputs.causality_reused != 'true'
    runs-on: rust-mcp-16core
    # 60: well past the 175-291 s the gate has measured, below `ci`'s 75 and the merge queue's 90.
    timeout-minutes: 60
    outputs:
      reusable: ${{ steps.measure.outputs.reusable }}
    permissions:
      contents: read
    # `ci`'s own group stops a superseded pull-request run; it does not reach this job, so without
    # its own the old run would keep a runner for the whole gate. `oracle-tier`'s shape.
    concurrency:
      group: causality-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate diffs against the base commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      # EXACTLY ONE INSTALLER PER EVENT, `ci`'s pattern and for its reason (#980).
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # 32.0.0
        if: github.event_name != 'pull_request'
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # 32.0.0
        if: github.event_name == 'pull_request'
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org https://sutura-prs.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens= sutura-prs.cachix.org-1:UTZrp8XfnC5a3XIvdtADv3/s+vQ686Ac7doOEu2Gizw=

      # `ci`'s `Resolve the base to compare against`, cut to the one arm this job needs. A pull
      # request derives its own base inside `Test causality`, and a push never reaches this job. A
      # merge-queue entry is one squash commit on top of the entries ahead of it, so `HEAD^` is the
      # state this entry is queued on - `ci`'s step argues why a merge-base would instead walk back
      # through every batched entry (#876). Not a copy a gate can compare: the two arms agree by
      # review alone. A HEAD with any parent count but one leaves the base empty, and the step below
      # then says so in a warning rather than measuring something wider.
      - name: Resolve the base for a merge-queue entry
        id: base
        if: github.event_name == 'merge_group'
        run: |
          set -eu
          parents="$(git show -s --format=%P HEAD)"
          read -r parent extra <<< "$parents"
          if [ -n "$parent" ] && [ -z "$extra" ]; then
            base="$parent"
          else
            echo "merge_group HEAD does not have exactly one parent (${parents:-<none>}); falling open" >&2
            base=""
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # A changed test must fail against base behaviour and pass with the change. Compiles
      # twice in a worktree, so it needs git history and a writable tree.
      #
      # EXIT 3 IS "I MEASURED NOTHING", and this step is the one place that decides what this
      # venue does with it. Both of the gate's inconclusive answers used to be exit 0, so a
      # required check went green over no evidence and no reader of the check could tell - see
      # `github.com/telekom/sutura#307` and `xtask/src/main.rs`'s `Verdict::Inconclusive`. They
      # exit 3 now, which fails any consumer that does not know the code; this one KNOWS it and
      # continues, because the changes that land there are legitimate (a harness move, a changed
      # public signature that a held-at-HEAD test file calls) and a gate that reddens correct
      # work gets disabled.
      #
      # WHAT CONTINUING COSTS, stated because a green step is exactly what #307 is about: the
      # job is still green on an inconclusive run, and the two surfaces below do NOT reach the
      # pull-request conversation. `$GITHUB_STEP_SUMMARY` renders on the workflow RUN SUMMARY
      # page - that is what the variable is for - and a `::warning` with no `file=`/`line=` is a
      # PATH-LESS annotation: the job log, the run's annotations list and the check run, anchored
      # wherever GitHub chooses rather than where this file chose. So a reviewer who reads only
      # the conversation sees one green check and nothing else, which is #307's failure mode with
      # one click removed rather than closed. An earlier version of this comment claimed the
      # conversation, and an overstated control is itself the defect.
      #
      # THE CONVERSATION MECHANISM IS IN THIS FILE, in the `crap-comment` job above: a
      # marker-keyed sticky comment posted from a separate job holding `pull-requests: write`,
      # shaped so a delivery failure cannot recolour the gate. Routing this verdict through it is
      # the open improvement, and it was not taken yet because the branch below HAS EXECUTED IN NO
      # VENUE - no run of this repository has reached exit 3 here - so a delivery path built on top
      # of it would be assumed rather than proven. What IS proven about this branch: exit 3 is a
      # unit test on `Verdict::exit_code`, `nix run` propagates 3 unchanged, and
      # `cargo xtask check-inconclusive` refuses a venue that suppresses it or declares a branch
      # it does not have.
      #
      # The substitute evidence (a mutation run, or the gate scoped per commit) is the author's,
      # and nothing here can check that they gave it. Cite the VERDICT LINE, never this step's
      # colour.
      - name: Test causality
        id: measure
        env:
          BASE: ${{ steps.base.outputs.base }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            # Ordinary CI keeps its merge checkout; causality measures only the topic's diff.
            merge_head=$(git rev-parse HEAD)
            read -r base_tip merged_pr extra <<< "$(git show -s --format=%P HEAD)"
            if [ -z "$PR_HEAD" ] || [ "$merged_pr" != "$PR_HEAD" ] || [ -n "$extra" ]; then
              echo "causality requires the checked-out merge's second parent to be the event's PR head" >&2
              exit 1
            fi
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "causality refuses to switch a checkout with tracked changes" >&2
              exit 1
            fi
            BASE=$(git merge-base "$base_tip" "$PR_HEAD")
            trap 'git checkout --detach "$merge_head" || exit 1' EXIT
            git checkout --detach "$PR_HEAD"
          elif [ "$EVENT" = push ]; then
            # THE CLASSIFICATION BASE IS TOO WIDE FOR THIS GATE. `base` above is the durable
            # marker, deliberately wide so an EVICTED run's commits stay covered (#561) - right
            # for `Classify the change`, wrong here: causality at this HEAD was already measured
            # at `HEAD^..HEAD` by its `merge_group` run at the SAME SHA (squash queue), and the
            # marker only advances on a green run, so re-measuring marker..HEAD reads every
            # undeclared test merged since as this commit's own and the red sustains itself.
            # Narrow to HEAD's single parent; any other parent count falls open like
            # `merge_group` above. `xtask workflows::step::causality` is the gate holding this
            # arm, and it is UNCONDITIONAL on push because that fixture exports neither
            # `GITHUB_REF_NAME` nor `DEFAULT_BRANCH` - a branch-filtered arm would never execute
            # there. `on:` above already restricts push to the default branch.
            parents="$(git show -s --format=%P HEAD)"
            read -r parent extra <<< "$parents"
            if [ -n "$parent" ] && [ -z "$extra" ]; then
              BASE="$parent"
            else
              echo "push HEAD does not have exactly one parent (${parents:-<none>}); falling open" >&2
              BASE=""
            fi
          fi
          if [ -z "$BASE" ]; then
            echo "::warning title=Test causality::No usable base ref, so this step is green over NOTHING RUN - not a red-before-green verdict. Read the base-resolution step above for why none was resolved."
            echo "no usable base ref; causality not checked"
            exit 0
          fi
          status=0
          log=$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ci-causality.XXXXXXXX")
          set -o pipefail
          nix run .#causality -- --since "$BASE" 2>&1 | tee "$log" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning title=Test causality was INCONCLUSIVE::The gate reached no verdict about this change - this step is green over NO red-before-green evidence. Read the verdict line in the log and require a mutation run, or the gate scoped per commit."
            {
              echo "### Test causality: INCONCLUSIVE"
              echo
              echo "The gate ran and measured nothing (exit 3), so this green step is not coverage."
              echo "Usual causes: a harness move, or a changed public signature a test file kept at"
              echo "HEAD calls. Ask for the substitute evidence - a mutation run, or \`just causality\`"
              echo "scoped per commit - and read the verdict line rather than this step's colour."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `xtask::causality::base::report` prints the Pass verdict as ONE line -
          # `xtask test-causality: ok - red on base, green on head (N of M added tests measured)` -
          # never as a standalone `measured:` line; that shape exists only on the INCONCLUSIVE and
          # FAILED remedy paths. The awk this replaced matched `$1 == "measured:"`, which no verdict
          # log has ever printed, so `reusable` was never set on any green run - `causality-receipt`
          # skipped on every pull-request run measured, and the merge queue re-ran causality on
          # every entry regardless of a matching patch.
          #
          # `nix run .#causality` prints everything on its way to that line - base test-output
          # tail, build stderr - and a PR author controls the diff that produces it, so an earlier
          # line in `$log` starting with `xtask test-causality:` cannot be trusted; only the LAST
          # one is this run's actual verdict. Full coverage (N == M, both non-zero) is required
          # before trusting it: a partial measurement (an orphaned or held-back test), the
          # uncounted `measured, of a total this gate could not establish` shape, or a `0 of 0`
          # collapse must not be read as proof.
          if [ "$EVENT" = pull_request ] && [ "$status" -eq 0 ]; then
            verdict=$(grep '^xtask test-causality:' "$log" | tail -1 || true)
            if [ "$verdict" = 'xtask test-causality: no changed tests - nothing to prove' ]; then
              echo 'reusable=true' >> "$GITHUB_OUTPUT"
            elif echo "$verdict" |
              grep -Eq '^xtask test-causality: ok - red on base, green on head \([1-9][0-9]* of [1-9][0-9]* added tests measured\)$'; then
              measured_n=$(sed -E 's/.*\(([0-9]+) of ([0-9]+) added.*/\1/' <<< "$verdict")
              measured_m=$(sed -E 's/.*\(([0-9]+) of ([0-9]+) added.*/\2/' <<< "$verdict")
              [ "$measured_n" = "$measured_m" ] && echo 'reusable=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          exit "$status"

  # #1280: `Postgres linked driver` AS ITS OWN JOB. It was the largest single step of `ci` - 209 s
  # in the scout's run, 1006-1434 s across six pull-request runs on 8a85f95c9's code (runs
  # 37605102469 to 37610275316) - and nothing after it in `ci` reads anything it produces: the step
  # has no `id:`, writes no `GITHUB_ENV` and leaves no file a later step opens.
  #
  # THE CONDITION IS THE STEP'S OLD ONE, `causality`'s way: `run_all`, `nix` or `data_source_postgres`
  # and not a push, with the first three read off `classify`'s `postgres_driver` (the OR is
  # taken there, as `driver_check`'s is) and `ci-aggregate` holding run-or-fail against `ci`'s own
  # copy of the same three. Same limit: a disagreement fails closed, never open.
  #
  # NOT THE `Postgres tier` STEP: that is a different check (the tier's state machine). This one
  # builds the adapter's tier-backed targets static for musl and starts its own tier inside the
  # sandbox, so the tier step above it in `ci` is no prerequisite and stays there. What it gives up
  # is `causality`'s list: fail-fast, the gating hop, its own setup.
  postgres-linked-driver:
    needs: [classify]
    if: github.event_name != 'push' && needs.classify.outputs.postgres_driver == 'true'
    runs-on: rust-mcp-16core
    # 60: past the 1434 s the step has measured, below `ci`'s 75 and the merge queue's 90.
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: postgres-linked-driver-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      # EXACTLY ONE INSTALLER PER EVENT, `ci`'s pattern and for its reason (#980).
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # 32.0.0
        if: github.event_name != 'pull_request'
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # 32.0.0
        if: github.event_name == 'pull_request'
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org https://sutura-prs.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens= sutura-prs.cachix.org-1:UTZrp8XfnC5a3XIvdtADv3/s+vQ686Ac7doOEu2Gizw=

      # THE SHIPPED POSTGRES PATH AGAINST THE LINKED DRIVER (`telekom/sutura#913` stage 2): every
      # `kind: postgres` source is answered over ADBC, and a musl release links the static driver,
      # so its libpq and static OpenSSL have to answer real statements somewhere. This builds the
      # adapter's tier-backed targets static for x86_64-musl with that archive and runs them
      # against the Postgres tier in the sandbox - `nix/shipped.nix`'s `linkedDriversTests` says
      # what that leaves out. Gated on the adapter, its driver and its tier.
      - name: Postgres linked driver
        run: nix build .#checks.x86_64-linux.postgres-linked-driver -L

  # #1696: THE SHIPPED FEATURE SET AS ITS OWN JOB, on #1280's terms. Its two steps were the only ones
  # in `ci` that touch cargo's default features - the set `nix/shipped.nix` publishes - and ran 74 s
  # and 85 s (pull-request medians, n=33) on `ci`'s path. Here they start beside `ci`.
  #
  # WHAT THEY ASK, unchanged by the move. Every compiling gate in `ci` passes `--all-features`,
  # `Clippy` and `Tests` included, so a `#[cfg(feature = ..)]` arm only ever compiled with the
  # feature ON was a hard error in the exact configuration a release builds while `ci` was green.
  # That shipped once, and its `cfg(not(..))` TEST was compiled by `ci` and executed by nothing at
  # all. Apps rather than checks for `Supply chain`'s reason: both shell out to cargo, which needs a
  # registry and a writable target directory the sandbox has not got.
  #
  # THE CONDITION IS THE STEPS' OLD ONE, read off `classify` for `causality`'s reason, and
  # `ci-aggregate` holds run-or-fail against `ci`'s OWN `rust`: `ci` selects and this job skips or
  # fails is a RED aggregate, never a silent pass. `rust` and not a narrower classification: the
  # package list is derived from `nix/shipped.nix`, which matches no area and so fails open to
  # `run_all` anyway.
  #
  # WHERE THE DEPENDENCY CLOSURE COMES FROM NOW. In `ci` the stage-2 graph had put it in the store
  # before either step. Nothing here does: each app's script embeds `cargoWarmStart`, so `.#deps`
  # (`ciArtifacts`) is an input of the app's derivation and its output path is in the script text,
  # and `nix run` realises it - from a substituter (`cachix-push.yml` publishes `.#deps`)
  # or by building it. A change that moves the closure
  # builds it here as well as in `ci`, on two runners at once.
  #
  # ADJACENT, AND THAT IS THE ONE THING THE ORDER DECIDES. The two ask cargo the SAME narrow
  # question - one shipped package, no feature flags - which the v2 resolver gives a narrower
  # feature set than the workspace-wide union `craneLib.buildDepsOnly` warmed, so about a third of
  # each dependency graph is compiled again. Whichever runs first pays that; the second reuses it
  # in this runner's `target/causality-target`. `xtask/src/default_features.rs` carries the
  # measurement and says why the recompile is the price of the question rather than a defect.
  #
  # THAT TARGET IS THIS JOB'S ALONE. `cargoWarmStart` unpacks the closure into a fresh runner's
  # `target/causality-target` and runs `nix/purge-baked-out-dirs.sh` itself, and nothing a step
  # here compiles reaches another job: `causality` unpacks its own on its own runner.
  #
  # WHAT NEITHER COVERS: the first stops at metadata and the second links the HOST triple only, so
  # the `cross` legs stay the authority on a musl LINK - and nothing here reaches a feature no
  # shipped binary enables, which is what the `--all-features` gates are for.
  #
  # WHAT THIS GIVES UP is `causality`'s list: fail-fast, the gating hop (required through
  # `ci-aggregate` now), and its own setup - `classify`, checkout, disk and Nix.
  shipped-features:
    needs: [classify]
    if: github.event_name != 'push' && needs.classify.outputs.rust == 'true'
    runs-on: rust-mcp-16core
    # 45: a cold closure fits in the 992 s a `ci` run rebuilding it took whole, and the steps add 159 s.
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: shipped-features-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      # EXACTLY ONE INSTALLER PER EVENT, `ci`'s pattern and for its reason (#980).
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # 32.0.0
        if: github.event_name != 'pull_request'
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # 32.0.0
        if: github.event_name == 'pull_request'
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org https://sutura-prs.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens= sutura-prs.cachix.org-1:UTZrp8XfnC5a3XIvdtADv3/s+vQ686Ac7doOEu2Gizw=

      # BOTH WRAPPED IN `measure-host` (#562): the cargo tail had no utilisation telemetry before,
      # so nobody could say whether it was CPU-bound or waiting. The `run:` is the gate's command;
      # only the wrapper is added.
      - name: The shipped feature set compiles and lints
        uses: $/.github/actions/measure-host
        with:
          label: shipped feature set compiles and lints
          run: |-
            set -eu
            nix run .#default-features

      # The other half. `xtask/src/default_feature_tests.rs` carries its own argument, its own
      # measurement - 2m18s reusing the warmed closure at the `ci` profile - and its own limits.
      - name: The shipped feature set runs its tests
        uses: $/.github/actions/measure-host
        with:
          label: shipped feature set runs its tests
          run: |-
            set -eu
            nix run .#default-feature-tests

  release-status:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    # The release critical path allows 210 minutes; leave room for its queued jobs too.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require publication and green release-tag workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash nix/wait-for-release.sh

  ci-aggregate:
    runs-on: ubuntu-latest
    needs: [
      ci,
      classify,
      identity-classify,
      qa-plan,
      qa,
      bigquery-conformance,
      e2e-datahub-adbc,
      causality,
      postgres-linked-driver,
      shipped-features,
      release-status,
    ]
    if: ${{ !cancelled() }}
    steps:
      - name: Aggregate the required checks
        env:
          CI_RESULT: ${{ needs.ci.result }}
          FAST_RESULT: ${{ needs.identity-classify.result }}
          PLAN_RESULT: ${{ needs.qa-plan.result }}
          QA_RESULT: ${{ needs.qa.result }}
          BQ_REQUIRED: ${{ contains(fromJSON(needs.qa-plan.outputs.suite-plan || '{}').selected, 'bigquery-conformance') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
          BQ_RESULT: ${{ needs.bigquery-conformance.result }}
          DATAHUB_REQUIRED: ${{ contains(fromJSON(needs.qa-plan.outputs.suite-plan || '{}').selected, 'e2e-datahub-adbc') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
          DATAHUB_RESULT: ${{ needs.e2e-datahub-adbc.result }}
          RELEASE_PUSH: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):') }}
          RELEASE_RESULT: ${{ needs.release-status.result }}
          CAUS_RESULT: ${{ needs.causality.result }}
          CAUS_REQUIRED: ${{ needs.ci.outputs.rust == 'true' && github.event_name != 'push' && needs.classify.outputs.causality_reused != 'true' }}
          PGD_RESULT: ${{ needs.postgres-linked-driver.result }}
          PGD_REQUIRED: ${{ (needs.ci.outputs.run_all == 'true' || needs.ci.outputs.nix == 'true' || needs.ci.outputs.data_source_postgres == 'true') && github.event_name != 'push' }}
          SHIP_RESULT: ${{ needs.shipped-features.result }}
          SHIP_REQUIRED: ${{ needs.ci.outputs.rust == 'true' && github.event_name != 'push' }}
        run: |
          set -eu
          fail() { echo "ci-aggregate: RED - $*"; exit 1; }
          require() {
            if [ "$2" = success ]; then return; fi
            if [ "$3" != true ] && [ "$2" = skipped ]; then return; fi
            fail "$1 reported '$2'"
          }
          require_when_selected() {
            if [ "$3" = true ] && [ "$2" != success ]; then
              fail "$1 must run but reported '$2'"
            fi
            require "$@"
          }
          require "fast checks" "$FAST_RESULT" true
          if [ "$RELEASE_PUSH" = true ]; then
            if [ "$RELEASE_RESULT" != success ]; then
              fail "release workflow did not publish this release: '$RELEASE_RESULT'"
            fi
            require ci "$CI_RESULT" false
            require "QA plan" "$PLAN_RESULT" false
            require QA "$QA_RESULT" false
          else
            require ci "$CI_RESULT" true
            require "QA plan" "$PLAN_RESULT" true
            require QA "$QA_RESULT" true
          fi
          require_when_selected bigquery-conformance "$BQ_RESULT" "$BQ_REQUIRED"
          require_when_selected e2e-datahub-adbc "$DATAHUB_RESULT" "$DATAHUB_REQUIRED"
          require_when_selected causality "$CAUS_RESULT" "$CAUS_REQUIRED"
          require_when_selected postgres-linked-driver "$PGD_RESULT" "$PGD_REQUIRED"
          require_when_selected shipped-features "$SHIP_RESULT" "$SHIP_REQUIRED"
          echo "ci-aggregate: ok - all required checks green"

  qa-receipt:
    name: QA checkout (${{ github.sha }})
    needs: [ci-aggregate]
    # The aggregate can pass with skipped ancestors, which suppress the implicit success().
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.ci-aggregate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Records the PR merge checkout after the required checks passed."

  causality-receipt:
    needs: [classify, identity-classify, causality]
    if: github.event_name == 'pull_request' && needs.causality.outputs.reusable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Records a conclusive PR causality verdict."
