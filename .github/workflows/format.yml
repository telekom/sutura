# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit
        required: true
        type: string
      operation:
        description: Hosted operation
        required: true
        type: choice
        options: [text, format, lock-format, lock-overlay, main-forward-lock, config, vectors, driver, native, native-base, native-claims, raw-base, raw-claims, raw-diagnostic, hygiene, lint, validate, arrow-source, postgres-diagnostic, oracle-split-claims, arrow-cache, arrow-lock]
      main_sha:
        description: Exact ancestor for main-forward-lock or native-base
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.operation }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  format:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.operation == 'text' && 'ubuntu-latest' || 'rust-mcp-16core' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - name: Open KVM
        if: inputs.operation == 'validate' || inputs.operation == 'postgres-diagnostic'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Record exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          mkdir -p /tmp/oracle-export
          git rev-parse HEAD > /tmp/oracle-export/source-sha
          git rev-parse 'HEAD^{tree}' > /tmp/oracle-export/source-tree
          python3 - <<'PYHASH'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          records = []
          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = Path(os.fsdecode(raw))
              symlink = path.is_symlink()
              data = os.fsencode(os.readlink(path)) if symlink else path.read_bytes()
              records.append({"path": str(path), "symlink": symlink, "sha256": hashlib.sha256(data).hexdigest()})
          Path("/tmp/oracle-export/source-files.json").write_text(json.dumps(records, indent=2) + "\n")
          PYHASH

      - name: Prepare exact unparser lock overlay
        if: inputs.operation == 'lock-overlay'
        run: |
          set -euo pipefail
          git show "$GITHUB_WORKFLOW_SHA:.github/scripts/oracle-limit-sort-lock.py" > /tmp/oracle-limit-sort-lock.py
          git show "$GITHUB_WORKFLOW_SHA:devco/oracle-limit-sort-product.patch.gz" > /tmp/oracle-export/lock-overlay-product.patch.gz
          git show "$GITHUB_WORKFLOW_SHA:.github/patches/oracle-limit-sort-product.json" > /tmp/oracle-export/lock-overlay-receipt.json
          sha256sum /tmp/oracle-limit-sort-lock.py > /tmp/oracle-export/lock-overlay-payload.sha256
          python3 /tmp/oracle-limit-sort-lock.py apply

      - name: Prepare exact main-forward generator inputs
        if: inputs.operation == 'main-forward-lock'
        env:
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "$MAIN_SHA")" = "$MAIN_SHA"
          git config user.name ci
          git config user.email user@example.com
          set +e
          git merge --no-ff --no-commit "$MAIN_SHA"
          status=$?
          set -e
          test "$status" -le 1
          conflicts=$(git diff --name-only --diff-filter=U)
          test -z "$conflicts" || test "$conflicts" = Cargo.lock
          git show HEAD:Cargo.lock > Cargo.lock
          git add Cargo.lock
          test -z "$(git ls-files -u)"
          printf '%s\n' "$MAIN_SHA" > /tmp/oracle-export/main-forward-sha
          git write-tree > /tmp/oracle-export/main-forward-input-tree
          git diff --cached --binary > /tmp/oracle-export/main-forward-input.patch
          python3 - <<'PYHASH'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          records = []
          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = Path(os.fsdecode(raw))
              symlink = path.is_symlink()
              data = os.fsencode(os.readlink(path)) if symlink else path.read_bytes()
              records.append({"path": str(path), "symlink": symlink, "sha256": hashlib.sha256(data).hexdigest()})
          Path("/tmp/oracle-export/main-forward-input-files.json").write_text(json.dumps(records, indent=2) + "\n")
          PYHASH

      - name: Resolve with the pinned generator
        if: inputs.operation == 'lock-format' || inputs.operation == 'lock-overlay' || inputs.operation == 'main-forward-lock'
        env:
          LOCK_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$LOCK_OPERATION" == lock-overlay ]]; then
            nix run .#cargo -- metadata --all-features --format-version 1 > /tmp/oracle-export/metadata.json
            nix run .#cargo -- metadata --manifest-path fuzz/Cargo.toml --format-version 1 > /tmp/oracle-export/fuzz-metadata.json
            python3 /tmp/oracle-limit-sort-lock.py check
          else
            nix run .#cargo -- metadata --format-version 1 > /tmp/oracle-export/metadata.json
          fi

      - name: Lock the canonical Arrow Git input
        if: inputs.operation == 'arrow-lock'
        run: |
          nix --version > /tmp/oracle-export/nix-version.txt
          nix flake update arrow-adbc-src

      - name: Format Rust with the pinned toolchain
        if: inputs.operation == 'format' || inputs.operation == 'lock-format' || inputs.operation == 'lock-overlay'
        run: |
          nix run .#cargo -- run -q -p xtask -- fmt
          nix run .#cargo -- run -q -p xtask -- text-hygiene --fix

      - name: Format text with the pinned tools
        if: inputs.operation == 'text' || inputs.operation == 'format' || inputs.operation == 'lock-format' || inputs.operation == 'lock-overlay'
        run: bash nix/format-text.sh fmt

      - name: Generate independently sourced modern NNE vectors
        if: inputs.operation == 'vectors'
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          oracle_source_root=$PWD
          git init /tmp/oracle-go-reference
          git -C /tmp/oracle-go-reference remote add origin https://github.com/sijms/go-ora.git
          git -C /tmp/oracle-go-reference fetch --depth=1 origin 62f8a42fe821414cec8fcacb1b877dfef836f798
          git -C /tmp/oracle-go-reference checkout --detach FETCH_HEAD
          test "$(git -C /tmp/oracle-go-reference rev-parse HEAD)" = 62f8a42fe821414cec8fcacb1b877dfef836f798
          git show "$GITHUB_WORKFLOW_SHA:.github/scripts/oracle-nne-vectors.go" > /tmp/oracle-nne-vectors.go
          sha256sum /tmp/oracle-nne-vectors.go > /tmp/oracle-export/vector-generator.sha256
          git -C /tmp/oracle-go-reference rev-parse HEAD > /tmp/oracle-export/reference-sha
          cd /tmp/oracle-go-reference/v3
          nix shell --inputs-from "$oracle_source_root" nixpkgs#go --command go run /tmp/oracle-nne-vectors.go > /tmp/oracle-export/nne-reference-vectors.txt
          test "$(wc -l < /tmp/oracle-export/nne-reference-vectors.txt)" -eq 54
          cat /tmp/oracle-export/nne-reference-vectors.txt

      - name: Measure config head and base
        if: inputs.operation == 'config'
        run: |
          set -euo pipefail
          nix run .#cargo -- test --locked -p sutura-config --all-features --test oracle_native_settings 2>&1 | tee /tmp/oracle-export/config-head-all.log
          nix run .#cargo -- test --locked -p sutura-config --no-default-features --test oracle_native_settings 2>&1 | tee /tmp/oracle-export/config-head-default.log
          nix run .#cargo -- test --locked -p sutura-runtime --all-features --test oracle_transport 2>&1 | tee /tmp/oracle-export/runtime-head.log
          oracle_source_root=$PWD
          git worktree add --detach /tmp/oracle-config-mutant HEAD
          git show "$GITHUB_WORKFLOW_SHA:.github/scripts/native-token-guard.patch" > /tmp/oracle-export/native-token-guard.patch
          sha256sum /tmp/oracle-export/native-token-guard.patch > /tmp/oracle-export/native-token-guard.sha256
          git -C /tmp/oracle-config-mutant apply /tmp/oracle-export/native-token-guard.patch
          cd /tmp/oracle-config-mutant
          set +e
          nix run .#cargo -- test --locked -p sutura-config --all-features --test oracle_native_settings tests::native_mode_cannot_carry_oracle_external_token_authentication -- --exact > /tmp/oracle-export/config-mutation.log 2>&1
          status=$?
          set -e
          cat /tmp/oracle-export/config-mutation.log
          test "$status" -ne 0
          grep -Fq 'tests::native_mode_cannot_carry_oracle_external_token_authentication ... FAILED' /tmp/oracle-export/config-mutation.log
          grep -q 'test result: FAILED' /tmp/oracle-export/config-mutation.log
          cd "$oracle_source_root"
          base=$(git merge-base HEAD origin/main)
          git worktree add --detach /tmp/oracle-config-base "$base"
          cp crates/sutura-config/tests/oracle_native_settings.rs /tmp/oracle-config-base/crates/sutura-config/tests/
          cp crates/sutura-runtime/tests/oracle_transport.rs /tmp/oracle-config-base/crates/sutura-runtime/tests/
          git -C /tmp/oracle-config-base add -N crates/sutura-config/tests/oracle_native_settings.rs
          git -C /tmp/oracle-config-base add -N crates/sutura-runtime/tests/oracle_transport.rs
          printf '%s\n' "$base" > /tmp/oracle-export/config-base-sha
          cd /tmp/oracle-config-base
          set +e
          nix run .#cargo -- test --locked -p sutura-config --all-features --test oracle_native_settings > /tmp/oracle-export/config-base-all.log 2>&1
          status=$?
          set -e
          cat /tmp/oracle-export/config-base-all.log
          test "$status" -ne 0
          grep -q 'test result: FAILED' /tmp/oracle-export/config-base-all.log
          for cell in \
            native_source_and_dictionary_require_their_own_reason_and_refuse_tls_material \
            legacy_source_and_dictionary_require_an_independent_reason_and_an_encrypted_mode \
            oracle_only_options_are_refused_on_other_sources_and_dictionary_dialects \
            native_mode_cannot_carry_oracle_external_token_authentication \
            orphan_oracle_acknowledgements_are_refused_even_without_the_oracle_feature; do
            grep -Fq "tests::$cell ... FAILED" /tmp/oracle-export/config-base-all.log
          done
          set +e
          nix run .#cargo -- test --locked -p sutura-runtime --all-features --test oracle_transport > /tmp/oracle-export/runtime-base.log 2>&1
          status=$?
          set -e
          cat /tmp/oracle-export/runtime-base.log
          test "$status" -ne 0
          grep -q 'native_oracle_startup_names_the_weaker_channel_and_independent_password_opt_in ... FAILED' /tmp/oracle-export/runtime-base.log
          grep -q 'test result: FAILED' /tmp/oracle-export/runtime-base.log

      - name: Measure reanchored Oracle claim mutations
        if: inputs.operation == 'config'
        run: |
          set -euo pipefail
          oracle_source_root=$PWD
          git worktree add --detach /tmp/oracle-claim-mutants HEAD
          cd /tmp/oracle-claim-mutants
          export CARGO_TARGET_DIR="$oracle_source_root/target"
          cells=(
            a_listener_redirect_to_an_address_nobody_declared_is_refused
            a_verified_oracle_source_opens_tls_before_any_tns_packet
            an_oracle_catalog_with_an_unreadable_password_file_is_refused_naming_it
            the_oracle_reader_holds_the_declared_caps_or_the_documented_defaults
            the_oracle_reader_refuses_a_schema_or_predicate_column_that_is_not_an_identifier
          )
          for cell in "${cells[@]}"; do
            package=sutura-cli
            target=(--bin sutura)
            if [[ "$cell" == the_oracle_reader_* ]]; then
              package=sutura-catalog-rdbms
              target=(--lib)
            fi
            command=(nix run "$oracle_source_root#cargo" -- test --locked -p "$package" --all-features "${target[@]}" "$cell" -- --nocapture)
            "${command[@]}" > "/tmp/oracle-export/claim-$cell-head.log" 2>&1
            grep -Fq "$cell ... ok" "/tmp/oracle-export/claim-$cell-head.log"
            patch="$oracle_source_root/devco/claim-mutations/$cell.patch"
            cp "$patch" "/tmp/oracle-export/claim-$cell.patch"
            git apply "$patch"
            set +e
            "${command[@]}" > "/tmp/oracle-export/claim-$cell-mutant.log" 2>&1
            status=$?
            set -e
            git apply --reverse "$patch"
            cat "/tmp/oracle-export/claim-$cell-mutant.log"
            test "$status" -ne 0
            grep -Fq "$cell ... FAILED" "/tmp/oracle-export/claim-$cell-mutant.log"
            grep -Fq 'test result: FAILED' "/tmp/oracle-export/claim-$cell-mutant.log"
            "${command[@]}" > "/tmp/oracle-export/claim-$cell-restored.log" 2>&1
            grep -Fq "$cell ... ok" "/tmp/oracle-export/claim-$cell-restored.log"
          done
          test -z "$(git status --porcelain)"
          printf '%s\n' 'Five named claim kills; head and restored cells green.' > /tmp/oracle-export/claim-summary.txt

      - name: Measure driver head and killing mutations
        if: inputs.operation == 'driver'
        run: |
          set -euo pipefail
          git show "$GITHUB_WORKFLOW_SHA:.github/scripts/oracle-native-driver-mutations.py" > /tmp/oracle-native-driver-mutations.py
          python3 /tmp/oracle-native-driver-mutations.py

      - name: Run hosted native and legacy product acceptance
        if: inputs.operation == 'native'
        run: nix run .#oracle-native-acceptance

      - name: Measure native product cells against base
        if: inputs.operation == 'native-base'
        env:
          NATIVE_BASE_SHA: ${{ inputs.main_sha }}
        run: |
          set -euo pipefail
          SUTURA_ORACLE_BASE_SHA=${NATIVE_BASE_SHA:-$(git merge-base HEAD origin/main)}
          [[ "$SUTURA_ORACLE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SUTURA_ORACLE_BASE_SHA" HEAD
          export SUTURA_ORACLE_BASE_SHA
          printf '%s\n' "$SUTURA_ORACLE_BASE_SHA" > /tmp/oracle-export/native-base-sha
          nix run .#oracle-native-acceptance

      - name: Measure native product claim mutations
        if: inputs.operation == 'native-claims'
        env:
          SUTURA_ORACLE_CLAIM_PROOF: "1"
        run: nix run .#oracle-native-acceptance

      - name: Measure raw SQL base or killing mutations
        if: inputs.operation == 'raw-base' || inputs.operation == 'raw-claims' || inputs.operation == 'raw-diagnostic'
        env:
          RAW_OPERATION: ${{ inputs.operation }}
          RAW_BASE_SHA: ${{ inputs.main_sha }}
        run: |
          set -euo pipefail
          git show "$GITHUB_WORKFLOW_SHA:.github/scripts/oracle-raw-proof.py" > /tmp/oracle-raw-proof.py
          sha256sum /tmp/oracle-raw-proof.py > /tmp/oracle-export/raw-proof-payload.sha256
          python3 /tmp/oracle-raw-proof.py "$RAW_OPERATION"

      - name: Measure served Oracle split claim mutations
        if: inputs.operation == 'oracle-split-claims'
        env:
          SUTURA_ORACLE_SPLIT_CLAIM_PROOF: "1"
        run: nix run .#oracle-acceptance

      - name: Inspect the locked Arrow archive against its Git objects
        if: inputs.operation == 'arrow-source' || inputs.operation == 'arrow-lock'
        run: |
          git show "$GITHUB_WORKFLOW_SHA:.github/scripts/inspect-arrow-source.py" > /tmp/inspect-arrow-source.py
          sha256sum /tmp/inspect-arrow-source.py > /tmp/oracle-export/arrow-inspector.sha256
          python3 /tmp/inspect-arrow-source.py

      - name: Compare Arrow fetch cache metadata
        if: inputs.operation == 'arrow-cache'
        run: |
          git show "$GITHUB_WORKFLOW_SHA:.github/scripts/inspect-arrow-cache.py" > /tmp/inspect-arrow-cache.py
          sha256sum /tmp/inspect-arrow-cache.py > /tmp/oracle-export/arrow-cache-inspector.sha256
          python3 /tmp/inspect-arrow-cache.py

      - name: Run complete hygiene preflight
        if: inputs.operation == 'hygiene'
        run: nix build .#checks.x86_64-linux.hygiene --print-build-logs

      - name: Run complete lint preflight
        if: inputs.operation == 'lint'
        run: |
          nix build .#checks.x86_64-linux.fmt .#checks.x86_64-linux.clippy .#checks.x86_64-linux.hygiene --print-build-logs
          nix shell --inputs-from . nixpkgs#just --command just lint-workflows

      - name: Run exact-source validation
        if: inputs.operation == 'validate'
        run: nix shell --inputs-from . nixpkgs#just nixpkgs#pixi nixpkgs#betterleaks --command just validate

      - name: Rebuild the PostgreSQL VM check with explicit bounds
        if: inputs.operation == 'postgres-diagnostic'
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=30s 20m nix build --rebuild .#checks.x86_64-linux.multi-node-postgres --max-silent-time 180 --timeout 600 -L 2>&1 | tee /tmp/oracle-export/postgres-diagnostic.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > /tmp/oracle-export/postgres-diagnostic.exit
          exit "$status"

      - name: Export exact generated bytes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle-export
          git diff --binary > /tmp/oracle-export/generated.patch
          git diff --name-only -z > /tmp/oracle-export/generated-files.zlist
          git diff --name-only -z | xargs -0 -r sha256sum > /tmp/oracle-export/generated-files.sha256
          tar --null -T /tmp/oracle-export/generated-files.zlist -czf /tmp/oracle-export/generated-files.tar.gz
          git status --short > /tmp/oracle-export/status.txt
          sha256sum /tmp/oracle-export/generated-files.tar.gz > /tmp/oracle-export/archive.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oracle-export-${{ inputs.operation }}-${{ inputs.source_sha }}
          path: /tmp/oracle-export/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (inputs.operation == 'native' || inputs.operation == 'native-base' || inputs.operation == 'native-claims' || inputs.operation == 'raw-base' || inputs.operation == 'raw-claims' || inputs.operation == 'raw-diagnostic' || inputs.operation == 'oracle-split-claims')
        with:
          name: oracle-fixture-${{ inputs.operation }}-${{ inputs.source_sha }}
          path: |
            target/oracle-native-probe
            target/oracle-legacy-probe
            target/oracle-native-base-proof
            target/oracle-native-claim-proof
            target/oracle-split-claim-proof
            target/oracle-raw-product
            target/oracle-raw-proof
          retention-days: 7

      - uses: ./.github/actions/nix-store-cache-report
        if: always()
