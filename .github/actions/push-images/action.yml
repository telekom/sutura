name: Push the images
description: >
  Push every leaf image a build job handed over, assemble the glibc and musl manifest lists over
  them, and record every reference by digest in the image-record file under `dist/`.

inputs:
  targets:
    description: Space-separated Rust target triples whose images `images/` holds.
    required: true
  binaries:
    description: Space-separated shipped binaries, as `release.yml`'s `BINARIES` holds them.
    required: false
    default: sutura
  profile:
    description: >
      `release` or `performance`, the profile `build-artefacts` was given. `performance` puts
      `-performance` after the version in every tag and never moves `latest`.
    required: false
    default: release
  image:
    description: The registry repository, e.g. `ghcr.io/<owner>/<repo>`.
    required: true
  registry-username:
    description: Username for ghcr.io.
    required: true
  registry-token:
    description: Token for ghcr.io.
    required: true

# A LOCAL composite action for `attest-and-sign`'s reason: two workflows publish images, and one
# sequence means the optimised build's leaves, lists and digest records cannot drift from the
# release's. `release.yml` and `release-performance.yml` both call it; neither pushes by hand.
runs:
  using: composite
  steps:
    # Only from a tag that looks like a release. Without this a `workflow_dispatch` on any
    # branch computed a tag from the branch name and moved `:latest`, which is what consumers
    # pull - unreviewed content, published.
    #
    # ONE IMAGE PER SHIPPED BINARY PER TARGET, tagged with the binary's key and the RUST
    # TRIPLE, so an image and a tarball from the same run are traceable to each other. Four
    # leaf tags - `<version>-<triple>` - one per target, all for `sutura`: `github.com/
    # telekom/sutura#111` shipped a second binary, `sutura-serve`, with its own
    # `<version>-serve-<triple>` set, and `github.com/telekom/sutura#685` step 2 folded it back
    # into this one, so the second set is gone rather than merely unused.
    #
    # THE PROFILE is a tag infix, not a second repository: `performance` pushes
    # `<version>-performance-<triple>` leaves and `<version>-performance` /
    # `<version>-performance-musl` lists, and records each leaf under its asset key
    # (`<triple>-performance`), which is the stem of the SBOM `attest-and-sign` attaches to it.
    # `latest` moves only for `release`: an optimised image is opted into by name.
    #
    # **ONE REGISTRY REPOSITORY** - the deciding cost, back when there were two binaries, was
    # operational rather than aesthetic: a second GHCR package needs its visibility and its
    # per-repository write grant configured by hand, outside this file, before anything can push
    # to it - so a release would fail on a setting no reviewer of this diff can see. One
    # repository keeps ONE provenance `subject-name`, one `docker login`, and one place a
    # reader looks - unaffected by the fold, since it was never about a binary count.
    #
    # TWO MANIFEST LISTS, each spanning linux/amd64 and linux/arm64: `:<version>` / `:latest`
    # for glibc, `:<version>-musl` / `:latest-musl` for the static pair.
    #
    # `release.yml` used to say a manifest list was "its own change" and point `:<version>` and
    # `:latest` at the x86_64 glibc image with a plain `docker tag`. It was its own
    # change, and the first real release published the bug: an arm64 host running
    # `docker pull ghcr.io/telekom/sutura:latest` received an amd64 image, which either
    # refuses to start or is silently emulated. A single-architecture `:latest` is worse than
    # no `:latest`, because nothing in the name tells you which architecture you got.
    #
    # ORDERING IS LOAD-BEARING: `imagetools create` reads its inputs from the REGISTRY, so
    # every leaf has to be pushed before either list can be assembled. That is why the loop
    # completes before the two `create` calls, rather than a list being built per pair.
    #
    # glibc keeps the UNSUFFIXED tags, and size is not the reason. An unqualified
    # `docker pull` has always meant glibc here, and moving the libc under the same name would
    # be a silent change wearing one tag. musl also resolves DNS differently enough from glibc
    # that it should be the thing somebody asks for by name rather than the thing they get by
    # typing nothing. The 1 MiB-against-13 MiB argument is real and it belongs to whoever types
    # `-musl`.
    - name: Push the images
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        BINARIES: ${{ inputs.binaries }}
        PROFILE: ${{ inputs.profile }}
        IMAGE: ${{ inputs.image }}
        GHCR_USERNAME: ${{ inputs.registry-username }}
        GHCR_TOKEN: ${{ inputs.registry-token }}
      run: |
        set -eu
        test -n "$BINARIES" || { echo "::error::BINARIES is empty: this step would push no image"; exit 1; }
        test -n "$TARGETS" || { echo "::error::TARGETS is empty: this step would push no image"; exit 1; }
        case "$PROFILE" in
          release) psfx=""; move_latest=yes ;;
          performance) psfx="-performance"; move_latest=no ;;
          *) echo "::error::profile is '${PROFILE}' - it is release or performance"; exit 1 ;;
        esac
        case "$GITHUB_REF_NAME" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "::error::refusing to publish from ref $GITHUB_REF_NAME"; exit 1 ;;
        esac
        tag="${GITHUB_REF_NAME#v}"
        printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
        # kind, name, pinnable reference. Two kinds because they answer different questions:
        # a `list` is what a plain `docker pull` resolves and what a consumer should pin; a
        # `leaf` is one architecture, for pinning to one deliberately. A reader who pins a
        # leaf digest thinking it is the image has pinned half of it.
        mkdir -p dist
        {
          echo "# kind name reference@digest"
          echo "# list = multi-arch manifest list; pin this unless you want one architecture"
          echo "# leaf = single-arch image, named by its binary key and rust target triple"
        } > dist/image-digests.txt
        for target in $TARGETS; do
         for bin in $BINARIES; do
          # The same key rule as the build action and the arrival check in `release.yml`.
          if [ "$bin" = sutura ]; then base="$target"; else base="${bin#sutura-}-${target}"; fi
          key="${base}${psfx}"
          # Each stream script names its image after the binary it holds, so a tarball arrives
          # as `sutura:latest`; retag before the next iteration takes the name away. Loading
          # and pushing never EXECUTES the image - the smoke tests ran in `build`, under a
          # token that cannot write to a registry.
          docker load -i "images/sutura-oci-${key}.tar.gz"
          docker tag "${bin}:latest" "${IMAGE}:${tag}${psfx}-${base}"
          # The digest is the only durable answer to "which build is running", so it comes
          # from what the registry SAID rather than from local bookkeeping.
          #
          # This was `docker inspect --format '{{index .RepoDigests 0}}'`, and it recorded
          # `unknown` for one of the four targets in the v0.1.0 release while the push
          # itself had succeeded and printed a digest. `RepoDigests` is per-image-ID, and
          # every tarball here loads under the same `sutura:latest` name, so the tag-to-ID
          # mapping is rewritten on each iteration - the field is unreliable exactly when
          # several images share one repository. `docker push` prints the digest it
          # registered, which needs no bookkeeping to survive.
          push_log="$(mktemp)"
          docker push "${IMAGE}:${tag}${psfx}-${base}" | tee "$push_log"
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' "$push_log" | tail -1)"
          rm -f "$push_log"
          # FAIL rather than record `unknown`. A release whose digests are missing cannot
          # be pinned, and a placeholder makes an absence look like data.
          if [ -z "$digest" ]; then
            echo "::error::no digest in the push output for ${key}" >&2
            exit 1
          fi
          printf 'leaf %s %s@%s\n' "$key" "$IMAGE" "$digest" >> dist/image-digests.txt
         done
        done
        # Two manifest lists per shipped binary, assembled from the leaves just pushed. The
        # LEAF TRIPLES are still written out rather than accumulated in the loop above, so which
        # architecture belongs to which libc is readable here instead of inferred from control
        # flow; what the loop supplies is only the binary's tag suffix, which is one token.
        #
        # `docker buildx imagetools create`, not `docker manifest create`: buildx ships with
        # ubuntu-latest, while `docker manifest` still needs the experimental flag set, which
        # is one more thing that has to be true about a runner. Every tag goes on one call, so a
        # list and its `latest` alias are the same push and cannot drift apart.
        lists=""
        for bin in $BINARIES; do
          # `sfx` is the tag suffix and `nm` the name `image-digests.txt` records the list
          # under - empty and empty for the tool, `-serve` and `serve-` for the server. The
          # attest action reads that name, and `docs/verifying-a-release.md` documents it.
          if [ "$bin" = sutura ]; then sfx=""; nm=""; else sfx="-${bin#sutura-}"; nm="${bin#sutura-}-"; fi
          at="${IMAGE}:${tag}${psfx}${sfx}"
          glibc=(-t "$at")
          musl=(-t "${at}-musl")
          if [ "$move_latest" = yes ]; then
            glibc+=(-t "${IMAGE}:latest${sfx}")
            musl+=(-t "${IMAGE}:latest${sfx}-musl")
          fi
          docker buildx imagetools create "${glibc[@]}" "${at}-x86_64-unknown-linux-gnu" "${at}-aarch64-unknown-linux-gnu"
          docker buildx imagetools create "${musl[@]}" "${at}-x86_64-unknown-linux-musl" "${at}-aarch64-unknown-linux-musl"
          lists="${lists} ${nm}glibc=${at} ${nm}musl=${at}-musl"
        done

        # ASSERTED, like the static-linking claim in `build`, and for the same reason. A list
        # assembled from leaves that all declare amd64 still pushes, still resolves, and still
        # hands an amd64 image to an arm64 host - the exact bug this step exists to fix,
        # wearing a manifest list as a disguise. So each list has to report both platforms
        # before anything downstream records it as good.
        for entry in $lists; do
          list="${entry#*=}"
          platforms="$(docker buildx imagetools inspect "$list" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          echo "${list}: ${platforms}"
          for want in linux/amd64 linux/arm64; do
            case " $platforms " in
              *" $want "*) ;;
              *) echo "::error::${list} has no ${want} entry: ${platforms}"; exit 1 ;;
            esac
          done
        done

        # The LIST digest is what a consumer should pin, because a leaf digest pins one
        # architecture. `--raw` prints the index bytes and a manifest digest IS the sha256 of
        # exactly those bytes, so this computes the digest by definition rather than by
        # scraping an output format that can change. Cross-checked against the `Digest:` line
        # `imagetools inspect` prints for a human, and against `{{json .Manifest}}`.
        #
        # Over the same `lists` the assertion above walked, so a list that was created and not
        # recorded is unrepresentable rather than checked.
        for entry in $lists; do
          printf 'list %s %s@sha256:%s\n' "${entry%%=*}" "$IMAGE" \
            "$(docker buildx imagetools inspect --raw "${entry#*=}" | sha256sum | cut -d' ' -f1)" \
            >> dist/image-digests.txt
        done
        {
          echo "## Images"
          echo
          echo '```'
          cat dist/image-digests.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        docker logout ghcr.io
