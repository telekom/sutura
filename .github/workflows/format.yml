# Markdown, YAML and TOML formatting, and Python formatting plus lint.
#
# ITS OWN WORKFLOW, and the reason is what it does NOT run. The paths filter below means a
# text-only change gets this verdict without `ci.yml`'s matrix, and a Rust-only change pays
# nothing for a formatter that would have inspected no changed file. Folding it into `ci.yml`
# inverts both halves of that.
#
# THE SAME SCRIPT A DEVELOPER RUNS. `nix/format-text.sh` is what the `format-text` pre-commit
# hook, `just lint-text`, `just fmt` and `just validate` call, so a local run and CI cannot check
# different things - the property `nix/lint-workflows.sh` exists for, applied one file over.
#
# THIRD-PARTY ACTIONS: none, as everywhere else here.
name: format

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.py"
      - "dprint.json"
      - "nix/dprint.nix"
      - "nix/format-text.sh"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit
        required: true
        type: string
      operation:
        description: Hosted operation
        required: true
        type: choice
        options: [text, format, lock-format, config, validate]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oracle-export:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.operation == 'text' && 'ubuntu-latest' || 'rust-mcp-16core' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - name: Open KVM
        if: inputs.operation == 'validate'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ci

      - name: Record exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          mkdir -p /tmp/oracle-export
          git rev-parse HEAD > /tmp/oracle-export/source-sha
          git rev-parse 'HEAD^{tree}' > /tmp/oracle-export/source-tree
          git ls-files -z | xargs -0 sha256sum > /tmp/oracle-export/source-files.sha256

      - name: Resolve with the pinned generator
        if: inputs.operation == 'lock-format'
        run: nix run .#cargo -- metadata --format-version 1 > /tmp/oracle-export/metadata.json

      - name: Format Rust with the pinned toolchain
        if: inputs.operation == 'format' || inputs.operation == 'lock-format'
        run: |
          nix run .#cargo -- run -q -p xtask -- fmt
          nix run .#cargo -- run -q -p xtask -- text-hygiene --fix

      - name: Format text with the pinned tools
        if: inputs.operation == 'text' || inputs.operation == 'format' || inputs.operation == 'lock-format'
        run: bash nix/format-text.sh fmt

      - name: Measure config head and base
        if: inputs.operation == 'config'
        run: |
          set -euo pipefail
          nix run .#cargo -- test --locked -p sutura-config --all-features --test oracle_native_settings 2>&1 | tee /tmp/oracle-export/config-head-all.log
          nix run .#cargo -- test --locked -p sutura-config --no-default-features --test oracle_native_settings 2>&1 | tee /tmp/oracle-export/config-head-default.log
          base=$(git merge-base HEAD origin/main)
          git worktree add --detach /tmp/oracle-config-base "$base"
          cp crates/sutura-config/tests/oracle_native_settings.rs /tmp/oracle-config-base/crates/sutura-config/tests/
          git -C /tmp/oracle-config-base add -N crates/sutura-config/tests/oracle_native_settings.rs
          printf '%s\n' "$base" > /tmp/oracle-export/config-base-sha
          cd /tmp/oracle-config-base
          set +e
          nix run .#cargo -- test --locked -p sutura-config --all-features --test oracle_native_settings > /tmp/oracle-export/config-base-all.log 2>&1
          status=$?
          set -e
          cat /tmp/oracle-export/config-base-all.log
          test "$status" -ne 0
          grep -q 'test result: FAILED' /tmp/oracle-export/config-base-all.log

      - name: Run exact-source validation
        if: inputs.operation == 'validate'
        run: nix shell --inputs-from . nixpkgs#just nixpkgs#pixi nixpkgs#betterleaks --command just validate

      - name: Export exact generated bytes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle-export
          git diff --binary > /tmp/oracle-export/generated.patch
          git diff --name-only -z > /tmp/oracle-export/generated-files.zlist
          git diff --name-only -z | xargs -0 -r sha256sum > /tmp/oracle-export/generated-files.sha256
          tar --null -T /tmp/oracle-export/generated-files.zlist -czf /tmp/oracle-export/generated-files.tar.gz
          git status --short > /tmp/oracle-export/status.txt
          sha256sum /tmp/oracle-export/generated-files.tar.gz > /tmp/oracle-export/archive.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oracle-export-${{ inputs.operation }}-${{ inputs.source_sha }}
          path: /tmp/oracle-export/
          retention-days: 7

      - uses: ./.github/actions/nix-store-cache-report
        if: always()
