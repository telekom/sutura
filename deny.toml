# Supply chain and licence policy. On from M0, not later: this is also what keeps the
# attribution obligation from rotting once code is derived from an upstream project.

# Adapters are feature-gated and default-off, so the DEFAULT graph is nearly empty. Without
# this, the first adapter's dependency tree - its HTTP client, TLS stack and token library -
# becomes invisible to advisories, licences and source checks, and the weekly audit keeps
# reporting clean. Same reasoning as `--all-features` for clippy.
[graph]
all-features = true
# Every target a release publishes, musl included. Not cosmetic: `targets` is what decides
# which `[target.'cfg(..)'.dependencies]` tables count, so a triple missing from this list is a
# dependency tree nothing audits. The allocator is declared under `cfg(target_os = "linux")`,
# which all four satisfy, but the next platform-gated dependency will not be so forgiving.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"

# ONE ignored advisory, scoped to one id, with the reason it is acceptable rather than the
# observation that it is only a warning.
#
# RUSTSEC-2024-0436 is `paste` being UNMAINTAINED: archived by its author, no vulnerability
# attached, and the advisory itself says "No safe upgrade is available". It reaches this workspace
# as a transitive dependency of `utoipa-axum`, which is what makes the generated interface
# description actually generated - `routes!` registers a handler in the router and in the
# `OpenAPI` document from the same attribute, so a handler with no `#[utoipa::path]` fails to
# compile. Dropping it means hand-listing every path in a derive, which is the second source of
# truth that whole arrangement exists to remove.
#
# What is accepted: a macro helper that pastes identifiers together at compile time, is feature
# complete for what it does, and is not present at runtime. What is NOT accepted: this is one
# advisory id, not a category. The next unmaintained crate in the tree fails the audit, which is
# the difference between this entry and setting `unmaintained` to something looser.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "`paste`, transitively via `utoipa-axum`: unmaintained, no vulnerability, no upgrade path, compile-time only" },
]

[licenses]
version = 2
# Permissive only. Anything copyleft is a deliberate decision, not a transitive surprise.
#
# Exactly the licences the current graph uses, and no more - `unused-allowed-license` below makes an
# entry nothing uses FAIL rather than warn, so this list cannot rot into pre-approval for a
# dependency nobody has reviewed. Four entries were removed for that reason once; three of them are
# back below, because the DuckDB adapter brought crates that use them. That is the difference.
#
# WHERE THE NEW ENTRIES COME FROM, and it is worth reading before adding to this list. Five of them
# arrive under `libduckdb-sys`, whose build script DOWNLOADS a prebuilt libduckdb when nothing else
# has supplied one - so it carries `ureq`, and `ureq` carries a whole TLS stack. `ureq` is not
# optional there, so no feature flag removes it from the graph.
#
# That downloader never runs here. `build.rs` checks `DUCKDB_LIB_DIR` before it considers
# downloading, and `nix/duckdb.nix` sets it from the nixpkgs derivation. The check that this stays
# true is not a promise: the Nix build sandbox has no network, so a build that fell through to the
# download path fails loudly rather than quietly fetching a binary nobody pinned.
#
# **THOSE FIVE NOW HAVE A SECOND OWNER, and naming only the first is how this comment would rot.**
# `sutura-exec-bigquery`'s default-off `wire` feature declares `ureq` as a real dependency - the same
# 3.4.0 with the same two features, which is why it adds no package and no licence; `docs/adr/0018`
# measured that and says so. What it changes is that `ISC`, `BSD-3-Clause` and `CDLA-Permissive-2.0`
# are justified by FIRST-PARTY code as well as by a downloader that never runs. That closes a latent
# trap rather than opening one: had DuckDB ever been dropped as a dev-dependency,
# `unused-allowed-license` below would have failed on five entries at once, and a reader looking for
# why would have found a comment naming only the owner that had just left.
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  # `foldhash` (hashbrown -> hashlink -> duckdb) and `zlib-rs` (flate2, in libduckdb-sys's build
  # script). Permissive, OSI-approved, no copyleft, no attribution obligation beyond not
  # misrepresenting the origin.
  "Zlib",
  # `ar_archive_writer`, a build-dependency of `psm` <- `stacker` <- `polyglot-sql`. `stacker` is
  # kept on purpose: it is stack-growth protection for a recursive-descent parser, and dropping a
  # safety feature to shorten this list would be the wrong trade. The exception is the one the Rust
  # project itself ships under.
  "Apache-2.0 WITH LLVM-exception",
  # `subtle`, via the TLS stack described above.
  "BSD-3-Clause",
  # `rustls-webpki`, `untrusted`, and the ISC half of `ring`'s "Apache-2.0 AND ISC".
  "ISC",
  # `webpki-roots`, which is a data set of certificate authorities rather than code. CDLA-Permissive
  # is the Linux Foundation's permissive data licence: no copyleft, and no obligation attaching to
  # anything built with it.
  "CDLA-Permissive-2.0",
]

# So it cannot rot back: an entry nothing uses FAILS rather than warns. Adding a licence then
# happens at the moment a dependency needs it, which is where the decision belongs.
unused-allowed-license = "deny"

confidence-threshold = 0.9

[bans]
# A duplicated dependency tree is both a compile-time and a supply-chain cost. Warn rather
# than deny for now: the first real adapter crate will surface duplicates we do not yet
# have an opinion on, and a gate that blocks work on day one gets disabled.
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies have no version by design; flagging them would make
# this gate fire on a correct pattern, and a gate that fails on correct code gets disabled.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
