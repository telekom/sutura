# THE PULL-REQUEST CROSS LINK CHECK. Called by `ci.yml` and by nothing else.
#
# A REUSABLE WORKFLOW rather than a job in `ci.yml`, and the line cap is only half the reason.
#
# ONE, which decided WHEN: `ci.yml` was 999 lines against the 1000-line cap `cargo xtask max-lines`
# enforces, so every branch that added a line to it was unmergeable - two were at once, and that
# file had already been trimmed twice against the same wall.
#
# TWO, which decided WHICH job moves, and it is the half that survives the cap: this one is a LEAF
# that shares nothing. Nothing has it in `needs:`, it publishes no output, it reads no secret and
# it names no `environment:` - so lifting it cannot change what a credential can reach, which is
# the one class of behaviour change a reviewer cannot confirm by reading. Each of the three other
# jobs in `ci.yml` fails one of those: `crap-comment` is the only job in the repository holding a
# write scope and its grant has to be written where that decision is reviewed, and
# `cargo xtask check-venues` reads `bigquery-acceptance` out of `ci.yml` by name, with a
# refusal per property.
#
# WHAT STAYED BEHIND is the gating - `needs: [ci]` and the classification test - for the reason
# `nix/lint-workflows.sh`'s header gives for the same split one level down: what moves is the BODY,
# and the condition stays where the thing it gates is decided.
#
# WHAT IT COSTS: the four legs are reported as `cross / link (<triple>)` rather than
# `cross (<triple>)`. None of them is a required context - `ci` is the only one in the `main`
# ruleset - so no ruleset changes with this file. THE OTHER HALF OF THAT SENTENCE, which went
# unstated: none of them is required as read on 2026-09-05, so a red leg does not block a merge,
# and this job's coverage is advisory. Present tense on purpose - *has never blocked one* is a claim
# about the past that nothing read, and `devco/required-contexts`' header says why a ruleset's
# representation cannot answer it. That file is the record - the API response, the date, and the
# organisation-level scope that could not be read - it carries the DECISION to leave this coverage
# advisory and the two options refused to get there, and `cargo xtask check-workflows` is what keeps
# it in step with the jobs, THIS FILE'S JOB INCLUDED: a workflow a gating one calls is read for its
# jobs too, so adding a second job here fails that gate until somebody classifies it.
# `cargo xtask check-workflows`'s REFERENCE scan
# reads every file in `.github/workflows`, and `cargo xtask check-shipped-binaries` reads that
# directory and `.github/actions`, so the `nix run` / `nix build` references and the `BINARIES`
# literal below are checked exactly where they were - measured through `just hygiene`, 64
# references in 18 files before and 64 in 19 after.
#
# AND THE HALF OF THAT GATE THAT DID NOT FOLLOW HAS FOLLOWED. Its REFUSAL of a literal release
# build in ordinary CI read the single name `.github/workflows/ci.yml`, so a literal
# `nix build .#sutura-serve` written in THIS file was refused by nothing. It now walks the local
# `uses:` call graph out of `ci.yml` and refuses over every file that walk opens, this one included,
# failing closed on a call it cannot open - `xtask/src/workflows/reach.rs`, which also carries the
# YAML shapes it reads and the ones it does not. All three builds below stay exempt for the reasons
# they always were, which is measured rather than assumed: interpolated, or the probe manifest.
#
# WHAT THAT WALK STILL DOES NOT FOLLOW is the shell. A step that moves into a `nix/*.sh` script is
# reached by a `just` task and by the release path as well, so *ordinary CI* is not that file's
# venue and the refusal has no meaning there. The REFERENCE scan above does read those scripts.
#
# PULL REQUESTS: the two aarch64 targets, `ci` profile, no image. A branch proves that the
# architecture the native `ci` job NEVER compiles still COMPILES AND LINKS under both its libcs;
# the tag-triggered release workflow alone builds and proves what ships.
#
# MAIN: all four targets. Why the archs are checked at all, and why the PR set is a pair: the
# allocator is C, compiled once per target, and cross breakage lives there rather than in the
# Rust. A glibc-only run would not see it. The `ci` job natively builds and links the host
# triple `x86_64-unknown-linux-gnu`, so that cross leg is pure duplication of native coverage on
# a pull request; the pair that is genuinely new compile+link surface is `aarch64` under both its
# libcs. Dropping `x86_64-unknown-linux-musl` from the pull request costs its static C-allocator
# cross-link check on the branch - `main`'s all-4 push run catches it before any tag, which is
# the event-scoping this file now implements in the matrix below. Whichever set runs, the
# `feature-probes` and `embedded-dependency-list` steps ride the same matrix, so a dropped triple
# loses its `--features bigquery` link check on pull requests and keeps it on `main`.
#
# A MATRIX rather than four `nix build` lines in `ci`, and the reason is wall clock, not
# cost: four runners is more total compute than one runner doing the same four builds in
# sequence, because each job builds its own dependency closure instead of reusing the
# previous target's. What it buys is that a branch waits for ONE target instead of four,
# while a person is watching. Same trade release.yml's matrix makes, and stated the same way.
#
# Note what does NOT protect the attribute names below: `check-workflows` tracks apps and
# `checks.*` only, and ignores `nix build .#<package>` on purpose, because the cross package
# names are generated by interpolation and a text scan cannot know them. A typo in a target
# here surfaces in CI and nowhere earlier.
name: cross-link

# `workflow_call` and nothing else. No `push`, no `pull_request`: the event tests and the
# classification this job gates on are `ci.yml`'s, and a second trigger here would run the four
# builds again on its own schedule of when.
on:
  workflow_call:

permissions:
  contents: read

env:
  # THE SHIPPED SET, and it must stay in step with `binaries` in `nix/shipped.nix` and with
  # `BINARIES` in `release.yml`. It is not DERIVED from either: a workflow cannot evaluate a flake
  # before it has installed nix, and a matrix takes literals.
  #
  # TWO RULES KEEP IT HONEST, and only the second reaches the direction that matters. The cross
  # matrix BUILDS every name in it, so a name that is not a nix package fails the link check; and
  # `cargo xtask check-shipped-binaries` - a `hygiene` gate, so `ci.yml`'s `Structural gates` step
  # runs it - compares this literal against `nix/shipped.nix`, which is what catches a binary that
  # ships and is named here by nobody.
  #
  # HERE RATHER THAN IN `ci.yml`, because the matrix that spends it is here and `env` is not a
  # context a caller can pass through `with:`. That gate reads the whole of `.github/workflows`, so
  # the literal is reconciled against `nix/shipped.nix` in this file exactly as it was in that one.
  BINARIES: sutura sutura-serve

jobs:
  link:
    runs-on: rust-mcp-32core
    # 120 for the same reason as `ci`, with more of it: each target in the matrix compiles that
    # same large closure again for its own triple, and none of them shares the host's artifacts.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      # One red job names the target that broke; cancelling the others would only tell you that
      # something did. Same reasoning as release.yml, and here the work discarded would also be
      # work the cache had already paid for.
      fail-fast: false
      matrix:
        # THE SHIPPED SET, SCORED BY EVENT. On a pull request only the aarch64 pair runs - the
        # architecture the native `ci` job never compiles, under both its libcs - so a branch
        # proves the genuinely new cross surface without re-paying for the host triple the
        # native job has already linked. A push to `main` runs all four: that is the all-4 link
        # gate (it keeps `x86_64-unknown-linux-musl`'s static-allocator check and
        # `x86_64-unknown-linux-gnu` live before any tag) and the run that writes the per-target
        # Actions-cache entries every pull-request leg then restores. The full-set half stays
        # deliberately the same list as release.yml's `build`.
        #
        # In a CALLED workflow the `github` context reflects the CALLER's event, not
        # `workflow_call`; `ci.yml`'s `cross` job runs this on `pull_request` and on a push to
        # `main` (never on `merge_group`), so `github.event_name == 'pull_request'` selects the
        # two-aarch64 set and every other call gets the full four.
        target: ${{ github.event_name == 'pull_request' && fromJSON('["aarch64-unknown-linux-gnu","aarch64-unknown-linux-musl"]') || fromJSON('["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl"]') }}
    steps:
      # No `fetch-depth: 0` here: nothing in this job diffs against a base. `ci` owns that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before nix installs: /nix/store is what fills. See
      # `.github/actions/reclaim-disk` for why this is local and why it cannot
      # affect the Nix cache.
      - uses: ./.github/actions/reclaim-disk
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # Same reasoning as the `ci` job: the flag that would let flake.nix add its own
          # substituter stays absent, so a pull request cannot point CI at a store it controls.
          # No third-party substituter is configured here either - `docs/adr/0026` records the
          # Actions cache as the only carrier, so the only store CI trusts is the one this
          # repository's own `main` wrote.
          extra_nix_config: |
            fallback = true

      # One entry PER TARGET: each leg builds a different closure, so a shared key would have the
      # four overwrite each other. Restore-only on a pull request - see
      # `.github/actions/nix-store-cache`, whose save condition `check-workflows` pins.
      - uses: ./.github/actions/nix-store-cache
        with:
          scope: ${{ matrix.target }}

      # Through `env` rather than interpolated into the script: a matrix literal is not
      # attacker-controlled, but the rule that no `${{ }}` reaches a shell body is worth more
      # as a rule than as a case-by-case judgement.
      # EVERY SHIPPED BINARY, and the loop is what makes this job the measurement issue #111
      # asks for. A second shipped executable changes what has to LINK for two musl triples -
      # the allocator's C included - and this is the job that answers whether it does, on the
      # pull request, rather than at tag time after four cross builds have been paid for.
      - name: Link check
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # An EMPTY set is a green matrix that linked nothing: zero iterations, no
          # `assert-linked.sh`, and the notice below printed anyway. `set -u` catches the variable
          # being UNSET and caught nothing about it being empty. `cargo xtask
          # check-shipped-binaries` is what holds this guard in every step that loops over the set.
          test -n "$BINARIES" || { echo "::error::BINARIES is empty: this leg would link nothing"; exit 1; }
          for bin in $BINARIES; do
            nix build ".#${bin}-${TARGET}-ci" -L -o "result-ci-${bin}"
            # NOT a bare `file`, which is what stood here under a comment claiming it proved the
            # arch. It does not: `file` exits ZERO on a path that is not there, and nothing
            # compared its answer to the triple. The script asserts both, and says what it leaves.
            bash nix/assert-linked.sh "${TARGET}" "result-ci-${bin}/bin/${bin}"
          done
          # Not a silent cap: a green branch must not read as having validated what ships.
          echo "::notice::${TARGET}: ci profile, compile-speed settings. Release-profile codegen, the one-binary and shipped-features assertions and the container images are built only by the tag-triggered release workflow."

      # AND THE SAME QUESTION WITH THE FEATURE ON, which is the measurement
      # `github.com/telekom/sutura#121` step 2 owes. The step above builds cargo's default set,
      # which is what ships; `--features bigquery` had never been LINKED for any triple this
      # project publishes, and it pulls `ureq`, rustls and `ring`, whose C and assembly is exactly
      # what the two musl triples are the risk of.
      #
      # **THAT PAGE'S FEATURE SET, AT THIS JOB'S PROFILE AND NOT THAT PAGE'S.** It documents
      # `--release` - thin LTO, `panic = "abort"` - and this builds `ci`, which inherits `dev`. So
      # the question answered is *does the feature's closure cross-compile and link for this
      # triple*, not *does the reader's exact command link*. The notice below says so and
      # `docs/adr/0017` carries it as a limit.
      #
      # **A SEPARATE STEP AND NOT A WIDER LOOP**, so a reader can tell which question went red:
      # the step above is *does what we publish link*, this one is *does the documented source
      # build link*. A failure here does not mean the shipped artefact is broken - it means the
      # documented source build does not link on a triple this project publishes, which is the
      # one thing a native `cargo check` cannot report, because it stops at metadata.
      #
      # **IT COSTS ONE WHOLE CRATE DERIVATION, WHICH IS NOT WHAT THE FEATURE COSTS.**
      # `buildDepsOnly` runs on the same argument set as the default build, so the probe shares
      # that DEPENDENCY derivation - but a one-package build resolves a narrower feature set than
      # the workspace union that derivation compiled, so the closure recompiles inside it. The
      # seconds printed below are therefore the probe and not a delta; `docs/adr/0017` measures
      # the feature as compiled units instead, and `nix/shipped.nix` carries the same correction.
      #
      # **THE SET IS READ AND NOT RECONSTRUCTED.** It used to recover the set by splitting the
      # flake's attribute NAMES, so a rename emptied it silently and this step exited ZERO having
      # measured nothing. `feature-probes-<target>` is a fixed attribute whose rows carry the
      # package, the executable and the feature; `nix/shipped.nix` has the measurement that forced
      # it, and `cargo xtask check-shipped-binaries` is what says the right rows are in it.
      - name: Link check, feature on
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          manifest="$(nix build ".#feature-probes-${TARGET}" --no-link --print-out-paths)"
          if [ ! -s "$manifest" ]; then
            echo "::error::${TARGET}: the probe manifest is empty or unreadable, so nothing here measured a feature-on build. Usually that means nix/shipped.nix declares no probeFeatures for this triple. docs/adr/0017 claims the feature-on build is linked on every pull request - restore a probe, or withdraw the claim. Which features must be probed is held by cargo xtask check-shipped-binaries."
            exit 1
          fi
          while read -r probe exe feature; do
            started="$(date +%s)"
            # `< /dev/null` because the manifest is this loop's stdin: a child that reads stdin
            # would eat the remaining rows, and the job would go green having built fewer probes.
            nix build ".#${probe}" -L -o "result-probe-${probe}" < /dev/null
            # What makes the manifest's `exe` field CHECKED rather than decorative. A bare `file`
            # here printed `cannot open` and exited zero, so a renamed executable was green.
            bash nix/assert-linked.sh "${TARGET}" "result-probe-${probe}/bin/${exe}"
            echo "::notice::${TARGET}: ${exe} with --features ${feature} linked in $(( $(date +%s) - started ))s at the ci profile, which is NOT docs/getting-started.md's --release link. The seconds are the whole probe, not the feature's delta; docs/adr/0017 has the delta as compiled units, and the feature-off decision in nix/shipped.nix rests on what a published artefact links rather than on either number."
          done < "$manifest"

      # DOES EVERY SHIPPED BINARY CARRY ITS OWN DEPENDENCY LIST, and can the tool the release
      # path uses read it back out? A local composite action; its header says why it is not
      # inline here and what `nix/auditable.nix` and `release.yml` depend on it for.
      - uses: ./.github/actions/embedded-dependency-list
        with:
          target: ${{ matrix.target }}
          binaries: ${{ env.BINARIES }}
