# Generated input against the parsers that read input this deployment does not write.
#
# WHY THIS FILE EXISTS AT ALL. Every other check in this repository is static: clippy at
# `-D warnings`, zizmor, `cargo deny` and the structural gates read the tree and reason about it.
# None of them generates an input, so none of them can find a parser that panics on one - and the
# shipped profiles compile with `panic = "abort"`, so such a panic is the process dying rather than
# an error a caller sees. `fuzz/` is the only thing here that produces adversarial input.
#
# WHEN IT RUNS. The release tag, and a manual dispatch. There is no pull-request leg, no
# `merge_group` leg and - since this change - no push-to-`main` leg and no cron. A time-budgeted
# search over random input is a poor merge gate, and the per-push leg was paying for one it could
# not be. Measured over the twenty runs before this change, every one of them a push to `main`:
#
#   - a MEDIAN of 16.1 core-hours per push at 32 cores, 315.9 core-hours in total;
#   - NONE of the twenty succeeded - eleven failed, and nine were cancelled by
#     `cancel-in-progress` when the next push landed.
#
# So the trigger was destroying the fuzzing it paid for: every run shared one concurrency group,
# `refs/heads/main`, and the next push cancelled whatever was still running. A tag is its own ref,
# so a release run cancels nothing. The weekly cron goes with it, by decision.
#
# IT DOES NOT GATE THE RELEASE, and that is the decision rather than an accident. This is its own
# workflow on the same `v*` tag `release.yml` triggers on, so there is no dependency edge between
# them: `release.yml`'s `publish` job needs `build` and `gates` and nothing here, and a red run
# here cannot hold a tag back. A gating fuzz job would mean the first finding on a fresh random
# path blocks every release until somebody fixes it, and that is not a remote scenario: ELEVEN of
# the last twenty runs ended in a failure. A bound landing separately refuses both artifacts
# anybody has kept, so these targets may well be clean today - which is not an argument for
# gating, because finding the NEXT one is the whole job of a fuzzer. The report is the run: a red
# job in the Actions tab on the tag, with the crash input attached as an artifact. `cargo xtask
# check-fuzz` refuses an invocation of the fuzzer inside `release.yml` so it stays that way.
#
# WHAT THAT COSTS, and a reader six months from now must not have to work it out. SEARCHING - a
# time-budgeted libFuzzer run over MUTATED input - now happens at a release and on a manual
# dispatch, and nowhere else. There is no periodic search. REGRESSION CHECKING continues on the
# commits that touch the surface: `just fuzz-smoke` replays every committed seed at `-runs=0` with
# no mutation, in the `smoke` job here and in a path-scoped pre-commit hook, which is what keeps
# the quarantined `unclosed-paren-*` artifacts from coming back, and `cargo xtask check-fuzz`
# holds the harness itself on every pull request.
#
# So, plainly: THIS REPOSITORY STOPS SEARCHING FOR NEW DEFECTS BETWEEN RELEASES, AND KEEPS
# CHECKING THAT KNOWN ONES STAY FIXED. A quiet fuzz surface here means nobody is searching - not
# that there is nothing to find. `just fuzz seconds="300" target=""` is the local search.
#
# NOT IN `devco/required-contexts` AT ALL, and that is correct rather than an omission. That record
# accounts for jobs reporting a status-check CONTEXT, and its gating events are `pull_request` and
# `merge_group`. This workflow triggers on neither, so it reports no context and can gate no merge.
# What IS gated on every pull request is `cargo xtask check-fuzz`, inside the hygiene sweep, which
# costs milliseconds and fails when a target stops being declared, seeded, or run by this file.
#
# THE `actions/cache` STEPS ARE GONE, AND THE TRIGGER IS WHY - this is not a cost decision. A
# caching action in a workflow a TAG can start is `zizmor`'s `cache-poisoning` audit, high
# severity: a poisoned entry restored in a run the release tag started is a way to influence what
# that release publishes. `just lint-workflows` was green with those steps under `push: branches`
# and reports two high findings with the same steps under `push: tags` - so the steps could not
# survive this trigger, and suppressing a correct finding to keep them was not an option.
#
# They could not have paid anyway, which is why nothing replaces them. Every cache WRITE in this
# repository is gated on a push to `main` - `actions/cache` by the step's own `if:`,
# `.github/actions/nix-store-cache` by the `save:` `cargo xtask check-workflows` pins - and
# neither trigger above is one, so no run here can write either entry again. Widening to a
# tag does not help: an entry written from `refs/tags/v1.2.3` is readable only from that ref,
# which no later run is. The harness therefore builds cold on every run, and nothing waits on it -
# and `devco/action-inputs` loses its `actions/cache` record with the last `uses:` of it.
#
# THE `nix-store-cache` STEP IS UNTOUCHED, AND NOT BECAUSE IT WAS CLEARED. `zizmor` is invoked over
# `.github/workflows` and reads exactly those files, so it never opens a local composite action:
# an `actions/cache` step planted inside that action produced NO finding, where the same step in
# this file produced two. So a tag-started run here still RESTORES a store cache, and that is
# unassessed by the audit rather than absolved by it. What bounds it is the store's own write
# gate - `save:` on a push to `main`, which nothing here can satisfy - so the `fuzz` scope can only
# go stale and be evicted. The change that removes the step owns the decision to remove it.
#
# THIRD-PARTY ACTIONS: pinned by digest, as everywhere else here.
name: fuzz

on:
  # THE RELEASE TAG, the same `v*` `release.yml` triggers on - a separate run over the same tree,
  # which is what keeps the release ungated by it. See the header for the two triggers this
  # replaced and what was measured about them.
  push:
    tags: ["v*"]
  # KEPT, deliberately. A manual trigger costs nothing while nobody invokes it, and without it the
  # only way to reach these targets between releases is a local `just fuzz seconds="300" target=""`
  # on somebody's machine.
  workflow_dispatch:
    inputs:
      seconds:
        description: Budget per target, in seconds
        required: false
        default: "900"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The deterministic half. Every committed seed executed once, no mutation, so the verdict is a
  # function of the files in the tree - the property that lets the same replay sit in a pre-commit
  # hook and in `just fuzz-smoke`. It is a regression check over what is committed, not a search.
  smoke:
    runs-on: rust-mcp-32core
    # A cold nightly build with a sanitizer over this dependency graph is the cost here, not the
    # replay: the replay itself is a few hundred executions.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BEFORE nix installs, for the reason `ci.yml` states at its own call: the runner ships
      # ~20 GB of SDKs this repository does not use, and a sanitizer build is not small.
      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The flag that makes nix honour settings from flake.nix itself is deliberately absent,
          # for the reason `security-audit.yml` gives: with it, a pull request could add a
          # substituter and a trusted key and have CI fetch attacker-built store paths.
          extra_nix_config: |
            fallback = true

      # A scope of its OWN, and it has to be its own: nothing here is shareable with `ci`. This
      # workspace compiles under the pinned NIGHTLY with sanitizer codegen, from its own
      # `Cargo.lock` and its own `[profile.*]` - so its store paths are different derivations by
      # construction, not the same ones under another name. Without this the whole fuzz workspace
      # was rebuilt on every push to the default branch.
      - uses: ./.github/actions/nix-store-cache
        with:
          scope: fuzz

      - name: Replay the committed corpus
        run: bash nix/run-fuzz.sh smoke

  # The half that finds things. One leg per target so two budgets run in parallel rather than in
  # series, and so a crash names its target in the job list.
  fuzz:
    # No `if:` any more. It read `github.event_name != 'pull_request'`, which kept the expensive
    # half off the pull-request leg - and with that leg removed the condition could never be false,
    # so it was a guard over a case that cannot arise. A condition that cannot fail is worse than no
    # condition, because a reader takes it for a live restriction.
    runs-on: rust-mcp-32core
    timeout-minutes: 120
    strategy:
      # No fail-fast: a crash in one target must not cancel the budget of the other.
      fail-fast: false
      matrix:
        # THE LIST `cargo xtask check-fuzz` HOLDS against `fuzz/fuzz_targets/`. A target added
        # there and not here would be a target nothing ever runs, with every check green - which
        # is the failure this workflow's own gate exists for.
        target:
          - sql_expression
          - question_body
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/reclaim-disk
        with:
          minimum-gb: "25"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            fallback = true

      - name: Fuzz ${{ matrix.target }}
        run: bash nix/run-fuzz.sh run "${SECONDS_BUDGET}" "${{ matrix.target }}"
        env:
          SECONDS_BUDGET: ${{ github.event.inputs.seconds || '900' }}

      # The crash artifact and the input that produced it, or the run is a red line in a log and
      # nothing a person can act on. `if: failure()` rather than `always()`: on a green run there
      # is nothing here worth an upload, and the grown corpus is deliberately NOT published - a
      # corpus entry enters the tree through a pull request somebody read.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 14
