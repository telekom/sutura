name: Cache root evaluation observation

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Exact observation request
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cache-root-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: rust-mcp-16core
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a70aa4fbc16a1a7bd7735675f1a2e7419adb771e
          path: source
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            fallback = true
            extra-substituters = https://sutura.cachix.org https://sutura-cross-build.cachix.org https://sutura-connectors.cachix.org
            extra-trusted-public-keys = sutura.cachix.org-1:ujnKDi7ITrNVSQofXXvhiLhxoVUaYcFOM+qjW/+yGz0= sutura-cross-build.cachix.org-1:JIqwyJtgFFxOkA3JoUKOlbevOlflZ4J0Q3U04BJiq/w= sutura-connectors.cachix.org-1:1uJE7nE3cANwRW5R4Gf2i2YZldiAAC6p/jlUs0lMens=

      - name: Observe the exact source projections
        working-directory: source
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: bash ../nix/measure-cache-roots.sh

      - name: Keep the observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: cache-root-observation
          path: source/target/cache-root-observation/
          if-no-files-found: error
