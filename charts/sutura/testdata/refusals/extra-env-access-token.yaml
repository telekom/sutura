# The access token comes from an `extraEnv` variable, spelled in lower case (the binary reads it
# either way), beside `direct`: the binary refuses to start
# (`NotFitToServe::DeploymentTokenSharesTheHeader`).
environment: production
security:
  metricsToken:
    secretName: sutura-metrics-token
  tlsTermination: ingress
config:
  base:
    security:
      inbound:
        mode: direct
        resource: https://sutura.example.com
        authorization_server: https://issuer.example.com
        key_set_file: /etc/sutura/inbound-keys/jwks.json
        algorithms: [RS256]
extraEnv:
  - name: sutura__security__access_token
    value: placeholder-access-token-long-enough
